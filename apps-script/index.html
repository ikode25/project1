<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Student Portal</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --navy: #0d1b4b;
            --blue: #1a3a8a;
            --gold: #f0c020;
            --gold2: #e6a800
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0d1b4b 0%, #152566 45%, #0d2d6b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 16px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* ── LANDING PAGE HERO ── */
        .landing-hero {
            width: 100%;
            padding: 96px 24px 200px;
            position: relative;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 0;
        }

        .landing-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 16, 50, 0.55) 0%, rgba(13, 27, 75, 0.78) 100%);
            z-index: 1;
        }

        /* Fallback color while the photo carousel below loads/paints */
        .landing-hero {
            background: #0d1b4b;
        }

        /* Crossfading hero photo carousel — admin-uploaded school photos (HERO_PHOTOS) if any
           exist, otherwise a curated default set of elite school building images. Sits behind the
           ::before gradient veil and .hero-content, with a slow Ken-Burns zoom on each slide. */
        .hero-carousel {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #0d1b4b;
        }

        .hero-carousel-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 2.4s ease;
            animation: heroKenBurns 18s ease-in-out infinite;
        }

        .hero-carousel-slide.active {
            opacity: 1;
        }

        @keyframes heroKenBurns {
            0% {
                transform: scale(1.02);
            }

            50% {
                transform: scale(1.13);
            }

            100% {
                transform: scale(1.02);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-carousel-slide {
                animation: none;
            }
        }

        .hero-grid {
            display: none;
        }

        .hero-pupil-images {
            position: absolute;
            inset: 0;
            display: flex;
            gap: 12px;
            padding: 12px;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            z-index: 0;
            overflow: hidden;
        }

        .hero-pupil-images .hp-img {
            width: 70px;
            height: 82px;
            border-radius: 8px;
            object-fit: cover;
            opacity: 0.15;
            filter: grayscale(40%);
            border: 1px solid rgba(240, 192, 32, 0.2);
        }

        /* hero-content sits above the overlay */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-logo-wrap {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0c020, #ffd700, #e6a800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 18px;
            box-shadow: 0 10px 36px rgba(240, 192, 32, .45), 0 0 0 6px rgba(255, 255, 255, .08);
            overflow: hidden;
            flex-shrink: 0;
        }

        .hero-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .hero-school-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 192, 32, 0.14);
            border: 1px solid rgba(240, 192, 32, 0.35);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 11px;
            font-weight: 700;
            color: #f0c020;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            line-height: 1.15;
            margin-bottom: 14px;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.65;
            max-width: 540px;
            margin: 0 auto;
        }

        .hero-stats {
            display: flex;
            gap: 34px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat-val {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #f0c020;
            display: block;
        }

        .hero-stat-lbl {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Address / phone / email pills under the stats row */
        .hero-contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            width: 100%;
        }

        .hero-contact-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
        }

        .hero-contact-item svg {
            flex-shrink: 0;
            color: #f0c020;
        }

        /* Card now overlaps the hero */
        .portal-card-wrap {
            width: 100%;
            max-width: 460px;
            margin: -140px auto 0;
            position: relative;
            z-index: 10;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: drift 14s infinite alternate
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(240, 192, 32, .11), transparent 70%);
            top: -120px;
            left: -100px;
            animation-duration: 16s
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(26, 58, 138, .22), transparent 70%);
            bottom: -100px;
            right: -100px
        }

        .orb3 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(240, 192, 32, .07), transparent 70%);
            top: 50%;
            left: 60%
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1)
            }

            100% {
                transform: translate(30px, 40px) scale(1.08)
            }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(240, 192, 32, .55);
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 1
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: .8
            }

            100% {
                transform: translateY(-80px) rotate(720deg);
                opacity: 0
            }
        }

        /* PORTAL CARD */
        .portal-card {
            background: #fff;
            border-radius: 28px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(13, 27, 75, .55), 0 0 0 1px rgba(240, 192, 32, .18);
            overflow: hidden;
            position: relative;
            animation: slideUp .65s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(48px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .card-head {
            background: linear-gradient(145deg, #0a1540 0%, #1a3a8a 55%, #0d2d6b 100%);
            padding: 36px 32px 28px;
            text-align: center;
            position: relative;
            overflow: hidden
        }

        .card-head::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f0c020, #ffd700, #f0c020, transparent)
        }

        .card-head::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 192, 32, .35), transparent)
        }

        .logo-ring-wrap {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 16px
        }

        .logo-badge {
            width: 86px;
            height: 86px;
            background: linear-gradient(135deg, #f0c020, #ffd700, #e6a800);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 32px rgba(240, 192, 32, .5);
            overflow: hidden
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%
        }

        .logo-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(240, 192, 32, .3);
            animation: pulse-ring 2s infinite
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: .5
            }

            50% {
                transform: scale(1.06);
                opacity: 1
            }
        }

        .school-name-head {
            font-family: 'Outfit', sans-serif;
            font-size: 16.5px;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            margin-bottom: 4px;
            letter-spacing: .4px
        }

        .school-tagline-head {
            font-size: 11px;
            color: rgba(255, 255, 255, .5);
            letter-spacing: 2.5px;
            text-transform: uppercase
        }

        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 192, 32, .45), transparent);
            margin: 14px 0 0
        }

        .card-body {
            padding: 30px 28px
        }

        /* CATEGORY & CLASS TILES */
        .cat-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 8px;
        }

        .cat-tile {
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            border: 2px solid rgba(240, 192, 32, 0.2);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all .25s cubic-bezier(.22, 1, .36, 1);
            position: relative;
            overflow: hidden;
        }

        .cat-tile::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 192, 32, 0.08), transparent);
            opacity: 0;
            transition: opacity .25s
        }

        .cat-tile:hover {
            transform: translateY(-3px);
            border-color: #f0c020;
            box-shadow: 0 8px 24px rgba(240, 192, 32, 0.2)
        }

        .cat-tile:hover::before {
            opacity: 1
        }

        .cat-tile-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: block
        }

        .cat-tile-name {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3
        }

        .cat-tile-sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px
        }

        .cls-tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 8px;
        }

        .cls-tile {
            background: #f8faff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all .22s;
            font-weight: 700;
            font-size: 13px;
            color: #0d1b4b;
        }

        .cls-tile:hover {
            background: #0d1b4b;
            color: #f0c020;
            border-color: #0d1b4b;
            transform: translateY(-2px)
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
            margin-bottom: 14px;
            transition: color .2s
        }

        .back-link:hover {
            color: #0d1b4b
        }

        /* STEPS */
        .step-row {
            display: flex;
            align-items: center;
            margin-bottom: 26px
        }

        .step-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all .35s cubic-bezier(.22, 1, .36, 1)
        }

        .step-dot.done {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, .3)
        }

        .step-dot.active {
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            color: #f0c020;
            box-shadow: 0 4px 16px rgba(13, 27, 75, .35)
        }

        .step-dot.pending {
            background: #f3f4f6;
            color: #9ca3af;
            border: 2px solid #e5e7eb
        }

        .step-connector {
            flex: 1;
            height: 2px;
            background: #e5e7eb;
            margin: 0 -1px;
            transition: background .35s
        }

        .step-connector.done {
            background: linear-gradient(90deg, #16a34a, #22c55e)
        }

        .step-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px
        }

        .step-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #9ca3af;
            margin-top: 4px
        }

        .step-info.active .step-label {
            color: #0d1b4b
        }

        .step-info.done .step-label {
            color: #16a34a
        }

        /* PANELS */
        .step-panel {
            display: none
        }

        .step-panel.active {
            display: block;
            animation: panelFade .4s cubic-bezier(.22, 1, .36, 1)
        }

        @keyframes panelFade {
            from {
                opacity: 0;
                transform: translateX(14px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
            font-weight: 700;
            color: #0d1b4b;
            margin-bottom: 4px
        }

        .panel-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 22px;
            line-height: 1.5
        }

        /* ALERT */
        .alert {
            padding: 11px 16px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 9px;
            animation: alertIn .3s
        }

        @keyframes alertIn {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .alert.show {
            display: flex
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac
        }

        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd
        }

        /* DEMO CODE BOX */
        .demo-box {
            background: linear-gradient(135deg, #fef9e7, #fffbf0);
            border: 1.5px solid rgba(240, 192, 32, .5);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            display: none;
            animation: alertIn .3s
        }

        .demo-box.show {
            display: block
        }

        .demo-box-lbl {
            font-size: 10.5px;
            color: #92400e;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px
        }

        .demo-code {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #0d1b4b;
            font-family: monospace
        }

        .demo-note {
            font-size: 11px;
            color: #92400e;
            margin-top: 5px;
            opacity: .8
        }

        /* FORM */
        .fg {
            margin-bottom: 18px
        }

        .fg-lbl {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            letter-spacing: .8px;
            text-transform: uppercase;
            margin-bottom: 7px
        }

        .input-wrap {
            position: relative
        }

        .inp-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #9ca3af;
            pointer-events: none
        }

        .field-inp {
            width: 100%;
            padding: 13px 14px 13px 46px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            color: #1a1a2e;
            background: #fafafa;
            transition: all .22s;
            outline: none
        }

        .field-inp:focus {
            border-color: #1a3a8a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 58, 138, .07)
        }

        .field-inp::placeholder {
            color: #c4c9d4
        }

        /* OTP */
        .otp-row {
            display: flex;
            gap: 9px;
            justify-content: center;
            margin: 6px 0 4px
        }

        .otp-d {
            width: 52px;
            height: 56px;
            border: 2px solid #e5e7eb;
            border-radius: 13px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #0d1b4b;
            background: #fafafa;
            transition: all .22s;
            outline: none;
            font-family: 'DM Sans', sans-serif
        }

        .otp-d:focus {
            border-color: #1a3a8a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 58, 138, .07);
            transform: scale(1.04)
        }

        .otp-d.filled {
            border-color: #f0c020;
            background: linear-gradient(135deg, #fef9e7, #fff)
        }

        /* PRIMARY BUTTON */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            color: #fff;
            border: none;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all .22s;
            position: relative;
            overflow: hidden;
            letter-spacing: .3px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(13, 27, 75, .33)
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none
        }

        .btn-primary .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .15), transparent);
            transition: left .5s
        }

        .btn-primary:hover .shine {
            left: 150%
        }

        .btn-sec {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #6b7280;
            border: 2px solid #e5e7eb;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all .22s;
            margin-top: 9px
        }

        .btn-sec:hover {
            border-color: #1a3a8a;
            color: #1a3a8a;
            background: #e8f0fe
        }

        .spinner {
            width: 19px;
            height: 19px;
            border: 2.5px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .btn-primary.loading .spinner {
            display: inline-block
        }

        .btn-primary.loading .btn-lbl {
            display: none
        }

        .admin-link {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .45);
            z-index: 10;
            position: relative
        }

        .admin-link a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            color: #f0c020;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(240, 192, 32, 0.2)
        }

        .admin-link a:hover {

            h += '</tbody><tfoot><tr><th style="padding:15px 10px;text-align:right;font-size:16px;background:#f8fafc;border-top:2px solid #0d1b4b">Total Expected:</th><th style="padding:15px 10px;text-align:right;font-size:16px;color:#c0392b;background:#f8fafc;border-top:2px solid #0d1b4b">GH¢ ' + tot.toFixed(2) + '</th></tr></tfoot></table>';
            h += '<div style="text-align:center;margin-top:40px;padding:20px;font-size:12px;color:#0d1b4b;font-weight:600;border-top:1px dashed #cbd5e1">Thank you for your prompt payment!</div>';
            h += '</div>';
            return h;
        }

        // Class Test / Mid-Term report — same visual chrome as the End-of-Term report card
        // (buildReportCard) but a single Score column (no SBA/Exam split), a Grade column only
        // when that exam type actually has grading configured, and the Conduct & Remarks block
        // gated entirely by the exam type's own Show* flags (Class Teacher's Remark isn't part of
        // these — only the End-of-Term flow has a "class teacher remark" field on a session).
        function buildClassTestOrMidTermCard(data) {
            if (!data || !data.student) return '<div style="color:#fff;padding:40px;text-align:center">Failed to load report data.</div>';
            var s = data.student, res = data.results || [], ci = data.classInfo || {}, st = data.settings || {};
            var session = data.session || {}, type = data.examType || {};
            var maxScore = data.maxScore || type.MaxScore || 100;
            var graded = res.some(function (r) { return r.Grade; });
            var showInterest = String(type.ShowInterest) === 'true';
            var showConduct = String(type.ShowConduct) === 'true';
            var showAttitude = String(type.ShowAttitude) === 'true';
            var showHtRemark = String(type.ShowHeadRemark) === 'true';
            var showRmkBlock = showInterest || showConduct || showAttitude || showHtRemark;
            var schoolName = st.SCHOOL_NAME || 'MY SCHOOL';
            var addr = st.SCHOOL_ADDRESS || '';
            var email = st.SCHOOL_EMAIL || ''; var phone = st.SCHOOL_PHONE || '';
            var logoSrc = fixDriveUrl(st.SCHOOL_LOGO || '');
            var stampSrc = fixDriveUrl(st.SCHOOL_STAMP || '');
            var logoHtml = logoSrc ? '<img src="' + logoSrc + '" alt="Logo">' : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d1b4b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';

            var gTotal = 0;
            var rows = res.map(function (r, i) {
                gTotal += Number(r.Score || 0);
                return '<tr' + (i % 2 === 1 ? ' style="background:#f8faff"' : '') + '>'
                    + '<td style="color:#6b7280;font-weight:600">' + (i + 1) + '</td>'
                    + '<td class="rc-td-subj">' + r.SubjectName + '</td>'
                    + '<td style="font-weight:700;color:#0d1b4b">' + r.Score + '</td>'
                    + (graded ? '<td style="font-weight:700;color:#c0392b">' + (r.Grade || '—') + '</td>' : '')
                    + '<td style="font-size:11px;color:#374151">' + (r.Remarks || '') + '</td>'
                    + '</tr>';
            }).join('');

            var avg = res.length ? Math.round(gTotal / res.length) : 0;
            var posBar = data.overallPosition ? '<div class="rc-pos-bar"><span class="rc-pos-lbl">CLASS POSITION</span><span class="rc-pos-badge">' + ord(data.overallPosition) + ' / ' + (data.classmatesCount || 'N/A') + '</span></div>' : '';

            var rmkHtml = '';
            if (showRmkBlock) {
                rmkHtml = '<div class="rc-rmk"><div class="rc-rmk-title">Conduct &amp; Remarks</div>'
                    + (showInterest ? '<div class="rc-rmk-row"><span class="rc-rmk-k">Interest / Talent:</span><span class="rc-rmk-v">' + (s.Interest || '—') + '</span></div>' : '')
                    + (showConduct ? '<div class="rc-rmk-row"><span class="rc-rmk-k">Conduct:</span><span class="rc-rmk-v">' + (s.Conduct || '—') + '</span></div>' : '')
                    + (showAttitude ? '<div class="rc-rmk-row"><span class="rc-rmk-k">Attitude to Work:</span><span class="rc-rmk-v">' + (s.Attitude || '—') + '</span></div>' : '')
                    + (showHtRemark ? '<div class="rc-rmk-row"><span class="rc-rmk-k">Headmaster\'s Remark:</span><span class="rc-rmk-v">' + (s.HeadTeacherRemark || '—') + '</span></div>' : '')
                    + '</div>';
            }

            return '<div class="rc-page">'
                + '<div class="rc-hdr">'
                + '<div class="rc-logo">' + logoHtml + '</div>'
                + '<div style="text-align:center"><div class="rc-sname">' + schoolName + '</div><div class="rc-scontact">' + addr + '<br>Tel: ' + phone + (email ? ' · ' + email : '') + '</div></div>'
                + '<div class="rc-photobox">' + (s.PhotoUrl ? '<img src="' + fixDriveUrl(s.PhotoUrl) + '" alt="">' : '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + '</div>'
                + '</div>'
                + '<div class="rc-title-strip"><div class="rc-title-text">' + (type.Name || 'Assessment') + ' Report</div></div>'
                + '<div class="rc-sub-strip">' + (session.Label || type.Name || '') + ' · Academic Year ' + s.Year + '</div>'
                + '<div class="rc-id-row"><span style="font-size:12px;color:#6b7280;margin-right:8px">Student ID:</span><span class="rc-id-badge">' + s.ID + '</span></div>'
                + '<div class="rc-info"><div class="rc-info-grid">'
                + '<div class="rc-info-item"><span class="rc-il">Name:</span><span class="rc-iv">' + s.Name + '</span></div>'
                + '<div class="rc-info-item"><span class="rc-il">Class:</span><span class="rc-iv">' + s.Class + '</span></div>'
                + '<div class="rc-info-item"><span class="rc-il">Gender:</span><span class="rc-iv">' + (s.Gender || '') + '</span></div>'
                + '<div class="rc-info-item"><span class="rc-il">Term:</span><span class="rc-iv">' + s.Term + '</span></div>'
                + '<div class="rc-info-item"><span class="rc-il">Max Score:</span><span class="rc-iv">' + maxScore + '</span></div>'
                + '<div class="rc-info-item"><span class="rc-il">Year:</span><span class="rc-iv">' + s.Year + '</span></div>'
                + '</div></div>'
                + '<div class="rc-tbl-wrap"><table class="rc-tbl"><thead><tr>'
                + '<th style="width:30px">#</th><th style="text-align:left;padding-left:9px">SUBJECT</th>'
                + '<th>SCORE<br><small style="font-weight:400;font-size:8.5px">(of ' + maxScore + ')</small></th>'
                + (graded ? '<th>GRADE</th>' : '') + '<th>REMARKS</th>'
                + '</tr></thead><tbody>' + rows + '</tbody>'
                + '<tfoot><tr style="background:#0d1b4b">'
                + '<td colspan="2" style="padding:7px;font-weight:700;text-align:left;padding-left:9px;letter-spacing:1px;border:1px solid rgba(255,255,255,.3);color:#ffffff">TOTAL</td>'
                + '<td style="padding:7px;text-align:center;border:1px solid rgba(255,255,255,.3);font-weight:700;color:#ffffff">' + gTotal + '</td>'
                + '<td colspan="' + (graded ? 2 : 1) + '" style="border:1px solid rgba(255,255,255,.2)"></td></tr></tfoot></table></div>'
                + '<div class="rc-stats">'
                + '<div class="rc-stat"><span class="rc-stat-lbl">Total Score</span><span class="rc-stat-val">' + gTotal + '</span></div>'
                + '<div class="rc-stat"><span class="rc-stat-lbl">Average</span><span class="rc-stat-val">' + avg + '</span></div>'
                + '<div class="rc-stat"><span class="rc-stat-lbl">Subjects</span><span class="rc-stat-val">' + res.length + '</span></div>'
                + '</div>'
                + posBar
                + rmkHtml
                + '<div class="rc-sigs"><div class="rc-sig"><div class="rc-sig-line">' + (stampSrc ? '<img src="' + stampSrc + '" style="max-height:64px;max-width:130px;object-fit:contain">' : '') + '</div><div class="rc-sig-role">Official School Stamp</div></div></div>'
                + '<div class="rc-footer-strip"><span>Generated by: <strong>' + schoolName + '</strong></span><span>' + s.Class + ' · ' + s.Term + ' · ' + s.Year + '</span></div>'
                + '</div>';
        }

        // Basic 9 (JHS3) Mock Examination — a compact "Result Slip" rather than a full report
        // card, in the spirit of the school's existing paper mock slips: header band, candidate
        // info block, subject/score/remarks table, aggregate, signature. Restyled to this app's
        // navy/gold brand rather than a pixel clone of any particular paper slip.
        function buildMockResultSlip(data) {
            if (!data || !data.student) return '<div style="color:#fff;padding:40px;text-align:center">Failed to load report data.</div>';
            var s = data.student, res = data.results || [], st = data.settings || {};
            var session = data.session || {}, type = data.examType || {};
            var schoolName = st.SCHOOL_NAME || 'MY SCHOOL';
            var logoSrc = fixDriveUrl(st.SCHOOL_LOGO || '');
            var mockLabel = (session.Label || type.Name || 'MOCK').toUpperCase();
            var mockDate = session.PublishedAt || session.CreatedAt;
            mockDate = mockDate ? new Date(mockDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }) : '—';

            var verifyUrl = '';
            var baseUrl = data.scriptUrl || window.scriptUrl || '';
            var isStatic = (!baseUrl || baseUrl.indexOf('<' + '?=') !== -1 || baseUrl.indexOf('<' + '?') !== -1 || window.location.origin.indexOf('netlify') !== -1 || window.location.hostname !== 'script.google.com');
            if (isStatic) {
                var origin = window.location.origin, path = window.location.pathname;
                if (path.endsWith('/') || path === '') path += 'report.html'; else path = path.substring(0, path.lastIndexOf('/') + 1) + 'report.html';
                verifyUrl = origin + path + '?sessionId=' + encodeURIComponent(session.SessionID) + '&id=' + encodeURIComponent(s.ID);
            } else {
                verifyUrl = baseUrl + '?page=report&sessionId=' + encodeURIComponent(session.SessionID) + '&id=' + encodeURIComponent(s.ID);
            }
            var qrHtml = verifyUrl ? '<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(verifyUrl) + '" alt="QR Code" style="width:100%;height:100%;object-fit:contain">' : '';

            var rows = res.map(function (r) {
                return '<tr><td style="padding:9px 10px;border-bottom:1px solid #edf1f7;font-weight:600;color:#1e293b">' + r.SubjectName.toUpperCase() + '</td>'
                    + '<td style="padding:9px 10px;border-bottom:1px solid #edf1f7;text-align:center;font-weight:700;color:#0d1b4b">' + r.Score + '</td>'
                    + '<td style="padding:9px 10px;border-bottom:1px solid #edf1f7;text-align:right;color:#c0392b;font-weight:600;font-size:11.5px">' + (r.Remarks || r.Grade || '—') + '</td></tr>';
            }).join('');

            var agg = data.jhsAggregate ? data.jhsAggregate.aggregate : null;

            return '<style>.ms-slip *{box-sizing:border-box}.ms-slip{max-width:720px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5);font-family:\'Plus Jakarta Sans\',sans-serif}'
                + '.ms-band1{background:linear-gradient(135deg,#0d1b4b,#1a237e);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}'
                + '.ms-band1 .nm{font-family:\'Outfit\',sans-serif;font-weight:800;font-size:17px;letter-spacing:.4px;text-transform:uppercase}'
                + '.ms-band2{background:linear-gradient(90deg,#f0c020,#ffd700);color:#0d1b4b;padding:9px 20px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}'
                + '.ms-sub{text-align:center;font-weight:700;font-size:12px;color:#374151;padding:10px 20px 0;font-style:italic}'
                + '.ms-media{display:flex;justify-content:center;gap:26px;padding:18px 20px 6px}'
                + '.ms-media .box{width:88px;height:88px;border:2px solid #0d1b4b;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafc}'
                + '.ms-info{padding:14px 26px 4px}'
                + '.ms-info-row{display:flex;padding:5px 0;font-size:12.5px;border-bottom:1px dashed #e5e7eb}'
                + '.ms-info-row .k{width:180px;flex-shrink:0;color:#0d1b4b;font-weight:700}'
                + '.ms-info-row .v{color:#1e293b;font-weight:600}'
                + '.ms-tbl-wrap{padding:16px 26px}'
                + '.ms-tbl-wrap table{width:100%;border-collapse:collapse;border:2px solid #0d1b4b;border-radius:6px;overflow:hidden}'
                + '.ms-tbl-wrap thead th{background:#0d1b4b;color:#f0c020;padding:9px 10px;font-size:11px;letter-spacing:.5px;text-transform:uppercase}'
                + '.ms-agg{display:flex;justify-content:center;margin:6px 26px 4px}'
                + '.ms-agg .b{background:linear-gradient(135deg,#f0c020,#ffd700);color:#0d1b4b;font-weight:800;font-size:13px;padding:8px 22px;border-radius:30px;letter-spacing:.5px}'
                + '.ms-sig{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 26px 10px;margin-top:10px}'
                + '.ms-sig .line{border-top:1.5px solid #0d1b4b;padding-top:5px;font-size:11px;color:#374151;font-weight:600;min-width:180px;text-align:center}'
                + '.ms-foot{background:#0d1b4b;color:rgba(255,255,255,.7);font-size:10px;padding:10px 20px;display:flex;justify-content:space-between}'
                + '@media print{.ms-slip{box-shadow:none}}</style>'
                + '<div class="ms-slip">'
                + '<div class="ms-band1">'
                + '<div style="display:flex;align-items:center;gap:10px">' + (logoSrc ? '<img src="' + logoSrc + '" style="width:36px;height:36px;border-radius:50%;object-fit:cover">' : '') + '<span class="nm">' + schoolName + '</span></div>'
                + '<span style="font-size:10px;color:rgba(255,255,255,.6);font-weight:600">' + (s.Class || '') + '</span>'
                + '</div>'
                + '<div class="ms-band2"><span>' + mockLabel + '</span><span>Result Slip</span></div>'
                + '<div class="ms-sub">Provisional Result Slip</div>'
                + '<div class="ms-media">'
                + '<div class="box">' + qrHtml + '</div>'
                + '<div class="box">' + (s.PhotoUrl ? '<img src="' + fixDriveUrl(s.PhotoUrl) + '" style="width:100%;height:100%;object-fit:cover">' : '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + '</div>'
                + '</div>'
                + '<div class="ms-info">'
                + '<div class="ms-info-row"><span class="k">Candidate Name</span><span class="v">: ' + s.Name + '</span></div>'
                + '<div class="ms-info-row"><span class="k">Index Number</span><span class="v">: ' + s.ID + '</span></div>'
                + '<div class="ms-info-row"><span class="k">Type of Examination</span><span class="v">: ' + mockLabel + ' - ' + s.Year + '</span></div>'
                + '<div class="ms-info-row"><span class="k">School</span><span class="v">: ' + schoolName + '</span></div>'
                + (agg !== null ? '<div class="ms-info-row"><span class="k">Aggregate</span><span class="v">: ' + agg + '</span></div>' : '')
                + '<div class="ms-info-row"><span class="k">Mock Date</span><span class="v">: ' + mockDate + '</span></div>'
                + '</div>'
                + '<div class="ms-tbl-wrap"><table><thead><tr><th style="text-align:left">Subject</th><th>Score</th><th style="text-align:right">Remarks</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
                + (agg !== null ? '<div class="ms-agg"><span class="b">Aggregate Score: ' + agg + ' (lower is better)</span></div>' : '')
                + '<div class="ms-sig"><span class="line">Head Teacher\'s Signature</span><span style="font-size:10px;color:#6b7280">Generated ' + new Date().toLocaleDateString() + '</span></div>'
                + '<div class="ms-foot"><span>Result on this print-out can be cross-checked by scanning the QR code.</span><span>' + schoolName + '</span></div>'
                + '</div>';
        }

        // ── Small presentational components ─────────────────────────────────────
        function StepIndicator({ dotStep }) {
            var steps = [
                { n: 1, label: 'Category' },
                { n: 2, label: 'Identity' },
                { n: 3, label: 'Verify' },
                { n: 4, label: 'Period' }
            ];
            return (
                <div className="step-row">
                    {steps.map(function (st, idx) {
                        var cls = st.n < dotStep ? 'done' : st.n === dotStep ? 'active' : 'pending';
                        return (
                            <React.Fragment key={st.n}>
                                <div className={'step-info' + (cls === 'pending' ? '' : ' ' + cls)}>
                                    <div className={'step-dot ' + cls}>{cls === 'done' ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg> : st.n}</div>
                                    <div className="step-label">{st.label}</div>
                                </div>
                                {idx < steps.length - 1 && <div className={'step-connector' + (st.n < dotStep ? ' done' : '')}></div>}
                            </React.Fragment>
                        );
                    })}
                </div>
            );
        }

        var ALERT_ICONS = {
            error: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>,
            success: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>,
            info: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></svg>
        };
        function Alert({ alert }) {
            if (!alert) return null;
            return <div className={'alert show ' + alert.type}><span style={{ flexShrink: 0, display: 'inline-flex' }}>{ALERT_ICONS[alert.type] || ALERT_ICONS.info}</span><span>{alert.msg}</span></div>;
        }

        var CATEGORIES = [
            { cat: 'preschool', label: 'Preschool', name: 'Preschool', sub: 'KG 1 & KG 2',
              icon: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f0c020" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" /></svg> },
            { cat: 'lower', label: 'Lower Primary', name: 'Lower Primary', sub: 'Basic 1 – 3',
              icon: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f0c020" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg> },
            { cat: 'upper', label: 'Upper Primary', name: 'Upper Primary', sub: 'Basic 4 – 6',
              icon: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f0c020" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg> },
            { cat: 'jhs', label: 'JHS', name: 'Junior High School', sub: 'Basic 7 – 9',
              icon: <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f0c020" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg> }
        ];

        function CategoryPanel({ onSelect }) {
            return (
                <div className="step-panel active">
                    <div className="panel-title">Select Your Level</div>
                    <div className="panel-sub">Choose your school category to get started</div>
                    <div className="cat-tiles">
                        {CATEGORIES.map(function (c) {
                            return (
                                <div className="cat-tile" key={c.cat} onClick={function () { onSelect(c); }}>
                                    <span className="cat-tile-icon">{c.icon}</span>
                                    <div className="cat-tile-name">{c.label}</div>
                                    <div className="cat-tile-sub">{c.sub}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function filterClassesForCategory(cat, allClasses) {
            var filtered = [];
            if (!allClasses || !allClasses.length) return filtered;
            if (cat === 'preschool') {
                filtered = allClasses.filter(function (c) {
                    var cn = c.ClassName.toLowerCase();
                    return cn.indexOf('kindergarten') !== -1 || cn.indexOf('kg') !== -1 || cn.indexOf('nursery') !== -1 || cn.indexOf('preschool') !== -1;
                });
            } else if (cat === 'lower') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 1') || cn.startsWith('Basic 2') || cn.startsWith('Basic 3'); });
            } else if (cat === 'upper') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 4') || cn.startsWith('Basic 5') || cn.startsWith('Basic 6'); });
            } else if (cat === 'jhs') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 7') || cn.startsWith('Basic 8') || cn.startsWith('Basic 9'); });
            }
            filtered.sort(function (a, b) { return a.ClassName.localeCompare(b.ClassName); });
            return filtered;
        }

        function ClassPanel({ category, allClasses, classesLoading, onSelectClass, onBack }) {
            var classes = filterClassesForCategory(category.cat, allClasses);
            return (
                <div className="step-panel active">
                    <div className="back-link" onClick={onBack}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6" /></svg>
                        Back to Categories
                    </div>
                    <div className="panel-title">{category.name} - Select Class</div>
                    <div className="panel-sub">Choose your class in {category.name}</div>
                    <div className="cls-tiles">
                        {classesLoading && <div style={{ color: '#6b7280', gridColumn: '1/-1', textAlign: 'center', padding: 20 }}>Loading classes…</div>}
                        {!classesLoading && classes.length === 0 && <div style={{ color: '#6b7280', gridColumn: '1/-1', textAlign: 'center', padding: 20 }}>No classes configured in this category.</div>}
                        {!classesLoading && classes.map(function (c) {
                            return <div className="cls-tile" key={c.ClassName} onClick={function () { onSelectClass(c.ClassName); }}>{c.ClassName}</div>;
                        })}
                    </div>
                </div>
            );
        }

        function IdentityPanel({ studentId, setStudentId, studentName, setStudentName, onBack, onSubmit, alert, loading, inputRef }) {
            return (
                <div className="step-panel active">
                    <div className="back-link" onClick={onBack}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6" /></svg>
                        Back to Categories
                    </div>
                    <div className="panel-title">Access Your Results</div>
                    <div className="panel-sub">Enter your Student ID and full name to get started</div>
                    <Alert alert={alert} />
                    <div className="fg">
                        <label className="fg-lbl">Student ID Number</label>
                        <div className="input-wrap">
                            <span className="inp-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', color: '#9ca3af' }}><rect x="3" y="4" width="18" height="16" rx="2" /><line x1="7" y1="8" x2="17" y2="8" /><line x1="7" y1="12" x2="13" y2="12" /><line x1="7" y1="16" x2="9" y2="16" /></svg></span>
                            <input ref={inputRef} className="field-inp" type="text" placeholder="e.g. 001" autoComplete="off"
                                value={studentId} onChange={function (e) { setStudentId(e.target.value); }} />
                        </div>
                    </div>
                    <div className="fg">
                        <label className="fg-lbl">Full Name</label>
                        <div className="input-wrap">
                            <span className="inp-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', color: '#9ca3af' }}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>
                            <input className="field-inp" type="text" placeholder="e.g. Ama Owusu" autoComplete="off"
                                value={studentName} onChange={function (e) { setStudentName(e.target.value); }} />
                        </div>
                    </div>
                    <button className={'btn-primary' + (loading ? ' loading' : '')} disabled={loading} onClick={onSubmit}>
                        <span className="shine"></span><span className="btn-lbl">Continue →</span>
                        <div className="spinner"></div>
                    </button>
                </div>
            );
        }

        function OtpPanel({ otp, setOtp, demoCode, onSubmit, onBack, alert, loading }) {
            var refs = useRef([]);
            useEffect(function () { if (refs.current[0]) refs.current[0].focus(); }, []);

            function handleChange(i, val) {
                val = val.replace(/[^0-9]/g, '').slice(0, 1);
                var next = otp.slice(); next[i] = val; setOtp(next);
                if (val && i < 5 && refs.current[i + 1]) refs.current[i + 1].focus();
            }
            function handleKeyDown(i, e) {
                if (e.key === 'Backspace' && !otp[i] && i > 0 && refs.current[i - 1]) refs.current[i - 1].focus();
            }

            return (
                <div className="step-panel active">
                    <div className="panel-title">Verify Identity</div>
                    <div className="panel-sub">Enter the 6-digit code shown below (sent to parent's phone in production)</div>
                    <Alert alert={alert} />
                    <div className={'demo-box' + (demoCode ? ' show' : '')}>
                        <div className="demo-box-lbl" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5" /><path d="M11.5 11.5 22 1l2 2-2 2-2-2-3 3 2 2-2 2-2-2-2 2" /></svg>
                            Verification Code
                        </div>
                        <div className="demo-code">{demoCode || '——————'}</div>
                        <div className="demo-note">In production, this code is sent via SMS to the parent's phone number</div>
                    </div>
                    <div className="fg">
                        <label className="fg-lbl">Enter 6-digit Code</label>
                        <div className="otp-row">
                            {otp.map(function (v, i) {
                                return (
                                    <input key={i} ref={function (el) { refs.current[i] = el; }} className={'otp-d' + (v ? ' filled' : '')}
                                        maxLength={1} inputMode="numeric" value={v}
                                        onChange={function (e) { handleChange(i, e.target.value); }}
                                        onKeyDown={function (e) { handleKeyDown(i, e); }} />
                                );
                            })}
                        </div>
                    </div>
                    <button className={'btn-primary' + (loading ? ' loading' : '')} disabled={loading} onClick={onSubmit}>
                        <span className="shine"></span><span className="btn-lbl">Verify Code →</span>
                        <div className="spinner"></div>
                    </button>
                    <button className="btn-sec" onClick={onBack}>← Go Back</button>
                </div>
            );
        }

        // Replaces the old fixed "Select Year & Term" form: after OTP the portal already knows
        // every result the student actually has (End-of-Term + any published Class Test / Mid-Term
        // / Mock sessions), so it lists them instead of asking the student to guess a period. A
        // "NEW" badge on a card *is* the "result released" notification — no separate messaging
        // system needed, it's just whether that item published within the last 14 days.
        function ExamSelectionPanel({ items, itemsLoading, onSelect, onBack, alert, loading, busyKey }) {
            return (
                <div className="step-panel active">
                    <div className="panel-title">Your Results</div>
                    <div className="panel-sub">Select a result below to view it. Newly released results are marked NEW.</div>
                    <Alert alert={alert} />
                    {itemsLoading ? (
                        <div style={{ textAlign: 'center', color: '#6b7280', fontSize: 13, padding: '30px 8px' }}>Loading your results…</div>
                    ) : (!items || items.length === 0) ? (
                        <div style={{ textAlign: 'center', color: '#6b7280', fontSize: 13, padding: '24px 8px', lineHeight: 1.6 }}>
                            No published results are available for you yet.<br />Please check back later.
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 360, overflowY: 'auto', margin: '4px 0 8px' }}>
                            {items.map(function (it) {
                                var key = it.kind + '-' + (it.sessionId || (it.year + '|' + it.term));
                                var busy = busyKey === key;
                                return (
                                    <button key={key} type="button" disabled={!!loading} onClick={function () { onSelect(it, key); }}
                                        style={{
                                            display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10,
                                            width: '100%', textAlign: 'left', padding: '13px 16px', borderRadius: 12,
                                            border: it.isNew ? '1.5px solid #f0c020' : '1.5px solid #e5e7eb', background: it.isNew ? '#fffdf5' : '#fff',
                                            cursor: loading ? 'default' : 'pointer', opacity: (loading && !busy) ? 0.5 : 1, transition: 'all .15s'
                                        }}>
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: 3, minWidth: 0 }}>
                                            <span style={{ fontWeight: 700, color: '#0d1b4b', fontSize: 13.5 }}>{it.examTypeName}{it.label && it.label !== it.examTypeName ? ' — ' + it.label : ''}</span>
                                            <span style={{ fontSize: 11.5, color: '#6b7280' }}>{it.class} · {it.term} · {it.year}</span>
                                        </div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                                            {it.isNew && (
                                                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: 'linear-gradient(135deg,#f0c020,#ffd700)', color: '#0d1b4b', fontSize: 10, fontWeight: 800, padding: '3px 8px', borderRadius: 20, letterSpacing: '.4px' }}>
                                                    <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" /></svg> NEW
                                                </span>
                                            )}
                                            {busy ? (
                                                <span style={{ width: 16, height: 16, border: '2.5px solid #e5e7eb', borderTopColor: '#0d1b4b', borderRadius: '50%', display: 'inline-block', animation: 'spin .7s linear infinite' }}></span>
                                            ) : (
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
                                            )}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                    <button className="btn-sec" onClick={onBack}>← Go Back</button>
                </div>
            );
        }

        function ReportOverlay({ data, onClose }) {
            var [tab, setTab] = useState('report');
            var schoolName = (data.settings && data.settings.SCHOOL_NAME) || 'School Portal';
            // data.__kind: 'endofterm' (legacy getStudentReport) has a Fee Bill tab; any exam
            // session picks its report builder from its exam type's Category — Mock gets the
            // compact Result Slip, everything else (Class Test, Mid-Term, custom types) gets the
            // simplified single-score report card.
            var isSession = data.__kind === 'session';
            var category = isSession ? (data.examType && data.examType.Category) || '' : '';
            var hasFeesTab = !isSession;
            var reportHtml = !isSession ? buildReportCard(data) : (category === 'Mock' ? buildMockResultSlip(data) : buildClassTestOrMidTermCard(data));
            var html = (tab === 'report' || !hasFeesTab) ? reportHtml : buildFeesInvoice(data);
            return (
                <div id="reportOverlay" className="show">
                    <div className="rc-toolbar no-print">
                        <div className="rc-toolbar-brand"><div className="rc-toolbar-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d1b4b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg></div><div className="rc-toolbar-name">{schoolName}</div></div>
                        {hasFeesTab && (
                            <div style={{ display: 'flex', gap: 8 }} className="rc-tabs-wrap">
                                <button className="btn-sec" style={{ border: 'none', background: tab === 'report' ? 'var(--gold)' : 'transparent', color: tab === 'report' ? '#0d1b4b' : '#fff', borderRadius: 8, padding: '6px 12px', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 6 }} onClick={function () { setTab('report'); }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /></svg> Result</button>
                                <button className="btn-sec" style={{ border: 'none', background: tab === 'fees' ? 'var(--gold)' : 'transparent', color: tab === 'fees' ? '#0d1b4b' : '#fff', borderRadius: 8, padding: '6px 12px', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 6 }} onClick={function () { setTab('fees'); }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2" /><line x1="1" y1="10" x2="23" y2="10" /></svg> Fee Bill</button>
                            </div>
                        )}
                        <div className="rc-toolbar-acts">
                            <button className="rc-btn rc-btn-back" onClick={onClose}>← Back</button>
                            <button className="rc-btn rc-btn-print" onClick={function () { window.print(); }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: '-2px', marginRight: 5 }}><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>Print</button>
                        </div>
                    </div>
                    <div dangerouslySetInnerHTML={{ __html: html }} />
                </div>
            );
        }

        // ── Main App ─────────────────────────────────────────────────────────────
        function App() {
            var { data: settingsData } = useSWR('publicSettings', function () { return gasCall('getPublicSettings'); }, {
                fallbackData: window.__publicSettingsPreload || readCache('cached_public_settings'),
                revalidateOnFocus: false,
                dedupingInterval: 60000,
                onSuccess: function (r) { writeCache('cached_public_settings', r); }
            });
            var { data: classesData, isLoading: classesLoading } = useSWR('classesPublic', function () { return gasCall('getClassesPublic'); }, {
                revalidateOnFocus: false,
                dedupingInterval: 60000
            });

            var [panel, setPanel] = useState('category'); // category | class | identity | otp | period
            var [category, setCategory] = useState(null);
            var [studentId, setStudentId] = useState('');
            var [studentName, setStudentName] = useState('');
            var [currentStudentId, setCurrentStudentId] = useState('');
            var [demoCode, setDemoCode] = useState('');
            var [otp, setOtp] = useState(['', '', '', '', '', '']);
            var [examItems, setExamItems] = useState([]);
            var [examItemsLoading, setExamItemsLoading] = useState(false);
            var [busyKey, setBusyKey] = useState(null);
            var [alerts, setAlerts] = useState({});
            var [loading, setLoading] = useState({});
            var [reportData, setReportData] = useState(null);
            var identityInputRef = useRef(null);

            var dotStep = (panel === 'category' || panel === 'class') ? 1 : panel === 'identity' ? 2 : panel === 'otp' ? 3 : 4;

            function setAlert(n, alert) { setAlerts(function (a) { var b = Object.assign({}, a); b[n] = alert; return b; }); }
            function setBusy(n, v) { setLoading(function (l) { var b = Object.assign({}, l); b[n] = v; return b; }); }

            function selectCategory(c) { setCategory(c); setPanel('class'); }
            function selectClass(cls) { setPanel('identity'); setTimeout(function () { if (identityInputRef.current) identityInputRef.current.focus(); }, 50); }
            function goToCategories() {
                setPanel('category'); setCategory(null); setOtp(['', '', '', '', '', '']);
                setStudentId(''); setStudentName(''); setAlerts({}); setDemoCode(''); setExamItems([]);
            }
            function goBack() { setPanel('identity'); setOtp(['', '', '', '', '', '']); setAlert('otp', null); setDemoCode(''); }
            function goBackToOtp() { setPanel('otp'); }

            var handleStep1 = useCallback(function () {
                var sid = studentId.trim(), sname = studentName.trim();
                setAlert('identity', null);
                if (!sid || !sname) { setAlert('identity', { type: 'error', msg: 'Please enter both Student ID and Full Name.' }); return; }
                setBusy('identity', true);
                gasCall('validateStudent', sid, sname).then(function (r) {
                    setBusy('identity', false);
                    if (r.success) {
                        setCurrentStudentId(sid);
                        setDemoCode(r.code);
                        setPanel('otp');
                    } else {
                        setAlert('identity', { type: 'error', msg: '' + r.message });
                    }
                }).catch(function (e) {
                    setBusy('identity', false);
                    setAlert('identity', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }, [studentId, studentName]);

            // After OTP, fetch the combined list of everything published for this student
            // (End-of-Term + Class Test / Mid-Term / Mock sessions) instead of asking for a period.
            var handleStep2 = useCallback(function () {
                var code = otp.join('');
                setAlert('otp', null);
                if (code.length < 6) { setAlert('otp', { type: 'error', msg: 'Please enter the full 6-digit code.' }); return; }
                setBusy('otp', true);
                gasCall('verifyCode', currentStudentId, code).then(function (r) {
                    setBusy('otp', false);
                    if (r.success) {
                        setPanel('examselect');
                        setExamItemsLoading(true);
                        gasCall('getPublicExamSessionsForStudent', currentStudentId).then(function (r2) {
                            setExamItemsLoading(false);
                            if (r2.success) setExamItems(r2.items || []);
                            else setAlert('examselect', { type: 'error', msg: '' + r2.message });
                        }).catch(function (e2) {
                            setExamItemsLoading(false);
                            setAlert('examselect', { type: 'error', msg: 'Connection error: ' + e2.message });
                        });
                    } else {
                        setAlert('otp', { type: 'error', msg: '' + r.message });
                    }
                }).catch(function (e) {
                    setBusy('otp', false);
                    setAlert('otp', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }, [otp, currentStudentId]);

            function handleSelectExam(item, key) {
                setAlert('examselect', null);
                setBusyKey(key);
                var req = item.kind === 'endofterm'
                    ? gasCall('getStudentReport', currentStudentId, item.year, item.term)
                    : gasCall('getExamSessionReport', currentStudentId, item.sessionId);
                req.then(function (r) {
                    setBusyKey(null);
                    if (r.success) { r.__kind = item.kind; setReportData(r); }
                    else setAlert('examselect', { type: 'error', msg: '' + r.message });
                }).catch(function (e) {
                    setBusyKey(null);
                    setAlert('examselect', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }

            function closeReport() { setReportData(null); goToCategories(); window.scrollTo(0, 0); }

            // Enter-to-submit, matching the original portal's keyboard shortcut.
            useEffect(function () {
                function onKey(e) {
                    if (e.key !== 'Enter') return;
                    if (panel === 'identity') handleStep1();
                    else if (panel === 'otp') handleStep2();
                }
                document.addEventListener('keydown', onKey);
                return function () { document.removeEventListener('keydown', onKey); };
            }, [panel, handleStep1, handleStep2]);

            var logoSrc = settingsData && settingsData.SCHOOL_LOGO;

            return (
                <React.Fragment>
                    <div className="portal-card-wrap">
                        <div className="portal-card">
                            <div className="card-head">
                                <div className="logo-ring-wrap">
                                    <div className="logo-badge">{logoSrc ? <img src={logoSrc} alt="Logo" /> : <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0d1b4b" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg>}</div>
                                    <div className="logo-ring"></div>
                                </div>
                                <div className="school-name-head">{(settingsData && settingsData.SCHOOL_NAME) || 'School Portal'}</div>
                                <div className="school-tagline-head">Student Result Portal</div>
                                <div className="gold-line"></div>
                            </div>
                            <div className="card-body">
                                <StepIndicator dotStep={dotStep} />
                                {panel === 'category' && <CategoryPanel onSelect={selectCategory} />}
                                {panel === 'class' && category && (
                                    <ClassPanel category={category} allClasses={classesData && classesData.classes} classesLoading={classesLoading}
                                        onSelectClass={selectClass} onBack={goToCategories} />
                                )}
                                {panel === 'identity' && (
                                    <IdentityPanel studentId={studentId} setStudentId={setStudentId} studentName={studentName} setStudentName={setStudentName}
                                        onBack={goToCategories} onSubmit={handleStep1} alert={alerts.identity} loading={!!loading.identity} inputRef={identityInputRef} />
                                )}
                                {panel === 'otp' && (
                                    <OtpPanel otp={otp} setOtp={setOtp} demoCode={demoCode} onSubmit={handleStep2} onBack={goBack} alert={alerts.otp} loading={!!loading.otp} />
                                )}
                                {panel === 'examselect' && (
                                    <ExamSelectionPanel items={examItems} itemsLoading={examItemsLoading} onSelect={handleSelectExam}
                                        onBack={goBackToOtp} alert={alerts.examselect} loading={!!busyKey} busyKey={busyKey} />
                                )}
                            </div>
                        </div>
                    </div>
                    {reportData && <ReportOverlay data={reportData} onClose={closeReport} />}
                </React.Fragment>
            );
        }

        var mountEl = document.getElementById('appRoot');
        createRoot(mountEl).render(<App />);
    </script>
</body>

</html>
