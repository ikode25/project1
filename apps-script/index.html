<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --navy: #0d1b4b;
            --blue: #1a3a8a;
            --gold: #f0c020;
            --gold2: #e6a800;
            /* Report card theme colors only (the .rc-* classes below). The admin picks these
               two in the Admin Panel (replacing the old fixed 3-template picker); JS sets them
               once the school's settings load. Defaults match the original "Classic Navy" look,
               so a school that hasn't set custom colors yet sees the same report card as
               before. Kept separate from --navy/--gold above, which theme the rest of this page
               (landing hero, buttons, etc.) and are not affected by this setting. */
            --rc-primary: #0d1b4b;
            --rc-primary-light: #1a237e;
            --rc-accent: #f0c020;
            --rc-accent-light: #ffd700;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0d1b4b 0%, #152566 45%, #0d2d6b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 16px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* ── LANDING PAGE HERO ── */
        .landing-hero {
            width: 100%;
            /* Carousel photos should fill the whole screen ("fullscreen slider"), not just
               whatever height the hero content happens to need. min-height (not height) so the
               hero still grows to fit taller content on small/zoomed screens instead of clipping
               it. The plain vh rule is the fallback for browsers without svh support; where svh
               *is* supported it uses the browser's stable viewport height so the hero doesn't
               jump/resize as a mobile browser's address bar shows and hides. */
            min-height: 100vh;
            min-height: 100svh;
            padding: 96px 24px 200px;
            position: relative;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 0;
        }

        .landing-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 16, 50, 0.55) 0%, rgba(13, 27, 75, 0.78) 100%);
            z-index: 1;
        }

        /* Default/fallback background — shown until the carousel (below) renders school photos
           uploaded by the admin (Settings → School Info → Landing Page Carousel), and permanently
           if none have been uploaded. */
        .landing-hero {
            background: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1400&q=80') center/cover no-repeat;
        }

        /* Photo carousel — sits between the default background above and the dark gradient
           overlay (.landing-hero::before, z-index:1) so slides are always legible under the
           hero text regardless of which photo is showing. */
        .hero-carousel {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.4s ease;
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-carousel-dots {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 16px;
            z-index: 2;
            display: flex;
            justify-content: center;
            gap: 7px;
        }

        .hero-carousel-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: all 0.25s;
            border: none;
            padding: 0;
        }

        .hero-carousel-dot.active {
            background: #f0c020;
            width: 22px;
            border-radius: 5px;
        }

        .hero-grid {
            display: none;
        }

        .hero-pupil-images {
            position: absolute;
            inset: 0;
            display: flex;
            gap: 12px;
            padding: 12px;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            z-index: 0;
            overflow: hidden;
        }

        .hero-pupil-images .hp-img {
            width: 70px;
            height: 82px;
            border-radius: 8px;
            object-fit: cover;
            opacity: 0.15;
            filter: grayscale(40%);
            border: 1px solid rgba(240, 192, 32, 0.2);
        }

        /* hero-content sits above the overlay */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-logo-wrap {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0c020, #ffd700, #e6a800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 18px;
            box-shadow: 0 10px 36px rgba(240, 192, 32, .45), 0 0 0 6px rgba(255, 255, 255, .08);
            overflow: hidden;
            flex-shrink: 0;
        }

        .hero-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .hero-school-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 192, 32, 0.14);
            border: 1px solid rgba(240, 192, 32, 0.35);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 11px;
            font-weight: 700;
            color: #f0c020;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            line-height: 1.15;
            margin-bottom: 14px;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.65;
            max-width: 540px;
            margin: 0 auto;
        }

        .hero-stats {
            display: flex;
            gap: 34px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat-val {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #f0c020;
            display: block;
        }

        .hero-stat-lbl {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Address / phone / email pills under the stats row */
        .hero-contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            width: 100%;
        }

        .hero-contact-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
        }

        .hero-contact-item svg {
            flex-shrink: 0;
            color: #f0c020;
        }

        /* Card now overlaps the hero */
        .portal-card-wrap {
            width: 100%;
            max-width: 460px;
            margin: -140px auto 0;
            position: relative;
            z-index: 10;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: drift 14s infinite alternate
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(240, 192, 32, .11), transparent 70%);
            top: -120px;
            left: -100px;
            animation-duration: 16s
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(26, 58, 138, .22), transparent 70%);
            bottom: -100px;
            right: -100px
        }

        .orb3 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(240, 192, 32, .07), transparent 70%);
            top: 50%;
            left: 60%
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1)
            }

            100% {
                transform: translate(30px, 40px) scale(1.08)
            }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(240, 192, 32, .55);
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 1
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            90% {
                opacity: .8
            }

            100% {
                transform: translateY(-80px) rotate(720deg);
                opacity: 0
            }
        }

        /* PORTAL CARD */
        .portal-card {
            background: #fff;
            border-radius: 28px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(13, 27, 75, .55), 0 0 0 1px rgba(240, 192, 32, .18);
            overflow: hidden;
            position: relative;
            animation: slideUp .65s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(48px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .card-head {
            background: linear-gradient(145deg, #0a1540 0%, #1a3a8a 55%, #0d2d6b 100%);
            padding: 36px 32px 28px;
            text-align: center;
            position: relative;
            overflow: hidden
        }

        .card-head::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f0c020, #ffd700, #f0c020, transparent)
        }

        .card-head::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 192, 32, .35), transparent)
        }

        .logo-ring-wrap {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 16px
        }

        .logo-badge {
            width: 86px;
            height: 86px;
            background: linear-gradient(135deg, #f0c020, #ffd700, #e6a800);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 32px rgba(240, 192, 32, .5);
            overflow: hidden
        }

        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%
        }

        .logo-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(240, 192, 32, .3);
            animation: pulse-ring 2s infinite
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: .5
            }

            50% {
                transform: scale(1.06);
                opacity: 1
            }
        }

        .school-name-head {
            font-family: 'Outfit', sans-serif;
            font-size: 16.5px;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            margin-bottom: 4px;
            letter-spacing: .4px
        }

        .school-tagline-head {
            font-size: 11px;
            color: rgba(255, 255, 255, .5);
            letter-spacing: 2.5px;
            text-transform: uppercase
        }

        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 192, 32, .45), transparent);
            margin: 14px 0 0
        }

        .card-body {
            padding: 30px 28px
        }

        /* CATEGORY & CLASS TILES */
        .cat-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 8px;
        }

        .cat-tile {
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            border: 2px solid rgba(240, 192, 32, 0.2);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all .25s cubic-bezier(.22, 1, .36, 1);
            position: relative;
            overflow: hidden;
        }

        .cat-tile::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 192, 32, 0.08), transparent);
            opacity: 0;
            transition: opacity .25s
        }

        .cat-tile:hover {
            transform: translateY(-3px);
            border-color: #f0c020;
            box-shadow: 0 8px 24px rgba(240, 192, 32, 0.2)
        }

        .cat-tile:hover::before {
            opacity: 1
        }

        .cat-tile-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: block
        }

        .cat-tile-name {
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3
        }

        .cat-tile-sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px
        }

        .cls-tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 8px;
        }

        .cls-tile {
            background: #f8faff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all .22s;
            font-weight: 700;
            font-size: 13px;
            color: #0d1b4b;
        }

        .cls-tile:hover {
            background: #0d1b4b;
            color: #f0c020;
            border-color: #0d1b4b;
            transform: translateY(-2px)
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
            margin-bottom: 14px;
            transition: color .2s
        }

        .back-link:hover {
            color: #0d1b4b
        }

        /* STEPS */
        .step-row {
            display: flex;
            align-items: center;
            margin-bottom: 26px
        }

        .step-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all .35s cubic-bezier(.22, 1, .36, 1)
        }

        .step-dot.done {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, .3)
        }

        .step-dot.active {
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            color: #f0c020;
            box-shadow: 0 4px 16px rgba(13, 27, 75, .35)
        }

        .step-dot.pending {
            background: #f3f4f6;
            color: #9ca3af;
            border: 2px solid #e5e7eb
        }

        .step-connector {
            flex: 1;
            height: 2px;
            background: #e5e7eb;
            margin: 0 -1px;
            transition: background .35s
        }

        .step-connector.done {
            background: linear-gradient(90deg, #16a34a, #22c55e)
        }

        .step-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px
        }

        .step-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #9ca3af;
            margin-top: 4px
        }

        .step-info.active .step-label {
            color: #0d1b4b
        }

        .step-info.done .step-label {
            color: #16a34a
        }

        /* PANELS */
        .step-panel {
            display: none
        }

        .step-panel.active {
            display: block;
            animation: panelFade .4s cubic-bezier(.22, 1, .36, 1)
        }

        @keyframes panelFade {
            from {
                opacity: 0;
                transform: translateX(14px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
            font-weight: 700;
            color: #0d1b4b;
            margin-bottom: 4px
        }

        .panel-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 22px;
            line-height: 1.5
        }

        /* ALERT */
        .alert {
            padding: 11px 16px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 9px;
            animation: alertIn .3s
        }

        @keyframes alertIn {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .alert.show {
            display: flex
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac
        }

        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd
        }

        /* DEMO CODE BOX */
        .demo-box {
            background: linear-gradient(135deg, #fef9e7, #fffbf0);
            border: 1.5px solid rgba(240, 192, 32, .5);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            display: none;
            animation: alertIn .3s
        }

        .demo-box.show {
            display: block
        }

        .demo-box-lbl {
            font-size: 10.5px;
            color: #92400e;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px
        }

        .demo-code {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #0d1b4b;
            font-family: monospace
        }

        .demo-note {
            font-size: 11px;
            color: #92400e;
            margin-top: 5px;
            opacity: .8
        }

        /* FORM */
        .fg {
            margin-bottom: 18px
        }

        .fg-lbl {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            letter-spacing: .8px;
            text-transform: uppercase;
            margin-bottom: 7px
        }

        .input-wrap {
            position: relative
        }

        .inp-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #9ca3af;
            pointer-events: none
        }

        .field-inp {
            width: 100%;
            padding: 13px 14px 13px 46px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            color: #1a1a2e;
            background: #fafafa;
            transition: all .22s;
            outline: none
        }

        .field-inp:focus {
            border-color: #1a3a8a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 58, 138, .07)
        }

        .field-inp::placeholder {
            color: #c4c9d4
        }

        /* OTP */
        .otp-row {
            display: flex;
            gap: 9px;
            justify-content: center;
            margin: 6px 0 4px
        }

        .otp-d {
            width: 52px;
            height: 56px;
            border: 2px solid #e5e7eb;
            border-radius: 13px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #0d1b4b;
            background: #fafafa;
            transition: all .22s;
            outline: none;
            font-family: 'DM Sans', sans-serif
        }

        .otp-d:focus {
            border-color: #1a3a8a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 58, 138, .07);
            transform: scale(1.04)
        }

        .otp-d.filled {
            border-color: #f0c020;
            background: linear-gradient(135deg, #fef9e7, #fff)
        }

        /* PRIMARY BUTTON */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d1b4b, #1a3a8a);
            color: #fff;
            border: none;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all .22s;
            position: relative;
            overflow: hidden;
            letter-spacing: .3px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(13, 27, 75, .33)
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none
        }

        .btn-primary .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .15), transparent);
            transition: left .5s
        }

        .btn-primary:hover .shine {
            left: 150%
        }

        .btn-sec {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #6b7280;
            border: 2px solid #e5e7eb;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all .22s;
            margin-top: 9px
        }

        .btn-sec:hover {
            border-color: #1a3a8a;
            color: #1a3a8a;
            background: #e8f0fe
        }

        .spinner {
            width: 19px;
            height: 19px;

        }

        }

        @media screen and (max-width:540px) {
            .rc-page {
                width: 100% !important;
                max-width: 100% !important;
                border-radius: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: 2px solid var(--rc-primary) !important;
            }

            .rc-sigs {
                flex-direction: column !important;
                align-items: center !important;
                gap: 20px !important;
            }

            .rc-hdr {
                grid-template-columns: 56px 1fr 56px;
                gap: 8px;
                padding: 14px
            }

            .rc-sname {
                font-size: 13px
            }

            .rc-info-grid {
                grid-template-columns: 1fr 1fr
            }

            .otp-d {
                width: 44px;
                height: 48px;
                font-size: 20px
            }
        }

        @media print {

            /* Ask the browser not to fade/grayscale vivid colors to save ink. This only
               takes effect when the print dialog's "Background graphics" option is on — it
               can't force that setting, which is why the rules below also give every
               colored section a print-safe fallback that stays legible even if background
               colors don't make it to the page at all. */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            /* Hide EVERYTHING except the report overlay — most robust approach.
               #appRoot is the single React mount point (portal card + report overlay live inside
               it as siblings), so this targets it instead of `body` directly. */
            #appRoot>* {
                display: none !important;
            }

            #appRoot>#reportOverlay {
                display: block !important;
            }

            .landing-hero,
            .hero-school-badge,
            .hero-stats,
            .portal-card-wrap,
            .card-head,
            .rc-toolbar,
            .no-print,
            .bg-canvas,
            .admin-link {
                display: none !important;
            }

            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body,
            html {
                background: #fff !important;
                padding: 0 !important
            }

            #reportOverlay {
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
                display: block !important
            }

            .rc-toolbar,
            .no-print {
                display: none !important
            }

            .rc-page {
                box-shadow: none !important;
                border-radius: 0 !important;
                max-width: 190mm !important;
                width: 100% !important;
                margin: 0 auto !important;
                border: 4px solid #0d1b4b !important
            }

            .rc-tbl th,
            .rc-tbl td {
                border: 2px solid rgba(13, 27, 75, 0.2) !important;
            }

            .rc-tbl tfoot td {
                border: 2px solid rgba(255, 255, 255, 0.4) !important;
            }

            .rc-tbl {
                border-bottom: 2px dotted #0d1b4b !important;
            }
            .rc-sigs {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: flex-end !important;
            }

            /* FIX: "faint/invisible text when printed". Several bars use light or translucent
               white text on a dark navy/gold background for the on-screen look. Many browsers
               print with background colors turned off by default (and some printers/toner-
               saving modes fade them further even when they are on) — when that happens this
               light text sits on plain white paper and is unreadable. Give every such section a
               print-only palette of solid, dark, opaque text plus a border, so the report stays
               fully legible on paper regardless of what the printer does with the backgrounds. */
            .rc-hdr,
            .rc-substrip,
            .rc-pos-bar,
            .rc-agg-bar,
            .rc-gkey-hdr,
            .rc-footer-strip,
            .rc-tbl tfoot tr {
                background: #ffffff !important;
                border-bottom: 1.5px solid #0d1b4b !important;
            }

            .rc-hdr::before {
                display: none !important;
            }

            .rc-sname,
            .rc-scontact,
            .rc-substrip,
            .rc-pos-lbl,
            .rc-agg-lbl,
            .rc-agg-detail,
            .rc-gkey-hdr,
            .rc-footer-strip,
            .rc-tbl tfoot td {
                color: #0d1b4b !important;
                opacity: 1 !important;
                text-shadow: none !important;
            }

            .rc-pos-badge,
            .rc-agg-badge,
            .rc-id-badge {
                background: #ffffff !important;
                border: 1.5px solid #0d1b4b !important;
                color: #0d1b4b !important;
            }

            .rc-logo,
            .rc-photobox {
                border: 2px solid #0d1b4b !important;
            }

            .rc-tbl td,
            .rc-rmk-v,
            .rc-rmk-k,
            .rc-il,
            .rc-stat-lbl,
            .rc-sig {
                color: #111827 !important;
                opacity: 1 !important;
            }
        }
    </style>
</head>

        var heroCarouselTimer = null;
        var heroCarouselIdx = 0;
        function renderHeroCarousel(images) {
            var list = images;
            if (typeof list === 'string') { try { list = JSON.parse(list || '[]'); } catch (e) { list = []; } }
            if (!list || !list.length) return;
            var wrap = document.getElementById('heroCarousel');

        function buildFeesInvoice(data) {
            var s = data.student, st = data.settings || {};
            var sN = st.SCHOOL_NAME || 'School Portal', addr = st.SCHOOL_ADDRESS || '', phone = st.SCHOOL_PHONE || '';
            var logo = st.SCHOOL_LOGO || '';
            var feeComps = (st.FEE_COMPONENTS || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
            var fd = (typeof s.FeeData === 'object' && s.FeeData !== null) ? s.FeeData : {};
            if (typeof s.FeeData === 'string' && s.FeeData) { try { fd = JSON.parse(s.FeeData); } catch (e) {} }

            var tbody = '';
            var tot = 0;

            if (feeComps.length === 0) {
                var arr = Number(parseFloat(s.Arrears || 0));
                var nxt = Number(parseFloat(s.NextTermFees || 0));
                tot = arr + nxt;
                tbody += '<tr><td style="padding:12px;border-bottom:1px solid #e5e7eb">Previous Arrears</td><td style="padding:12px;border-bottom:1px solid #e5e7eb;text-align:right">GH¢ ' + arr.toFixed(2) + '</td></tr>';
                tbody += '<tr><td style="padding:12px;border-bottom:1px solid #e5e7eb">Next Term Fees</td><td style="padding:12px;border-bottom:1px solid #e5e7eb;text-align:right">GH¢ ' + nxt.toFixed(2) + '</td></tr>';
            } else {
                feeComps.forEach(function (fc) {
                    var v = Number(parseFloat(fd[fc] || 0));
                    if (fc.toLowerCase() === 'arrears' && !fd[fc]) v = Number(parseFloat(s.Arrears || 0));
                    if (fc.toLowerCase() === 'next term fees' && !fd[fc]) v = Number(parseFloat(s.NextTermFees || 0));
                    tot += v;
                    tbody += '<tr><td style="padding:12px;border-bottom:1px solid #e5e7eb">' + fc + '</td><td style="padding:12px;border-bottom:1px solid #e5e7eb;text-align:right">GH¢ ' + v.toFixed(2) + '</td></tr>';
                });
            }

            var h = '<div class="rc-page" style="padding:40px;background:#fff;border:4px solid #0d1b4b;border-radius:12px;margin:16px auto;color:#1e293b">';
            h += '<div style="text-align:center;margin-bottom:20px;background:linear-gradient(145deg,#0d1b4b,#1a237e);padding:24px;border-radius:12px;color:#fff">';
            if (logo) h += '<img src="' + logo + '" style="height:70px;border-radius:50%;margin-bottom:10px;border:2px solid #f0c020">';
            h += '<h2 style="margin:0;color:#f0c020;text-transform:uppercase;letter-spacing:1px">' + sN + '</h2><p style="margin:5px 0;font-size:13px;color:rgba(255,255,255,0.7)">' + addr + ' | ' + phone + '</p>';
            h += '</div>';
            h += '<div style="text-align:center;margin:20px 0 15px 0"><h3 style="margin:0;color:#0d1b4b;text-transform:uppercase;border-bottom:2px solid #f0c020;display:inline-block;padding-bottom:5px;letter-spacing:1px">Next Academic Term Bill</h3></div>';
            h += '<div style="display:flex;justify-content:space-between;margin-bottom:30px;padding:15px;background:#f8fafc;border-left:4px solid #0d1b4b;border-radius:4px"><div><strong style="color:#0d1b4b">Student:</strong> ' + s.Name + '<br><strong style="color:#0d1b4b">ID:</strong> ' + s.ID + '<br><strong style="color:#0d1b4b">Class:</strong> ' + s.Class + '</div><div><strong style="color:#0d1b4b">Date:</strong> ' + new Date().toLocaleDateString() + '</div></div>';
            h += '<table style="width:100%;border-collapse:collapse;margin-bottom:20px;border:2px solid #0d1b4b;font-size:14px"><thead><tr><th style="background:#0d1b4b;color:#f0c020;padding:12px;text-align:left;border-bottom:2px solid #cbd5e1;text-transform:uppercase">Description</th><th style="background:#0d1b4b;color:#f0c020;padding:12px;text-align:right;border-bottom:2px solid #cbd5e1;text-transform:uppercase">Amount</th></tr></thead><tbody>';
            h += tbody;
            h += '</tbody><tfoot><tr><th style="padding:15px 10px;text-align:right;font-size:16px;background:#f8fafc;border-top:2px solid #0d1b4b">Total Expected:</th><th style="padding:15px 10px;text-align:right;font-size:16px;color:#c0392b;background:#f8fafc;border-top:2px solid #0d1b4b">GH¢ ' + tot.toFixed(2) + '</th></tr></tfoot></table>';
            h += '<div style="text-align:center;margin-top:40px;padding:20px;font-size:12px;color:#0d1b4b;font-weight:600;border-top:1px dashed #cbd5e1">Thank you for your prompt payment!</div>';
            h += '</div>';
            return h;
        }

        function filterClassesForCategory(cat, allClasses) {
            var filtered = [];

                filtered = allClasses.filter(function (c) {
                    var cn = c.ClassName.toLowerCase();
                    return cn.indexOf('kindergarten') !== -1 || cn.indexOf('kg') !== -1 || cn.indexOf('nursery') !== -1 || cn.indexOf('preschool') !== -1;
                });
            } else if (cat === 'lower') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 1') || cn.startsWith('Basic 2') || cn.startsWith('Basic 3'); });
            } else if (cat === 'upper') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 4') || cn.startsWith('Basic 5') || cn.startsWith('Basic 6'); });
            } else if (cat === 'jhs') {
                filtered = allClasses.filter(function (c) { var cn = c.ClassName; return cn.startsWith('Basic 7') || cn.startsWith('Basic 8') || cn.startsWith('Basic 9'); });

            filtered.sort(function (a, b) { return a.ClassName.localeCompare(b.ClassName); });

            function handleChange(i, val) {
                val = val.replace(/[^0-9]/g, '').slice(0, 1);
                var next = otp.slice(); next[i] = val; setOtp(next);
                if (val && i < 5 && refs.current[i + 1]) refs.current[i + 1].focus();

            function handleKeyDown(i, e) {
                if (e.key === 'Backspace' && !otp[i] && i > 0 && refs.current[i - 1]) refs.current[i - 1].focus();
            }

            return (
                <div className="step-panel active">

        function App() {

            var [category, setCategory] = useState(null);
            var [studentId, setStudentId] = useState('');
            var [studentName, setStudentName] = useState('');

            var [year, setYear] = useState('2025-2026');
            var [term, setTerm] = useState('Term 1');
            var [alerts, setAlerts] = useState({});
            var [loading, setLoading] = useState({});
            var [reportData, setReportData] = useState(null);
            var identityInputRef = useRef(null);

            // Default the period selector to the school's active term/year once settings load.
            useEffect(function () {
                if (settingsData) {
                    if (settingsData.CURRENT_YEAR) setYear(settingsData.CURRENT_YEAR);
                    if (settingsData.CURRENT_TERM) setTerm(settingsData.CURRENT_TERM);
                }
            }, [settingsData && settingsData.CURRENT_YEAR, settingsData && settingsData.CURRENT_TERM]);

            var dotStep = (panel === 'category' || panel === 'class') ? 1 : panel === 'identity' ? 2 : panel === 'otp' ? 3 : 4;

            function setAlert(n, alert) { setAlerts(function (a) { var b = Object.assign({}, a); b[n] = alert; return b; }); }
            function setBusy(n, v) { setLoading(function (l) { var b = Object.assign({}, l); b[n] = v; return b; }); }

            function selectCategory(c) { setCategory(c); setPanel('class'); }
            function selectClass(cls) { setPanel('identity'); setTimeout(function () { if (identityInputRef.current) identityInputRef.current.focus(); }, 50); }
            function goToCategories() {
                setPanel('category'); setCategory(null); setOtp(['', '', '', '', '', '']);
                setStudentId(''); setStudentName(''); setAlerts({}); setDemoCode('');
            }
            function goBack() { setPanel('identity'); setOtp(['', '', '', '', '', '']); setAlert('otp', null); setDemoCode(''); }
            function goBackToOtp() { setPanel('otp'); }

            var handleStep1 = useCallback(function () {
                var sid = studentId.trim(), sname = studentName.trim();
                setAlert('identity', null);
                if (!sid || !sname) { setAlert('identity', { type: 'error', msg: 'Please enter both Student ID and Full Name.' }); return; }
                setBusy('identity', true);
                gasCall('validateStudent', sid, sname).then(function (r) {
                    setBusy('identity', false);
                    if (r.success) {
                        setCurrentStudentId(sid);
                        setDemoCode(r.code);
                        setPanel('otp');
                    } else {
                        setAlert('identity', { type: 'error', msg: '' + r.message });
                    }
                }).catch(function (e) {
                    setBusy('identity', false);
                    setAlert('identity', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }, [studentId, studentName]);

            var handleStep2 = useCallback(function () {
                var code = otp.join('');
                setAlert('otp', null);
                if (code.length < 6) { setAlert('otp', { type: 'error', msg: 'Please enter the full 6-digit code.' }); return; }
                setBusy('otp', true);
                gasCall('verifyCode', currentStudentId, code).then(function (r) {
                    setBusy('otp', false);
                    if (r.success) setPanel('period');
                    else setAlert('otp', { type: 'error', msg: '' + r.message });
                }).catch(function (e) {
                    setBusy('otp', false);
                    setAlert('otp', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }, [otp, currentStudentId]);

            function handleStep3() {
                setAlert('period', null);
                setBusy('period', true);
                gasCall('getStudentReport', currentStudentId, year, term).then(function (r) {
                    setBusy('period', false);
                    if (r.success) setReportData(r);
                    else setAlert('period', { type: 'error', msg: '' + r.message });
                }).catch(function (e) {
                    setBusy('period', false);
                    setAlert('period', { type: 'error', msg: 'Connection error: ' + e.message });
                });
            }

            function closeReport() { setReportData(null); goToCategories(); window.scrollTo(0, 0); }

            // Enter-to-submit, matching the original portal's keyboard shortcut.
            useEffect(function () {
                function onKey(e) {
                    if (e.key !== 'Enter') return;
                    if (panel === 'identity') handleStep1();
                    else if (panel === 'otp') handleStep2();
                }
                document.addEventListener('keydown', onKey);
                return function () { document.removeEventListener('keydown', onKey); };
            }, [panel, handleStep1, handleStep2]);

            var logoSrc = settingsData && settingsData.SCHOOL_LOGO;

            return (
                <React.Fragment>
                    <div className="portal-card-wrap">
                        <div className="portal-card">
                            <div className="card-head">
                                <div className="logo-ring-wrap">
                                    <div className="logo-badge">{logoSrc ? <img src={logoSrc} alt="Logo" /> : <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0d1b4b" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></svg>}</div>
                                    <div className="logo-ring"></div>
                                </div>
                                <div className="school-name-head">{(settingsData && settingsData.SCHOOL_NAME) || 'School Portal'}</div>
                                <div className="school-tagline-head">Student Result Portal</div>
                                <div className="gold-line"></div>
                            </div>
                            <div className="card-body">
                                <StepIndicator dotStep={dotStep} />
                                {panel === 'category' && <CategoryPanel onSelect={selectCategory} />}
                                {panel === 'class' && category && (
                                    <ClassPanel category={category} allClasses={classesData && classesData.classes} classesLoading={classesLoading}
                                        onSelectClass={selectClass} onBack={goToCategories} />
                                )}
                                {panel === 'identity' && (
                                    <IdentityPanel studentId={studentId} setStudentId={setStudentId} studentName={studentName} setStudentName={setStudentName}
                                        onBack={goToCategories} onSubmit={handleStep1} alert={alerts.identity} loading={!!loading.identity} inputRef={identityInputRef} />
                                )}
                                {panel === 'otp' && (
                                    <OtpPanel otp={otp} setOtp={setOtp} demoCode={demoCode} onSubmit={handleStep2} onBack={goBack} alert={alerts.otp} loading={!!loading.otp} />
                                )}
                                {panel === 'period' && (
                                    <PeriodPanel year={year} setYear={setYear} term={term} setTerm={setTerm}
                                        onSubmit={handleStep3} onBack={goBackToOtp} alert={alerts.period} loading={!!loading.period} />
                                )}
                            </div>
                        </div>
                    </div>
                    {reportData && <ReportOverlay data={reportData} onClose={closeReport} />}
                </React.Fragment>
            );
        }

        var mountEl = document.getElementById('appRoot');
        createRoot(mountEl).render(<App />);
    </script>
</body>

</html>
