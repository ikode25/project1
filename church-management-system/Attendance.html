<div class="view" id="view-attendance">
  <div class="page-head">
    <div><h1>Attendance</h1><p>Digital check-in, service tracking and per-member history.</p></div>
  </div>

  <div class="tabbar" id="att-tabs">
    <div class="tab-btn active" data-tab="checkin">Check-In</div>
    <div class="tab-btn" data-tab="records">Records</div>
    <div class="tab-btn" data-tab="qr">QR Codes</div>
  </div>

  <div class="tab-panel active" data-panel="checkin">
    <div class="card card-pad" style="max-width:520px">
      <div class="field">
        <label>Member</label>
        <input id="ci-member-search" placeholder="Type a name…" autocomplete="off">
        <div id="ci-member-results" style="border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:180px;overflow-y:auto;display:none"></div>
        <div id="ci-member-selected" class="muted" style="margin-top:6px;font-size:12.5px"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Service Type</label><select id="ci-service-type"></select></div>
        <div class="field"><label>Service Date</label><input type="date" id="ci-service-date"></div>
      </div>
      <button class="btn btn-primary" id="ci-submit" style="width:100%;justify-content:center"><svg class="icon"><use href="#ic-check-circle"></use></svg> Check In</button>
    </div>
  </div>

  <div class="tab-panel" data-panel="records">
    <div class="card card-pad">
      <div class="field-row" style="margin-bottom:14px">
        <div class="field" style="margin-bottom:0"><label>Filter by Date</label><input type="date" id="att-filter-date"></div>
        <div class="field" style="margin-bottom:0"><label>Filter by Service</label><select id="att-filter-service"><option value="">All services</option></select></div>
      </div>
      <div id="att-table"></div>
    </div>
  </div>

  <div class="tab-panel" data-panel="qr">
    <div class="card card-pad" style="max-width:420px">
      <div class="field">
        <label>Member</label>
        <input id="qr-member-search" placeholder="Type a name…" autocomplete="off">
        <div id="qr-member-results" style="border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:180px;overflow-y:auto;display:none"></div>
      </div>
      <div id="qr-display" style="text-align:center"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var SERVICE_TYPES = ['Sunday Service', 'Midweek Service', 'Prayer Meeting', 'Youth Service', 'Special Event'];
  var members = [], attRows = [], attTable = null, selectedMemberId = null;

  document.querySelectorAll('#att-tabs .tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#att-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('#view-attendance .tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelector('#view-attendance .tab-panel[data-panel="' + btn.dataset.tab + '"]').classList.add('active');
    });
  });

  function fillServiceSelects() {
    var sel = document.getElementById('ci-service-type');
    var filt = document.getElementById('att-filter-service');
    SERVICE_TYPES.forEach(function (s) {
      sel.appendChild(new Option(s, s));
      filt.appendChild(new Option(s, s));
    });
    document.getElementById('ci-service-date').value = new Date().toISOString().split('T')[0];
  }

  function wireMemberSearch(inputId, resultsId, onPick) {
    var input = document.getElementById(inputId), results = document.getElementById(resultsId);
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      if (!q) { results.style.display = 'none'; return; }
      var matches = members.filter(function (m) { return (m.FirstName + ' ' + m.LastName).toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
      results.innerHTML = matches.map(function (m) { return '<div class="flex gap-10" data-id="' + m.ID + '" style="padding:8px 12px;cursor:pointer"><div class="avatar-circle" style="width:26px;height:26px;font-size:10px">' + Church.fmt.initials(m.FirstName + ' ' + m.LastName) + '</div>' + Church.fmt.escape(m.FirstName + ' ' + m.LastName) + '</div>'; }).join('') || '<div class="muted" style="padding:8px 12px">No matches</div>';
      results.style.display = 'block';
      results.querySelectorAll('[data-id]').forEach(function (row) {
        row.addEventListener('mouseenter', function () { row.style.background = '#f2f5f3'; });
        row.addEventListener('click', function () {
          var m = members.find(function (x) { return x.ID === row.dataset.id; });
          onPick(m); results.style.display = 'none'; input.value = m.FirstName + ' ' + m.LastName;
        });
      });
    });
  }

  function loadMembers() {
    return Church.run('listMembers').then(function (m) { members = m; });
  }

  /* ---- Check-in tab ---- */
  function wireCheckIn() {
    wireMemberSearch('ci-member-search', 'ci-member-results', function (m) {
      selectedMemberId = m.ID;
      document.getElementById('ci-member-selected').textContent = 'Selected: ' + m.FirstName + ' ' + m.LastName + ' (' + m.ID + ')';
    });
    document.getElementById('ci-submit').addEventListener('click', function () {
      if (!selectedMemberId) { Church.toast('Select a member first', 'error'); return; }
      Church.task('recordAttendance', {
        MemberID: selectedMemberId,
        ServiceType: document.getElementById('ci-service-type').value,
        ServiceDate: document.getElementById('ci-service-date').value
      }).then(function () {
        Church.toast('Checked in', 'success');
        selectedMemberId = null; document.getElementById('ci-member-search').value = ''; document.getElementById('ci-member-selected').textContent = '';
        if (document.querySelector('.tab-panel[data-panel="records"]').classList.contains('active')) loadRecords();
      });
    });
  }

  /* ---- Records tab ---- */
  function loadRecords() {
    var filters = { serviceDate: document.getElementById('att-filter-date').value, serviceType: document.getElementById('att-filter-service').value };
    Church.task('listAttendance', filters).then(function (rows) {
      attRows = rows;
      var cols = [
        { label: 'Member', key: 'MemberName' },
        { label: 'Service', key: 'ServiceType' },
        { label: 'Date', render: function (r) { return Church.fmt.date(r.ServiceDate); } },
        { label: 'Checked In', render: function (r) { return Church.fmt.datetime(r.CheckInTime); } },
        { label: 'Method', render: function (r) { return '<span class="badge ' + (r.CheckInMethod === 'QR' ? 'badge-green' : 'badge-gray') + '">' + r.CheckInMethod + '</span>'; } }
      ];
      if (attTable) attTable.refresh(rows);
      else attTable = Church.dataTable(document.getElementById('att-table'), {
        columns: cols, rows: rows, searchKeys: ['MemberName', 'ServiceType'], searchPlaceholder: 'Search records…',
        onDelete: function (r) { Church.task('deleteAttendance', r.ID).then(function () { Church.toast('Record removed', 'success'); loadRecords(); }); },
        empty: { icon: 'ic-attendance', title: 'No attendance records for this filter' }
      });
    });
  }
  document.getElementById('att-filter-date').addEventListener('change', loadRecords);
  document.getElementById('att-filter-service').addEventListener('change', loadRecords);

  /* ---- QR tab ---- */
  function wireQr() {
    wireMemberSearch('qr-member-search', 'qr-member-results', function (m) {
      Church.task('getMemberQrUrl', m.ID).then(function (url) {
        document.getElementById('qr-display').innerHTML =
          '<img src="' + url + '" style="border-radius:12px;border:1px solid var(--line);margin:14px 0" width="220" height="220">' +
          '<div style="font-weight:800">' + Church.fmt.escape(m.FirstName + ' ' + m.LastName) + '</div>' +
          '<div class="muted mono" style="font-size:12px;margin-bottom:14px">' + m.ID + '</div>' +
          '<button class="btn btn-outline btn-sm" onclick="window.print()"><svg class="icon-sm"><use href="#ic-print"></use></svg> Print Card</button>';
      });
    });
  }

  function mount() {
    fillServiceSelects();
    loadMembers().then(function () { wireCheckIn(); wireQr(); });
    loadRecords();
  }

  Church.views.attendance = { mount: mount, refresh: loadRecords };
})();
</script>
