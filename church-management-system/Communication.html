<div class="view" id="view-sms">
  <div class="page-head"><div><h1>Communication Center</h1><p>Bulk SMS, prayer requests and internal messaging.</p></div></div>

  <div class="tabbar" id="comm-tabs">
    <div class="tab-btn active" data-tab="bulk">Bulk SMS</div>
    <div class="tab-btn" data-tab="templates">Templates</div>
    <div class="tab-btn" data-tab="log">Delivery Log</div>
    <div class="tab-btn" data-tab="prayer">Prayer Requests</div>
    <div class="tab-btn" data-tab="messages">Messaging</div>
  </div>

  <div class="tab-panel active" data-panel="bulk">
    <div class="card card-pad" style="max-width:620px">
      <div class="field">
        <label>Send To</label>
        <select id="sms-group">
          <option value="all">All Members</option>
          <option value="active">Active Members</option>
          <option value="new">New Members</option>
          <option value="visitors">Visitors</option>
        </select>
      </div>
      <div class="field">
        <label>Message <span class="muted" style="font-weight:400">(use {name} to personalize)</span></label>
        <textarea id="sms-message" placeholder="Type your message…"></textarea>
        <div class="field-hint"><span id="sms-char-count">0</span> characters</div>
      </div>
      <div class="field">
        <label>Use a Template</label>
        <select id="sms-template-pick"><option value="">— None —</option></select>
      </div>
      <div class="field checkbox-row"><input type="checkbox" id="sms-schedule-toggle"><label for="sms-schedule-toggle" style="margin:0">Schedule for later</label></div>
      <div class="field" id="sms-schedule-field" style="display:none"><label>Send At</label><input type="datetime-local" id="sms-schedule-at"></div>
      <button class="btn btn-primary" id="sms-send-btn" style="width:100%;justify-content:center"><svg class="icon"><use href="#ic-send"></use></svg> Send</button>
    </div>
  </div>

  <div class="tab-panel" data-panel="templates">
    <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="tpl-add-btn"><svg class="icon"><use href="#ic-plus"></use></svg> New Template</button></div>
    <div class="card card-pad"><div id="tpl-list"></div></div>
  </div>

  <div class="tab-panel" data-panel="log">
    <div class="card card-pad"><div id="sms-log-table"></div></div>
  </div>

  <div class="tab-panel" data-panel="prayer">
    <div class="card card-pad"><div id="prayer-table"></div></div>
    <div class="card card-pad" style="margin-top:14px">
      <b style="font-size:13px">Public submission link</b>
      <div class="flex gap-10" style="margin-top:8px"><input readonly id="prayer-public-link" class="mono" style="flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12px"></div>
    </div>
  </div>

  <div class="tab-panel" data-panel="messages">
    <div class="grid" style="grid-template-columns:280px 1fr;gap:16px;align-items:start">
      <div class="card">
        <div class="card-head"><h3>Conversations</h3><button class="btn btn-ghost btn-icon btn-sm" id="msg-new-btn"><svg class="icon-sm"><use href="#ic-plus"></use></svg></button></div>
        <div id="thread-list"></div>
      </div>
      <div class="card" style="min-height:420px;display:flex;flex-direction:column">
        <div class="card-head" id="chat-header"><h3>Select a conversation</h3></div>
        <div id="chat-body" style="flex:1;overflow-y:auto;padding:16px;max-height:400px"></div>
        <div style="padding:12px 16px;border-top:1px solid var(--line);display:none" id="chat-input-row">
          <div class="flex gap-10">
            <input id="chat-input" placeholder="Type a message…" style="flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px">
            <button class="btn btn-primary btn-icon" id="chat-send"><svg class="icon"><use href="#ic-send"></use></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll('#comm-tabs .tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#comm-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('#view-sms .tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active'); document.querySelector('#view-sms .tab-panel[data-panel="' + btn.dataset.tab + '"]').classList.add('active');
      if (btn.dataset.tab === 'log') loadSmsLog();
      if (btn.dataset.tab === 'prayer') loadPrayer();
      if (btn.dataset.tab === 'messages') loadThreads();
    });
  });

  /* ---------- Bulk SMS ---------- */
  var groupOptsLoaded = false;
  function loadGroupOptions() {
    if (groupOptsLoaded) return; groupOptsLoaded = true;
    Church.run('getSmsGroupOptions').then(function (opts) {
      var sel = document.getElementById('sms-group');
      opts.clusters.forEach(function (c) { sel.appendChild(new Option('Cluster: ' + c, 'cluster:' + c)); });
      opts.departments.forEach(function (d) { sel.appendChild(new Option('Department: ' + d, 'department:' + d)); });
    });
  }
  document.getElementById('sms-message').addEventListener('input', function (e) {
    document.getElementById('sms-char-count').textContent = e.target.value.length;
  });
  document.getElementById('sms-schedule-toggle').addEventListener('change', function (e) {
    document.getElementById('sms-schedule-field').style.display = e.target.checked ? 'block' : 'none';
  });
  document.getElementById('sms-template-pick').addEventListener('change', function (e) {
    var t = templates.find(function (x) { return x.ID === e.target.value; });
    if (t) document.getElementById('sms-message').value = t.Body;
    document.getElementById('sms-message').dispatchEvent(new Event('input'));
  });
  document.getElementById('sms-send-btn').addEventListener('click', function () {
    var msg = document.getElementById('sms-message').value.trim();
    if (!msg) { Church.toast('Message body is required', 'error'); return; }
    var group = document.getElementById('sms-group').value;
    var scheduled = document.getElementById('sms-schedule-toggle').checked ? document.getElementById('sms-schedule-at').value : null;
    Church.task('sendBulkSms', group, msg, scheduled || null).then(function (res) {
      Church.toast(scheduled ? (res.scheduled + ' message(s) scheduled') : (res.sent + ' sent, ' + res.failed + ' failed'), 'success');
      document.getElementById('sms-message').value = ''; document.getElementById('sms-char-count').textContent = '0';
    });
  });

  /* ---------- Templates ---------- */
  var templates = [];
  function loadTemplates() {
    return Church.run('listSmsTemplates').then(function (rows) {
      templates = rows;
      var pick = document.getElementById('sms-template-pick');
      pick.innerHTML = '<option value="">— None —</option>' + rows.map(function (t) { return '<option value="' + t.ID + '">' + Church.fmt.escape(t.Name) + '</option>'; }).join('');
      document.getElementById('tpl-list').innerHTML = !rows.length ? '<div class="empty-state">No templates yet</div>' :
        rows.map(function (t) {
          return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="flex" style="justify-content:space-between"><b>' + Church.fmt.escape(t.Name) + '</b>' +
            '<button class="btn btn-ghost btn-icon btn-sm" data-del="' + t.ID + '"><svg class="icon-sm"><use href="#ic-trash"></use></svg></button></div>' +
            '<div class="muted" style="font-size:12.5px">' + Church.fmt.escape(t.Body) + '</div></div>';
        }).join('');
      document.querySelectorAll('#tpl-list [data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () { Church.task('deleteSmsTemplate', btn.dataset.del).then(loadTemplates); });
      });
    });
  }
  document.getElementById('tpl-add-btn').addEventListener('click', function () {
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-sms"></use></svg>New Template</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body"><div class="field"><label>Name</label><input id="tpl-name"></div><div class="field"><label>Body</label><textarea id="tpl-body" placeholder="Hi {name}, ..."></textarea></div></div>' +
      '<div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="tpl-save">Save</button></div>');
    document.getElementById('tpl-save').addEventListener('click', function () {
      Church.task('saveSmsTemplate', { Name: document.getElementById('tpl-name').value, Body: document.getElementById('tpl-body').value })
        .then(function () { Church.toast('Template saved', 'success'); Church.modal.close(); loadTemplates(); });
    });
  });

  /* ---------- Delivery log ---------- */
  var logLoaded = false;
  function loadSmsLog() {
    Church.task('listSmsLog').then(function (rows) {
      document.getElementById('sms-log-table').innerHTML = !rows.length ? '<div class="empty-state">No messages sent yet</div>' :
        '<div class="table-wrap"><table class="data-table"><thead><tr><th>Recipient</th><th>Message</th><th>Status</th><th>Provider</th><th>Sent</th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + Church.fmt.escape(r.RecipientName || r.RecipientPhone) + '</td><td style="max-width:280px">' + Church.fmt.escape(r.MessageBody) + '</td>' +
            '<td><span class="badge ' + (r.Status === 'Sent' ? 'badge-green' : r.Status === 'Failed' ? 'badge-red' : 'badge-amber') + '">' + r.Status + '</span></td>' +
            '<td>' + r.Provider + '</td><td>' + Church.fmt.datetime(r.SentAt || r.ScheduledFor) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    });
  }

  /* ---------- Prayer requests ---------- */
  var prayerTable = null;
  function loadPrayer() {
    Church.run('getWebAppUrl').then(function (url) { document.getElementById('prayer-public-link').value = url + '?page=prayer'; });
    Church.task('listPrayerRequests').then(function (rows) {
      var cols = [
        { label: 'Requester', render: function (r) { return Church.fmt.escape(r.RequesterName) + (r.Visibility === 'Private' ? ' <svg class="icon-sm"><use href="#ic-lock"></use></svg>' : ''); } },
        { label: 'Request', render: function (r) { return '<div style="max-width:320px">' + Church.fmt.escape(r.RequestText) + '</div>'; } },
        { label: 'Status', render: function (r) { return '<span class="badge ' + (r.Status === 'Answered' ? 'badge-green' : r.Status === 'New' ? 'badge-blue' : r.Status === 'Closed' ? 'badge-gray' : 'badge-amber') + '">' + r.Status + '</span>'; } },
        { label: 'Submitted', render: function (r) { return Church.fmt.date(r.SubmittedAt); } }
      ];
      if (prayerTable) prayerTable.refresh(rows);
      else prayerTable = Church.dataTable(document.getElementById('prayer-table'), {
        columns: cols, rows: rows, searchKeys: ['RequesterName', 'RequestText'], searchPlaceholder: 'Search prayer requests…',
        onEdit: openPrayerModal, empty: { icon: 'ic-pray', title: 'No prayer requests yet' }
      });
    });
  }
  function openPrayerModal(r) {
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-pray"></use></svg>Prayer Request</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body"><p style="margin-bottom:14px;color:var(--ink-soft)">' + Church.fmt.escape(r.RequestText) + '</p>' +
      '<div class="field"><label>Status</label><select id="pr-status"></select></div>' +
      '<div class="field"><label>Assigned To</label><input id="pr-assigned" value="' + Church.fmt.escape(r.AssignedTo || '') + '"></div>' +
      '<div class="field"><label>Response Notes</label><textarea id="pr-notes">' + Church.fmt.escape(r.ResponseNotes || '') + '</textarea></div></div>' +
      '<div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="pr-save">Save</button></div>');
    var sel = document.getElementById('pr-status');
    ['New', 'In Progress', 'Answered', 'Closed'].forEach(function (s) { sel.appendChild(new Option(s, s, false, s === r.Status)); });
    document.getElementById('pr-save').addEventListener('click', function () {
      Church.task('updatePrayerRequest', { ID: r.ID, Status: sel.value, AssignedTo: document.getElementById('pr-assigned').value, ResponseNotes: document.getElementById('pr-notes').value })
        .then(function () { Church.toast('Updated', 'success'); Church.modal.close(); loadPrayer(); });
    });
  }

  /* ---------- Internal messaging ---------- */
  var activeThread = null, contacts = [];
  function loadThreads() {
    Church.task('listMessageThreads').then(function (threads) {
      document.getElementById('thread-list').innerHTML = !threads.length ? '<div class="empty-state" style="padding:24px">No conversations yet</div>' :
        threads.map(function (t) {
          return '<div class="nav-item" style="color:var(--ink);margin:4px 8px" data-thread="' + t.ID + '"><svg class="icon"><use href="#ic-message-square"></use></svg>' +
            '<span style="overflow:hidden;text-overflow:ellipsis">' + Church.fmt.escape(t.Name) + '</span></div>';
        }).join('');
      document.querySelectorAll('[data-thread]').forEach(function (el) { el.addEventListener('click', function () { openThread(threads.find(function (t) { return t.ID === el.dataset.thread; })); }); });
    });
    if (!contacts.length) Church.run('listMessagingContacts').then(function (c) { contacts = c; });
  }
  function openThread(thread) {
    activeThread = thread;
    document.getElementById('chat-header').innerHTML = '<h3>' + Church.fmt.escape(thread.Name) + '</h3>';
    document.getElementById('chat-input-row').style.display = 'block';
    Church.task('listThreadMessages', thread.ID).then(function (msgs) {
      document.getElementById('chat-body').innerHTML = !msgs.length ? '<div class="empty-state">Say hello 👋</div>' :
        msgs.map(function (m) {
          var mine = m.FromUser === Church.session.email;
          return '<div style="margin-bottom:10px;text-align:' + (mine ? 'right' : 'left') + '"><div style="display:inline-block;max-width:75%;padding:9px 13px;border-radius:12px;background:' + (mine ? 'var(--green-primary)' : '#f0f3f1') + ';color:' + (mine ? '#fff' : 'var(--ink)') + '">' +
            (!mine ? '<div style="font-size:10.5px;opacity:.7;margin-bottom:2px">' + Church.fmt.escape(m.FromUser) + '</div>' : '') +
            Church.fmt.escape(m.Body) + '</div><div class="muted" style="font-size:10.5px;margin-top:2px">' + Church.fmt.datetime(m.SentAt) + '</div></div>';
        }).join('');
      document.getElementById('chat-body').scrollTop = 999999;
    });
  }
  document.getElementById('chat-send').addEventListener('click', function () {
    var input = document.getElementById('chat-input');
    if (!activeThread || !input.value.trim()) return;
    Church.task('sendMessage', activeThread.ID, input.value.trim()).then(function () { input.value = ''; openThread(activeThread); loadThreads(); });
  });
  document.getElementById('msg-new-btn').addEventListener('click', function () {
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-message-square"></use></svg>New Conversation</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body"><div class="field"><label>Name (optional, for group chats)</label><input id="nc-name"></div>' +
      '<div class="field"><label>Participants</label><select id="nc-participants" multiple size="6">' +
      contacts.map(function (c) { return '<option value="' + c.email + '">' + Church.fmt.escape(c.name) + ' (' + c.role + ')</option>'; }).join('') + '</select></div></div>' +
      '<div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="nc-save">Start</button></div>');
    document.getElementById('nc-save').addEventListener('click', function () {
      var sel = Array.prototype.map.call(document.getElementById('nc-participants').selectedOptions, function (o) { return o.value; });
      if (!sel.length) { Church.toast('Select at least one participant', 'error'); return; }
      Church.task('createMessageThread', document.getElementById('nc-name').value, sel, sel.length > 1 ? 'Group' : 'Direct')
        .then(function (t) { Church.toast('Conversation started', 'success'); Church.modal.close(); loadThreads(); });
    });
  });

  function mount() {
    loadGroupOptions();
    loadTemplates();
  }
  Church.views.sms = { mount: mount, refresh: mount };
})();
</script>
