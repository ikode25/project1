<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= orgName ?> | Prayer Request</title>
  <?!= include('Styles'); ?>
</head>
<body>
<?!= include('Icons'); ?>
<div class="public-page">
  <div class="public-card">
    <div class="brand-mark"><svg class="icon"><use href="#ic-pray"></use></svg></div>
    <h2 style="color:var(--green-primary);font-size:20px;font-weight:800;margin-bottom:4px"><?= orgName ?></h2>
    <p class="muted" style="margin-bottom:22px">Submit a Prayer Request</p>

    <div id="pr-form">
      <div class="field" style="text-align:left"><label>Your Name (optional)</label><input id="pr-name" placeholder="Leave blank to stay anonymous"></div>
      <div class="field" style="text-align:left"><label>Phone or Email (optional, for follow-up)</label><input id="pr-contact"></div>
      <div class="field" style="text-align:left"><label>Your Prayer Request</label><textarea id="pr-text" placeholder="Share what's on your heart…" style="min-height:120px"></textarea></div>
      <div class="field" style="text-align:left">
        <label>Who can see this?</label>
        <select id="pr-visibility">
          <option value="Private">Private — pastoral team only</option>
          <option value="Prayer Team">Prayer Team — our prayer chain</option>
          <option value="Public">Public — church prayer wall</option>
        </select>
      </div>
      <button class="btn btn-primary" id="pr-submit-btn" style="width:100%;justify-content:center;padding:14px">
        <svg class="icon"><use href="#ic-send"></use></svg> Submit Request
      </button>
    </div>
    <div id="pr-result" style="margin-top:16px"></div>
  </div>
</div>

<script>
  document.getElementById('pr-submit-btn').addEventListener('click', function () {
    var text = document.getElementById('pr-text').value.trim();
    if (!text) { document.getElementById('pr-result').innerHTML = '<div class="alert-row alert-red"><svg class="icon"><use href="#ic-alert"></use></svg>Please write your prayer request.</div>'; return; }
    var btn = this; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Sending…';
    google.script.run
      .withSuccessHandler(function () {
        document.getElementById('pr-form').style.display = 'none';
        document.getElementById('pr-result').innerHTML = '<div class="alert-row alert-green"><svg class="icon"><use href="#ic-check-circle"></use></svg>Thank you. Your request has been received and our team will be praying with you.</div>';
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.innerHTML = '<svg class="icon"><use href="#ic-send"></use></svg> Submit Request';
        document.getElementById('pr-result').innerHTML = '<div class="alert-row alert-red"><svg class="icon"><use href="#ic-alert"></use></svg>' + (err.message || err) + '</div>';
      })
      .submitPrayerRequest({
        RequesterName: document.getElementById('pr-name').value,
        RequesterContact: document.getElementById('pr-contact').value,
        RequestText: text,
        Visibility: document.getElementById('pr-visibility').value
      });
  });
</script>
</body>
</html>
