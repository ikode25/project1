<div class="view" id="view-finance">
  <div class="page-head"><div><h1>Finance</h1><p>Giving, pledges, campaigns, expense approvals and reporting.</p></div></div>

  <div class="tabbar" id="fin-tabs">
    <div class="tab-btn active" data-tab="giving">Giving</div>
    <div class="tab-btn" data-tab="pledges">Pledges &amp; Campaigns</div>
    <div class="tab-btn" data-tab="expenses">Expenses</div>
    <div class="tab-btn" data-tab="reports">Reports</div>
  </div>

  <div class="tab-panel active" data-panel="giving">
    <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="fin-add-giving"><svg class="icon"><use href="#ic-plus"></use></svg> Record Giving</button></div>
    <div class="card card-pad"><div id="giving-table"></div></div>
  </div>

  <div class="tab-panel" data-panel="pledges">
    <div class="grid grid-2" style="align-items:start">
      <div>
        <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-outline" id="fin-add-campaign"><svg class="icon"><use href="#ic-plus"></use></svg> New Campaign</button></div>
        <div class="card card-pad"><div id="campaign-list"></div></div>
      </div>
      <div>
        <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="fin-add-pledge"><svg class="icon"><use href="#ic-plus"></use></svg> New Pledge</button></div>
        <div class="card card-pad"><div id="pledge-list"></div></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" data-panel="expenses">
    <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="fin-add-expense"><svg class="icon"><use href="#ic-plus"></use></svg> New Expense Claim</button></div>
    <div class="card card-pad"><div id="expense-table"></div></div>
  </div>

  <div class="tab-panel" data-panel="reports">
    <div class="field-row" style="max-width:520px;margin-bottom:16px">
      <div class="field" style="margin-bottom:0"><label>From</label><input type="date" id="rep-from"></div>
      <div class="field" style="margin-bottom:0"><label>To</label><input type="date" id="rep-to"></div>
    </div>
    <button class="btn btn-outline" id="rep-run" style="margin-bottom:16px"><svg class="icon"><use href="#ic-refresh"></use></svg> Run Report</button>
    <div class="grid grid-3" id="rep-summary" style="margin-bottom:18px"></div>
    <div class="grid grid-2">
      <div class="card"><div class="card-head"><h3>Giving by Type</h3></div><div class="card-pad"><div id="chart-fin-type" style="height:220px"></div></div></div>
      <div class="card"><div class="card-head"><h3>Expenses by Category</h3></div><div class="card-pad"><div id="chart-fin-cat" style="height:220px"></div></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var members = [], campaigns = [], givingRows = [], pledgeRows = [], expenseRows = [];
  var givingTable = null, expenseTable = null;

  document.querySelectorAll('#fin-tabs .tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#fin-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('#view-finance .tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelector('#view-finance .tab-panel[data-panel="' + btn.dataset.tab + '"]').classList.add('active');
    });
  });

  function memberOptions() { return members.map(function (m) { return { value: m.ID, label: m.FirstName + ' ' + m.LastName }; }); }
  function campaignOptions() { return campaigns.map(function (c) { return { value: c.ID, label: c.Name }; }); }

  /* ---------- Giving ---------- */
  var GIVING_FIELDS = [
    { key: 'Type', label: 'Type', type: 'select', options: ['Tithe', 'Offering', 'Donation', 'Pledge Payment'], required: true, half: true },
    { key: 'Amount', label: 'Amount (GHS)', type: 'number', required: true, half: true },
    { key: 'DonorMemberID', label: 'Donor (leave blank for anonymous)', type: 'select', half: true },
    { key: 'PaymentMethod', label: 'Payment Method', type: 'select', options: ['Cash', 'Mobile Money', 'Bank Transfer', 'Card', 'Cheque'], required: true, half: true },
    { key: 'CampaignID', label: 'Campaign', type: 'select', half: true },
    { key: 'Date', label: 'Date', type: 'date', required: true, half: true },
    { key: 'Recurring', label: 'Recurring gift', type: 'checkbox' },
    { key: 'Notes', label: 'Notes', type: 'textarea' }
  ];

  function loadGiving() {
    Church.task('listFinance').then(function (rows) {
      givingRows = rows;
      var cols = [
        { label: 'Donor', key: 'DonorName' },
        { label: 'Type', render: function (r) { return '<span class="badge badge-green">' + r.Type + '</span>'; } },
        { label: 'Amount', render: function (r) { return '<b>' + Church.fmt.money(r.Amount) + '</b>'; } },
        { label: 'Method', key: 'PaymentMethod' },
        { label: 'Date', render: function (r) { return Church.fmt.date(r.Date); } },
        { label: 'Receipt', render: function (r) { return '<span class="mono muted">' + Church.fmt.escape(r.ReceiptNumber) + '</span>'; } }
      ];
      if (givingTable) givingTable.refresh(rows);
      else givingTable = Church.dataTable(document.getElementById('giving-table'), {
        columns: cols, rows: rows, searchKeys: ['DonorName', 'Type', 'ReceiptNumber'], searchPlaceholder: 'Search giving records…',
        onDelete: function (r) { Church.task('deleteFinanceRecord', r.ID).then(function () { Church.toast('Removed', 'success'); loadGiving(); }); },
        empty: { icon: 'ic-finance', title: 'No giving recorded yet' }
      });
    });
  }

  function openGivingModal() {
    var fields = GIVING_FIELDS.map(function (f) { if (f.key === 'DonorMemberID') f.options = memberOptions(); if (f.key === 'CampaignID') f.options = campaignOptions(); return f; });
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-finance"></use></svg>Record Giving</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="gv-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="gv-save">Save</button></div>');
    document.getElementById('gv-fields').innerHTML = Church.renderFields(fields, { Date: new Date().toISOString().split('T')[0] });
    document.getElementById('gv-save').addEventListener('click', function () {
      var payload = Church.readFields(document.getElementById('gv-fields'), fields);
      Church.task('saveFinanceRecord', payload).then(function () { Church.toast('Giving recorded', 'success'); Church.modal.close(); loadGiving(); });
    });
  }
  document.getElementById('fin-add-giving').addEventListener('click', openGivingModal);

  /* ---------- Campaigns ---------- */
  function loadCampaigns() {
    return Church.run('listCampaigns').then(function (rows) {
      campaigns = rows;
      document.getElementById('campaign-list').innerHTML = !rows.length ? '<div class="empty-state">No campaigns yet</div>' :
        rows.map(function (c) { return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="flex" style="justify-content:space-between"><b>' + Church.fmt.escape(c.Name) + '</b><span class="badge badge-gray">' + c.Status + '</span></div><div class="muted" style="font-size:12px">Goal: ' + Church.fmt.money(c.Goal) + '</div></div>'; }).join('');
    });
  }
  document.getElementById('fin-add-campaign').addEventListener('click', function () {
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-gift"></use></svg>New Campaign</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="cm-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="cm-save">Save</button></div>');
    var fields = [
      { key: 'Name', label: 'Campaign Name', required: true },
      { key: 'Goal', label: 'Goal (GHS)', type: 'number', required: true, half: true },
      { key: 'Status', label: 'Status', type: 'select', options: ['Active', 'Completed', 'Cancelled'], half: true },
      { key: 'StartDate', label: 'Start Date', type: 'date', half: true },
      { key: 'EndDate', label: 'End Date', type: 'date', half: true }
    ];
    document.getElementById('cm-fields').innerHTML = Church.renderFields(fields, {});
    document.getElementById('cm-save').addEventListener('click', function () {
      Church.task('saveCampaign', Church.readFields(document.getElementById('cm-fields'), fields)).then(function () { Church.toast('Campaign saved', 'success'); Church.modal.close(); loadCampaigns(); });
    });
  });

  /* ---------- Pledges ---------- */
  function loadPledges() {
    Church.task('listPledges').then(function (rows) {
      pledgeRows = rows;
      document.getElementById('pledge-list').innerHTML = !rows.length ? '<div class="empty-state">No pledges yet</div>' :
        rows.map(function (p) {
          return '<div style="padding:12px 0;border-bottom:1px solid var(--line)">' +
            '<div class="flex" style="justify-content:space-between"><b>' + Church.fmt.escape(p.MemberName) + '</b><span class="muted" style="font-size:12px">' + Church.fmt.escape(p.CampaignName) + '</span></div>' +
            '<div class="progress-bar" style="margin:8px 0"><div style="width:' + p.PercentPaid + '%"></div></div>' +
            '<div class="flex" style="justify-content:space-between;font-size:12px" class="muted"><span>' + Church.fmt.money(p.PaidAmount) + ' of ' + Church.fmt.money(p.PledgedAmount) + '</span><span class="badge ' + (p.Status === 'Fulfilled' ? 'badge-green' : p.Status === 'Overdue' ? 'badge-red' : 'badge-blue') + '">' + p.Status + '</span></div></div>';
        }).join('');
    });
  }
  document.getElementById('fin-add-pledge').addEventListener('click', function () {
    var fields = [
      { key: 'MemberID', label: 'Member', type: 'select', options: memberOptions(), required: true },
      { key: 'CampaignID', label: 'Campaign', type: 'select', options: campaignOptions(), required: true },
      { key: 'PledgedAmount', label: 'Pledged Amount (GHS)', type: 'number', required: true, half: true },
      { key: 'Status', label: 'Status', type: 'select', options: ['Active', 'Fulfilled', 'Overdue', 'Cancelled'], half: true },
      { key: 'StartDate', label: 'Start Date', type: 'date', half: true },
      { key: 'EndDate', label: 'End Date', type: 'date', half: true },
      { key: 'Notes', label: 'Notes', type: 'textarea' }
    ];
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-gift"></use></svg>New Pledge</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="pl-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="pl-save">Save</button></div>');
    document.getElementById('pl-fields').innerHTML = Church.renderFields(fields, {});
    document.getElementById('pl-save').addEventListener('click', function () {
      Church.task('savePledge', Church.readFields(document.getElementById('pl-fields'), fields)).then(function () { Church.toast('Pledge saved', 'success'); Church.modal.close(); loadPledges(); });
    });
  });

  /* ---------- Expenses ---------- */
  function loadExpenses() {
    Church.task('listExpenses').then(function (rows) {
      expenseRows = rows;
      var cols = [
        { label: 'Description', key: 'Description' },
        { label: 'Category', key: 'Category' },
        { label: 'Amount', render: function (r) { return Church.fmt.money(r.Amount); } },
        { label: 'Date', render: function (r) { return Church.fmt.date(r.Date); } },
        { label: 'Status', render: function (r) { return '<span class="badge ' + (r.Status === 'Approved' ? 'badge-green' : r.Status === 'Rejected' ? 'badge-red' : 'badge-amber') + '">' + r.Status + '</span>'; } }
      ];
      if (expenseTable) expenseTable.refresh(rows);
      else expenseTable = Church.dataTable(document.getElementById('expense-table'), {
        columns: cols, rows: rows, searchKeys: ['Description', 'Category'], searchPlaceholder: 'Search expenses…',
        rowActions: function (r) {
          if (r.Status !== 'Pending') return '';
          return '<button class="btn btn-ghost btn-icon btn-sm" title="Approve" data-approve="1"><svg class="icon-sm" style="color:var(--success)"><use href="#ic-check"></use></svg></button>' +
            '<button class="btn btn-ghost btn-icon btn-sm" title="Reject" data-reject="1"><svg class="icon-sm" style="color:var(--danger)"><use href="#ic-close"></use></svg></button>';
        },
        empty: { icon: 'ic-finance', title: 'No expense claims yet' }
      });
      document.getElementById('expense-table').onclick = function (e) {
        var tr = e.target.closest('tr[data-id]'); if (!tr) return;
        if (e.target.closest('[data-approve]')) Church.task('decideExpense', tr.dataset.id, 'Approved').then(function () { Church.toast('Approved', 'success'); loadExpenses(); });
        if (e.target.closest('[data-reject]')) Church.task('decideExpense', tr.dataset.id, 'Rejected').then(function () { Church.toast('Rejected', 'success'); loadExpenses(); });
      };
    });
  }
  document.getElementById('fin-add-expense').addEventListener('click', function () {
    var fields = [
      { key: 'Description', label: 'Description', required: true },
      { key: 'Category', label: 'Category', required: true, half: true },
      { key: 'Department', label: 'Department', half: true },
      { key: 'Amount', label: 'Amount (GHS)', type: 'number', required: true, half: true },
      { key: 'Date', label: 'Date', type: 'date', required: true, half: true },
      { key: 'BudgetLine', label: 'Budget Line' }
    ];
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-card"></use></svg>New Expense Claim</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="ex-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="ex-save">Submit</button></div>');
    document.getElementById('ex-fields').innerHTML = Church.renderFields(fields, { Date: new Date().toISOString().split('T')[0] });
    document.getElementById('ex-save').addEventListener('click', function () {
      Church.task('saveExpense', Church.readFields(document.getElementById('ex-fields'), fields)).then(function () { Church.toast('Expense submitted for approval', 'success'); Church.modal.close(); loadExpenses(); });
    });
  });

  /* ---------- Reports ---------- */
  function runReport() {
    var from = document.getElementById('rep-from').value, to = document.getElementById('rep-to').value;
    Church.task('getFinanceSummary', from, to).then(function (s) {
      document.getElementById('rep-summary').innerHTML =
        '<div class="kpi-card kpi-g1"><div class="icon-wrap"><svg class="icon"><use href="#ic-finance"></use></svg></div><div class="kpi-value">' + Church.fmt.money(s.totalGiving) + '</div><div class="kpi-label">Total Giving</div></div>' +
        '<div class="kpi-card kpi-g2"><div class="icon-wrap"><svg class="icon"><use href="#ic-card"></use></svg></div><div class="kpi-value">' + Church.fmt.money(s.totalExpense) + '</div><div class="kpi-label">Total Expenses</div></div>' +
        '<div class="kpi-card kpi-g3"><div class="icon-wrap"><svg class="icon"><use href="#ic-trend-up"></use></svg></div><div class="kpi-value">' + Church.fmt.money(s.net) + '</div><div class="kpi-label">Net Position</div></div>';
      Church.loadCharts().then(function () {
        var t1 = new google.visualization.DataTable(); t1.addColumn('string', 'Type'); t1.addColumn('number', 'Amount');
        Object.keys(s.byType).forEach(function (k) { t1.addRow([k, s.byType[k]]); });
        new google.visualization.PieChart(document.getElementById('chart-fin-type')).draw(t1, { pieHole: 0.5, colors: ['#22c55e', '#0b3d2e', '#146c43', '#94a3b8'], chartArea: { width: '90%', height: '85%' }, legend: { textStyle: { fontSize: 11 } } });
        var t2 = new google.visualization.DataTable(); t2.addColumn('string', 'Category'); t2.addColumn('number', 'Amount');
        Object.keys(s.byCategory).forEach(function (k) { t2.addRow([k, s.byCategory[k]]); });
        new google.visualization.ColumnChart(document.getElementById('chart-fin-cat')).draw(t2, { legend: 'none', colors: ['#ef4444'], chartArea: { width: '88%', height: '72%' } });
      });
    });
  }
  document.getElementById('rep-run').addEventListener('click', runReport);

  function mount() {
    Church.run('listMembers').then(function (m) { members = m; });
    loadCampaigns().then(loadPledges);
    loadGiving();
    loadExpenses();
    runReport();
  }
  Church.views.finance = { mount: mount, refresh: function () { loadGiving(); loadExpenses(); loadPledges(); } };
})();
</script>
