<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= orgName ?> | Check-In</title>
  <?!= include('Styles'); ?>
</head>
<body>
<?!= include('Icons'); ?>
<div class="public-page">
  <div class="public-card">
    <div class="brand-mark"><svg class="icon"><use href="#ic-church"></use></svg></div>
    <h2 style="color:var(--green-primary);font-size:20px;font-weight:800;margin-bottom:4px"><?= orgName ?></h2>
    <p class="muted" style="margin-bottom:22px">Service Check-In</p>

    <div id="ci-step-id" style="display:<?= memberId ? 'none' : 'block' ?>">
      <div class="field" style="text-align:left">
        <label>Member ID</label>
        <input id="ci-id-input" placeholder="e.g. MEM-000123" style="font-size:16px;text-align:center;letter-spacing:1px">
        <div class="field-hint">Scan your QR card, or ask an usher for your ID.</div>
      </div>
    </div>

    <div class="field" style="text-align:left">
      <label>Today's Service</label>
      <select id="ci-service-select"></select>
    </div>

    <button class="btn btn-primary" id="ci-go-btn" style="width:100%;justify-content:center;padding:14px">
      <svg class="icon"><use href="#ic-check-circle"></use></svg> Check In
    </button>

    <div id="ci-result" style="margin-top:18px"></div>
  </div>
</div>

<script>
  var PRESET_ID = <?!= JSON.stringify(memberId || '') ?>;
  var SERVICE_TYPES = ['Sunday Service', 'Midweek Service', 'Prayer Meeting', 'Youth Service', 'Special Event'];
  var sel = document.getElementById('ci-service-select');
  SERVICE_TYPES.forEach(function (s) { sel.appendChild(new Option(s, s)); });

  function setResult(html) { document.getElementById('ci-result').innerHTML = html; }

  document.getElementById('ci-go-btn').addEventListener('click', function () {
    var id = PRESET_ID || document.getElementById('ci-id-input').value.trim().toUpperCase();
    if (!id) { setResult('<div class="alert-row alert-red"><svg class="icon"><use href="#ic-alert"></use></svg>Please enter your Member ID.</div>'); return; }
    var btn = this; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Checking in…';
    google.script.run
      .withSuccessHandler(function (record) {
        btn.disabled = false; btn.innerHTML = '<svg class="icon"><use href="#ic-check-circle"></use></svg> Check In';
        setResult('<div class="alert-row alert-green"><svg class="icon"><use href="#ic-check-circle"></use></svg>Welcome, ' + record.MemberName + '! You\'re checked in for ' + record.ServiceType + '.</div>');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.innerHTML = '<svg class="icon"><use href="#ic-check-circle"></use></svg> Check In';
        setResult('<div class="alert-row alert-red"><svg class="icon"><use href="#ic-alert"></use></svg>' + (err.message || err) + '</div>');
      })
      .publicCheckIn(id, sel.value);
  });
</script>
</body>
</html>
