<div class="view" id="view-cluster">
  <div class="page-head"><div><h1>Cluster Follow-up</h1><p>Small groups, leaders, and per-member follow-up logs.</p></div></div>

  <div class="tabbar" id="cl-tabs">
    <div class="tab-btn active" data-tab="clusters">Clusters</div>
    <div class="tab-btn" data-tab="followups">Follow-up Log</div>
  </div>

  <div class="tab-panel active" data-panel="clusters">
    <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="cl-add-btn"><svg class="icon"><use href="#ic-plus"></use></svg> New Cluster</button></div>
    <div class="card card-pad"><div id="cl-table"></div></div>
  </div>

  <div class="tab-panel" data-panel="followups">
    <div class="page-actions" style="margin-bottom:14px"><button class="btn btn-primary" id="fu-add-btn"><svg class="icon"><use href="#ic-plus"></use></svg> Log Follow-up</button></div>
    <div class="card card-pad"><div id="fu-table"></div></div>
  </div>
</div>

<script>
(function () {
  var clusters = [], members = [], followups = [], clTable = null, fuTable = null;

  document.querySelectorAll('#cl-tabs .tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#cl-tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('#view-cluster .tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active'); document.querySelector('#view-cluster .tab-panel[data-panel="' + btn.dataset.tab + '"]').classList.add('active');
    });
  });

  function loadClusters() {
    return Church.task('listClusters').then(function (rows) {
      clusters = rows;
      var cols = [
        { label: 'Cluster', key: 'Name' },
        { label: 'Leader', key: 'LeaderName' },
        { label: 'Members', render: function (c) { return '<span class="badge badge-green">' + c.MemberCount + '</span>'; } },
        { label: 'Meets', key: 'MeetingDay' },
        { label: 'Location', key: 'Location' },
        { label: 'Status', render: function (c) { return '<span class="badge ' + (c.Status === 'Active' ? 'badge-green' : 'badge-gray') + '">' + c.Status + '</span>'; } }
      ];
      if (clTable) clTable.refresh(rows);
      else clTable = Church.dataTable(document.getElementById('cl-table'), {
        columns: cols, rows: rows, searchKeys: ['Name', 'LeaderName'], searchPlaceholder: 'Search clusters…',
        onEdit: openClusterModal, onDelete: function (c) { Church.confirm('Delete cluster ' + c.Name + '?').then(function (ok) { if (ok) Church.task('deleteCluster', c.ID).then(function () { Church.toast('Deleted', 'success'); loadClusters(); }); }); },
        empty: { icon: 'ic-cluster', title: 'No clusters yet' }
      });
    });
  }

  function openClusterModal(c) {
    c = c || {};
    var isNew = !c.ID;
    var fields = [
      { key: 'Name', label: 'Cluster Name', required: true },
      { key: 'LeaderMemberID', label: 'Leader', type: 'select', options: members.map(function (m) { return { value: m.ID, label: m.FirstName + ' ' + m.LastName }; }), half: true },
      { key: 'MeetingDay', label: 'Meeting Day', half: true },
      { key: 'Location', label: 'Location', half: true },
      { key: 'Status', label: 'Status', type: 'select', options: ['Active', 'Inactive'], half: true },
      { key: 'Notes', label: 'Notes', type: 'textarea' }
    ];
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-cluster"></use></svg>' + (isNew ? 'New Cluster' : 'Edit Cluster') + '</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="cl-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="cl-save">Save</button></div>');
    document.getElementById('cl-fields').innerHTML = Church.renderFields(fields, c);
    document.getElementById('cl-save').addEventListener('click', function () {
      var payload = Church.readFields(document.getElementById('cl-fields'), fields);
      if (!isNew) payload.ID = c.ID;
      Church.task('saveCluster', payload).then(function () { Church.toast('Saved', 'success'); Church.modal.close(); loadClusters(); });
    });
  }
  document.getElementById('cl-add-btn').addEventListener('click', function () { openClusterModal({}); });

  function loadFollowUps() {
    return Church.task('listClusterFollowUps').then(function (rows) {
      followups = rows;
      var cols = [
        { label: 'Member', key: 'MemberName' },
        { label: 'Cluster', key: 'ClusterName' },
        { label: 'Type', render: function (f) { return '<span class="badge badge-blue">' + f.Type + '</span>'; } },
        { label: 'Date', render: function (f) { return Church.fmt.date(f.FollowUpDate); } },
        { label: 'Outcome', key: 'Outcome' },
        { label: 'By', key: 'FollowedUpBy' }
      ];
      if (fuTable) fuTable.refresh(rows);
      else fuTable = Church.dataTable(document.getElementById('fu-table'), {
        columns: cols, rows: rows, searchKeys: ['MemberName', 'ClusterName'], searchPlaceholder: 'Search follow-ups…',
        onDelete: function (f) { Church.task('deleteClusterFollowUp', f.ID).then(function () { Church.toast('Removed', 'success'); loadFollowUps(); }); },
        empty: { icon: 'ic-cluster', title: 'No follow-ups logged yet' }
      });
    });
  }
  document.getElementById('fu-add-btn').addEventListener('click', function () {
    var fields = [
      { key: 'ClusterID', label: 'Cluster', type: 'select', options: clusters.map(function (c) { return { value: c.ID, label: c.Name }; }), required: true },
      { key: 'MemberID', label: 'Member', type: 'select', options: members.map(function (m) { return { value: m.ID, label: m.FirstName + ' ' + m.LastName }; }), required: true },
      { key: 'Type', label: 'Type', type: 'select', options: ['Visit', 'Call', 'Message'], required: true, half: true },
      { key: 'FollowUpDate', label: 'Date', type: 'date', required: true, half: true },
      { key: 'Outcome', label: 'Outcome' },
      { key: 'Notes', label: 'Notes', type: 'textarea' }
    ];
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-cluster"></use></svg>Log Follow-up</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="fu-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="fu-save">Save</button></div>');
    document.getElementById('fu-fields').innerHTML = Church.renderFields(fields, { FollowUpDate: new Date().toISOString().split('T')[0] });
    document.getElementById('fu-save').addEventListener('click', function () {
      Church.task('saveClusterFollowUp', Church.readFields(document.getElementById('fu-fields'), fields)).then(function () { Church.toast('Saved', 'success'); Church.modal.close(); loadFollowUps(); });
    });
  });

  function mount() {
    Church.run('listMembers').then(function (m) { members = m; });
    loadClusters();
    loadFollowUps();
  }
  Church.views.cluster = { mount: mount, refresh: function () { loadClusters(); loadFollowUps(); } };
})();
</script>
