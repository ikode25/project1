<div class="view" id="view-dashboard">
  <div class="page-head">
    <div>
      <h1>Welcome back 👋</h1>
      <p>Here's what's happening across your church today.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-outline" id="dash-refresh"><svg class="icon"><use href="#ic-refresh"></use></svg> Refresh</button>
    </div>
  </div>

  <div class="grid grid-4" id="dash-kpis" style="margin-bottom:18px"></div>

  <div class="grid grid-2" style="margin-bottom:18px">
    <div class="card">
      <div class="card-head"><div><h3>Attendance Trend</h3><p>Check-ins per recent service</p></div><svg class="icon" style="color:#c3d0ca"><use href="#ic-attendance"></use></svg></div>
      <div class="card-pad"><div id="chart-attendance" style="height:220px"></div></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h3>Giving Trend</h3><p>Total giving by month</p></div><svg class="icon" style="color:#c3d0ca"><use href="#ic-finance"></use></svg></div>
      <div class="card-pad"><div id="chart-giving" style="height:220px"></div></div>
    </div>
  </div>

  <div class="grid grid-2" style="margin-bottom:18px">
    <div class="card">
      <div class="card-head"><div><h3>Member Growth</h3><p>Cumulative membership, last 6 months</p></div><svg class="icon" style="color:#c3d0ca"><use href="#ic-trend-up"></use></svg></div>
      <div class="card-pad"><div id="chart-growth" style="height:220px"></div></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h3>Membership Status</h3><p>Current breakdown</p></div><svg class="icon" style="color:#c3d0ca"><use href="#ic-members"></use></svg></div>
      <div class="card-pad"><div id="chart-status" style="height:220px"></div></div>
    </div>
  </div>

  <div class="grid grid-3">
    <div class="card" style="grid-column: span 1">
      <div class="card-head"><h3>Alerts</h3></div>
      <div class="card-pad" id="dash-alerts"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Upcoming Birthdays</h3></div>
      <div class="card-pad" id="dash-birthdays"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Membership Anniversaries</h3></div>
      <div class="card-pad" id="dash-anniversaries"></div>
    </div>
  </div>
</div>

<script>
(function () {
  function kpiCard(icon, gradClass, value, label, sub) {
    return '<div class="kpi-card ' + gradClass + '"><div class="icon-wrap"><svg class="icon"><use href="#' + icon + '"></use></svg></div>' +
      '<div class="kpi-value">' + value + '</div><div class="kpi-label">' + label + '</div>' +
      (sub ? '<div class="kpi-delta"><svg class="icon-sm"><use href="#ic-trend-up"></use></svg>' + sub + '</div>' : '') + '</div>';
  }

  function renderAlerts(alerts) {
    var iconFor = { red: 'ic-alert', orange: 'ic-alert', amber: 'ic-alert', green: 'ic-check-circle', blue: 'ic-info' };
    document.getElementById('dash-alerts').innerHTML = alerts.map(function (a) {
      return '<div class="alert-row alert-' + a.level + '"><svg class="icon"><use href="#' + iconFor[a.level] + '"></use></svg><span>' + Church.fmt.escape(a.text) + '</span></div>';
    }).join('') || '<div class="empty-state">No alerts</div>';
  }

  function renderPeople(containerId, list, dateLabel) {
    var el = document.getElementById(containerId);
    if (!list.length) { el.innerHTML = '<div class="empty-state">Nothing in the next 14 days</div>'; return; }
    el.innerHTML = list.map(function (p) {
      return '<div class="flex gap-10" style="padding:9px 0;border-bottom:1px solid var(--line)">' +
        '<div class="avatar-circle">' + Church.fmt.initials(p.name) + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">' + Church.fmt.escape(p.name) + '</div>' +
        '<div class="muted" style="font-size:11.5px">' + Church.fmt.date(p.date) + (p.turning ? ' · turning ' + p.turning : '') + (p.years ? ' · ' + p.years + ' yr(s)' : '') + '</div></div>' +
        '<span class="badge ' + (p.daysAway === 0 ? 'badge-green' : 'badge-gray') + '">' + (p.daysAway === 0 ? 'Today' : p.daysAway + 'd') + '</span></div>';
    }).join('');
  }

  function drawCharts(data) {
    Church.loadCharts().then(function () {
      var green = '#0b3d2e', accent = '#22c55e', dark = '#146c43';

      var attTable = new google.visualization.DataTable();
      attTable.addColumn('string', 'Date'); attTable.addColumn('number', 'Check-ins');
      data.charts.attendanceTrend.forEach(function (r) { attTable.addRow([r.date.slice(5), r.count]); });
      new google.visualization.ColumnChart(document.getElementById('chart-attendance')).draw(attTable, {
        legend: 'none', colors: [accent], chartArea: { width: '88%', height: '72%' },
        vAxis: { gridlines: { color: '#eef2f0' } }, hAxis: { textStyle: { fontSize: 11 } }
      });

      var giveTable = new google.visualization.DataTable();
      giveTable.addColumn('string', 'Month'); giveTable.addColumn('number', 'Giving');
      data.charts.givingTrend.forEach(function (r) { giveTable.addRow([r.month, r.amount]); });
      new google.visualization.AreaChart(document.getElementById('chart-giving')).draw(giveTable, {
        legend: 'none', colors: [green], chartArea: { width: '88%', height: '72%' },
        areaOpacity: 0.18, vAxis: { gridlines: { color: '#eef2f0' } }
      });

      var growTable = new google.visualization.DataTable();
      growTable.addColumn('string', 'Month'); growTable.addColumn('number', 'Members');
      data.charts.memberGrowth.forEach(function (r) { growTable.addRow([r.month, r.total]); });
      new google.visualization.LineChart(document.getElementById('chart-growth')).draw(growTable, {
        legend: 'none', colors: [dark], lineWidth: 3, pointSize: 5, chartArea: { width: '88%', height: '72%' },
        vAxis: { gridlines: { color: '#eef2f0' } }
      });

      var statusTable = new google.visualization.DataTable();
      statusTable.addColumn('string', 'Status'); statusTable.addColumn('number', 'Members');
      data.charts.statusBreakdown.filter(function (s) { return s.count > 0; }).forEach(function (r) { statusTable.addRow([r.status, r.count]); });
      new google.visualization.PieChart(document.getElementById('chart-status')).draw(statusTable, {
        legend: { position: 'right', textStyle: { fontSize: 11 } }, pieHole: 0.5,
        colors: ['#22c55e', '#0b3d2e', '#94a3b8', '#f59e0b', '#ef4444'], chartArea: { width: '90%', height: '85%' }
      });
    });
  }

  function load() {
    Church.task('getDashboardData').then(function (data) {
      var k = data.kpis;
      document.getElementById('dash-kpis').innerHTML =
        kpiCard('ic-members', 'kpi-g1', k.totalMembers, 'Total Members', k.newThisMonth + ' new this month') +
        kpiCard('ic-visitor', 'kpi-g2', k.visitorsThisMonth, 'Visitors This Month', '') +
        kpiCard('ic-attendance', 'kpi-g3', k.lastServiceAttendance, 'Last Service Attendance', '') +
        kpiCard('ic-finance', 'kpi-g4', Church.fmt.money(k.givingThisMonth), 'Giving This Month', k.pendingExpenses + ' expense(s) pending');
      renderAlerts(data.alerts);
      renderPeople('dash-birthdays', data.birthdays, 'birthday');
      renderPeople('dash-anniversaries', data.anniversaries, 'anniversary');
      drawCharts(data);
    });
  }

  document.getElementById('dash-refresh').addEventListener('click', load);
  Church.views.dashboard = { mount: load, refresh: load };
})();
</script>
