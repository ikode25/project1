<div class="view" id="view-equipment">
  <div class="page-head">
    <div><h1>Equipment</h1><p>Church asset inventory, assignment and condition tracking.</p></div>
    <div class="page-actions"><button class="btn btn-primary" id="eq-add-btn"><svg class="icon"><use href="#ic-plus"></use></svg> Add Equipment</button></div>
  </div>
  <div class="card card-pad"><div id="eq-table"></div></div>
</div>

<script>
(function () {
  var FIELDS = [
    { key: 'Name', label: 'Equipment Name', required: true, half: true },
    { key: 'Category', label: 'Category', required: true, half: true },
    { key: 'SerialNumber', label: 'Serial Number', half: true },
    { key: 'Status', label: 'Status', type: 'select', options: ['Available', 'In Use', 'Maintenance', 'Retired'], half: true },
    { key: 'Location', label: 'Location', half: true },
    { key: 'AssignedTo', label: 'Assigned To', half: true },
    { key: 'PurchaseDate', label: 'Purchase Date', type: 'date', half: true },
    { key: 'Condition', label: 'Condition', type: 'select', options: ['Excellent', 'Good', 'Fair', 'Poor'], half: true },
    { key: 'Notes', label: 'Notes', type: 'textarea' }
  ];
  var all = [], table = null;

  function statusBadge(s) {
    var cls = { Available: 'badge-green', 'In Use': 'badge-blue', Maintenance: 'badge-amber', Retired: 'badge-gray' }[s] || 'badge-gray';
    return '<span class="badge ' + cls + '">' + s + '</span>';
  }

  function render() {
    var cols = [
      { label: 'Name', render: function (e) { return '<b>' + Church.fmt.escape(e.Name) + '</b><div class="muted" style="font-size:11.5px">' + Church.fmt.escape(e.Category) + '</div>'; } },
      { label: 'Serial #', render: function (e) { return '<span class="mono">' + Church.fmt.escape(e.SerialNumber || '—') + '</span>'; } },
      { label: 'Status', render: function (e) { return statusBadge(e.Status); } },
      { label: 'Location', key: 'Location' },
      { label: 'Assigned To', render: function (e) { return Church.fmt.escape(e.AssignedTo || '—'); } },
      { label: 'Condition', key: 'Condition' }
    ];
    if (table) { table.refresh(all); return; }
    table = Church.dataTable(document.getElementById('eq-table'), {
      columns: cols, rows: all, searchKeys: ['Name', 'Category', 'SerialNumber', 'Location'], searchPlaceholder: 'Search equipment…',
      onEdit: openModal, onDelete: function (e) { Church.confirm('Remove ' + e.Name + ' from inventory?').then(function (ok) { if (ok) Church.task('deleteEquipment', e.ID).then(function () { Church.toast('Removed', 'success'); load(); }); }); },
      empty: { icon: 'ic-equipment', title: 'No equipment recorded yet' }
    });
  }

  function openModal(item) {
    item = item || {};
    var isNew = !item.ID;
    Church.modal.open('<div class="modal-head"><h3><svg class="icon"><use href="#ic-equipment"></use></svg>' + (isNew ? 'Add Equipment' : 'Edit Equipment') + '</h3><div class="modal-close" onclick="Church.modal.close()"><svg class="icon"><use href="#ic-close"></use></svg></div></div>' +
      '<div class="modal-body" id="eq-fields"></div><div class="modal-foot"><button class="btn btn-outline" onclick="Church.modal.close()">Cancel</button><button class="btn btn-primary" id="eq-save">Save</button></div>');
    document.getElementById('eq-fields').innerHTML = Church.renderFields(FIELDS, item);
    document.getElementById('eq-save').addEventListener('click', function () {
      var payload = Church.readFields(document.getElementById('eq-fields'), FIELDS);
      if (!isNew) payload.ID = item.ID;
      Church.task('saveEquipment', payload).then(function () { Church.toast('Saved', 'success'); Church.modal.close(); load(); });
    });
  }

  function load() { return Church.task('listEquipment').then(function (rows) { all = rows; render(); }); }
  document.getElementById('eq-add-btn').addEventListener('click', function () { openModal({}); });
  Church.views.equipment = { mount: load, refresh: load };
})();
</script>
