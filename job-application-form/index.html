    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            /* Default (Classic Green) system color palette.
               Admin > Settings > Appearance overrides these at runtime. */
            --c-darkest: #1b5e20;
            --c-dark: #2e7d32;
            --c-mid: #43a047;
            --c-light: #66bb6a;
            --c-pale: #c8e6c9;
            --c-faint: #e8f5e9;
            --c-tint: #f1f8f4;
            --doodle-pattern: none;
            --doodle-opacity: 0.14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* Safety net: nothing should ever be able to force page-wide
               horizontal scroll on a phone. Elements that legitimately need
               to scroll sideways (e.g. .data-table) still can - they scroll
               within their own box, this only stops the outer page. */
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--c-faint) 0%, var(--c-pale) 100%);
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
            max-width: 100vw;
            margin: 0;
        }

        body.dashboard-active {
            padding: 0;
            overflow: hidden;
        }

        body.form-active {
            padding: 0;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.15);
            overflow: hidden;
        }

        body.form-active .container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            margin: 0;
            border-radius: 0;
            overflow-y: auto;
            box-shadow: none;
        }

        .header {
            background: linear-gradient(135deg, var(--c-dark) 0%, var(--c-mid) 100%);
            background-size: cover;
            background-position: center;
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--doodle-pattern);
            background-repeat: repeat;
            background-size: 140px;
            opacity: var(--doodle-opacity);
            pointer-events: none;
            animation: doodle-drift 14s linear infinite;
        }

        @keyframes doodle-drift {
            0% { background-position: 0 0; }
            100% { background-position: 280px 280px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .header::before,
            .dashboard-header::before {
                animation: none;
            }
        }

        .header > * {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Icon-only admin entry point: no label, no box, just the icon */
        .admin-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            z-index: 2;
            background: transparent;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-btn:hover,
        .admin-btn:focus-visible {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            outline: none;
        }

        .admin-btn i {
            font-size: 17px;
        }

        .social-links-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }

        .social-links-row a {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .social-links-row a:hover {
            background: white;
            color: var(--c-dark);
            transform: translateY(-2px);
        }

        .password-field-wrapper {
            position: relative;
        }

        .password-field-wrapper .login-input {
            padding-right: 44px;
        }

        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #757575;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .password-toggle-btn:hover {
            color: var(--c-dark);
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 6000;
            display: flex;
            flex-direction: column-reverse;
            gap: 12px;
            pointer-events: none;
        }

        .toast-card {
            pointer-events: auto;
            min-width: 280px;
            max-width: 380px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-left: 5px solid #2e7d32;
            animation: toast-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .toast-card.toast-leaving {
            animation: toast-out 0.28s ease forwards;
        }

        .toast-card.toast-success { border-left-color: #2e7d32; }
        .toast-card.toast-error { border-left-color: #c62828; }
        .toast-card.toast-info { border-left-color: #1976d2; }
        .toast-card.toast-warning { border-left-color: #f57c00; }

        .toast-icon {
            font-size: 20px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .toast-card.toast-success .toast-icon { color: #2e7d32; }
        .toast-card.toast-error .toast-icon { color: #c62828; }
        .toast-card.toast-info .toast-icon { color: #1976d2; }
        .toast-card.toast-warning .toast-icon { color: #f57c00; }

        .toast-message {
            flex: 1;
            font-size: 13.5px;
            color: #333;
            line-height: 1.45;
        }

        .toast-close {
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 13px;
            padding: 2px;
            flex-shrink: 0;
        }

        .toast-close:hover {
            color: #666;
        }

        @keyframes toast-in {
            from { transform: translateX(40px) scale(0.95); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes toast-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(40px); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .toast-card {
                animation: none;
            }
        }

        /* Blinking SMS balance badge */
        .sms-balance-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            font-weight: 600;
        }

        .sms-balance-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffca28;
            box-shadow: 0 0 0 rgba(255, 202, 40, 0.6);
            animation: sms-balance-blink 1.4s ease-in-out infinite;
        }

        .sms-balance-dot.low {
            background: #ff5252;
            box-shadow: 0 0 0 rgba(255, 82, 82, 0.6);
            animation: sms-balance-blink-red 1.1s ease-in-out infinite;
        }

        @keyframes sms-balance-blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 202, 40, 0.55); }
            50% { opacity: 0.35; box-shadow: 0 0 0 6px rgba(255, 202, 40, 0); }
        }

        @keyframes sms-balance-blink-red {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.55); }
            50% { opacity: 0.3; box-shadow: 0 0 0 6px rgba(255, 82, 82, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .sms-balance-dot,
            .sms-balance-dot.low {
                animation: none;
            }
        }

        .form-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--c-faint);
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: var(--c-dark);
        }

        .section-number {
            background: linear-gradient(135deg, var(--c-light) 0%, var(--c-mid) 100%);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            font-size: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            /* Grid/flex items default to min-width:auto, which stops them
               shrinking below their content's intrinsic width (date inputs
               are the worst offender - their native calendar control has a
               wide minimum). That's what was pushing the whole page wider
               than the phone screen and forcing the browser to zoom out to
               fit it - not a viewport meta problem, an overflow problem. */
            min-width: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--c-dark);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="datetime-local"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--c-pale);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--c-mid);
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .education-subsection {
            background: var(--c-tint);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--c-light);
        }

        .education-subsection h4 {
            color: var(--c-dark);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .file-upload {
            border: 2px dashed var(--c-light);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: var(--c-tint);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            background: var(--c-faint);
            border-color: var(--c-mid);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-label {
            cursor: pointer;
            color: var(--c-dark);
        }

        .file-upload-icon {
            font-size: 48px;
            color: var(--c-light);
            margin-bottom: 10px;
        }

        /* Certificate upload: one of these sits inside every education
           subsection, so the large dashed drop-zone used for CV/cover
           letter (meant to be found once, at the very bottom of the form)
           would be repetitive and oversized here. This is a compact single
           row instead - icon, filename, small upload button. */
        .certificate-upload-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            border: 1.5px solid var(--c-pale);
            border-radius: 8px;
            background: #fff;
        }

        .certificate-upload-row:focus-within {
            border-color: var(--c-mid);
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.1);
        }

        .certificate-upload-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--c-faint);
            color: var(--c-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
        }

        .certificate-upload-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .certificate-upload-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--c-darkest);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .certificate-upload-name.placeholder {
            font-weight: 400;
            color: #999;
        }

        .certificate-upload-hint {
            font-size: 11px;
            color: #999;
        }

        .certificate-upload-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: var(--c-mid);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .certificate-upload-btn:hover {
            background: var(--c-dark);
        }

        .certificate-upload-row input[type="file"] {
            display: none;
        }

        @media (max-width: 420px) {
            .certificate-upload-row {
                flex-wrap: wrap;
            }

            .certificate-upload-info {
                min-width: 100%;
                order: 1;
            }

            .certificate-upload-icon {
                order: 0;
            }

            .certificate-upload-btn {
                order: 2;
                margin-left: auto;
            }
        }

        /* Passport photo: a real photo-shaped frame instead of the wide
           document drop-zone, so it reads as "put your photo here" and
           previews the actual picture once one's chosen. */
        .passport-photo-row {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            flex-wrap: wrap;
        }

        .passport-photo-frame {
            width: 150px;
            height: 190px;
            flex-shrink: 0;
            border: 2px dashed var(--c-light);
            border-radius: 10px;
            background: var(--c-tint);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            color: var(--c-dark);
            transition: all 0.3s ease;
        }

        .passport-photo-frame:hover {
            background: var(--c-faint);
            border-color: var(--c-mid);
        }

        .passport-photo-frame.has-photo {
            border-style: solid;
            padding: 0;
        }

        .passport-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .passport-photo-frame i {
            font-size: 34px;
            color: var(--c-light);
        }

        .passport-photo-frame span {
            font-size: 12px;
            padding: 0 10px;
            line-height: 1.4;
        }

        .passport-photo-hint {
            flex: 1;
            min-width: 200px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            padding-top: 6px;
        }

        .passport-photo-hint .change-photo-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid var(--c-light);
            background: white;
            color: var(--c-dark);
            font-size: 13px;
            cursor: pointer;
        }

        .passport-photo-hint .change-photo-btn:hover {
            background: var(--c-faint);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: var(--c-mid);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--c-dark) 0%, var(--c-mid) 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .job-description-view {
            background: var(--c-tint);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--c-mid);
            color: var(--c-darkest);
            line-height: 1.6;
        }

        .required {
            color: #d32f2f;
            margin-left: 2px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            border: 4px solid var(--c-faint);
            border-top: 4px solid var(--c-mid);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message-box {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .message-box.success {
            background: var(--c-faint);
            border: 2px solid var(--c-mid);
            color: var(--c-darkest);
        }

        .message-box.error {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }

        .message-box i {
            font-size: 24px;
        }

        .submit-btn:disabled {
            background: var(--c-pale);
            cursor: not-allowed;
            transform: none;
        }

        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-modal-header {
            background: linear-gradient(135deg, var(--c-dark) 0%, var(--c-mid) 100%);
            color: white;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-modal-header h2 {
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .login-modal-body {
            padding: 30px;
        }

        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--c-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--c-pale);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;

        /* Application review modal - uses the same theme variables as the
           rest of the form, so it picks up whatever colors the admin has
           set instead of a fixed palette. */
        .preview-modal-content {
            max-width: 720px;
            border-radius: 16px;
            /* NOT `overflow: hidden` - that shorthand also sets overflow-y,
               silently overriding the base .modal-content's `overflow-y:
               auto` (same rule this class relies on for scrolling) since
               this rule is declared later in the stylesheet. That's what
               made the modal content impossible to scroll past ~80vh -
               the Confirm & Submit button was there, just unreachable.
               overflow-x: hidden alone still clips content to the rounded
               corners; overflow-y stays auto so long applications scroll. */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .preview-modal-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 26px 28px;

            width: 32px;
            height: 32px;

            align-items: center;
            justify-content: center;

        .preview-modal-body {

    <!-- Server-rendered theme (Code.gs doGet() passes this in) - paints the
         admin's saved color theme on the very first frame, instead of the
         default green flashing briefly before the client-side theme fetch
         (below, in the React app) resolves and repaints it. -->
    <style>
        :root {
            --c-darkest: <?!= serverThemeColors.darkest ?>;
            --c-dark: <?!= serverThemeColors.dark ?>;
            --c-mid: <?!= serverThemeColors.mid ?>;
            --c-light: <?!= serverThemeColors.light ?>;
            --c-pale: <?!= serverThemeColors.pale ?>;
            --c-faint: <?!= serverThemeColors.faint ?>;
            --c-tint: <?!= serverThemeColors.tint ?>;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Independent of React entirely, so it still shows up even if the
         React tree itself is what goes down (React's own error boundaries
         only catch errors thrown during rendering, not inside plain event
         handlers). Renders a plain-DOM banner with the real error text on
         any uncaught exception or unhandled promise rejection, so a blank
         page turns into an actionable screenshot instead of a dead end. -->
    <script>
        function showCrashBanner(message) {
            if (document.getElementById('crash-banner')) return;
            const banner = document.createElement('div');
            banner.id = 'crash-banner';
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;' +
                'background:#fff3f3;border-bottom:3px solid #c62828;padding:14px 18px;' +
                'font-family:monospace;font-size:12px;color:#c62828;white-space:pre-wrap;' +
                'word-break:break-word;max-height:40vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,0.15);';
            banner.textContent = 'A script error happened (please screenshot this):\n\n' + message;
            document.body.appendChild(banner);
        }
        window.addEventListener('error', function (event) {
            showCrashBanner((event.error && event.error.stack) || event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
            const reason = event.reason;
            showCrashBanner((reason && reason.stack) || (reason && reason.message) || String(reason));
        });
    </script>

    <script type="text/babel">
        const { useState } = React;

        /* ============================================================
         * Appearance / Theme engine
         * Curated presets + a custom two-color mode, applied as CSS
         * custom properties on the document root so every existing
         * .header / .submit-btn / .section-number / etc. re-colors
         * automatically. A subtle SVG "doodle" pattern overlays the
         * header/dashboard-header gradients for an ultra-modern feel.
         * ============================================================ */

        const PRESET_THEMES = [
            { id: 'classicGreen', name: 'Classic Green', colors: { darkest: '#1b5e20', dark: '#2e7d32', mid: '#43a047', light: '#66bb6a', pale: '#c8e6c9', faint: '#e8f5e9', tint: '#f1f8f4' } },
            { id: 'oceanBreeze', name: 'Ocean Breeze', colors: { darkest: '#01579b', dark: '#0277bd', mid: '#0288d1', light: '#4fc3f7', pale: '#b3e5fc', faint: '#e1f5fe', tint: '#f1fafe' } },
            { id: 'sunsetAurora', name: 'Sunset Aurora', colors: { darkest: '#4a148c', dark: '#7b1fa2', mid: '#ab47bc', light: '#f06292', pale: '#f8bbd0', faint: '#fce4ec', tint: '#fdf1f6' } },
            { id: 'midnightNeon', name: 'Midnight Neon', colors: { darkest: '#0d1b2a', dark: '#1b263b', mid: '#00b4d8', light: '#48cae4', pale: '#ade8f4', faint: '#caf0f8', tint: '#e8fbfd' } },
            { id: 'coralBloom', name: 'Coral Bloom', colors: { darkest: '#bf360c', dark: '#e64a19', mid: '#ff7043', light: '#ffab91', pale: '#ffccbc', faint: '#fbe9e7', tint: '#fdf4f2' } },
            { id: 'emeraldLuxe', name: 'Emerald Luxe', colors: { darkest: '#003d29', dark: '#00695c', mid: '#00897b', light: '#4db6ac', pale: '#b2dfdb', faint: '#e0f2f1', tint: '#f0f9f8' } }
        ];

        const DOODLE_OPTIONS = [
            { id: 'none', name: 'None' },
            { id: 'dots', name: 'Dots' },
            { id: 'waves', name: 'Waves' },
            { id: 'blobs', name: 'Blobs' }
        ];

        const DOODLE_SVGS = {
            dots: "<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><circle cx='10' cy='10' r='4' fill='white'/><circle cx='50' cy='30' r='3' fill='white'/><circle cx='84' cy='68' r='5' fill='white'/><circle cx='28' cy='78' r='3' fill='white'/><circle cx='68' cy='14' r='2' fill='white'/><circle cx='92' cy='40' r='2.5' fill='white'/></svg>",
            waves: "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><path d='M0 30 Q15 10 30 30 T60 30 T90 30 T120 30' stroke='white' stroke-width='3' fill='none'/><path d='M0 48 Q15 28 30 48 T60 48 T90 48 T120 48' stroke='white' stroke-width='2' fill='none' opacity='0.6'/></svg>",
            blobs: "<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><circle cx='28' cy='30' r='20' fill='white'/><circle cx='104' cy='94' r='15' fill='white'/><path d='M85 18c14-9 27 1 27 15s-12 24-26 20-19-19-12-28 6-3 11-7z' fill='white'/></svg>"
        };

        function getDoodleBackgroundImage(doodleKey) {
            const svg = DOODLE_SVGS[doodleKey];
            if (!svg) return 'none';
            return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
        }

        function hexToRgb(hex) {
            const h = (hex || '#000000').replace('#', '');
            const full = h.length === 3 ? h.split('').map(ch => ch + ch).join('') : h;
            const bigint = parseInt(full, 16) || 0;
            return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b]
                .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
                .join('');
        }

        function mixColors(hex1, hex2, weight) {
            const c1 = hexToRgb(hex1);
            const c2 = hexToRgb(hex2);
            const w = Math.max(0, Math.min(1, weight));
            return rgbToHex(
                c1.r + (c2.r - c1.r) * w,
                c1.g + (c2.g - c1.g) * w,
                c1.b + (c2.b - c1.b) * w
            );
        }

        // Derives the full 7-token palette from just two admin-picked colors
        function deriveCustomPalette(darkColor, lightColor) {
            return {
                darkest: mixColors(darkColor, '#000000', 0.25),
                dark: darkColor,
                mid: mixColors(darkColor, lightColor, 0.5),
                light: lightColor,
                pale: mixColors(lightColor, '#ffffff', 0.55),
                faint: mixColors(lightColor, '#ffffff', 0.85),
                tint: mixColors(lightColor, '#ffffff', 0.92)
            };
        }

        function getDefaultThemeConfig() {
            return {
                preset: 'classicGreen',
                doodle: 'dots',
                colors: PRESET_THEMES[0].colors
            };
        }

        // Applies a theme config to the document root as CSS custom properties
        function applyTheme(themeConfig) {
            if (!themeConfig || !themeConfig.colors) return;
            const root = document.documentElement;
            const c = themeConfig.colors;
            root.style.setProperty('--c-darkest', c.darkest);
            root.style.setProperty('--c-dark', c.dark);
            root.style.setProperty('--c-mid', c.mid);
            root.style.setProperty('--c-light', c.light);
            root.style.setProperty('--c-pale', c.pale);
            root.style.setProperty('--c-faint', c.faint);
            root.style.setProperty('--c-tint', c.tint);
            root.style.setProperty('--doodle-pattern', getDoodleBackgroundImage(themeConfig.doodle));
        }

        /* ============================================================
         * Admin-controlled form fields
         * Built-in fields are grouped at the level admins actually think
         * about (whole subsections like "HND", not each individual input).
         * A locked field can't be hidden - it's load-bearing elsewhere
         * (dedup by email, CV requirement, position tracking, etc.).
         * ============================================================ */

        const BUILT_IN_FIELDS = [
            { id: 'applyingFor', label: 'Applying For', section: 'personal', locked: true },
            { id: 'firstName', label: 'First Name', section: 'personal', locked: true },
            { id: 'lastName', label: 'Last Name', section: 'personal', locked: true },
            { id: 'email', label: 'Email', section: 'personal', locked: true },
            { id: 'mobile', label: 'Mobile Number', section: 'personal', locked: true },
            { id: 'dob', label: 'Date of Birth', section: 'personal' },
            { id: 'religion', label: 'Religion', section: 'personal' },
            { id: 'maritalStatus', label: 'Marital Status', section: 'personal' },
            { id: 'gender', label: 'Gender', section: 'personal' },
            { id: 'nationality', label: 'Nationality', section: 'personal' },
            { id: 'currentAddress', label: 'Current Address', section: 'personal' },
            { id: 'permanentAddress', label: 'Permanent Address', section: 'personal' },
            { id: 'ssc', label: 'SSC (Secondary School Certificate)', section: 'education' },
            { id: 'sscCertificate', label: 'SSC Certificate Upload (Required if shown)', section: 'education' },
            { id: 'hsc', label: 'HSC (Higher Secondary Certificate)', section: 'education' },
            { id: 'hscCertificate', label: 'HSC Certificate Upload (Required if shown)', section: 'education' },
            { id: 'bachelor', label: "Bachelor/Undergraduate", section: 'education' },
            { id: 'bachelorCertificate', label: 'Bachelor Certificate Upload (Required if shown)', section: 'education' },
            { id: 'hnd', label: 'HND (Higher National Diploma)', section: 'education' },
            { id: 'hndCertificate', label: 'HND Certificate Upload (Required if shown)', section: 'education' },
            { id: 'postgraduate', label: 'Postgraduate', section: 'education' },
            { id: 'postgraduateCertificate', label: 'Postgraduate Certificate Upload (Required if shown)', section: 'education' },
            { id: 'experience', label: 'Work Experience Details', section: 'experience' },
            { id: 'coverLetter', label: 'Cover Letter Upload', section: 'documents' },
            { id: 'passportPhoto', label: 'Passport Photo Upload', section: 'documents' }
        ];

        // Shared by every place that lists an applicant's uploaded
        // documents (Document Bank table, candidate cards) so the "View
        // Certificate" buttons stay in sync with the 5 education levels.
        const CERTIFICATE_LEVELS = [
            { id: 'ssc', label: 'SSC' },
            { id: 'hsc', label: 'HSC' },
            { id: 'bachelor', label: 'Bachelor' },
            { id: 'hnd', label: 'HND' },
            { id: 'postgraduate', label: 'PG' }
        ];

        /* ============================================================
         * WhatsApp - no API, no credentials. "Sending" a WhatsApp message
         * just opens a wa.me click-to-chat link in a new tab, pre-filled
         * with the applicant's number and message; the admin presses Send
         * themselves inside WhatsApp Web/App. Everything happens client
         * side, so this normalization logic lives here rather than Code.gs.
         * ============================================================ */

        // wa.me expects digits only (no "+", spaces, or dashes), with the
        // country code included.
        function normalizeWhatsappNumber(phone, defaultCountryCode) {
            // Google Sheets hands back a long all-digit Mobile cell as a JS
            // number, not a string (no quotes needed to look numeric) -
            // String(...) first so .replace() below never blows up on it.
            let digits = String(phone || '').replace(/[^\d+]/g, '');
            if (digits.startsWith('+')) {
                digits = digits.substring(1);
            } else if (digits.startsWith('00')) {
                digits = digits.substring(2);
            } else if (digits.startsWith('0') && defaultCountryCode) {
                digits = String(defaultCountryCode).replace(/\D/g, '') + digits.substring(1);
            }
            return digits;
        }

        function buildWhatsappLink(phone, message, defaultCountryCode) {
            const number = normalizeWhatsappNumber(phone, defaultCountryCode);
            return `https://wa.me/${number}?text=${encodeURIComponent(message || '')}`;
        }

        const CUSTOM_FIELD_TYPES = [
            { id: 'text', label: 'Short Text' },
            { id: 'textarea', label: 'Long Text' },
            { id: 'number', label: 'Number' },
            { id: 'date', label: 'Date' },
            { id: 'email', label: 'Email' },
            { id: 'tel', label: 'Phone' },
            { id: 'select', label: 'Dropdown' },
            { id: 'image', label: 'Image Upload' },
            { id: 'file', label: 'Document Upload' }
        ];

        // Custom field types whose value is a file, not text - handled the
        // same way as certificates (uploaded to Drive at submit time, URL
        // stored in place of the raw file data).
        const CUSTOM_FILE_FIELD_TYPES = ['image', 'file'];

        const FORM_SECTIONS = [
            { id: 'personal', label: 'Personal Information' },
            { id: 'education', label: 'Education' },
            { id: 'experience', label: 'Experience' }
        ];

        function getDefaultFormFieldsConfigClient() {
            return { hiddenFields: [], customFields: [], fieldRequirements: {} };
        }

        // Fields whose required-ness admin can override, mapped to their
        // normal default (used whenever there's no override saved yet).
        // Locked fields (name/email/mobile/position) and fields with no
        // single required attribute to toggle (education subsections,
        // documents) aren't included - see EducationSection/CVUploadSection
        // for why those work differently (whole-group visibility, or
        // required-when-shown file uploads validated in JS).
        const FIELD_DEFAULT_REQUIRED = {
            dob: true,
            religion: false,
            maritalStatus: true,
            gender: true,
            nationality: true,
            currentAddress: true,
            permanentAddress: true,
            experience: true
        };

        function isFieldRequired(fieldRequirements, fieldId, defaultValue) {
            const overrides = fieldRequirements || {};
            return overrides.hasOwnProperty(fieldId) ? !!overrides[fieldId] : defaultValue;
        }

        // Renders one admin-defined custom field using the same Input/Select
        // building blocks the built-in fields use, so it looks native.
        const CustomFieldInput = ({ field, value, onChange }) => {
            if (field.type === 'image' || field.type === 'file') {
                const isImage = field.type === 'image';
                const fileName = value && value.fileName;

                const handleFileSelect = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (isImage && !file.type.startsWith('image/')) {
                        alert('Please select an image file.');
                        e.target.value = '';
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        onChange(field.id, { fileName: file.name, data: event.target.result });
                    };
                    reader.onerror = () => alert('Failed to read the file. Please try again.');
                    reader.readAsDataURL(file);
                };

                return (
                    <div className="form-group">
                        <label>
                            {field.label}
                            {field.required && <span className="required">*</span>}
                        </label>
                        <div className="certificate-upload-row">
                            <div className="certificate-upload-icon">
                                <i className={`fas ${isImage ? 'fa-image' : 'fa-file-upload'}`}></i>
                            </div>
                            <div className="certificate-upload-info">
                                <span className={`certificate-upload-name ${fileName ? '' : 'placeholder'}`}>
                                    {fileName || 'No file selected'}
                                </span>
                                <span className="certificate-upload-hint">{isImage ? 'Image, max 5MB' : 'PDF or image, max 5MB'}</span>
                            </div>
                            <label htmlFor={`customField_${field.id}`} className="certificate-upload-btn">
                                <i className="fas fa-upload"></i> {fileName ? 'Change' : 'Upload'}
                            </label>
                            <input
                                type="file"
                                id={`customField_${field.id}`}
                                accept={isImage ? 'image/*' : '.pdf,image/*'}
                                onChange={handleFileSelect}
                            />
                        </div>
                    </div>
                );
            }
            if (field.type === 'textarea') {
                return (
                    <TextArea
                        label={field.label}
                        name={field.id}
                        value={value || ''}
                        onChange={(e) => onChange(field.id, e.target.value)}
                        required={!!field.required}
                    />
                );
            }
            if (field.type === 'select') {
                const options = (field.options || '').split('\n').map(o => o.trim()).filter(Boolean);
                return (
                    <Select
                        label={field.label}
                        name={field.id}
                        value={value || ''}
                        onChange={(e) => onChange(field.id, e.target.value)}
                        options={options}
                        required={!!field.required}
                    />
                );
            }
            return (
                <Input
                    label={field.label}
                    type={field.type || 'text'}
                    name={field.id}
                    value={value || ''}
                    onChange={(e) => onChange(field.id, e.target.value)}
                    required={!!field.required}
                    placeholder={field.placeholder || ''}
                />
            );
        };

        /* ============================================================
         * Toast notifications
         * ============================================================ */

        const TOAST_ICONS = {
            success: 'fa-circle-check',
            error: 'fa-circle-exclamation',
            info: 'fa-circle-info',
            warning: 'fa-triangle-exclamation'
        };

        const Toast = ({ toast, onClose }) => (
            <div className={`toast-card toast-${toast.type} ${toast.leaving ? 'toast-leaving' : ''}`}>
                <i className={`fas ${TOAST_ICONS[toast.type] || TOAST_ICONS.success} toast-icon`}></i>
                <div className="toast-message">{toast.message}</div>
                <button className="toast-close" onClick={onClose} aria-label="Dismiss">
                    <i className="fas fa-times"></i>
                </button>
            </div>
        );

        const ToastContainer = ({ toasts, onClose }) => {
            if (!toasts || toasts.length === 0) return null;
            return (
                <div className="toast-container">
                    {toasts.map(t => (
                        <Toast key={t.id} toast={t} onClose={() => onClose(t.id)} />
                    ))}
                </div>
            );
        };

        // Input Component
        const Input = ({ label, type = "text", name, value, onChange, required = false, placeholder = "" }) => (
            <div className="form-group">
                <label>
                    {label}
                    {required && <span className="required">*</span>}
                </label>
                <input
                    type={type}
                    name={name}
                    value={value}
                    onChange={onChange}
                    required={required}
                    placeholder={placeholder}
                />
            </div>
        );

        // Select Component
        const Select = ({ label, name, value, onChange, options, required = false }) => (
            <div className="form-group">

        // just opening a wa.me link - browsers (and the sandboxed iframe

        // ="_blank"> click always gets through since it's native browser
        // navigation. So when there's exactly one recipient (the common
        // case - a single candidate's button), the button IS that anchor;
        // for bulk sends to several candidates at once there's no single
        // href to point an anchor at, so that case falls back to a
        // best-effort window.open() loop instead.
        // For WhatsApp, neither window.open() nor a real <a target="_blank">
        // click reliably escapes the sandboxed iframe Apps Script serves this
        // app through - both have been observed leaving the whole app blank.
        // So instead of attempting any navigation from inside this app at
        // all, WhatsApp "sending" copies the pre-filled wa.me link to the
        // clipboard (navigator.clipboard.writeText - no navigation involved)
        // and shows it as plain selectable text too, so the admin can paste
        // it into a new tab themselves, or right-click it to open it - both
        // native browser actions immune to whatever the iframe restricts.
        const SmsTemplateModal = ({ isOpen, onClose, template, onChange, onSend, title, channel = 'sms', whatsappCandidates, whatsappCountryCode }) => {
            const [showLinks, setShowLinks] = useState(false);

            React.useEffect(() => {
                if (isOpen) setShowLinks(false);
            }, [isOpen]);

                .replace(/\[Candidate Name\]/g, `${candidate.firstName} ${candidate.lastName}`)

                name: `${c.firstName} ${c.lastName}`,
                link: buildWhatsappLink(c.mobile, personalize(c), whatsappCountryCode)
            }));

            const handleCopyLink = async (link, index) => {
                try {
                    await navigator.clipboard.writeText(link);
                } catch (e) {
                    window.prompt('Copy this link:', link);
                }
                setCopiedIndex(index);
                setTimeout(() => setCopiedIndex(prev => (prev === index ? null : prev)), 2000);
            };

            const handleDone = () => {
                setShowLinks(false);
                onSend();

                                        {whatsappLinks.map((item, index) => (

                                                    <button
                                                        className="action-btn"
                                                        onClick={() => handleCopyLink(item.link, index)}
                                                        style={{ backgroundColor: copiedIndex === index ? '#2e7d32' : '#25D366', color: '#fff', padding: '6px 12px', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '12px', flexShrink: 0 }}
                                                    >
                                                        <i className={copiedIndex === index ? 'fas fa-check' : 'fas fa-copy'}></i> {copiedIndex === index ? 'Copied!' : 'Copy Link'}
                                                    </button>
                                                </div>

        // CV Preview Modal Component

            // Convert Google Drive URL to embeddable preview format
            const getPreviewUrl = (url) => {
                if (!url) return '';

                // If it's a Google Drive URL, convert to preview format
                if (url.includes('drive.google.com')) {
                    // Extract file ID from various Google Drive URL formats
                    let fileId = '';

                    // Format: https://drive.google.com/file/d/FILE_ID/view
                    if (url.includes('/file/d/')) {
                        fileId = url.split('/file/d/')[1].split('/')[0];
                    }
                    // Format: https://drive.google.com/open?id=FILE_ID
                    else if (url.includes('id=')) {
                        fileId = url.split('id=')[1].split('&')[0];
                    }

                    // Return preview URL if file ID was found
                    if (fileId) {
                        return `https://drive.google.com/file/d/${fileId}/preview`;
                    }
                }

                // Return original URL if not a Drive URL or couldn't parse
                return url;
            };

            const previewUrl = getPreviewUrl(cvUrl);

                    <div className="modal-content">
                        <div className="modal-header">
                            <h3>CV Preview - {candidateName}</h3>

        // Dashboard Charts Component
        const DashboardCharts = ({ applications, interviews }) => {
            const canvasRefs = {
                statusPie: React.useRef(null),
                positionDonut: React.useRef(null),
                genderPie: React.useRef(null),
                experienceDonut: React.useRef(null),
                applicationsLine: React.useRef(null),
                positionBar: React.useRef(null),
                monthlyTrend: React.useRef(null),
                interviewBar: React.useRef(null)
            };

            const chartInstances = React.useRef({});

            // Calculate analytics data
            const analytics = React.useMemo(() => {
                // Status distribution
                const statusCounts = {
                    pending: applications.filter(app => app.status === 'pending').length,
                    shortlisted: applications.filter(app => app.status === 'shortlisted').length,
                    rejected: applications.filter(app => app.status === 'rejected').length
                };

                // Position distribution
                const positionCounts = {};
                applications.forEach(app => {
                    const position = app.applyingFor || 'Not Specified';
                    positionCounts[position] = (positionCounts[position] || 0) + 1;
                });

                // Gender distribution
                const genderCounts = {
                    Male: applications.filter(app => app.gender === 'Male').length,
                    Female: applications.filter(app => app.gender === 'Female').length,
                    Other: applications.filter(app => app.gender && app.gender !== 'Male' && app.gender !== 'Female').length
                };

                // Experience distribution
                const experienceCounts = {
                    '0-2 years': applications.filter(app => parseInt(app.yearsOfExperience || 0) <= 2).length,
                    '3-5 years': applications.filter(app => {
                        const exp = parseInt(app.yearsOfExperience || 0);
                        return exp >= 3 && exp <= 5;
                    }).length,
                    '6-10 years': applications.filter(app => {
                        const exp = parseInt(app.yearsOfExperience || 0);
                        return exp >= 6 && exp <= 10;
                    }).length,
                    '10+ years': applications.filter(app => parseInt(app.yearsOfExperience || 0) > 10).length
                };

                // Monthly trend (last 6 months)
                const monthlyData = {};
                const now = new Date();
                for (let i = 5; i >= 0; i--) {
                    const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const monthKey = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                    monthlyData[monthKey] = 0;
                }

                applications.forEach(app => {
                    const appDate = new Date(app.timestamp);
                    const monthKey = appDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                    if (monthlyData.hasOwnProperty(monthKey)) {
                        monthlyData[monthKey]++;
                    }
                });

                // Interview status distribution
                const interviewStatusCounts = {};
                interviews.forEach(interview => {
                    const status = interview.status || 'Scheduled';
                    interviewStatusCounts[status] = (interviewStatusCounts[status] || 0) + 1;
                });

                // Calculate percentages
                const total = applications.length || 1;
                const shortlistRate = ((statusCounts.shortlisted / total) * 100).toFixed(1);
                const rejectionRate = ((statusCounts.rejected / total) * 100).toFixed(1);
                const conversionRate = interviews.length > 0 ? ((interviews.length / statusCounts.shortlisted) * 100).toFixed(1) : 0;
                const avgResponseTime = '2.5'; // Placeholder

                return {
                    statusCounts,
                    positionCounts,
                    genderCounts,
                    experienceCounts,
                    monthlyData,
                    interviewStatusCounts,
                    total,
                    shortlistRate,
                    rejectionRate,
                    conversionRate,
                    avgResponseTime
                };
            }, [applications, interviews]);

            // Create charts
            React.useEffect(() => {
                // Destroy old charts
                Object.values(chartInstances.current).forEach(chart => {
                    if (chart) chart.destroy();
                });

                // Status Pie Chart
                if (canvasRefs.statusPie.current) {
                    chartInstances.current.statusPie = new Chart(canvasRefs.statusPie.current, {
                        type: 'pie',
                        data: {
                            labels: ['Pending', 'Shortlisted', 'Rejected'],
                            datasets: [{
                                data: [
                                    analytics.statusCounts.pending,
                                    analytics.statusCounts.shortlisted,
                                    analytics.statusCounts.rejected
                                ],
                                backgroundColor: ['#ff9800', '#66bb6a', '#f44336'],
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { padding: 15, font: { size: 12 } }
                                }
                            }
                        }
                    });
                }

                // Position Donut Chart
                if (canvasRefs.positionDonut.current) {
                    const topPositions = Object.entries(analytics.positionCounts)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 6);

                    chartInstances.current.positionDonut = new Chart(canvasRefs.positionDonut.current, {
                        type: 'doughnut',
                        data: {
                            labels: topPositions.map(([label]) => label),
                            datasets: [{
                                data: topPositions.map(([, count]) => count),
                                backgroundColor: [
                                    '#2e7d32', '#43a047', '#66bb6a', '#81c784', '#a5d6a7', '#c8e6c9'
                                ],
                                borderWidth: 2,
                                borderColor: '#fff'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '60%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { padding: 10, font: { size: 11 } }
                                }
                            }
                        }
                    });
                }

                // Gender Pie Chart
                if (canvasRefs.genderPie.current) {
                    chartInstances.current.genderPie = new Chart(canvasRefs.genderPie.current, {
                        type: 'pie',
                        data: {
                            labels: ['Male', 'Female', 'Other'],
                            datasets: [{
                                data: [
                                    analytics.genderCounts.Male,
                                    analytics.genderCounts.Female,

                        const hours = date.getHours();
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        const seconds = String(date.getSeconds()).padStart(2, '0');
                        const ampm = hours >= 12 ? 'PM' : 'AM';
                        const displayHour = hours % 12 || 12;
                        return `${displayHour}:${minutes}:${seconds} ${ampm}`;
                    };

            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);

                // Check if google.script.run is available
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((response) => {
                            setIsLoading(false);
                            if (response.success) {
                                onLoginSuccess(response.user);
                                onClose();
                            } else {
                                setError('Invalid username or password');
                            }
                        })
                        .withFailureHandler((err) => {
                            setIsLoading(false);
                            setError('Login failed: ' + err.message);
                        })
                        .authenticateAdmin(username, password);
                } else {
                    // For testing standalone
                    setTimeout(() => {
                        setIsLoading(false);
                        if (username === 'admin' && password === 'admin') {
                            onLoginSuccess({ username: 'admin' });
                            onClose();
                        } else {
                            setError('Invalid username or password');
                        }
                    }, 1000);

                                            value={password}

        // Main App Component
        const JobApplicationForm = () => {

            // level, keyed by level id: { ssc: { fileName, data }, hsc: {...}, ... }

            const [showLoginModal, setShowLoginModal] = useState(false);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

            const [jobDescription, setJobDescription] = useState('We are looking for a talented professional to join our team. The ideal candidate should have excellent skills and a passion for excellence.');
            const [bannerUrl, setBannerUrl] = useState('');
            const [socialLinks, setSocialLinks] = useState({ facebook: '', twitter: '', instagram: '', linkedin: '' });
            // Starts with the all-fields-visible default so the form renders
            // immediately; re-renders once the real config arrives (usually
            // near-instant, and admins rarely hide fields, so this trades a
            // small chance of a brief flash for a faster perceived load).
            const [formFieldsConfig, setFormFieldsConfig] = useState(getDefaultFormFieldsConfigClient());
            const [customFieldValues, setCustomFieldValues] = useState({});

            const handleCustomFieldChange = (fieldId, value) => {
                setCustomFieldValues(prev => ({ ...prev, [fieldId]: value }));
            };

            // Load job description, appearance theme, banner and social links on mount
            React.useEffect(() => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((description) => {
                            setJobDescription(description);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load job description:', error);
                        })
                        .getJobDescription();

                    google.script.run
                        .withSuccessHandler((theme) => {
                            applyTheme(theme);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load theme:', error);
                        })
                        .getThemeConfig();

                    google.script.run
                        .withSuccessHandler((url) => {
                            setBannerUrl(url || '');
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load banner:', error);
                        })
                        .getBannerUrl();

                    google.script.run
                        .withSuccessHandler((links) => {
                            setSocialLinks(links || {});
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load social links:', error);
                        })
                        .getSocialLinks();

                    google.script.run
                        .withSuccessHandler((config) => {
                            setFormFieldsConfig(config || getDefaultFormFieldsConfigClient());
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load form fields config:', error);
                            setFormFieldsConfig(getDefaultFormFieldsConfigClient());
                        })
                        .getFormFieldsConfig();
                } else {
                    // Standalone preview: apply the default theme
                    applyTheme(getDefaultThemeConfig());
                    setFormFieldsConfig(getDefaultFormFieldsConfigClient());
                }
                // Re-fetch whenever admin logs out too, so the public form picks up
                // job description/theme/banner/social edits made in the same session
                // instead of showing whatever was loaded at the very first page load.
            }, [isAdminLoggedIn]);

            const [formData, setFormData] = useState(getInitialFormData());

                const file = e.target.files[0];

                        alert('Only PDF files are allowed. Please upload a PDF file.');
                        e.target.value = ''; // Clear the file input
                        return;

                    // Check file size (5MB limit)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = ''; // Clear the file input
                        return;
                    }

                    // Convert file to base64
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setFileName(file.name);
                        setCvFile(event.target.result); // Store base64 data
                    };
                    reader.onerror = (error) => {
                        console.error('Error reading file:', error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
