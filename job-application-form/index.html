                                setIsSubmitting(false);
                                setSubmitMessage({
                                    type: 'error',
                                    text: 'An error occurred: ' + error.message
                                });
                            })
                            .submitJobApplication(submissionData, fileName, cvFile);
                    } else {
                        // Running standalone (for testing)
                        setTimeout(() => {
                            setIsSubmitting(false);
                            const submissionTime = new Date().toISOString();
                            // Show congratulations modal
                            setShowCongratsModal(true);
                            console.log('Submission Time (ISO 8601):', submissionTime);
                            console.log('Form Data:', submissionData);
                            console.log('CV File:', fileName);
                        }, 2000);
                    }

                } catch (error) {
                    setIsSubmitting(false);
                    setSubmitMessage({
                        type: 'error',
                        text: 'Failed to submit application. Please try again.'
                    });
                    console.error('Submission error:', error);
                }
            };

            // If admin is logged in, show dashboard
            if (isAdminLoggedIn && adminUser) {
                return (
                    <AdminDashboard
                        adminUser={adminUser}
                        onLogout={handleAdminLogout}
                    />
                );
            }

            // Otherwise, show the application form
            return (
                <>
                    {isSubmitting && (
                        <div className="loading-overlay">
                            <div className="loading-spinner">
                                <div className="spinner"></div>
                                <h3 style={{ color: '#2e7d32', marginBottom: '8px' }}>Submitting Application...</h3>
                                <p style={{ color: '#66bb6a', fontSize: '14px' }}>Please wait while we process your application</p>
                            </div>
                        </div>
                    )}

                    <CongratsModal
                        isOpen={showCongratsModal}
                        onClose={() => {
                            setShowCongratsModal(false);
                            window.location.reload(); // Reload to reset the form
                        }}
                        applicantName={formData.firstName}
                        applicantEmail={formData.email}
                    />

                    <AdminLoginModal
                        isOpen={showLoginModal}
                        onClose={() => setShowLoginModal(false)}
                        onLoginSuccess={handleAdminLogin}
                    />

                    <div className="container">
                        <div
                            className="header"
                            style={bannerUrl ? {
                                backgroundImage: `linear-gradient(135deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25)), url(${bannerUrl})`
                            } : {}}
                        >
                            <button
                                className="admin-btn"
                                onClick={() => setShowLoginModal(true)}
                                title="Admin Login"
                                aria-label="Admin Login"
                            >
                                <i className="fas fa-user-shield"></i>
                            </button>
                            <h1>Job Application Form</h1>
                            <p>Fill out the form below to apply for this position</p>
                            {(socialLinks.facebook || socialLinks.twitter || socialLinks.instagram || socialLinks.linkedin) && (
                                <div className="social-links-row">
                                    {socialLinks.facebook && (
                                        <a href={socialLinks.facebook} target="_blank" rel="noopener noreferrer" title="Facebook" aria-label="Facebook">
                                            <i className="fab fa-facebook-f"></i>
                                        </a>
                                    )}
                                    {socialLinks.twitter && (
                                        <a href={socialLinks.twitter} target="_blank" rel="noopener noreferrer" title="Twitter / X" aria-label="Twitter / X">
                                            <i className="fab fa-twitter"></i>
                                        </a>
                                    )}
                                    {socialLinks.instagram && (
                                        <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
                                            <i className="fab fa-instagram"></i>
                                        </a>
                                    )}
                                    {socialLinks.linkedin && (
                                        <a href={socialLinks.linkedin} target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
                                            <i className="fab fa-linkedin-in"></i>
                                        </a>
                                    )}
                                </div>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} className="form-content">
                            {submitMessage && (
                                <div className={`message-box ${submitMessage.type}`}>
                                    <i className={`fas fa-${submitMessage.type === 'success' ? 'check-circle' : 'exclamation-circle'}`}></i>
                                    <div>
                                        <strong>{submitMessage.type === 'success' ? 'Success!' : 'Error!'}</strong>
                                        <p style={{ margin: '5px 0 0 0' }}>{submitMessage.text}</p>
                                    </div>
                                </div>
                            )}

                            <JobDescriptionSection jobDescription={jobDescription} />
                            <PersonalInfoSection formData={formData} handleChange={handleChange} />
                            <EducationSection formData={formData} handleChange={handleChange} />
                            <ExperienceSection
                                formData={formData}
                                handleChange={handleChange}
                                currentlyWorking={currentlyWorking}
                                setCurrentlyWorking={setCurrentlyWorking}
                                isFresher={isFresher}
                                setIsFresher={setIsFresher}
                            />
                            <CVUploadSection fileName={fileName} handleFileChange={handleFileChange} />

                            <button type="submit" className="submit-btn" disabled={isSubmitting}>
                                {isSubmitting ? 'Submitting...' : 'Submit Application'}
                            </button>
                        </form>
                    </div>
                </>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JobApplicationForm />);
    </script>
</body>
</html>
