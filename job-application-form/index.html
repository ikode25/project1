                    if (!file.name.toLowerCase().endsWith('.pdf')) {
                        alert('Only PDF files are allowed. Please upload a PDF file.');
                        e.target.value = '';
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setCoverLetterFileName(file.name);
                        setCoverLetterFile(event.target.result);
                    };
                    reader.onerror = (error) => {
                        console.error('Error reading cover letter file:', error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handlePassportPhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (!file.type.startsWith('image/')) {
                        alert('Please select an image file (JPG, PNG, etc.).');
                        e.target.value = '';
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPassportPhotoFileName(file.name);
                        setPassportPhotoFile(event.target.result);
                    };
                    reader.onerror = (error) => {
                        console.error('Error reading passport photo:', error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleCertificateChange = (level, e) => {
                const file = e.target.files[0];
                if (file) {
                    const isPdf = file.name.toLowerCase().endsWith('.pdf');
                    const isImage = file.type.startsWith('image/');
                    if (!isPdf && !isImage) {
                        alert('Only PDF or image files are allowed for certificates.');
                        e.target.value = '';
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setCertificateFiles(prev => ({
                            ...prev,
                            [level]: { fileName: file.name, data: event.target.result }
                        }));
                    };
                    reader.onerror = (error) => {
                        console.error(`Error reading ${level} certificate:`, error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAdminLogin = (user) => {
                setIsAdminLoggedIn(true);
                setAdminUser(user);
                setShowLoginModal(false);
                console.log('Admin logged in:', user);
            };

            const handleAdminLogout = () => {
                setIsAdminLoggedIn(false);
                setAdminUser(null);
                // Clear any admin-related data
            };

            // Resets the form in place instead of window.location.reload() -
            // reloading an Apps Script web app URL can land on a blank page
            // (it's served through a sandboxed redirect, not a plain static
            // file), so this avoids that entirely.
            const resetForm = () => {
                setFormData(getInitialFormData());
                setCurrentlyWorking(false);
                setIsFresher(false);
                setFileName('');
                setCvFile(null);
                setCoverLetterFileName('');
                setCoverLetterFile(null);
                setPassportPhotoFileName('');
                setPassportPhotoFile(null);
                setCertificateFiles({});
                setCustomFieldValues({});
                setSubmitMessage(null);
                setShowPreviewModal(false);
                window.scrollTo(0, 0);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // Validate CV upload
                if (!fileName || !cvFile) {
                    alert('Please upload your CV (PDF format required)');
                    return;
                }

                // Validate education certificate uploads. These live inside
                // hidden file inputs (triggered via a styled label/button),
                // so the browser's native `required` validation can't show
                // its usual popup for them and just silently blocks
                // submission with no visible feedback - hence this explicit
                // check instead, with a clear alert naming what's missing.
                const hiddenFields = formFieldsConfig.hiddenFields || [];
                const certificateLabels = { ssc: 'SSC', hsc: 'HSC', bachelor: 'Bachelor', hnd: 'HND', postgraduate: 'Postgraduate' };
                const missingCertificateLevel = ['ssc', 'hsc', 'bachelor', 'hnd', 'postgraduate'].find((level) => {
                    const sectionHidden = hiddenFields.includes(level);
                    const certificateHidden = hiddenFields.includes(`${level}Certificate`);
                    if (sectionHidden || certificateHidden) return false;
                    return !(certificateFiles[level] && certificateFiles[level].fileName && certificateFiles[level].data);
                });
                if (missingCertificateLevel) {
                    alert(`Please upload your ${certificateLabels[missingCertificateLevel]} certificate.`);
                    return;
                }

                // Same story for required custom image/document fields -
                // their file inputs are hidden the same way, so this can't
                // rely on native `required` validation either.
                const missingCustomFile = (formFieldsConfig.customFields || []).find(f =>
                    CUSTOM_FILE_FIELD_TYPES.includes(f.type) &&
                    f.required &&
                    !hiddenFields.includes(f.id) &&
                    !(customFieldValues[f.id] && customFieldValues[f.id].fileName && customFieldValues[f.id].data)
                );
                if (missingCustomFile) {
                    alert(`Please upload ${missingCustomFile.label}.`);
                    return;
                }

                // Everything required is present - let the applicant review
                // what they entered before it actually goes anywhere.
                // performActualSubmit() (below) does the real submission,
                // triggered from the preview modal's "Confirm & Submit".
                setShowPreviewModal(true);
            };

            const performActualSubmit = async () => {
                setShowPreviewModal(false);
                setIsSubmitting(true);
                setSubmitMessage(null);

                try {
                    // Convert date values to ISO format
                    const formatDateToISO = (dateValue) => {
                        if (!dateValue) return '';
                        // For date inputs (YYYY-MM-DD), create date at midnight UTC to avoid timezone shifts
                        // For datetime-local inputs (YYYY-MM-DDTHH:MM), use the provided time
                        const date = new Date(dateValue);
                        if (dateValue.includes('T')) {
                            // Has time component (datetime-local)
                            return date.toISOString(); // Returns "2025-10-09T05:05:00.000Z"
                        } else {
                            // Date only - set to midnight UTC
                            const [year, month, day] = dateValue.split('-');
                            const utcDate = new Date(Date.UTC(year, month - 1, day, 0, 0, 0, 0));
                            return utcDate.toISOString(); // Returns "2025-10-14T00:00:00.000Z"
                        }
                    };

                    // Custom image/document fields carry file data ({fileName,
                    // data}) the same way certificates do - split those out
                    // of customFieldValues (which gets JSON.stringify'd into
                    // a single sheet cell) into their own payload so the
                    // backend can upload them to Drive and store just the
                    // resulting URL, instead of stuffing raw base64 into
                    // that cell.
                    const fileCustomFieldIds = (formFieldsConfig.customFields || [])
                        .filter(f => CUSTOM_FILE_FIELD_TYPES.includes(f.type))
                        .map(f => f.id);
                    const customFileData = {};
                    const scalarCustomFieldValues = {};
                    Object.keys(customFieldValues).forEach(fieldId => {
                        if (fileCustomFieldIds.includes(fieldId)) {
                            if (customFieldValues[fieldId] && customFieldValues[fieldId].fileName && customFieldValues[fieldId].data) {
                                customFileData[fieldId] = customFieldValues[fieldId];
                            }
                        } else {
                            scalarCustomFieldValues[fieldId] = customFieldValues[fieldId];
                        }
                    });

                    // Prepare submission data with ISO formatted dates
                    const submissionData = {
                        ...formData,
                        dob: formatDateToISO(formData.dob),
                        joiningDate: formatDateToISO(formData.joiningDate),
                        endDate: formatDateToISO(formData.endDate),
                        currentlyWorking: currentlyWorking,
                        customFieldValues: scalarCustomFieldValues
                    };

                    // Only send data for certificates that were actually uploaded
                    const certificateData = {};
                    ['ssc', 'hsc', 'bachelor', 'hnd', 'postgraduate'].forEach((level) => {
                        if (certificateFiles[level] && certificateFiles[level].fileName && certificateFiles[level].data) {
                            certificateData[level] = certificateFiles[level];
                        }
                    });

                    // Check if google.script.run is available (running in GAS environment)
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        // Running in Google Apps Script environment
                        google.script.run
                            .withSuccessHandler((response) => {
                                setIsSubmitting(false);
                                if (response.status === 'success') {
                                    // Show congratulations modal
                                    setShowCongratsModal(true);
                                } else {
                                    setSubmitMessage({
                                        type: 'error',
                                        text: response.message || 'Failed to submit application. Please try again.'
                                    });
                                }
                            })
                            .withFailureHandler((error) => {
                                setIsSubmitting(false);
                                setSubmitMessage({
                                    type: 'error',
                                    text: 'An error occurred: ' + error.message
                                });
                            })
                            .submitJobApplication(submissionData, fileName, cvFile, coverLetterFileName, coverLetterFile, passportPhotoFileName, passportPhotoFile, certificateData, customFileData);
                    } else {
                        // Running standalone (for testing)
                        setTimeout(() => {
                            setIsSubmitting(false);
                            const submissionTime = new Date().toISOString();
                            // Show congratulations modal
                            setShowCongratsModal(true);
                            console.log('Submission Time (ISO 8601):', submissionTime);
                            console.log('Form Data:', submissionData);
                            console.log('CV File:', fileName);
                        }, 2000);
                    }

                } catch (error) {
                    setIsSubmitting(false);
                    setSubmitMessage({
                        type: 'error',
                        text: 'Failed to submit application. Please try again.'
                    });
                    console.error('Submission error:', error);
                }
            };

            // If admin is logged in, show dashboard
            if (isAdminLoggedIn && adminUser) {
                return (
                    <AdminDashboard
                        adminUser={adminUser}
                        onLogout={handleAdminLogout}
                    />
                );
            }

            const hiddenFieldSet = new Set(formFieldsConfig.hiddenFields || []);
            const customFieldsForSection = (sectionId) =>
                (formFieldsConfig.customFields || []).filter(f => f.section === sectionId);

            // Otherwise, show the application form
            return (
                <>
                    {isSubmitting && (
                        <div className="loading-overlay">
                            <div className="loading-spinner">
                                <div className="spinner"></div>
                                <h3 style={{ color: '#2e7d32', marginBottom: '8px' }}>Submitting Application...</h3>
                                <p style={{ color: '#66bb6a', fontSize: '14px' }}>Please wait while we process your application</p>
                            </div>
                        </div>
                    )}

                    <CongratsModal
                        isOpen={showCongratsModal}
                        onClose={() => {
                            setShowCongratsModal(false);
                            resetForm();
                        }}
                        applicantName={formData.firstName}
                        applicantEmail={formData.email}
                    />

                    <AdminLoginModal
                        isOpen={showLoginModal}
                        onClose={() => setShowLoginModal(false)}
                        onLoginSuccess={handleAdminLogin}
                    />

                    <ApplicationPreviewModal
                        isOpen={showPreviewModal}
                        onClose={() => setShowPreviewModal(false)}
                        onConfirm={performActualSubmit}
                        formData={formData}
                        fileName={fileName}
                        coverLetterFileName={coverLetterFileName}
                        passportPhotoFileName={passportPhotoFileName}
                        passportPhotoPreview={passportPhotoFile}
                        certificateFiles={certificateFiles}
                        currentlyWorking={currentlyWorking}
                        isFresher={isFresher}
                        hiddenFieldSet={hiddenFieldSet}
                        customFieldValues={customFieldValues}
                        customFields={formFieldsConfig.customFields}
                    />

                    <div className="container">
                        <div
                            className="header"
                            style={bannerUrl ? {
                                backgroundImage: `linear-gradient(135deg, rgba(0,0,0,0.45), rgba(0,0,0,0.25)), url(${bannerUrl})`
                            } : {}}
                        >
                            <button
                                className="admin-btn"
                                onClick={() => setShowLoginModal(true)}
                                title="Admin Login"
                                aria-label="Admin Login"
                            >
                                <i className="fas fa-user-shield"></i>
                            </button>
                            <h1>Job Application Form</h1>
                            <p>Fill out the form below to apply for this position</p>
                            {(socialLinks.facebook || socialLinks.twitter || socialLinks.instagram || socialLinks.linkedin) && (
                                <div className="social-links-row">
                                    {socialLinks.facebook && (
                                        <a href={socialLinks.facebook} target="_blank" rel="noopener noreferrer" title="Facebook" aria-label="Facebook">
                                            <i className="fab fa-facebook-f"></i>
                                        </a>
                                    )}
                                    {socialLinks.twitter && (
                                        <a href={socialLinks.twitter} target="_blank" rel="noopener noreferrer" title="Twitter / X" aria-label="Twitter / X">
                                            <i className="fab fa-twitter"></i>
                                        </a>
                                    )}
                                    {socialLinks.instagram && (
                                        <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">
                                            <i className="fab fa-instagram"></i>
                                        </a>
                                    )}
                                    {socialLinks.linkedin && (
                                        <a href={socialLinks.linkedin} target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
                                            <i className="fab fa-linkedin-in"></i>
                                        </a>
                                    )}
                                </div>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} className="form-content">
                            {submitMessage && (
                                <div className={`message-box ${submitMessage.type}`}>
                                    <i className={`fas fa-${submitMessage.type === 'success' ? 'check-circle' : 'exclamation-circle'}`}></i>
                                    <div>
                                        <strong>{submitMessage.type === 'success' ? 'Success!' : 'Error!'}</strong>
                                        <p style={{ margin: '5px 0 0 0' }}>{submitMessage.text}</p>
                                    </div>
                                </div>
                            )}

                            <JobDescriptionSection jobDescription={jobDescription} />
                            <PersonalInfoSection
                                formData={formData}
                                handleChange={handleChange}
                                hiddenFields={hiddenFieldSet}
                                customFields={customFieldsForSection('personal')}
                                customFieldValues={customFieldValues}
                                onCustomFieldChange={handleCustomFieldChange}
                                fieldRequirements={formFieldsConfig.fieldRequirements}
                            />
                            {!hiddenFieldSet.has('ssc') || !hiddenFieldSet.has('hsc') || !hiddenFieldSet.has('bachelor') || !hiddenFieldSet.has('hnd') || !hiddenFieldSet.has('postgraduate') || customFieldsForSection('education').length > 0 ? (
                                <EducationSection
                                    formData={formData}
                                    handleChange={handleChange}
                                    hiddenFields={hiddenFieldSet}
                                    customFields={customFieldsForSection('education')}
                                    customFieldValues={customFieldValues}
                                    onCustomFieldChange={handleCustomFieldChange}
                                    certificateFiles={certificateFiles}
                                    onCertificateChange={handleCertificateChange}
                                />
                            ) : null}
                            {!hiddenFieldSet.has('experience') && (
                                <ExperienceSection
                                    formData={formData}
                                    handleChange={handleChange}
                                    currentlyWorking={currentlyWorking}
                                    setCurrentlyWorking={setCurrentlyWorking}
                                    isFresher={isFresher}
                                    setIsFresher={setIsFresher}
                                    customFields={customFieldsForSection('experience')}
                                    customFieldValues={customFieldValues}
                                    onCustomFieldChange={handleCustomFieldChange}
                                    fieldRequirements={formFieldsConfig.fieldRequirements}
                                />
                            )}
                            <CVUploadSection
                                fileName={fileName}
                                handleFileChange={handleFileChange}
                                coverLetterFileName={coverLetterFileName}
                                handleCoverLetterFileChange={handleCoverLetterFileChange}
                                showCoverLetter={!hiddenFieldSet.has('coverLetter')}
                                passportPhotoFileName={passportPhotoFileName}
                                passportPhotoPreview={passportPhotoFile}
                                handlePassportPhotoChange={handlePassportPhotoChange}
                                showPassportPhoto={!hiddenFieldSet.has('passportPhoto')}
                            />

                            <button type="submit" className="submit-btn" disabled={isSubmitting}>
                                {isSubmitting ? 'Submitting...' : 'Review & Submit Application'}
                            </button>
                        </form>
                    </div>
                </>
            );
        };

        // Catches any render-time crash and shows the real error instead of
        // leaving the page blank with no clue what happened. React error
        // boundaries must be class components - hooks/functional components
        // can't implement componentDidCatch/getDerivedStateFromError.
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { error: null };
            }

            static getDerivedStateFromError(error) {
                return { error };
            }

            componentDidCatch(error, info) {
                console.error('App crashed:', error, info);
            }

            render() {
                if (this.state.error) {
                    return (
                        <div style={{
                            maxWidth: '700px', margin: '40px auto', padding: '30px',
                            fontFamily: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif",
                            background: '#fff3f3', border: '2px solid #c62828', borderRadius: '12px'
                        }}>
                            <h2 style={{ color: '#c62828', marginTop: 0 }}>
                                <i className="fas fa-triangle-exclamation"></i> Something went wrong
                            </h2>
                            <p style={{ color: '#555' }}>
                                Please take a screenshot of the message below and share it - it
                                shows exactly what broke, which makes this fixable instead of a
                                guessing game.
                            </p>
                            <pre style={{
                                whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontSize: '12px',
                                background: '#fff', padding: '14px', borderRadius: '6px',
                                border: '1px solid #eee', maxHeight: '300px', overflow: 'auto'
                            }}>
                                {this.state.error && this.state.error.toString()}
                                {this.state.error && this.state.error.stack ? '\n\n' + this.state.error.stack : ''}
                            </pre>
                            <button
                                onClick={() => this.setState({ error: null })}
                                style={{
                                    marginTop: '16px', padding: '10px 20px', background: '#c62828',
                                    color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer',
                                    fontSize: '14px', fontWeight: 600
                                }}
                            >
                                Try to Recover
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <JobApplicationForm />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
