    // ============================================
    // ADMIN: CLEANING REQUESTS VIEW
    // ============================================
    function AdminCleaningRequestsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [requests, setRequests] = useState([]);
      const [stats, setStats] = useState({ pending: 0, completed: 0, urgent: 0 });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);
      const [showModal, setShowModal] = useState(false);
      const [editingRequest, setEditingRequest] = useState(null);

      useEffect(() => {
        loadRequests();
        intervalRef.current = setInterval(() => loadRequests(true), 10000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadRequests = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const data = result.error ? [] : result;
          setRequests(data);

          const pending = data.filter(r => r.status === 'Pending').length;
          const completed = data.filter(r => r.status === 'Completed').length;
          const urgent = data.filter(r => r.status === 'Pending' && (r.priority === 'Urgent' || r.priority === 'High')).length;
          setStats({ pending, completed, urgent });

          if (!silent || !tableRef.current) initDataTable(data);
        }).getAllCleaningRequests();
      };

      const handleDelete = (request) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Request?',
          text: `Delete cleaning request ${request.requestId} for Room ${request.roomNo}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); loadRequests(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteCleaningRequest(request.dateRowIndex, request.requestIndex, user);
          }
        });
      };

      const handleComplete = (request) => {
        Swal.fire({
          icon: 'question',
          title: 'Complete Request?',
          html: `<p>Mark request <strong>${request.requestId}</strong> (Room ${request.roomNo}) as completed?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#34a853',
          confirmButtonText: 'Yes, Complete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Request completed!', timer: 1500, showConfirmButton: false }); loadRequests(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .completeCleaningRequest(request.dateRowIndex, request.requestIndex, user);
          }
        });
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#adminCleaningTable').empty(); }
        if (data.length === 0) return;

        setTimeout(() => {
          tableRef.current = $('#adminCleaningTable').DataTable({
            data: data,
            columns: [
              { data: 'requestId', title: 'ID' },
              { data: 'roomNo', title: 'Room' },
              { data: 'guestName', title: 'Guest' },
              { data: 'reason', title: 'Reason' },
              { data: 'priority', title: 'Priority', render: d => {
                const colors = { Urgent: '#ea4335', High: '#ff9800', Normal: '#34a853', Low: '#6c757d' };
                return `<span style="background:${colors[d] || '#6c757d'};color:white;padding:4px 10px;border-radius:15px;font-size:12px">${d}</span>`;
              }},
              { data: 'status', title: 'Status', render: d => `<span class="status-badge ${d === 'Completed' ? 'status-active' : 'status-waiting'}">${d}</span>` },
              { data: 'createdAt', title: 'Created', render: d => new Date(d).toLocaleString() },
              { data: 'completedBy', title: 'Completed By', defaultContent: '-', render: d => d || '-' },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>${row.status === 'Pending' ? '<button class="action-icon" data-action="complete" title="Mark Complete" style="color:var(--success)"><i class="fas fa-check-circle"></i></button>' : ''}<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "All"]],
            order: [[6, 'desc']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ]
          });

          $('#adminCleaningTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') { setEditingRequest(rowData); setShowModal(true); }
            else if (action === 'complete') handleComplete(rowData);
            else if (action === 'delete') handleDelete(rowData);
          });
        }, 150);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-broom"></i> Cleaning Requests</h2>
            <div style={{display: 'flex', gap: 10}}>
              <button className="btn btn-success" onClick={() => { setEditingRequest(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Request</button>
              <button className="btn btn-primary" onClick={loadRequests}><i className="fas fa-sync-alt"></i> Refresh</button>
            </div>
          </div>

          {/* Stats */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 15, marginBottom: 20}}>
            <div style={{background: 'linear-gradient(135deg, #ff9800, #f57c00)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.pending}</div>
              <div style={{opacity: 0.9}}>Pending Requests</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #ea4335, #d33526)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.urgent}</div>
              <div style={{opacity: 0.9}}>Urgent/High Priority</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #34a853, #2d9249)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.completed}</div>
              <div style={{opacity: 0.9}}>Completed</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #001f3f, #003366)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{requests.length}</div>
              <div style={{opacity: 0.9}}>Total Requests</div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={9} /> : (
            <div style={{overflowX: 'auto'}}>
              <table id="adminCleaningTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && (
            <CleaningRequestModal
              request={editingRequest}
              user={user}
              onClose={() => { setShowModal(false); setEditingRequest(null); }}
              onSave={() => { setShowModal(false); setEditingRequest(null); loadRequests(); }}
            />
          )}
        </div>
      );
    }

    // ============================================
    // MODAL: CLEANING REQUEST (Add/Edit)
    // ============================================
    function CleaningRequestModal({ request, user, onClose, onSave }) {
      const [formData, setFormData] = useState({
        roomNo: request?.roomNo || '',
        guestName: request?.guestName || '',
        guestEmail: request?.guestEmail || '',
        reason: request?.reason || '',
        priority: request?.priority || 'Normal',
        notes: request?.notes || '',
        status: request?.status || 'Pending'
      });
      const [saving, setSaving] = useState(false);

      const reasonOptions = [
        'General Room Cleaning', 'Bathroom Cleaning', 'Change Bed Sheets',
        'Change Towels', 'Vacuum Cleaning', 'Spill Cleanup',
        'Trash Removal', 'Deep Cleaning', 'Other'
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.roomNo) { Swal.fire({ icon: 'warning', text: 'Room number is required' }); return; }
        if (!formData.reason) { Swal.fire({ icon: 'warning', text: 'Reason is required' }); return; }

        setSaving(true);

        if (request) {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .editCleaningRequest(request.dateRowIndex, request.requestIndex, formData, user);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Request Added!', text: 'Request ID: ' + res.requestId, timer: 2000 }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .adminAddCleaningRequest(formData, user);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 550}}>
            <div className="modal-header">
              <h3><i className="fas fa-broom"></i> {request ? 'Edit' : 'Add'} Cleaning Request</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-group">
                  <label>Room Number *</label>
                  <input type="text" value={formData.roomNo} onChange={(e) => setFormData({...formData, roomNo: e.target.value})} placeholder="e.g. 101" required />
                </div>
                <div className="form-group">
                  <label>Guest Name</label>
                  <input type="text" value={formData.guestName} onChange={(e) => setFormData({...formData, guestName: e.target.value})} placeholder="Guest name" />
                </div>
                <div className="form-group">
                  <label>Guest Email</label>
                  <input type="email" value={formData.guestEmail} onChange={(e) => setFormData({...formData, guestEmail: e.target.value})} placeholder="guest@email.com" />
                </div>
                <div className="form-group">
                  <label>Reason *</label>
                  <select value={formData.reason} onChange={(e) => setFormData({...formData, reason: e.target.value})} required>
                    <option value="">-- Select Reason --</option>
                    {reasonOptions.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label>Priority</label>
                  <select value={formData.priority} onChange={(e) => setFormData({...formData, priority: e.target.value})}>
                    <option value="Low">Low</option>
                    <option value="Normal">Normal</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                  </select>
                </div>
                {request && (
                  <div className="form-group">
                    <label>Status</label>
                    <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})}>
                      <option value="Pending">Pending</option>
                      <option value="Completed">Completed</option>
                    </select>
                  </div>
                )}
                <div className="form-group">
                  <label>Notes</label>
                  <textarea rows={3} value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Additional notes..." style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3, fontFamily: 'inherit'}}></textarea>
                </div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> {request ? 'Update' : 'Add'} Request</>}
                  </button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // USER: MY ACCOUNT (Password Update)
    // ============================================
    function UserAccountView({ user }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [saving, setSaving] = useState(false);
      const [profile, setProfile] = useState(null);

      useEffect(() => {
        google.script.run.withSuccessHandler((result) => {
          if (result && !result.error) setProfile(result);
        }).getUserProfile(user);
      }, []);

      const handleUpdatePassword = (e) => {
        e.preventDefault();
        if (!currentPassword || !newPassword || !confirmPassword) {
          Swal.fire({ icon: 'warning', text: 'Please fill all fields' }); return;
        }
        if (newPassword !== confirmPassword) {
          Swal.fire({ icon: 'warning', text: 'New passwords do not match' }); return;
        }
        if (newPassword.length < 6) {
          Swal.fire({ icon: 'warning', text: 'Password must be at least 6 characters' }); return;
        }

        setSaving(true);
        google.script.run
          .withSuccessHandler((res) => {
            setSaving(false);
            if (res.success) {
              Swal.fire({ icon: 'success', text: 'Password updated successfully!' });
              setCurrentPassword(''); setNewPassword(''); setConfirmPassword('');
            } else {
              Swal.fire({ icon: 'error', text: res.message });
            }
          })
          .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
          .updateUserPassword(user, currentPassword, newPassword);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-user-cog"></i> My Account</h2>
          </div>

          <div style={{maxWidth: 500}}>
            <div style={{background: '#f8f9fa', padding: 20, borderRadius: 8, marginBottom: 25}}>
              <h4 style={{margin: '0 0 10px', color: 'var(--navy-primary)'}}><i className="fas fa-envelope"></i> Email</h4>
              <p style={{margin: 0, fontWeight: 600}}>{user}</p>
              {profile && profile.fullName && (
                <div style={{marginTop: 10}}>
                  <h4 style={{margin: '0 0 5px', color: 'var(--navy-primary)'}}><i className="fas fa-user"></i> Name</h4>
                  <p style={{margin: 0, fontWeight: 600}}>{profile.fullName}</p>
                </div>
              )}
              {profile && profile.role && (
                <div style={{marginTop: 10}}>
                  <h4 style={{margin: '0 0 5px', color: 'var(--navy-primary)'}}><i className="fas fa-id-badge"></i> Role</h4>
                  <p style={{margin: 0, fontWeight: 600}}>{profile.role}</p>
                </div>
              )}
              {profile && profile.assignedRooms && (
                <div style={{marginTop: 10}}>
                  <h4 style={{margin: '0 0 5px', color: 'var(--navy-primary)'}}><i className="fas fa-door-open"></i> Assigned Rooms</h4>
                  <div style={{display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 5}}>
                    {profile.assignedRooms.split(',').map((room, i) => (
                      <span key={i} style={{background: profile.role === 'Cleaner' ? '#7b1fa2' : '#1565c0', color: 'white', padding: '3px 10px', borderRadius: 4, fontSize: 13, fontWeight: 600}}>{room.trim()}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <h3 style={{marginBottom: 20, color: 'var(--navy-primary)'}}><i className="fas fa-key"></i> Change Password</h3>
            <form onSubmit={handleUpdatePassword}>
              <div className="form-group">
                <label>Current Password *</label>
                <input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} placeholder="Enter current password" required />
              </div>
              <div className="form-group">
                <label>New Password *</label>
                <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Enter new password (min 6 chars)" required />
              </div>
              <div className="form-group">
                <label>Confirm New Password *</label>
                <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="Confirm new password" required />
              </div>
              <button type="submit" className="btn btn-primary" disabled={saving}>
                {saving ? <><i className="fas fa-spinner fa-spin"></i> Updating...</> : <><i className="fas fa-save"></i> Update Password</>}
              </button>
            </form>
          </div>
        </div>
      );
    }

        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const newOrders = result.error ? [] : result;
          setOrders(newOrders);
          const totalPending = newOrders.reduce((sum, o) => sum + o.totalAmount, 0);
          const roomBillCount = newOrders.filter(o => o.paymentType === 'Room Bill').length;
          const cashCount = newOrders.filter(o => o.paymentType === 'Cash').length;
          setStats(prev => ({ ...prev, pending: newOrders.length, totalRevenue: totalPending, roomBill: roomBillCount, cash: cashCount }));
          setTimeout(() => initCharts(newOrders), 150);
        }).getPendingFoodOrders(user);

        google.script.run.withSuccessHandler((result) => {
          if (!result.error) {
            const today = new Date().toISOString().split('T')[0];
            const completedToday = result.filter(o => o.status === 'Completed' && o.completedAt && o.completedAt.startsWith(today)).length;
            setStats(prev => ({ ...prev, completedToday }));
          }
        }).getStaffFoodOrders(user);
      };

      const initCharts = (ordersData) => {
        Object.values(chartsRef.current).forEach(c => c && c.destroy());
        chartsRef.current = {};

        const paymentCtx = document.getElementById('foodPaymentChart');
        if (paymentCtx) {
          const roomBill = ordersData.filter(o => o.paymentType === 'Room Bill').length;
          const cash = ordersData.filter(o => o.paymentType === 'Cash').length;
          const card = ordersData.filter(o => o.paymentType === 'Card').length;
          chartsRef.current.payment = new Chart(paymentCtx, {
            type: 'doughnut',
            data: {
              labels: ['Room Bill', 'Cash', 'Card'],
              datasets: [{ data: [roomBill, cash, card], backgroundColor: ['#ff9800', '#34a853', '#0074D9'], borderWidth: 3, borderColor: '#fff' }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 15, usePointStyle: true } } } }
          });
        }

        const itemsCtx = document.getElementById('foodItemsChart');
        if (itemsCtx) {
          const itemCounts = {};
          ordersData.forEach(order => {
            order.items.forEach(item => {
              itemCounts[item.name] = (itemCounts[item.name] || 0) + item.qty;
            });
          });
          const sortedItems = Object.entries(itemCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
          chartsRef.current.items = new Chart(itemsCtx, {
            type: 'bar',
            data: {
              labels: sortedItems.map(i => i[0]),
              datasets: [{ label: 'Quantity', data: sortedItems.map(i => i[1]), backgroundColor: ['#001f3f', '#0074D9', '#ff9800', '#34a853', '#ea4335'], borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, y: { grid: { display: false } } } }
          });
        }
      };

      useEffect(() => {
        loadOrders();
        intervalRef.current = setInterval(loadOrders, 15000);
        return () => {
          clearInterval(intervalRef.current);
          Object.values(chartsRef.current).forEach(c => c && c.destroy());
        };
      }, []);

      return (
        <div>
          <div className="section-header" style={{marginBottom: 25}}>
            <h2><i className="fas fa-chart-line"></i> Dashboard</h2>
            <button className="btn btn-primary" onClick={loadOrders}>
              <i className="fas fa-sync-alt"></i> Refresh
            </button>
          </div>

          {assignedRooms && (
            <div style={{background: 'linear-gradient(135deg, #e3f2fd, #bbdefb)', border: '1px solid #90caf9', borderRadius: 8, padding: 15, marginBottom: 20, display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
              <i className="fas fa-door-open" style={{fontSize: 20, color: '#1565c0'}}></i>
              <div>
                <strong style={{color: '#0d47a1'}}>Assigned Rooms:</strong>
                <div style={{display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 5}}>
                  {assignedRooms.split(',').map((room, i) => (
                    <span key={i} style={{background: '#1565c0', color: 'white', padding: '3px 10px', borderRadius: 4, fontSize: 13, fontWeight: 600}}>{room.trim()}</span>
                  ))}
                </div>
              </div>
            </div>
          )}

          {loading ? <TableSkeleton rows={3} columns={3} /> : (
            <>
              <div className="dashboard-grid-3">
                <div className="stat-card">
                  <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #ff9800, #ffc107)'}}><i className="fas fa-clock"></i></div>
                  <div className="stat-card-value">{stats.pending}</div>
                  <div className="stat-card-label">Pending Orders</div>

                <div className="stat-card">
                  <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #34a853, #4ade80)'}}><i className="fas fa-check-circle"></i></div>
                  <div className="stat-card-value">{stats.completedToday}</div>
                  <div className="stat-card-label">Completed Today</div>

                <div className="stat-card">
                  <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #0074D9, #00a8ff)'}}><i className="fas fa-dollar-sign"></i></div>
                  <div className="stat-card-value">${stats.totalRevenue.toFixed(0)}</div>
                  <div className="stat-card-label">Pending Revenue</div>

                <div className="stat-card">

    // ============================================
    // FOOD STAFF: PENDING ORDERS
    // ============================================
    function FoodStaffPendingOrdersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);
      const [lastOrderCount, setLastOrderCount] = useState(0);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const [assignedRooms, setAssignedRooms] = useState('');
      const speechRef = useRef(null);
      const intervalRef = useRef(null);

      useEffect(() => {
        google.script.run.withSuccessHandler((result) => {
          if (result && !result.error) setAssignedRooms(result.assignedRooms || '');
        }).getUserProfile(user);
      }, []);

      const speakNotification = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance('Order received! Kindly complete your order.');
          utterance.rate = 0.9;
          utterance.pitch = 1;
          utterance.volume = 1;
          window.speechSynthesis.speak(utterance);
          speechRef.current = utterance;
        }
      };

      const stopSpeaking = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setAudioPlaying(false);
      };

      const loadOrders = () => {
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const newOrders = result.error ? [] : result;

          if (newOrders.length > lastOrderCount && lastOrderCount > 0) {
            setAudioPlaying(true);
            speakNotification();
            const repeatInterval = setInterval(() => {
              if (audioPlaying) speakNotification();
            }, 5000);
            setTimeout(() => clearInterval(repeatInterval), 30000);
          }

          setOrders(newOrders);
          setLastOrderCount(newOrders.length);
        }).getPendingFoodOrders(user);
      };

      useEffect(() => {
        loadOrders();
        intervalRef.current = setInterval(loadOrders, 5000);
        return () => {
          clearInterval(intervalRef.current);
          stopSpeaking();
        };
      }, []);

      const markComplete = (order) => {
        Swal.fire({
          icon: 'question',
          title: 'Complete Order?',
          html: `<p>Mark order <strong>${order.orderId}</strong> as completed?</p>`,
          showCancelButton: true,
          confirmButtonColor: 'var(--success)',
          confirmButtonText: 'Yes, Complete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) {
                  Swal.fire({ icon: 'success', text: 'Order completed!', timer: 1500 });
                  loadOrders();
                } else {
                  Swal.fire({ icon: 'error', text: res.message });
                }
              })
              .completeFoodOrder(order.dateRowIndex, order.orderIndex, user);
          }
        });
      };

      const dismissNotification = () => {
        stopSpeaking();
        Swal.fire({ icon: 'info', text: 'Notification dismissed', timer: 1000, showConfirmButton: false });
      };

      return (
        <div>
          <div className="section-header" style={{marginBottom: 25}}>
            <h2><i className="fas fa-utensils"></i> Pending Orders</h2>
            <div style={{display: 'flex', gap: 10}}>
              {audioPlaying && (
                <button className="btn btn-danger" onClick={dismissNotification}>
                  <i className="fas fa-volume-mute"></i> OK - Stop Alert
                </button>
              )}
              <button className="btn btn-primary" onClick={loadOrders}>
                <i className="fas fa-sync-alt"></i> Refresh
              </button>
            </div>
          </div>

          {assignedRooms && (
            <div style={{background: 'linear-gradient(135deg, #e3f2fd, #bbdefb)', border: '1px solid #90caf9', borderRadius: 8, padding: 15, marginBottom: 20, display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
              <i className="fas fa-door-open" style={{fontSize: 20, color: '#1565c0'}}></i>
              <div>
                <strong style={{color: '#0d47a1'}}>Assigned Rooms:</strong>
                <div style={{display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 5}}>
                  {assignedRooms.split(',').map((room, i) => (
                    <span key={i} style={{background: '#1565c0', color: 'white', padding: '3px 10px', borderRadius: 4, fontSize: 13, fontWeight: 600}}>{room.trim()}</span>
                  ))}
                </div>
              </div>
            </div>
          )}

          {audioPlaying && (
            <div style={{background: 'linear-gradient(135deg, #ff6b6b, #ee5a5a)', color: 'white', padding: 20, borderRadius: 4, marginBottom: 20, animation: 'pulse 1s infinite', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <h3 style={{margin: 0}}><i className="fas fa-bell" style={{marginRight: 10}}></i> NEW ORDER RECEIVED!</h3>
                <p style={{margin: '5px 0 0'}}>Please complete the order and press OK</p>
              </div>
              <button onClick={dismissNotification} style={{background: 'white', color: '#ee5a5a', border: 'none', padding: '15px 30px', borderRadius: 4, fontWeight: 700, fontSize: 18, cursor: 'pointer'}}>
                OK
              </button>
            </div>
          )}

          {loading ? <TableSkeleton rows={5} columns={5} /> : orders.length === 0 ? (
            <div style={{textAlign: 'center', padding: 60, background: '#f8f9fa', borderRadius: 4}}>
              <i className="fas fa-check-circle" style={{fontSize: '4rem', color: 'var(--success)'}}></i>
              <h3 style={{color: '#666', marginTop: 20}}>No Pending Orders</h3>
              <p style={{color: '#999'}}>All orders have been completed!</p>
            </div>
          ) : (
            <div style={{display: 'flex', flexDirection: 'column', gap: 15}}>
              {orders.map(order => (
                <div key={order.orderId} style={{background: 'white', border: '1px solid #e0e0e0', borderLeft: '4px solid #ff9800', borderRadius: 4, padding: 20, boxShadow: '0 2px 8px rgba(0,0,0,0.1)'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 15, flexWrap: 'wrap', gap: 15}}>
                    <div>
                      <h3 style={{margin: 0, color: 'var(--navy-primary)'}}>{order.orderId}</h3>
                      <p style={{margin: '5px 0', color: '#666'}}>
                        <i className="fas fa-door-open"></i> Room: <strong>{order.roomNo}</strong> |
                        <i className="fas fa-user" style={{marginLeft: 15}}></i> {order.guestName}
                      </p>
                      <p style={{margin: 0, fontSize: 12, color: '#999'}}>
                        <i className="fas fa-clock"></i> {new Date(order.createdAt).toLocaleString()}
                      </p>
                    </div>
                    <div style={{textAlign: 'right'}}>
                      <div style={{fontSize: 24, fontWeight: 700, color: 'var(--success)'}}>${order.totalAmount.toFixed(2)}</div>
                      <span style={{background: order.paymentType === 'Pay Now' ? '#d4edda' : '#fff3cd', color: order.paymentType === 'Pay Now' ? '#155724' : '#856404', padding: '4px 10px', borderRadius: 3, fontSize: 12, fontWeight: 600}}>{order.paymentType}</span>
                    </div>
                  </div>

                  <div style={{background: '#f8f9fa', padding: 15, borderRadius: 4, marginBottom: 15}}>
                    <h4 style={{margin: '0 0 10px', fontSize: 14, color: 'var(--navy-primary)'}}>Order Items:</h4>
                    <div style={{display: 'flex', gap: 10, flexWrap: 'wrap'}}>
                      {order.items.map((item, idx) => (
                        <span key={idx} style={{background: 'var(--navy-primary)', color: 'white', padding: '6px 14px', borderRadius: 3, fontSize: 14, fontWeight: 600}}>
                          {item.name} x{item.qty} (${(item.price * item.qty).toFixed(2)})
                        </span>
                      ))}
                    </div>
                    {order.notes && <p style={{margin: '10px 0 0', fontStyle: 'italic', color: '#666'}}><i className="fas fa-sticky-note"></i> {order.notes}</p>}
                  </div>

                  {order.paymentType === 'Pay Now' && order.paymentMethod && (
                    <div style={{background: '#d4edda', padding: 12, borderRadius: 4, marginBottom: 15, display: 'flex', alignItems: 'center', gap: 15, flexWrap: 'wrap'}}>
                      <span style={{fontWeight: 600, color: '#155724'}}><i className="fas fa-credit-card"></i> {order.paymentMethod}</span>
                      {order.transactionId && <span style={{color: '#155724'}}><i className="fas fa-hashtag"></i> TxnID: {order.transactionId}</span>}
                      {order.paymentScreenshotUrl && (
                        <img src={order.paymentScreenshotUrl} alt="Payment"
                          style={{width: 40, height: 40, borderRadius: 4, cursor: 'pointer', border: '2px solid #155724', objectFit: 'cover'}}
                          onClick={() => Swal.fire({ imageUrl: order.paymentScreenshotUrl, imageWidth: 400, showConfirmButton: false })}
                          title="View payment screenshot" />
                      )}
                    </div>
                  )}

                  <button onClick={() => markComplete(order)} className="btn btn-success" style={{width: '100%', padding: 15, fontSize: 16}}>
                    <i className="fas fa-check-circle"></i> Mark as Completed
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

        return () => { if (tableRef.current) tableRef.current.destroy(); };

          setLoading(false);
          const data = result.error ? [] : result;
          setOrders(data);
          initDataTable(data);
        }).getStaffFoodOrders(user);

              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[0, 'desc']]
          });

          $('#foodMenuTable').off('click', '.action-icon');
          $('#foodMenuTable').on('click', '.action-icon', function() {
            const action = $(this).data('action');
            const rowIdx = $(this).data('row');
            const item = data.find(i => i.rowIndex === rowIdx);
            if (action === 'edit') { setEditingItem(item); setShowModal(true); }
            else if (action === 'stock') { handleStockUpdate(item); }
            else if (action === 'delete') { handleDelete(item); }
          });
        }, 100);
      };

      const handleStockUpdate = (item) => {
        Swal.fire({
          title: 'Update Stock',
          html: `<p>Current stock for <strong>${item.name}</strong>: ${item.stock}</p>`,
          input: 'number',
          inputValue: item.stock,
          inputAttributes: { min: 0 },
          showCancelButton: true,
          confirmButtonText: 'Update Stock'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler((res) => {
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); loadItems(); }
              else Swal.fire({ icon: 'error', text: res.message });
            }).updateFoodStock(item.rowIndex, result.value);
          }
        });
      };

      const handleDelete = (item) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Food Item?',
          html: `<p>Are you sure you want to delete <strong>${item.name}</strong>?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler((res) => {
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); loadItems(); }
              else Swal.fire({ icon: 'error', text: res.message });
            }).deleteFoodItem(item.rowIndex);
          }
        });
      };

      const handleSave = () => {
        setShowModal(false);
        setEditingItem(null);
        loadItems();
      };

      // Calculate stats
      const availableCount = items.filter(i => i.status === 'Available').length;
      const outOfStockCount = items.filter(i => i.status === 'Out of Stock' || i.stock <= 0).length;
      const lowStockCount = items.filter(i => i.stock > 0 && i.stock <= 5).length;

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-hamburger"></i> Food Menu Management</h2>
            <button className="btn btn-success" onClick={() => { setEditingItem(null); setShowModal(true); }}>
              <i className="fas fa-plus"></i> Add Item
            </button>
          </div>

          {/* Stats Cards */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 15, marginBottom: 20}}>
            <div style={{background: 'linear-gradient(135deg, #34a853, #2d9249)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{availableCount}</div>
              <div style={{opacity: 0.9}}>Available Items</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #ff9800, #f57c00)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{lowStockCount}</div>
              <div style={{opacity: 0.9}}>Low Stock (≤5)</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #ea4335, #d33526)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{outOfStockCount}</div>
              <div style={{opacity: 0.9}}>Out of Stock</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #001f3f, #003366)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{items.length}</div>
              <div style={{opacity: 0.9}}>Total Items</div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={7} /> : (
            <div style={{overflowX: 'auto'}}>
              <table id="foodMenuTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && <FoodItemModal item={editingItem} onClose={() => { setShowModal(false); setEditingItem(null); }} onSave={handleSave} />}
        </div>
      );
    }

    function FoodItemModal({ item, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: item?.name || '',
        description: item?.description || '',
        category: item?.category || 'Main Course',
        price: item?.price || '',
        image: item?.image || '',
        stock: item?.stock || 0,
        status: item?.status || 'Available'
      });
      const [saving, setSaving] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.price) { Swal.fire({ icon: 'warning', text: 'Name and price are required' }); return; }
        setSaving(true);

        if (item) {
          google.script.run.withSuccessHandler((res) => {
            setSaving(false);
            if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); onSave(); }
            else Swal.fire({ icon: 'error', text: res.message });
          }).updateFoodItem(item.rowIndex, formData);
        } else {
          google.script.run.withSuccessHandler((res) => {
            setSaving(false);
            if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); onSave(); }
            else Swal.fire({ icon: 'error', text: res.message });
          }).addFoodItem(formData);
        }
      };

      const categories = ['Main Course', 'Appetizer', 'Dessert', 'Beverages', 'Snacks', 'Breakfast', 'Soup', 'Salad', 'Other'];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 600}}>
            <div className="modal-header">
              <h3><i className="fas fa-hamburger"></i> {item ? 'Edit' : 'Add'} Food Item</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <div className="form-group">
                    <label>Item Name *</label>
                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} placeholder="e.g., Grilled Chicken" required />
                  </div>
                  <div className="form-group">
                    <label>Category</label>
                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})}>
                      {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Price ($) *</label>
                    <input type="number" step="0.01" min="0" value={formData.price} onChange={(e) => setFormData({...formData, price: e.target.value})} placeholder="0.00" required />
                  </div>
                  <div className="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" min="0" value={formData.stock} onChange={(e) => setFormData({...formData, stock: parseInt(e.target.value) || 0})} />
                  </div>
                  <div className="form-group">
                    <label>Status</label>
                    <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})}>
                      <option value="Available">Available</option>
                      <option value="Cooking">Cooking (Being Prepared)</option>
                      <option value="Out of Stock">Out of Stock</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Image URL (optional)</label>
                    <input type="text" value={formData.image} onChange={(e) => setFormData({...formData, image: e.target.value})} placeholder="https://..." />
                  </div>
                </div>
                <div className="form-group">
                  <label>Description</label>
                  <textarea rows={3} value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} placeholder="Describe the item..." style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3, fontFamily: 'inherit'}}></textarea>
                </div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}
                  </button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // ADMIN: FOOD ORDERS VIEW
    // ============================================
    function FoodOrdersAdminView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);
      const [stats, setStats] = useState({ pending: 0, completed: 0, totalRevenue: 0 });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);
      const [showModal, setShowModal] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);

      useEffect(() => {
        loadOrders();
        intervalRef.current = setInterval(() => loadOrders(true), 10000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadOrders = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const data = result.error ? [] : result;
          setOrders(data);

          const awaitingApproval = data.filter(o => o.status === 'Awaiting Approval').length;
          const pending = data.filter(o => o.status === 'Pending').length;
          const completed = data.filter(o => o.status === 'Completed').length;
          const totalRevenue = data.reduce((sum, o) => sum + (o.totalAmount || 0), 0);
          setStats({ awaitingApproval, pending, completed, totalRevenue });

          if (!silent || !tableRef.current) initDataTable(data);
        }).getAllFoodOrders();
      };

      const handleDelete = (order) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Order?',
          text: `Delete food order ${order.orderId} for Room ${order.roomNo}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); loadOrders(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteFoodOrder(order.dateRowIndex, order.orderIndex, user);
          }
        });
      };

      const handleComplete = (order) => {
        Swal.fire({
          icon: 'question',
          title: 'Complete Order?',
          html: `<p>Mark order <strong>${order.orderId}</strong> (Room ${order.roomNo}) as completed?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#34a853',
          confirmButtonText: 'Yes, Complete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Order completed!', timer: 1500, showConfirmButton: false }); loadOrders(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .completeFoodOrder(order.dateRowIndex, order.orderIndex, user);
          }
        });
      };

      const handleApproveFoodOrder = (order) => {
        Swal.fire({
          icon: 'question',
          title: 'Approve Food Order?',
          html: `<p>Approve order <strong>${order.orderId}</strong> for Room ${order.roomNo}?</p><p style="color:#666;font-size:13px">This will send the order to the kitchen for preparation.</p>`,
          showCancelButton: true,
          confirmButtonColor: '#34a853',
          confirmButtonText: '<i class="fas fa-check"></i> Approve'
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Approving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run
              .withSuccessHandler((res) => {
                Swal.close();
                if (res.success) {
                  Swal.fire({ icon: 'success', title: 'Approved!', text: res.message, timer: 2000 });
                  loadOrders();
                } else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => { Swal.close(); Swal.fire({ icon: 'error', text: err.message }); })
              .approveFoodOrder(order.dateRowIndex, order.orderIndex, user);
          }
        });
      };

      const handleRejectFoodOrder = (order) => {
        Swal.fire({
          icon: 'warning',
          title: 'Reject Food Order?',
          html: `<p>Reject order <strong>${order.orderId}</strong> for Room ${order.roomNo}?</p><p style="color:#666;font-size:13px">Stock will be restored.</p>`,
          input: 'textarea',
          inputLabel: 'Rejection Reason (optional)',
          inputPlaceholder: 'Enter reason for rejection...',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-times"></i> Reject'
        }).then((result) => {
          if (result.isConfirmed) {
            const reason = result.value || '';
            Swal.fire({ title: 'Rejecting...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run
              .withSuccessHandler((res) => {
                Swal.close();
                if (res.success) {
                  Swal.fire({ icon: 'success', title: 'Rejected', text: res.message, timer: 2000 });
                  loadOrders();
                } else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => { Swal.close(); Swal.fire({ icon: 'error', text: err.message }); })
              .rejectFoodOrder(order.dateRowIndex, order.orderIndex, reason, user);
          }
        });
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#foodOrdersAdminTable').empty(); }
        if (data.length === 0) return;

        setTimeout(() => {
          tableRef.current = $('#foodOrdersAdminTable').DataTable({
            data: data,
            columns: [
              { data: 'orderId', title: 'Order ID' },
              { data: 'roomNo', title: 'Room' },
              { data: 'guestName', title: 'Guest' },
              { data: 'items', title: 'Items', render: d => d.map(i => `${i.name} x${i.qty}`).join(', ') },
              { data: 'totalAmount', title: 'Total', render: d => `<strong style="color:var(--success)">$${d.toFixed(2)}</strong>` },
              { data: 'paymentType', title: 'Payment', render: (d, type, row) => {
                let html = `<span style="background:${d === 'Pay Now' ? '#d4edda' : '#fff3cd'};color:${d === 'Pay Now' ? '#155724' : '#856404'};padding:3px 8px;border-radius:3px;font-size:12px;font-weight:600">${d}</span>`;
                if (d === 'Pay Now' && row.paymentMethod) {
                  html += `<br><small style="color:#666">${row.paymentMethod}</small>`;
                  if (row.transactionId) html += `<br><small style="color:#888">TxnID: ${row.transactionId}</small>`;
                }
                if (row.paymentScreenshotUrl) {
                  html += ` <a href="${row.paymentScreenshotUrl}" target="_blank" title="View screenshot" style="color:var(--navy-accent)"><i class="fas fa-image"></i></a>`;
                }
                return html;
              }},
              { data: 'status', title: 'Status', render: d => {
                const cls = d === 'Completed' ? 'status-active' : (d === 'Awaiting Approval' ? 'status-pending' : (d === 'Rejected' ? 'status-rejected' : 'status-waiting'));
                return `<span class="status-badge ${cls}">${d}</span>`;
              }},
              { data: 'createdAt', title: 'Date', render: d => new Date(d).toLocaleString() },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => {
                const isAwaiting = row.status === 'Awaiting Approval';
                let actions = '';
                if (isAwaiting) {
                  actions += `<button class="action-icon" data-action="approve-food" title="Approve Order" style="color:var(--success)"><i class="fas fa-check-circle"></i></button>`;
                  actions += `<button class="action-icon" data-action="reject-food" title="Reject Order" style="color:var(--danger)"><i class="fas fa-times-circle"></i></button>`;
                }
                actions += `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>`;
                if (row.status === 'Pending') {
                  actions += `<button class="action-icon" data-action="complete" title="Mark Complete" style="color:var(--success)"><i class="fas fa-check-circle"></i></button>`;
                }
                actions += `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>`;
                return actions;
              }}
            ],
            pageLength: 10,
            order: [[7, 'desc']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ]
          });

          $('#foodOrdersAdminTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'approve-food') handleApproveFoodOrder(rowData);
            else if (action === 'reject-food') handleRejectFoodOrder(rowData);
            else if (action === 'edit') { setEditingOrder(rowData); setShowModal(true); }
            else if (action === 'complete') handleComplete(rowData);
            else if (action === 'delete') handleDelete(rowData);
          });
        }, 150);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-utensils"></i> Food Orders</h2>
            <div style={{display: 'flex', gap: 10}}>
              <button className="btn btn-success" onClick={() => { setEditingOrder(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Order</button>
              <button className="btn btn-primary" onClick={loadOrders}><i className="fas fa-sync-alt"></i> Refresh</button>
            </div>
          </div>

          {/* Stats */}
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 15, marginBottom: 20}}>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #fbbc04, #ffd54f)'}}><i className="fas fa-hourglass-half"></i></div>
              <div className="stat-card-value">{stats.awaitingApproval || 0}</div>
              <div className="stat-card-label">Awaiting Approval</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #ff9800, #ffc107)'}}><i className="fas fa-clock"></i></div>
              <div className="stat-card-value">{stats.pending}</div>
              <div className="stat-card-label">In Kitchen</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #4caf50, #8bc34a)'}}><i className="fas fa-check-circle"></i></div>
              <div className="stat-card-value">{stats.completed}</div>
              <div className="stat-card-label">Completed</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #2196f3, #03a9f4)'}}><i className="fas fa-dollar-sign"></i></div>
              <div className="stat-card-value">${stats.totalRevenue.toFixed(2)}</div>
              <div className="stat-card-label">Total Revenue</div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={9} /> : orders.length === 0 ? (
            <div style={{textAlign: 'center', padding: 40}}>
              <i className="fas fa-utensils" style={{fontSize: '3rem', color: '#ccc'}}></i>
              <p style={{marginTop: 15, color: '#666'}}>No food orders found</p>
            </div>
          ) : (
            <div style={{display: 'block'}}>
              <table id="foodOrdersAdminTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && (
            <FoodOrderModal
              order={editingOrder}
              user={user}
              onClose={() => { setShowModal(false); setEditingOrder(null); }}
              onSave={() => { setShowModal(false); setEditingOrder(null); loadOrders(); }}
            />
          )}
        </div>
      );
    }

    // ============================================
    // MODAL: FOOD ORDER (Add/Edit)
    // ============================================
    function FoodOrderModal({ order, user, onClose, onSave }) {
      const [formData, setFormData] = useState({
        roomNo: order?.roomNo || '',
        guestName: order?.guestName || '',
        guestEmail: order?.guestEmail || '',
        paymentType: order?.paymentType || 'Cash',
        notes: order?.notes || '',
        status: order?.status || 'Pending'
      });
      const [items, setItems] = useState(order?.items?.length > 0 ? order.items.map(i => ({...i})) : [{ name: '', price: '', qty: 1 }]);
      const [saving, setSaving] = useState(false);

      const totalAmount = items.reduce((sum, item) => sum + ((parseFloat(item.price) || 0) * (parseInt(item.qty) || 0)), 0);

      const addItem = () => setItems([...items, { name: '', price: '', qty: 1 }]);

      const removeItem = (index) => {
        if (items.length <= 1) return;
        setItems(items.filter((_, i) => i !== index));
      };

      const updateItem = (index, field, value) => {
        const updated = [...items];
        updated[index] = { ...updated[index], [field]: value };
        setItems(updated);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.roomNo) { Swal.fire({ icon: 'warning', text: 'Room number is required' }); return; }
        const validItems = items.filter(i => i.name && i.price && i.qty);
        if (validItems.length === 0) { Swal.fire({ icon: 'warning', text: 'Add at least one item' }); return; }

        setSaving(true);
        const submitItems = validItems.map(i => ({ name: i.name, price: parseFloat(i.price), qty: parseInt(i.qty) }));
        const submitData = { ...formData, items: submitItems, totalAmount: totalAmount };

        if (order) {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .editFoodOrder(order.dateRowIndex, order.orderIndex, submitData, user);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Order Added!', text: 'Order ID: ' + res.orderId, timer: 2000 }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .adminAddFoodOrder(submitData, user);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 600}}>
            <div className="modal-header">
              <h3><i className="fas fa-utensils"></i> {order ? 'Edit' : 'Add'} Food Order</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>

    // ============================================
    // ADMIN: QUOTES VIEW
    // ============================================
    function AdminQuotesView({ user }) {
      const [loading, setLoading] = useState(true);
      const [quotes, setQuotes] = useState([]);
      const [stats, setStats] = useState({ draft: 0, sent: 0, accepted: 0, converted: 0 });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);
      const [showModal, setShowModal] = useState(false);
      const [editingQuote, setEditingQuote] = useState(null);
      const [previewQuote, setPreviewQuote] = useState(null);

      useEffect(() => {
        loadQuotes();
        intervalRef.current = setInterval(() => loadQuotes(true), 10000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadQuotes = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const data = result.error ? [] : result;
          setQuotes(data);
          const draft = data.filter(q => q.status === 'Draft').length;
          const sent = data.filter(q => q.status === 'Sent').length;
          const accepted = data.filter(q => q.status === 'Accepted').length;
          const converted = data.filter(q => q.status === 'Converted').length;
          setStats({ draft, sent, accepted, converted });
          if (!silent || !tableRef.current) initDataTable(data);
        }).getAllQuotes();
      };

      const handleDelete = (quote) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Quote?',
          text: `Delete quote ${quote.quoteId} for ${quote.guestName}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); loadQuotes(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteQuote(quote.dateRowIndex, quote.quoteIndex, user);
          }
        });
      };

      const handleConvert = (quote) => {
        if (quote.status === 'Converted') {
          Swal.fire({ icon: 'info', text: 'This quote has already been converted to an invoice.' });
          return;
        }
        Swal.fire({
          icon: 'question',
          title: 'Convert to Invoice?',
          html: `<p>Convert quote <strong>${quote.quoteId}</strong> ($${quote.totalAmount.toFixed(2)}) to an invoice?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#0074D9',
          confirmButtonText: 'Yes, Convert'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', title: 'Invoice Created!', text: 'Invoice ID: ' + res.invoiceId, timer: 3000 }); loadQuotes(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .convertQuoteToInvoice(quote.dateRowIndex, quote.quoteIndex, user);
          }
        });
      };

      const handleEmail = (quote) => {
        if (!quote.guestEmail) {
          Swal.fire({ icon: 'warning', text: 'No guest email address on this quote.' });
          return;
        }
        Swal.fire({
          icon: 'question',
          title: 'Send Quote Email?',
          html: `<p>Send quote <strong>${quote.quoteId}</strong> to <strong>${quote.guestEmail}</strong>?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#0074D9',
          confirmButtonText: 'Send Email'
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Sending...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Quote email sent!', timer: 2000, showConfirmButton: false }); loadQuotes(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .sendQuoteEmail(quote.dateRowIndex, quote.quoteIndex, user);
          }
        });
      };

      const handlePrint = (quote) => {
        setPreviewQuote(quote);
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#adminQuotesTable').empty(); }
        if (data.length === 0) return;

        setTimeout(() => {
          tableRef.current = $('#adminQuotesTable').DataTable({
            data: data,
            columns: [
              { data: 'quoteId', title: 'Quote ID' },
              { data: 'guestName', title: 'Guest', render: d => d || '-' },
              { data: 'rooms', title: 'Rooms', render: d => d && d.length > 0 ? d.map(r => `${r.roomNo}`).join(', ') : '-' },
              { data: 'totalAmount', title: 'Total', render: d => `<strong style="color:var(--success)">$${(d || 0).toFixed(2)}</strong>` },
              { data: 'status', title: 'Status', render: d => {
                const colors = { Draft: '#6c757d', Sent: '#0074D9', Accepted: '#34a853', Converted: '#9c27b0' };
                return `<span style="background:${colors[d] || '#6c757d'};color:white;padding:4px 10px;border-radius:15px;font-size:12px">${d}</span>`;
              }},
              { data: 'validUntil', title: 'Valid Until', render: d => d || '-' },
              { data: 'createdAt', title: 'Created', render: d => new Date(d).toLocaleString() },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => {
                let btns = `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>`;
                if (row.status !== 'Converted') btns += `<button class="action-icon" data-action="convert" title="Convert to Invoice" style="color:#9c27b0"><i class="fas fa-file-invoice-dollar"></i></button>`;
                btns += `<button class="action-icon" data-action="email" title="Send Email" style="color:#0074D9"><i class="fas fa-envelope"></i></button>`;
                btns += `<button class="action-icon" data-action="print" title="Print" style="color:#001f3f"><i class="fas fa-print"></i></button>`;
                btns += `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>`;
                return btns;
              }}
            ],
            pageLength: 10,
            order: [[6, 'desc']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ]
          });

          $('#adminQuotesTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') { setEditingQuote(rowData); setShowModal(true); }
            else if (action === 'convert') handleConvert(rowData);
            else if (action === 'email') handleEmail(rowData);
            else if (action === 'print') handlePrint(rowData);
            else if (action === 'delete') handleDelete(rowData);
          });
        }, 150);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-file-invoice"></i> Quotes</h2>
            <div style={{display: 'flex', gap: 10}}>
              <button className="btn btn-success" onClick={() => { setEditingQuote(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Quote</button>
              <button className="btn btn-primary" onClick={loadQuotes}><i className="fas fa-sync-alt"></i> Refresh</button>
            </div>
          </div>

          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 15, marginBottom: 20}}>
            <div style={{background: 'linear-gradient(135deg, #6c757d, #868e96)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.draft}</div>
              <div style={{opacity: 0.9}}>Draft</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #0074D9, #00a8ff)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.sent}</div>
              <div style={{opacity: 0.9}}>Sent</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #34a853, #2d9249)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.accepted}</div>
              <div style={{opacity: 0.9}}>Accepted</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #9c27b0, #ba68c8)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.converted}</div>
              <div style={{opacity: 0.9}}>Converted</div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={8} /> : quotes.length === 0 ? (
            <div style={{textAlign: 'center', padding: 40}}>
              <i className="fas fa-file-invoice" style={{fontSize: '3rem', color: '#ccc'}}></i>
              <p style={{marginTop: 15, color: '#666'}}>No quotes found</p>
            </div>
          ) : (
            <div style={{display: 'block'}}>
              <table id="adminQuotesTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && (
            <QuoteModal
              quote={editingQuote}
              user={user}
              onClose={() => { setShowModal(false); setEditingQuote(null); }}
              onSave={() => { setShowModal(false); setEditingQuote(null); loadQuotes(); }}
            />
          )}

          {previewQuote && (
            <QuotePrintPreview quote={previewQuote} onClose={() => setPreviewQuote(null)} />
          )}
        </div>
      );
    }
