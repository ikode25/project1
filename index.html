          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              <div className="form-group"><label>Your Name *</label><input type="text" value={formData.guestName} onChange={(e) => setFormData({...formData, guestName: e.target.value})} required /></div>
              <div className="form-group"><label>Phone *</label><input type="text" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} required /></div>
              <div className="form-group"><label>Email</label><input type="email" value={formData.email} readOnly style={{background: '#f5f5f5'}} /></div>
              <div className="form-group"><label>City</label><input type="text" value={formData.city} onChange={(e) => setFormData({...formData, city: e.target.value})} /></div>
              <div className="form-group"><label>Check-In *</label><input type="date" min={today} value={formData.checkIn} onChange={(e) => setFormData({...formData, checkIn: e.target.value})} required /></div>
              <div className="form-group"><label>Check-Out *</label><input type="date" min={today} value={formData.checkOut} onChange={(e) => setFormData({...formData, checkOut: e.target.value})} required /></div>
            </div>
            <div className="form-group"><label>Special Requests</label><textarea value={formData.specialRequests} onChange={(e) => setFormData({...formData, specialRequests: e.target.value})} placeholder="Extra pillows, dietary requirements, etc." rows="2"></textarea></div>
            <div className="form-group">
              <label>Select Room *</label>
              {loadingRooms ? <div className="skeleton" style={{height: 100}}></div> : rooms.length === 0 ? <p style={{color: '#666'}}>No rooms available</p> : (
                <div className="room-tiles">
                  {rooms.map(room => (
                    <div key={room.roomNo} className={`room-tile ${formData.roomNo === room.roomNo ? 'selected' : ''}`} onClick={() => setFormData({...formData, roomNo: room.roomNo})}>
                      <i className="fas fa-bed"></i><div>Room {room.roomNo}</div><div className="room-tile-info">{room.type} - ${room.rate}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Payment Section */}
            <div style={{background: 'linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%)', padding: 20, borderRadius: 8, marginBottom: 20, border: '1px solid #dee2e6'}}>
              <h4 style={{marginBottom: 15, color: 'var(--navy-primary)', display: 'flex', alignItems: 'center', gap: 10}}><i className="fas fa-credit-card"></i> Payment Method</h4>

              {loadingMethods ? <div className="skeleton" style={{height: 50}}></div> : (
                <>
                  <div className="form-group" style={{marginBottom: 15}}>
                    <select value={formData.paymentMethod} onChange={(e) => handlePaymentMethodChange(e.target.value)} style={{width: '100%'}}>
                      {paymentMethods.map(m => (
                        <option key={m.id} value={m.name}>{m.name} {m.description ? `- ${m.description}` : ''}</option>
                      ))}
                    </select>
                  </div>

                  {selectedPaymentMethod && (selectedPaymentMethod.bankName || selectedPaymentMethod.accountNo || selectedPaymentMethod.qrCode) && (
                    <div style={{background: 'white', padding: 15, borderRadius: 6, border: '2px solid var(--navy-accent)'}}>
                      <h5 style={{marginBottom: 12, color: 'var(--navy-primary)', fontSize: 14}}><i className="fas fa-info-circle"></i> Payment Details for {selectedPaymentMethod.name}</h5>
                      <div style={{display: 'flex', gap: 20, flexWrap: 'wrap', alignItems: 'flex-start'}}>
                        <div style={{flex: 1, minWidth: 200}}>
                          {selectedPaymentMethod.bankName && (
                            <div style={{marginBottom: 8}}>
                              <span style={{color: '#666', fontSize: 12}}>Bank/Service:</span>
                              <div style={{fontWeight: 600, color: 'var(--navy-primary)'}}>{selectedPaymentMethod.bankName}</div>
                            </div>
                          )}
                          {selectedPaymentMethod.accountName && (
                            <div style={{marginBottom: 8}}>
                              <span style={{color: '#666', fontSize: 12}}>Account Name:</span>
                              <div style={{fontWeight: 600}}>{selectedPaymentMethod.accountName}</div>
                            </div>
                          )}
                          {selectedPaymentMethod.accountNo && (
                            <div style={{marginBottom: 8}}>
                              <span style={{color: '#666', fontSize: 12}}>Account/Mobile Number:</span>
                              <div style={{fontWeight: 600, fontFamily: 'monospace', fontSize: 16, color: 'var(--success)', cursor: 'pointer'}} onClick={() => { navigator.clipboard.writeText(selectedPaymentMethod.accountNo); Swal.fire({ icon: 'success', text: 'Copied!', timer: 1000, showConfirmButton: false }); }}>

                              </div>
                            </div>

                        {selectedPaymentMethod.qrCode && (

                            <img src={selectedPaymentMethod.qrCode} alt="QR Code" style={{width: 120, height: 120, border: '2px solid #ddd', borderRadius: 8, cursor: 'pointer'}} onClick={() => Swal.fire({ imageUrl: selectedPaymentMethod.qrCode, imageWidth: 300, showConfirmButton: false })} />
                          </div>
                        )}
                      </div>
                    </div>

                  {/* Payment Screenshot Upload */}
                  <div style={{marginTop: 15}}>
                    <label style={{display: 'block', marginBottom: 8, fontWeight: 500, color: '#555'}}><i className="fas fa-camera"></i> Payment Screenshot (Optional)</label>
                    <p style={{fontSize: 12, color: '#888', marginBottom: 10}}>Upload a screenshot of your payment for faster verification</p>
                    <input type="file" accept="image/*" onChange={handleScreenshotChange} />
                    {screenshotPreview && (
                      <div style={{marginTop: 10, display: 'flex', alignItems: 'center', gap: 10}}>
                        <img src={screenshotPreview} alt="Screenshot" style={{maxWidth: 100, maxHeight: 100, border: '2px solid var(--success)', borderRadius: 6}} />
                        <button type="button" className="btn btn-secondary btn-sm" onClick={() => { setPaymentScreenshot(null); setScreenshotPreview(''); }}>
                          <i className="fas fa-trash"></i> Remove
                        </button>

                    )}

            <button type="submit" className="btn btn-success" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Submitting...</> : <><i className="fas fa-paper-plane"></i> Submit Booking Request</>}</button>
          </form>
        </div>
      );
    }

    function UserMyBookingsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [bookings, setBookings] = useState([]);
      const intervalRef = useRef(null);

      useEffect(() => {
        loadBookings();
        // Real-time polling every 30 seconds
        intervalRef.current = setInterval(() => loadBookings(true), 30000);
        return () => clearInterval(intervalRef.current);
      }, []);

      const loadBookings = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            const userBookings = (result || []).filter(b => {
              if (b.Email?.toLowerCase() !== user.toLowerCase()) return false;
              const s = (b.Status || '').toLowerCase();
              return s === 'pending' || s === 'booked' || s === 'rejected';
            });
            setBookings(userBookings);
          })
          .withFailureHandler(() => { setLoading(false); setBookings([]); })
          .getAllBookings();
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-list-alt"></i> My Bookings</h2>
            <button className="btn btn-primary" onClick={loadBookings}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>
          {loading ? <TableSkeleton rows={5} columns={5} /> : bookings.length === 0 ? (
            <div style={{textAlign: 'center', padding: 60}}>
              <i className="fas fa-calendar-times" style={{fontSize: '4rem', color: '#ccc'}}></i>
              <h3 style={{color: '#666', marginTop: 20}}>No Active Bookings</h3>
            </div>
          ) : (
            <>
              {bookings.some(b => b.Status === 'Pending') && (
                <div style={{padding: '15px 20px', background: '#fff3cd', borderRadius: 8, marginBottom: 15, display: 'flex', alignItems: 'center', gap: 10}}>
                  <i className="fas fa-hourglass-half" style={{color: '#856404', fontSize: 20}}></i>
                  <div>
                    <strong style={{color: '#856404'}}>Pending Approval</strong>
                    <p style={{color: '#856404', fontSize: 13, margin: 0}}>Some of your bookings are awaiting admin approval. You will be notified via email.</p>
                  </div>
                </div>
              )}
              <div style={{overflowX: 'auto'}}>
                <table style={{width: '100%', borderCollapse: 'collapse'}}>
                  <thead><tr style={{background: 'var(--navy-primary)', color: 'white'}}><th style={{padding: 14}}>Ticket ID</th><th style={{padding: 14}}>Room</th><th style={{padding: 14}}>Check-In</th><th style={{padding: 14}}>Check-Out</th><th style={{padding: 14}}>Status</th></tr></thead>
                  <tbody>
                    {bookings.map((b, idx) => (
                      <tr key={idx} style={{borderBottom: '1px solid #eee'}}>
                        <td style={{padding: 14}}><strong>{b.TicketID}</strong></td>
                        <td style={{padding: 14}}>Room {b.RoomNo}</td>
                        <td style={{padding: 14}}>{formatDate(b.CheckIn)}</td>
                        <td style={{padding: 14}}>{formatDate(b.CheckOut)}</td>
                        <td style={{padding: 14}}><span className={`status-badge ${b.Status === 'Pending' ? 'status-pending' : (b.Status === 'Rejected' ? 'status-rejected' : 'status-active')}`}>{b.Status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}
        </div>
      );
    }

    // ============================================
    // FOOD PAYMENT MODAL
    // ============================================
    function FoodPaymentModal({ cart, totalAmount, roomNo, guestName, guestEmail, notes, onClose, onSuccess }) {
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [loadingMethods, setLoadingMethods] = useState(true);
      const [selectedPaymentMethod, setSelectedPaymentMethod] = useState(null);
      const [selectedMethodName, setSelectedMethodName] = useState('');
      const [transactionId, setTransactionId] = useState('');
      const [paymentScreenshot, setPaymentScreenshot] = useState(null);
      const [screenshotPreview, setScreenshotPreview] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        google.script.run.withSuccessHandler((result) => {
          setLoadingMethods(false);
          const methods = result?.error ? [] : (result || []);
          setPaymentMethods(methods);
          if (methods.length > 0) {
            setSelectedMethodName(methods[0].name);
            setSelectedPaymentMethod(methods[0]);
          }
        }).withFailureHandler(() => {
          setLoadingMethods(false);
        }).getActivePaymentMethods();
      }, []);

      const handleMethodChange = (methodName) => {
        setSelectedMethodName(methodName);
        const method = paymentMethods.find(m => m.name === methodName);
        setSelectedPaymentMethod(method || null);
      };

      const handleScreenshotChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            Swal.fire({ icon: 'warning', text: 'Screenshot must be less than 5MB' });
            return;
          }
          setPaymentScreenshot(file);
          const reader = new FileReader();
          reader.onload = (ev) => setScreenshotPreview(ev.target.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = () => {
        if (!selectedMethodName) {
          Swal.fire({ icon: 'warning', text: 'Please select a payment method' });
          return;
        }
        if (!transactionId.trim()) {
          Swal.fire({ icon: 'warning', text: 'Please enter the transaction ID' });
          return;
        }

        setSubmitting(true);

        const submitOrder = (screenshotData, screenshotExt, screenshotMime) => {
          const orderData = {
            roomNo: roomNo,
            guestName: guestName,
            guestEmail: guestEmail,
            items: cart.map(c => ({ itemId: c.itemId, name: c.name, price: c.price, qty: c.qty })),
            totalAmount: totalAmount,
            paymentType: 'Pay Now',
            paymentMethod: selectedMethodName,
            transactionId: transactionId.trim(),
            notes: notes,
            paymentScreenshotData: screenshotData,
            paymentScreenshotExt: screenshotExt,
            paymentScreenshotMime: screenshotMime
          };

          google.script.run
            .withSuccessHandler((res) => {
              setSubmitting(false);
              if (res.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'Order Submitted!',
                  html: `<p>Order ID: <strong>${res.orderId}</strong></p><p>Total: <strong>$${totalAmount.toFixed(2)}</strong></p><p>Method: ${selectedMethodName}</p><p>Transaction ID: ${transactionId}</p><p style="margin-top:10px;color:#856404;"><i class="fas fa-clock"></i> Awaiting admin approval</p>`
                });
                onSuccess();
              } else {
                Swal.fire({ icon: 'error', text: res.message });
              }
            })
            .withFailureHandler((err) => {
              setSubmitting(false);
              Swal.fire({ icon: 'error', text: err.message });
            })
            .placeFoodOrder(orderData);
        };

        if (paymentScreenshot) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const base64 = ev.target.result.split(',')[1];
            const ext = paymentScreenshot.name.split('.').pop();
            submitOrder(base64, ext, paymentScreenshot.type);
          };
          reader.readAsDataURL(paymentScreenshot);
        } else {
          submitOrder(null, null, null);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{maxWidth: 700}} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-credit-card"></i> Pay for Food Order</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              {/* Order Summary */}
              <div style={{marginBottom: 20, background: '#f8f9fa', borderRadius: 8, padding: 15, border: '1px solid #e0e0e0'}}>
                <h4 style={{marginBottom: 12, color: 'var(--navy-primary)'}}><i className="fas fa-receipt"></i> Order Summary</h4>
                <table style={{width: '100%', borderCollapse: 'collapse'}}>
                  <thead><tr style={{background: 'var(--navy-primary)', color: 'white'}}><th style={{padding: 10, textAlign: 'left'}}>Item</th><th style={{padding: 10}}>Qty</th><th style={{padding: 10}}>Subtotal</th></tr></thead>
                  <tbody>
                    {cart.map(item => (
                      <tr key={item.itemId} style={{borderBottom: '1px solid #eee'}}>
                        <td style={{padding: 10, fontWeight: 600}}>{item.name}</td>
                        <td style={{padding: 10, textAlign: 'center'}}>{item.qty}</td>
                        <td style={{padding: 10, textAlign: 'center', fontWeight: 600, color: 'var(--success)'}}>${(item.price * item.qty).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr><td colSpan="2" style={{padding: 10, textAlign: 'right', fontWeight: 700, background: 'var(--navy-primary)', color: 'white'}}>Total</td>
                    <td style={{padding: 10, textAlign: 'center', fontWeight: 700, fontSize: 18, color: 'var(--navy-primary)', background: '#e8f4fd'}}>${totalAmount.toFixed(2)}</td></tr>
                  </tfoot>
                </table>
              </div>

              {/* Payment Method Selection */}
              <div style={{background: 'linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%)', padding: 20, borderRadius: 8, marginBottom: 20, border: '1px solid #dee2e6'}}>
                <h4 style={{marginBottom: 15, color: 'var(--navy-primary)', display: 'flex', alignItems: 'center', gap: 10}}>
                  <i className="fas fa-credit-card"></i> Select Payment Method
                </h4>

                {loadingMethods ? <div className="skeleton" style={{height: 50}}></div> : paymentMethods.length === 0 ? (
                  <div style={{padding: 20, textAlign: 'center', color: '#666'}}>
                    <i className="fas fa-exclamation-triangle" style={{fontSize: 24, color: 'var(--warning)', marginBottom: 10}}></i>
                    <p>No payment methods available. Please contact front desk.</p>
                  </div>
                ) : (
                  <>
                    <div className="form-group" style={{marginBottom: 15}}>
                      <select value={selectedMethodName} onChange={(e) => handleMethodChange(e.target.value)} style={{width: '100%'}}>
                        {paymentMethods.map(m => (
                          <option key={m.id} value={m.name}>{m.name}{m.description ? ` - ${m.description}` : ''}</option>
                        ))}
                      </select>
                    </div>

                    {selectedPaymentMethod && (selectedPaymentMethod.bankName || selectedPaymentMethod.accountNo || selectedPaymentMethod.qrCode) && (
                      <div style={{background: 'white', padding: 15, borderRadius: 6, border: '2px solid var(--navy-accent)'}}>
                        <h5 style={{marginBottom: 12, color: 'var(--navy-primary)', fontSize: 14}}>
                          <i className="fas fa-info-circle"></i> Payment Details for {selectedPaymentMethod.name}
                        </h5>
                        <div style={{display: 'flex', gap: 20, flexWrap: 'wrap', alignItems: 'flex-start'}}>
                          <div style={{flex: 1, minWidth: 200}}>
                            {selectedPaymentMethod.bankName && (
                              <div style={{marginBottom: 8}}>
                                <span style={{color: '#666', fontSize: 12}}>Bank/Service:</span>
                                <div style={{fontWeight: 600, color: 'var(--navy-primary)'}}>{selectedPaymentMethod.bankName}</div>
                              </div>
                            )}
                            {selectedPaymentMethod.accountName && (
                              <div style={{marginBottom: 8}}>
                                <span style={{color: '#666', fontSize: 12}}>Account Name:</span>
                                <div style={{fontWeight: 600}}>{selectedPaymentMethod.accountName}</div>
                              </div>
                            )}
                            {selectedPaymentMethod.accountNo && (
                              <div style={{marginBottom: 8}}>
                                <span style={{color: '#666', fontSize: 12}}>Account/Mobile Number:</span>
                                <div style={{fontWeight: 600, fontFamily: 'monospace', fontSize: 16, color: 'var(--success)', cursor: 'pointer'}}
                                  onClick={() => { navigator.clipboard.writeText(selectedPaymentMethod.accountNo); Swal.fire({icon: 'success', text: 'Copied!', timer: 1000, showConfirmButton: false}); }}>
                                  {selectedPaymentMethod.accountNo} <i className="fas fa-copy" style={{fontSize: 12, color: '#999'}}></i>
                                </div>
                              </div>
                            )}
                          </div>
                          {selectedPaymentMethod.qrCode && (
                            <div style={{textAlign: 'center'}}>
                              <div style={{color: '#666', fontSize: 12, marginBottom: 5}}>Scan QR Code:</div>
                              <img src={selectedPaymentMethod.qrCode} alt="QR Code"
                                style={{width: 120, height: 120, border: '2px solid #ddd', borderRadius: 8, cursor: 'pointer'}}
                                onClick={() => Swal.fire({imageUrl: selectedPaymentMethod.qrCode, imageWidth: 300, showConfirmButton: false})} />
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>

              {/* Transaction ID */}
              <div className="form-group" style={{marginBottom: 15}}>
                <label><i className="fas fa-hashtag" style={{marginRight: 6}}></i> Transaction ID / Reference Number *</label>
                <input type="text" value={transactionId} onChange={(e) => setTransactionId(e.target.value)}
                  placeholder="Enter your payment transaction ID or reference number" />
              </div>

              {/* Payment Screenshot */}
              <div style={{marginBottom: 20}}>
                <label style={{display: 'block', marginBottom: 8, fontWeight: 500, color: '#555'}}>
                  <i className="fas fa-camera"></i> Payment Screenshot (Optional)
                </label>
                <p style={{fontSize: 12, color: '#888', marginBottom: 10}}>Upload a screenshot of your payment for faster verification</p>
                <input type="file" accept="image/*" onChange={handleScreenshotChange} />
                {screenshotPreview && (
                  <div style={{marginTop: 10, display: 'flex', alignItems: 'center', gap: 10}}>
                    <img src={screenshotPreview} alt="Screenshot"
                      style={{maxWidth: 100, maxHeight: 100, border: '2px solid var(--success)', borderRadius: 6}} />
                    <button type="button" className="btn btn-secondary" style={{padding: '6px 12px', fontSize: 12}}
                      onClick={() => { setPaymentScreenshot(null); setScreenshotPreview(''); }}>
                      <i className="fas fa-trash"></i> Remove
                    </button>
                  </div>
                )}
              </div>

              {/* Action Buttons */}
              <div style={{display: 'flex', gap: 15, marginTop: 20}}>
                <button onClick={handleSubmit} className="btn btn-success" disabled={submitting}
                  style={{flex: 1, padding: 15, fontSize: 15, fontWeight: 600}}>
                  {submitting ? <><i className="fas fa-spinner fa-spin"></i> Processing Payment...</> :
                    <><i className="fas fa-check-circle"></i> Submit Payment - ${totalAmount.toFixed(2)}</>}
                </button>
                <button onClick={onClose} className="btn btn-secondary" disabled={submitting}
                  style={{padding: 15, fontSize: 15, fontWeight: 600}}>
                  <i className="fas fa-times"></i> Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // USER: ORDER FOOD
    // ============================================
    function UserOrderFoodView({ user }) {
      const [loading, setLoading] = useState(true);
      const [menu, setMenu] = useState([]);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [roomNo, setRoomNo] = useState('');
      const [guestName, setGuestName] = useState('');
      const [notes, setNotes] = useState('');
      const [placing, setPlacing] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [bookings, setBookings] = useState([]);
      const [selectedBooking, setSelectedBooking] = useState(null);
      const intervalRef = useRef(null);

      useEffect(() => {
        loadMenu();
        loadUserData();
        // Real-time polling every 30 seconds to update stock/availability
        intervalRef.current = setInterval(() => loadMenu(true), 30000);
        return () => clearInterval(intervalRef.current);
      }, []);

      const loadUserData = () => {
        // Load user's active bookings
        google.script.run.withSuccessHandler((result) => {
          const activeBookings = (result.error ? [] : result).filter(b => b.status === 'Booked' || b.status === 'Checked In');
          setBookings(activeBookings);
          if (activeBookings.length > 0) {
            setSelectedBooking(activeBookings[0]);
            setRoomNo(activeBookings[0].roomNo.toString());
            setGuestName(activeBookings[0].guestName || '');
          }
        }).getUserBookings(user);

        // Load user profile for full name if no booking
        google.script.run.withSuccessHandler((result) => {
          if (!result.error && result.fullName) {
            // Only set guest name if not already set from booking
            setGuestName(prev => prev || result.fullName);
          }
        }).getUserProfile(user);
      };

      const handleBookingChange = (e) => {
        const roomValue = e.target.value;
        setRoomNo(roomValue);
        const booking = bookings.find(b => b.roomNo.toString() === roomValue);
        if (booking) {
          setSelectedBooking(booking);
          setGuestName(booking.guestName || '');
        }
      };

      const loadMenu = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          setMenu(result.error ? [] : result);
        }).getFoodMenu();
      };

      const categories = ['All', ...new Set(menu.map(item => item.category))];

      const filteredMenu = selectedCategory === 'All' ? menu : menu.filter(item => item.category === selectedCategory);

      const addToCart = (item) => {
        const existing = cart.find(c => c.itemId === item.itemId);
        if (existing) {
          setCart(cart.map(c => c.itemId === item.itemId ? {...c, qty: c.qty + 1} : c));
        } else {
          setCart([...cart, {...item, qty: 1}]);
        }
        Swal.fire({ icon: 'success', text: `${item.name} added to cart`, timer: 1000, showConfirmButton: false, position: 'top-end', toast: true });
      };

      const updateQty = (itemId, delta) => {
        setCart(cart.map(c => {
          if (c.itemId === itemId) {
            const newQty = c.qty + delta;
            return newQty > 0 ? {...c, qty: newQty} : c;
          }
          return c;
        }).filter(c => c.qty > 0));
      };

      const removeFromCart = (itemId) => {
        setCart(cart.filter(c => c.itemId !== itemId));
      };

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const placeOrder = (paymentType) => {
        if (cart.length === 0) { Swal.fire({ icon: 'warning', text: 'Your cart is empty!' }); return; }
        if (!roomNo.trim()) { Swal.fire({ icon: 'warning', text: 'Please enter your room number' }); return; }
        if (!guestName.trim()) { Swal.fire({ icon: 'warning', text: 'Please enter your name' }); return; }

        setPlacing(true);
        const orderData = {
          roomNo: roomNo,
          guestName: guestName,
          guestEmail: user,
          items: cart.map(c => ({ itemId: c.itemId, name: c.name, price: c.price, qty: c.qty })),
          totalAmount: totalAmount,
          paymentType: paymentType,
          notes: notes
        };

        google.script.run
          .withSuccessHandler((res) => {
            setPlacing(false);
            if (res.success) {
              Swal.fire({ icon: 'success', title: 'Order Submitted!', html: `<p>Order ID: <strong>${res.orderId}</strong></p><p>Total: <strong>$${totalAmount.toFixed(2)}</strong></p><p>Payment: ${paymentType}</p><p style="margin-top:10px;color:#856404;"><i class="fas fa-clock"></i> Awaiting admin approval</p>` });
              setCart([]);
              setNotes('');
            } else {
              Swal.fire({ icon: 'error', text: res.message });
            }
          })
          .withFailureHandler((err) => { setPlacing(false); Swal.fire({ icon: 'error', text: err.message }); })
          .placeFoodOrder(orderData);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-utensils"></i> Order Food</h2>
            <div style={{display: 'flex', alignItems: 'center', gap: 15}}>
              <span style={{background: 'var(--navy-primary)', color: 'white', padding: '8px 16px', borderRadius: 20}}>
                <i className="fas fa-shopping-cart"></i> {cart.length} items | ${totalAmount.toFixed(2)}
              </span>
            </div>
          </div>

          {/* Room Info */}
          {bookings.length === 0 && (
            <div className="info-box info" style={{marginBottom: 20}}>
              <i className="fas fa-info-circle"></i>
              No active bookings found for your account. If you have a booked room, enter your room number and name below to place an order.
            </div>
          )}
          <div style={{background: '#f8f9fa', padding: 15, borderRadius: 8, marginBottom: 20, display: 'flex', gap: 15, flexWrap: 'wrap'}}>
            <div className="form-group" style={{flex: 1, minWidth: 150, marginBottom: 0}}>
              <label>Room Number *</label>
              {bookings.length > 0 ? (
                <select value={roomNo} onChange={handleBookingChange} style={{width: '100%', padding: '14px 16px', border: '1px solid #d0d0d0', borderRadius: 2, fontSize: 15}}>
                  {bookings.map(b => (
                    <option key={b.roomNo} value={b.roomNo}>Room {b.roomNo} {b.roomType ? `- ${b.roomType}` : ''}</option>
                  ))}
                </select>
              ) : (
                <input type="text" value={roomNo} onChange={(e) => setRoomNo(e.target.value)} placeholder="Enter your room number (e.g., 101)" />
              )}
            </div>
            <div className="form-group" style={{flex: 2, minWidth: 200, marginBottom: 0}}>
              <label>Your Name *</label>
              <input type="text" value={guestName} onChange={(e) => setGuestName(e.target.value)} placeholder="Enter your name" readOnly={!!selectedBooking} style={{background: selectedBooking ? '#e9ecef' : 'white'}} />
            </div>
          </div>

          {/* Category Filter */}
          <div style={{display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 20}}>
            {categories.map(cat => (
              <button key={cat} onClick={() => setSelectedCategory(cat)} style={{padding: '8px 20px', border: 'none', borderRadius: 20, cursor: 'pointer', fontWeight: 600, background: selectedCategory === cat ? 'var(--navy-primary)' : '#e9ecef', color: selectedCategory === cat ? 'white' : '#333', transition: 'all 0.3s'}}>
                {cat}
              </button>
            ))}
          </div>

          {loading ? <TableSkeleton rows={4} columns={4} /> : (
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 20}}>
              {filteredMenu.map(item => (
                <div key={item.itemId} style={{background: 'white', borderRadius: 12, overflow: 'hidden', boxShadow: '0 4px 15px rgba(0,0,0,0.1)', transition: 'transform 0.3s', border: '1px solid #eee'}}>
                  <div style={{height: 160, backgroundImage: `url(${item.image})`, backgroundSize: 'cover', backgroundPosition: 'center', position: 'relative'}}>
                    <span style={{position: 'absolute', top: 10, right: 10, background: 'var(--navy-primary)', color: 'white', padding: '5px 12px', borderRadius: 15, fontWeight: 700, fontSize: 14}}>${item.price.toFixed(2)}</span>
                    <span style={{position: 'absolute', bottom: 10, left: 10, background: 'rgba(0,0,0,0.7)', color: 'white', padding: '4px 10px', borderRadius: 10, fontSize: 12}}>{item.category}</span>
                  </div>
                  <div style={{padding: 15}}>
                    <h4 style={{margin: '0 0 8px', color: 'var(--navy-primary)'}}>{item.name}</h4>
                    <p style={{fontSize: 13, color: '#666', margin: '0 0 15px', minHeight: 40}}>{item.description}</p>
                    <button onClick={() => addToCart(item)} className="btn btn-success" style={{width: '100%'}}>
                      <i className="fas fa-plus"></i> Add to Cart
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Cart Section */}
          {cart.length > 0 && (
            <div className="about-card" style={{marginTop: 30, border: '2px solid var(--navy-primary)'}}>
              <h2 style={{display: 'flex', alignItems: 'center', gap: 10, color: 'var(--navy-primary)', marginBottom: 20}}>
                <i className="fas fa-shopping-cart"></i> Your Cart
                <span style={{marginLeft: 'auto', fontSize: 14, background: 'var(--navy-accent)', color: 'white', padding: '4px 12px', borderRadius: 20}}>{cart.length} {cart.length === 1 ? 'item' : 'items'}</span>
              </h2>
              <div className="about-table-wrapper">
                <table className="about-roles-table">
                  <thead>
                    <tr>
                      <th style={{textAlign: 'left'}}>Item</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Subtotal</th>
                      <th style={{width: 60}}>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {cart.map(item => (
                      <tr key={item.itemId}>
                        <td style={{textAlign: 'left', background: '#f8f9fa', fontWeight: 600}}>
                          <i className="fas fa-hamburger" style={{color: 'var(--navy-accent)', marginRight: 8}}></i>
                          {item.name}
                        </td>
                        <td>${item.price.toFixed(2)}</td>
                        <td>
                          <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8}}>
                            <button onClick={() => updateQty(item.itemId, -1)} style={{border: 'none', background: 'var(--danger)', color: 'white', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center'}}>-</button>
                            <span style={{fontWeight: 700, fontSize: 16, minWidth: 24, textAlign: 'center'}}>{item.qty}</span>
                            <button onClick={() => updateQty(item.itemId, 1)} style={{border: 'none', background: 'var(--success)', color: 'white', width: 28, height: 28, borderRadius: '50%', cursor: 'pointer', fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center'}}>+</button>
                          </div>
                        </td>
                        <td style={{fontWeight: 700, color: 'var(--success)'}}>${(item.price * item.qty).toFixed(2)}</td>
                        <td>
                          <button onClick={() => removeFromCart(item.itemId)} style={{border: 'none', background: 'rgba(234,67,53,0.1)', color: 'var(--danger)', cursor: 'pointer', fontSize: 16, padding: '6px 10px', borderRadius: 6, transition: 'background 0.2s'}} title="Remove item">
                            <i className="fas fa-trash-alt"></i>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td style={{textAlign: 'right', fontWeight: 700, fontSize: 16, background: 'var(--navy-primary)', color: 'white', border: '1px solid var(--navy-primary)'}} colSpan="3">Grand Total</td>
                      <td style={{fontWeight: 700, fontSize: 20, color: 'var(--navy-primary)', background: '#e8f4fd', border: '1px solid #e0e0e0'}}>${totalAmount.toFixed(2)}</td>
                      <td style={{background: 'var(--navy-primary)', border: '1px solid var(--navy-primary)'}}></td>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <div className="form-group" style={{marginTop: 20}}>
                <label><i className="fas fa-clipboard" style={{marginRight: 6}}></i> Special Instructions (Optional)</label>
                <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Any allergies or special requests..." rows="2"></textarea>
              </div>

              <div style={{display: 'flex', gap: 15, marginTop: 20, flexWrap: 'wrap'}}>
                <button onClick={() => {
                  if (cart.length === 0) { Swal.fire({ icon: 'warning', text: 'Your cart is empty!' }); return; }
                  if (!roomNo.trim()) { Swal.fire({ icon: 'warning', text: 'Please enter your room number' }); return; }
                  if (!guestName.trim()) { Swal.fire({ icon: 'warning', text: 'Please enter your name' }); return; }
                  setShowPaymentModal(true);
                }} className="btn btn-success" disabled={placing} style={{flex: 1, minWidth: 200, padding: 15, fontSize: 15, fontWeight: 600}}>
                  <i className="fas fa-credit-card"></i> Pay Now - ${totalAmount.toFixed(2)}
                </button>
                <button onClick={() => placeOrder('Add to Bill')} className="btn btn-primary" disabled={placing} style={{flex: 1, minWidth: 200, padding: 15, fontSize: 15, fontWeight: 600}}>
                  {placing ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-file-invoice"></i> Add to Checkout Bill</>}
                </button>
              </div>
            </div>
          )}

          {showPaymentModal && (
            <FoodPaymentModal
              cart={cart}
              totalAmount={totalAmount}
              roomNo={roomNo}
              guestName={guestName}
              guestEmail={user}
              notes={notes}
              onClose={() => setShowPaymentModal(false)}
              onSuccess={() => {
                setShowPaymentModal(false);
                setCart([]);
                setNotes('');
              }}
            />
          )}
        </div>
      );
    }

    // ============================================
    // USER: MY FOOD ORDERS
    // ============================================
    function UserMyFoodOrdersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);

      useEffect(() => { loadOrders(); }, []);

      const loadOrders = () => {
        setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          setOrders(result.error ? [] : result);
        }).getUserFoodOrders(user);
      };

      const handleDelete = (order) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Order?',
          text: `Delete food order ${order.orderId}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Yes, Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Order deleted!', timer: 1500, showConfirmButton: false }); loadOrders(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteFoodOrder(order.dateRowIndex, order.orderIndex, user);
          }
        });
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-receipt"></i> My Food Orders</h2>
            <button className="btn btn-primary" onClick={loadOrders}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {loading ? <TableSkeleton rows={5} columns={5} /> : orders.length === 0 ? (
            <div style={{textAlign: 'center', padding: 60}}>
              <i className="fas fa-utensils" style={{fontSize: '4rem', color: '#ccc'}}></i>
              <h3 style={{color: '#666', marginTop: 20}}>No Orders Yet</h3>
              <p style={{color: '#999'}}>Your food orders will appear here</p>
            </div>
          ) : (
            <div style={{display: 'flex', flexDirection: 'column', gap: 15}}>
              {orders.map(order => (
                <div key={order.orderId} style={{background: 'white', border: '1px solid #e0e0e0', borderRadius: 8, padding: 20, borderLeft: `4px solid ${order.status === 'Completed' ? 'var(--success)' : (order.status === 'Rejected' ? 'var(--danger)' : '#fbbc04')}`}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 15, flexWrap: 'wrap', gap: 10}}>
                    <div>
                      <strong style={{fontSize: 18, color: 'var(--navy-primary)'}}>{order.orderId}</strong>
                      <span style={{marginLeft: 15, color: '#666', fontSize: 13}}>{new Date(order.createdAt).toLocaleString()}</span>
                    </div>
                    <div style={{display: 'flex', gap: 10, alignItems: 'center'}}>
                      <span className={`status-badge ${order.status === 'Completed' ? 'status-active' : (order.status === 'Awaiting Approval' ? 'status-pending' : (order.status === 'Rejected' ? 'status-rejected' : 'status-waiting'))}`}>{order.status}</span>

                          <i className="fas fa-trash"></i> Delete
                        </button>
                      )}

                  </div>
                  <div style={{display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 10}}>

                  </div>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10}}>
                    <div style={{fontWeight: 700, color: 'var(--success)', fontSize: 18}}>Total: ${order.totalAmount.toFixed(2)}</div>
                    {order.paymentType === 'Pay Now' && order.paymentMethod && (
                      <div style={{display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, color: '#666'}}>

                        {order.transactionId && <span><i className="fas fa-hashtag" style={{marginRight: 4}}></i>{order.transactionId}</span>}
                        {order.paymentScreenshotUrl && (

    // ============================================
    // USER: REQUEST CLEANER
    // ============================================
    function UserRequestCleanerView({ user }) {
      const [loading, setLoading] = useState(true);
      const [bookings, setBookings] = useState([]);
      const [selectedRoom, setSelectedRoom] = useState('');
      const [reason, setReason] = useState('');
      const [priority, setPriority] = useState('Normal');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => { loadUserBookings(); }, []);

      const loadUserBookings = () => {
        setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const activeBookings = (result.error ? [] : result).filter(b => b.status === 'Checked In');
          setBookings(activeBookings);
          if (activeBookings.length > 0) setSelectedRoom(activeBookings[0].roomNo.toString());
        }).getUserBookings(user);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!selectedRoom) { Swal.fire({ icon: 'warning', text: 'Please select a room' }); return; }
        if (!reason.trim()) { Swal.fire({ icon: 'warning', text: 'Please enter a reason for cleaning' }); return; }

        const booking = bookings.find(b => b.roomNo.toString() === selectedRoom);
        setSubmitting(true);

        google.script.run.withSuccessHandler((res) => {
          setSubmitting(false);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Request Submitted!', text: `Your request ID: ${res.requestId}` });
            setReason(''); setNotes(''); setPriority('Normal');
          } else {
            Swal.fire({ icon: 'error', text: res.message });
          }
        }).requestCleaner({
          roomNo: selectedRoom,
          guestName: booking?.guestName || user,
          guestEmail: user,
          reason: reason,
          priority: priority,
          notes: notes
        });
      };

      const reasonOptions = [
        'General Room Cleaning',
        'Bathroom Cleaning',
        'Change Bed Sheets',
        'Change Towels',
        'Vacuum Cleaning',
        'Spill Cleanup',
        'Trash Removal',
        'Deep Cleaning',
        'Other'
      ];

      if (loading) return <div className="data-section"><TableSkeleton rows={3} columns={2} /></div>;

      if (bookings.length === 0) {
        return (
          <div className="data-section">
            <div className="section-header">
              <h2><i className="fas fa-broom"></i> Request Cleaner</h2>
            </div>
            <div style={{textAlign: 'center', padding: 60}}>
              <i className="fas fa-door-closed" style={{fontSize: '4rem', color: '#ccc'}}></i>
              <h3 style={{color: '#666', marginTop: 20}}>No Active Booking</h3>
              <p style={{color: '#999'}}>You need to have a checked-in booking to request a cleaner</p>
            </div>
          </div>
        );
      }

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-broom"></i> Request Cleaner</h2>
          </div>

          <form onSubmit={handleSubmit}>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 20}}>
              <div className="form-group" style={{marginBottom: 0}}>
                <label><i className="fas fa-door-open" style={{marginRight: 6, color: 'var(--navy-accent)'}}></i> Select Room *</label>
                <select value={selectedRoom} onChange={(e) => setSelectedRoom(e.target.value)} required style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3}}>
                  {bookings.map(b => (
                    <option key={b.roomNo} value={b.roomNo}>Room {b.roomNo} - {b.roomType}</option>
                  ))}
                </select>
              </div>

              <div className="form-group" style={{marginBottom: 0}}>
                <label><i className="fas fa-broom" style={{marginRight: 6, color: 'var(--navy-accent)'}}></i> Reason for Cleaning *</label>
                <select value={reason} onChange={(e) => setReason(e.target.value)} required style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3}}>
                  <option value="">-- Select Reason --</option>
                  {reasonOptions.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>

              <div className="form-group" style={{marginBottom: 0}}>
                <label><i className="fas fa-flag" style={{marginRight: 6, color: 'var(--navy-accent)'}}></i> Priority</label>
                <select value={priority} onChange={(e) => setPriority(e.target.value)} style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3}}>
                  <option value="Low">Low - No rush</option>
                  <option value="Normal">Normal - Within an hour</option>
                  <option value="High">High - As soon as possible</option>
                  <option value="Urgent">Urgent - Immediate attention needed</option>
                </select>
              </div>

              <div className="form-group" style={{marginBottom: 0}}>
                <label><i className="fas fa-clipboard" style={{marginRight: 6, color: 'var(--navy-accent)'}}></i> Additional Notes (Optional)</label>
                <textarea rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Any special instructions..." style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3, fontFamily: 'inherit', resize: 'vertical'}}></textarea>
              </div>
            </div>

            <button type="submit" className="btn btn-primary" disabled={submitting} style={{width: '100%', padding: 15, marginTop: 20, fontSize: 15, fontWeight: 600}}>
              {submitting ? <><i className="fas fa-spinner fa-spin"></i> Submitting...</> : <><i className="fas fa-paper-plane"></i> Submit Request</>}
            </button>
          </form>
        </div>
      );
    }

    // ============================================
    // USER: MY CLEANING REQUESTS
    // ============================================
    function UserMyCleaningRequestsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [requests, setRequests] = useState([]);

      useEffect(() => { loadRequests(); }, []);

      const loadRequests = () => {
        setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          setRequests(result.error ? [] : result);
        }).getUserCleaningRequests(user);
      };

      const getPriorityColor = (priority) => {
        switch(priority) {
          case 'Urgent': return { bg: '#f8d7da', color: '#721c24' };
          case 'High': return { bg: '#fff3cd', color: '#856404' };
          case 'Normal': return { bg: '#d4edda', color: '#155724' };
          default: return { bg: '#e2e3e5', color: '#383d41' };
        }
      };

      const handleDelete = (req) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Request?',
          text: `Delete cleaning request ${req.requestId}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Yes, Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Request deleted!', timer: 1500, showConfirmButton: false }); loadRequests(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteCleaningRequest(req.dateRowIndex, req.requestIndex, user);
          }
        });
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-spray-can"></i> My Cleaning Requests</h2>
            <button className="btn btn-primary" onClick={loadRequests}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {loading ? <TableSkeleton rows={5} columns={4} /> : requests.length === 0 ? (
            <div style={{textAlign: 'center', padding: 60}}>
              <i className="fas fa-broom" style={{fontSize: '4rem', color: '#ccc'}}></i>
              <h3 style={{color: '#666', marginTop: 20}}>No Requests Yet</h3>
              <p style={{color: '#999'}}>Your cleaning requests will appear here</p>
            </div>
          ) : (
            <div style={{display: 'flex', flexDirection: 'column', gap: 15}}>
              {requests.map(req => {
                const prioColor = getPriorityColor(req.priority);
                return (
                  <div key={req.requestId} style={{background: 'white', border: '1px solid #e0e0e0', borderRadius: 8, padding: 20, borderLeft: `4px solid ${req.status === 'Completed' ? 'var(--success)' : '#ff9800'}`}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 15, flexWrap: 'wrap', gap: 10}}>
                      <div>
                        <strong style={{fontSize: 18, color: 'var(--navy-primary)'}}>{req.requestId}</strong>
                        <span style={{marginLeft: 15, color: '#666', fontSize: 13}}>{new Date(req.createdAt).toLocaleString()}</span>
                      </div>
                      <div style={{display: 'flex', gap: 10, alignItems: 'center'}}>
                        <span className={`status-badge ${req.status === 'Completed' ? 'status-active' : 'status-waiting'}`}>{req.status}</span>
                        <span style={{background: prioColor.bg, color: prioColor.color, padding: '5px 12px', borderRadius: 15, fontSize: 12, fontWeight: 600}}>{req.priority}</span>
                        {req.status === 'Pending' && (
                          <button onClick={() => handleDelete(req)} style={{background: '#ea4335', color: 'white', border: 'none', padding: '5px 12px', borderRadius: 15, fontSize: 12, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5}} title="Delete Request">
                            <i className="fas fa-trash"></i> Delete
                          </button>
                        )}
                      </div>
                    </div>
                    <div style={{marginBottom: 10}}>
                      <span style={{background: '#e3f2fd', padding: '5px 12px', borderRadius: 15, fontSize: 13, marginRight: 10}}>
                        <i className="fas fa-door-open"></i> Room {req.roomNo}
                      </span>
                      <span style={{background: '#f8f9fa', padding: '5px 12px', borderRadius: 15, fontSize: 13}}>
                        {req.reason}
                      </span>
                    </div>
                    {req.notes && <p style={{margin: '10px 0 0', color: '#666', fontSize: 14}}><i className="fas fa-sticky-note"></i> {req.notes}</p>}
                    {req.status === 'Completed' && req.completedAt && (
                      <p style={{margin: '10px 0 0', color: 'var(--success)', fontSize: 13}}>
                        <i className="fas fa-check-circle"></i> Completed on {new Date(req.completedAt).toLocaleString()}
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // CLEANER: DASHBOARD VIEW
    // ============================================
    function CleanerDashboardView({ user }) {
      const [loading, setLoading] = useState(true);
      const [requests, setRequests] = useState([]);
      const [stats, setStats] = useState({ pending: 0, completedToday: 0, urgent: 0, high: 0, normal: 0, low: 0 });
      const [lastRequestCount, setLastRequestCount] = useState(0);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const [assignedRooms, setAssignedRooms] = useState('');
      const speechRef = useRef(null);
      const intervalRef = useRef(null);
      const chartsRef = useRef({});

      useEffect(() => {
        google.script.run.withSuccessHandler((result) => {
          if (result && !result.error) setAssignedRooms(result.assignedRooms || '');
        }).getUserProfile(user);
      }, []);

      const speakNotification = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance('Cleaning request received! Please complete your task.');
          utterance.rate = 0.9;
          utterance.pitch = 1;
          utterance.volume = 1;
          window.speechSynthesis.speak(utterance);
          speechRef.current = utterance;
        }
      };

      const stopSpeaking = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setAudioPlaying(false);
      };

      const loadRequests = () => {
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const newRequests = result.error ? [] : result;

          if (newRequests.length > lastRequestCount && lastRequestCount > 0) {
            setAudioPlaying(true);
            speakNotification();
            const repeatInterval = setInterval(() => {
              if (audioPlaying) speakNotification();
            }, 5000);
            setTimeout(() => clearInterval(repeatInterval), 30000);
          }

          setRequests(newRequests);
          setLastRequestCount(newRequests.length);

          const urgent = newRequests.filter(r => r.priority === 'Urgent').length;
          const high = newRequests.filter(r => r.priority === 'High').length;
          const normal = newRequests.filter(r => r.priority === 'Normal').length;
          const low = newRequests.filter(r => r.priority === 'Low').length;
          setStats(prev => ({ ...prev, pending: newRequests.length, urgent, high, normal, low }));
          setTimeout(() => initCharts(newRequests), 150);
        }).getPendingCleaningRequests(user);

        google.script.run.withSuccessHandler((result) => {
          if (!result.error) {
            const today = new Date().toISOString().split('T')[0];
            const completedToday = result.filter(r => r.status === 'Completed' && r.completedAt && r.completedAt.startsWith(today)).length;
            setStats(prev => ({ ...prev, completedToday }));
          }
        }).getStaffCleaningRequests(user);
      };

      const initCharts = (requestsData) => {
        Object.values(chartsRef.current).forEach(c => c && c.destroy());
        chartsRef.current = {};

        const priorityCtx = document.getElementById('cleaningPriorityChart');
        if (priorityCtx) {
          const urgent = requestsData.filter(r => r.priority === 'Urgent').length;
          const high = requestsData.filter(r => r.priority === 'High').length;
          const normal = requestsData.filter(r => r.priority === 'Normal').length;
          const low = requestsData.filter(r => r.priority === 'Low').length;
          chartsRef.current.priority = new Chart(priorityCtx, {
            type: 'doughnut',
            data: {
              labels: ['Urgent', 'High', 'Normal', 'Low'],
              datasets: [{ data: [urgent, high, normal, low], backgroundColor: ['#ea4335', '#ff9800', '#34a853', '#6c757d'], borderWidth: 3, borderColor: '#fff' }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 15, usePointStyle: true } } } }
          });
        }

        const reasonCtx = document.getElementById('cleaningReasonChart');
        if (reasonCtx) {
          const reasonCounts = {};
          requestsData.forEach(req => {
            reasonCounts[req.reason] = (reasonCounts[req.reason] || 0) + 1;
          });
          const sortedReasons = Object.entries(reasonCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
          chartsRef.current.reason = new Chart(reasonCtx, {
            type: 'bar',
            data: {
              labels: sortedReasons.map(r => r[0]),
              datasets: [{ label: 'Requests', data: sortedReasons.map(r => r[1]), backgroundColor: ['#34a853', '#0074D9', '#ff9800', '#001f3f', '#9c27b0'], borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, y: { grid: { display: false } } } }
          });
        }
      };

      useEffect(() => {
        loadRequests();
        intervalRef.current = setInterval(loadRequests, 5000);
        return () => {
          clearInterval(intervalRef.current);
          stopSpeaking();
          Object.values(chartsRef.current).forEach(c => c && c.destroy());
        };
      }, []);

      const markComplete = (request) => {
        Swal.fire({
          icon: 'question',
          title: 'Complete Request?',
          html: `<p>Mark request <strong>${request.requestId}</strong> as completed?</p>`,
          showCancelButton: true,
          confirmButtonColor: 'var(--success)',
          confirmButtonText: 'Yes, Complete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) {
                  Swal.fire({ icon: 'success', text: 'Request completed!', timer: 1500 });
                  loadRequests();
                } else {
                  Swal.fire({ icon: 'error', text: res.message });
                }
              })
              .completeCleaningRequest(request.dateRowIndex, request.requestIndex, user);
          }
        });
      };

      const dismissNotification = () => {
        stopSpeaking();
        Swal.fire({ icon: 'info', text: 'Notification dismissed', timer: 1000, showConfirmButton: false });
      };

      const getPriorityColor = (priority) => {
        switch(priority) {
          case 'Urgent': return '#ea4335';
          case 'High': return '#ff9800';
          case 'Normal': return '#34a853';
          default: return '#6c757d';
        }
      };

      return (
        <div>
          <div className="section-header" style={{marginBottom: 25}}>
            <h2><i className="fas fa-broom"></i> Cleaner Dashboard</h2>
            <div style={{display: 'flex', gap: 10}}>
              {audioPlaying && (
                <button className="btn btn-danger" onClick={dismissNotification}>
                  <i className="fas fa-volume-mute"></i> OK - Stop Alert
                </button>
              )}
              <button className="btn btn-primary" onClick={loadRequests}>
                <i className="fas fa-sync-alt"></i> Refresh
              </button>
            </div>
          </div>

          {assignedRooms && (
            <div style={{background: 'linear-gradient(135deg, #f3e5f5, #e1bee7)', border: '1px solid #ce93d8', borderRadius: 8, padding: 15, marginBottom: 20, display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
              <i className="fas fa-door-open" style={{fontSize: 20, color: '#7b1fa2'}}></i>
              <div>
                <strong style={{color: '#4a148c'}}>Assigned Rooms:</strong>
                <div style={{display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 5}}>
                  {assignedRooms.split(',').map((room, i) => (
                    <span key={i} style={{background: '#7b1fa2', color: 'white', padding: '3px 10px', borderRadius: 4, fontSize: 13, fontWeight: 600}}>{room.trim()}</span>
                  ))}
                </div>
              </div>
            </div>
          )}

          {audioPlaying && (
            <div style={{background: 'linear-gradient(135deg, #17a2b8, #138496)', color: 'white', padding: 20, borderRadius: 8, marginBottom: 20, animation: 'pulse 1s infinite', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <h3 style={{margin: 0}}><i className="fas fa-bell" style={{marginRight: 10}}></i> NEW CLEANING REQUEST!</h3>
                <p style={{margin: '5px 0 0'}}>Please complete the task and press OK</p>
              </div>
              <button onClick={dismissNotification} style={{background: 'white', color: '#17a2b8', border: 'none', padding: '15px 30px', borderRadius: 8, fontWeight: 700, fontSize: 18, cursor: 'pointer'}}>
                OK
              </button>
            </div>
          )}

          <div className="dashboard-grid-3">
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #34a853, #4ade80)'}}><i className="fas fa-clock"></i></div>
              <div className="stat-card-value">{stats.pending}</div>
              <div className="stat-card-label">Pending Requests</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #0074D9, #00a8ff)'}}><i className="fas fa-check-double"></i></div>
              <div className="stat-card-value">{stats.completedToday}</div>
              <div className="stat-card-label">Completed Today</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #ea4335, #f87171)'}}><i className="fas fa-exclamation-triangle"></i></div>
              <div className="stat-card-value">{stats.urgent}</div>
              <div className="stat-card-label">Urgent</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #ff9800, #ffb74d)'}}><i className="fas fa-arrow-up"></i></div>
              <div className="stat-card-value">{stats.high}</div>
              <div className="stat-card-label">High Priority</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #001f3f, #003366)'}}><i className="fas fa-minus"></i></div>
              <div className="stat-card-value">{stats.normal}</div>
              <div className="stat-card-label">Normal</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #6c757d, #adb5bd)'}}><i className="fas fa-arrow-down"></i></div>
              <div className="stat-card-value">{stats.low}</div>
              <div className="stat-card-label">Low Priority</div>
            </div>
          </div>

          <div className="dashboard-grid-3">
            <div className="chart-card">
              <h3><i className="fas fa-exclamation-circle"></i> Priority Distribution</h3>
              <div className="chart-container"><canvas id="cleaningPriorityChart"></canvas></div>
            </div>
            <div className="chart-card" style={{gridColumn: 'span 2'}}>
              <h3><i className="fas fa-tasks"></i> Request Types</h3>
              <div className="chart-container" style={{height: '250px'}}><canvas id="cleaningReasonChart"></canvas></div>
            </div>
          </div>

          <div className="data-section" style={{marginTop: 25}}>
            <h3 style={{marginBottom: 20, color: 'var(--navy-primary)'}}><i className="fas fa-list"></i> Pending Requests Queue</h3>

          {loading ? <TableSkeleton rows={5} columns={4} /> : requests.length === 0 ? (
            <div style={{textAlign: 'center', padding: 60, background: '#f8f9fa', borderRadius: 8}}>
              <i className="fas fa-check-circle" style={{fontSize: '4rem', color: 'var(--success)'}}></i>
