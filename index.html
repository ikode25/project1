            </div>
          )}

          {loading && <TableSkeleton rows={8} columns={7} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="roomsTable" className="display" style={{width: '100%'}}></table>
          </div>
          {showModal && <RoomModal room={editingRoom} onClose={() => { setShowModal(false); setEditingRoom(null); }} onSave={() => { setShowModal(false); setEditingRoom(null); loadRooms(); }} />}
          {showImageUpload && <RoomImageUploadModal uniqueTypes={uniqueTypes} onClose={() => setShowImageUpload(false)} onSave={() => { setShowImageUpload(false); loadRooms(); }} />}
        </div>
      );
    }

    // Room Image Upload Modal
    function RoomImageUploadModal({ uniqueTypes, onClose, onSave }) {
      const [selectedType, setSelectedType] = useState(uniqueTypes[0] || 'Standard');
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState('');
      const [uploading, setUploading] = useState(false);

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            Swal.fire({ icon: 'warning', text: 'Image size should be less than 5MB' });
            return;
          }
          setImageFile(file);
          const reader = new FileReader();
          reader.onload = (e) => setImagePreview(e.target.result);
          reader.readAsDataURL(file);
        }
      };

      const handleUpload = () => {
        if (!imageFile) {
          Swal.fire({ icon: 'warning', text: 'Please select an image' });
          return;
        }

        setUploading(true);
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64Data = e.target.result.split(',')[1];
          const fileName = `room_${selectedType}_${Date.now()}.${imageFile.name.split('.').pop()}`;

          google.script.run
            .withSuccessHandler((result) => {
              setUploading(false);
              if (result.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'Image Uploaded!',
                  text: `Updated ${result.updatedRooms} rooms of type "${selectedType}" with new image`,
                  timer: 3000
                });
                onSave();
              } else {
                Swal.fire({ icon: 'error', title: 'Upload Failed', text: result.message });
              }
            })
            .withFailureHandler((err) => {
              setUploading(false);
              Swal.fire({ icon: 'error', title: 'Error', text: err.message });
            })
            .updateRoomTypeImage(selectedType, base64Data, fileName, imageFile.type);
        };
        reader.readAsDataURL(imageFile);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 500}}>
            <div className="modal-header">
              <h3><i className="fas fa-image"></i> Upload Room Type Image</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label><i className="fas fa-bed"></i> Room Type</label>
                <select value={selectedType} onChange={(e) => setSelectedType(e.target.value)}>
                  {uniqueTypes.length > 0 ? (
                    uniqueTypes.map(type => <option key={type} value={type}>{type}</option>)
                  ) : (
                    <>
                      <option value="Standard">Standard</option>
                      <option value="Deluxe">Deluxe</option>
                      <option value="Suite">Suite</option>
                      <option value="Executive">Executive</option>
                    </>
                  )}
                </select>
              </div>

              <div className="form-group">
                <label><i className="fas fa-upload"></i> Select Image</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleFileChange}
                  style={{width: '100%', padding: '10px', border: '2px dashed #ccc', borderRadius: '4px', cursor: 'pointer'}}
                />
                <small style={{color: '#666', marginTop: 5, display: 'block'}}>Max size: 5MB. Supported: JPG, PNG, GIF, WebP</small>
              </div>

              {imagePreview && (
                <div className="form-group">
                  <label>Preview</label>
                  <div style={{position: 'relative', textAlign: 'center', background: '#f5f5f5', padding: 10, borderRadius: 4}}>
                    <img src={imagePreview} alt="Preview" style={{maxWidth: '100%', maxHeight: 200, borderRadius: 4}} />
                    <button
                      type="button"
                      onClick={() => { setImageFile(null); setImagePreview(''); }}
                      style={{position: 'absolute', top: 5, right: 5, background: '#ea4335', color: 'white', border: 'none', borderRadius: '50%', width: 25, height: 25, cursor: 'pointer'}}
                    >
                      <i className="fas fa-times"></i>
                    </button>
                  </div>
                </div>
              )}

              <div className="form-actions">
                <button
                  type="button"
                  className="btn btn-primary"
                  onClick={handleUpload}
                  disabled={uploading || !imageFile}
                >
                  {uploading ? <><i className="fas fa-spinner fa-spin"></i> Uploading...</> : <><i className="fas fa-cloud-upload-alt"></i> Upload Image</>}
                </button>
                <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RoomModal({ room, onClose, onSave }) {
      const [formData, setFormData] = useState({ roomNo: room?.roomNo || '', roomType: room?.roomType || '', roomRate: room?.roomRate || '', roomStatus: room?.roomStatus || 'Available' });
      const [saving, setSaving] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.roomNo) { Swal.fire({ icon: 'warning', text: 'Room number required' }); return; }
        setSaving(true);

        const action = room ? 'updateRoom' : 'addRoom';
        const args = room ? [room.rowIndex, formData.roomNo, formData.roomType, formData.roomRate, formData.roomStatus] : [formData.roomNo, formData.roomType, formData.roomRate, formData.roomStatus];

        google.script.run
          .withSuccessHandler((res) => { setSaving(false); if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000 }); onSave(); } else Swal.fire({ icon: 'error', text: res.message }); })
          .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
          [action](...args);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 500}}>
            <div className="modal-header"><h3><i className="fas fa-door-open"></i> {room ? 'Edit' : 'Add'} Room</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-group"><label>Room Number *</label><input type="text" value={formData.roomNo} onChange={(e) => setFormData({...formData, roomNo: e.target.value})} required /></div>
                <div className="form-group"><label>Room Type</label><input type="text" value={formData.roomType} onChange={(e) => setFormData({...formData, roomType: e.target.value})} placeholder="Standard, Deluxe, Suite" /></div>
                <div className="form-group"><label>Rate/Night</label><input type="number" step="0.01" value={formData.roomRate} onChange={(e) => setFormData({...formData, roomRate: e.target.value})} /></div>
                <div className="form-group"><label>Status</label><select value={formData.roomStatus} onChange={(e) => setFormData({...formData, roomStatus: e.target.value})}><option value="Available">Available</option><option value="Booked">Booked</option><option value="Maintenance">Maintenance</option></select></div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // WAITLIST VIEW (Admin)
    // ============================================
    function WaitlistView() {
      const [loading, setLoading] = useState(true);
      const [waitlist, setWaitlist] = useState([]);
      const [filters, setFilters] = useState({ status: '', dateFrom: '', dateTo: '' });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);

      useEffect(() => {
        loadWaitlist();
        // Real-time polling every 30 seconds
        intervalRef.current = setInterval(() => loadWaitlist(true), 30000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadWaitlist = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            const data = result.error ? [] : result;
            setWaitlist(data);
            if (!silent || !tableRef.current) initDataTable(data);
          })
          .withFailureHandler(() => { setLoading(false); setWaitlist([]); })
          .getWaitlist();
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#waitlistTable').empty(); }
        if (data.length === 0) return;
        setTimeout(() => {
          tableRef.current = $('#waitlistTable').DataTable({
            data: data,
            columns: [
              { data: 'WaitlistID', title: 'ID' },
              { data: 'GuestName', title: 'Guest', render: (d, t, row) => `${d}<br/><small style="color:#666">${row.PreferredRoomType || ''}</small>` },
              { data: 'Email', title: 'Contact', render: (d, t, row) => `${d}<br/><small>${row.Phone || ''}</small>` },
              { data: 'CheckIn', title: 'Dates', render: (d, t, row) => `${formatDate(d)} - ${formatDate(row.CheckOut)}` },
              { data: 'NumRooms', title: 'Rooms' },
              { data: 'Status', title: 'Status', render: d => `<span class="status-badge status-${(d || '').toLowerCase()}">${d}</span>` },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `
                <select class="status-select" data-row="${row.rowIndex}" style="padding:5px 10px;margin-right:8px">
                  <option value="Waiting" ${row.Status === 'Waiting' ? 'selected' : ''}>Waiting</option>
                  <option value="Contacted" ${row.Status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                  <option value="Booked" ${row.Status === 'Booked' ? 'selected' : ''}>Booked</option>
                  <option value="Cancelled" ${row.Status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
                <button class="action-icon delete-icon" data-action="delete" data-row="${row.rowIndex}"><i class="fas fa-trash"></i></button>
              ` }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[0, 'desc']]
          });

          $('#waitlistTable').off('change', '.status-select').on('change', '.status-select', function() {
            const rowIndex = $(this).data('row');
            const newStatus = $(this).val();
            updateStatus(rowIndex, newStatus);
          });

          $('#waitlistTable').off('click', '.delete-icon').on('click', '.delete-icon', function() {
            const rowIndex = $(this).data('row');
            deleteEntry(rowIndex);
          });
        }, 150);
      };

      const updateStatus = (rowIndex, status) => {
        google.script.run
          .withSuccessHandler((res) => { if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); loadWaitlist(); } })
          .updateWaitlistStatus(rowIndex, status, '');
      };

      const deleteEntry = (rowIndex) => {
        Swal.fire({ icon: 'warning', title: 'Delete?', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' }).then((result) => {
          if (result.isConfirmed) {
            google.script.run.withSuccessHandler(() => { Swal.fire({ icon: 'success', text: 'Deleted', timer: 1500 }); loadWaitlist(); }).deleteWaitlistEntry(rowIndex);
          }
        });
      };

      const applyFilters = () => {
        if (!tableRef.current) return;
        // Clear previous custom search
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn.isWaitlistFilter);

        // Date range filter
        const filterFn = function(settings, data, dataIndex) {
          if (settings.nTable.id !== 'waitlistTable') return true;
          const entry = waitlist[dataIndex];
          if (!entry) return true;

          const checkIn = new Date(entry.CheckIn);
          const fromDate = (filters.dateFrom && filters.dateFrom.trim()) ? new Date(filters.dateFrom) : null;
          const toDate = (filters.dateTo && filters.dateTo.trim()) ? new Date(filters.dateTo + 'T23:59:59') : null;

          if (fromDate && checkIn < fromDate) return false;
          if (toDate && checkIn > toDate) return false;
          return true;
        };
        filterFn.isWaitlistFilter = true;
        $.fn.dataTable.ext.search.push(filterFn);

        // Column filters
        tableRef.current.columns().search('');
        if (filters.status) tableRef.current.column(5).search(filters.status);

        tableRef.current.draw();
      };

      const clearFilters = () => {
        setFilters({ status: '', dateFrom: '', dateTo: '' });
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn.isWaitlistFilter);
        if (tableRef.current) tableRef.current.columns().search('').draw();
      };

      useEffect(() => {
        if (tableRef.current && waitlist.length > 0) applyFilters();
      }, [filters]);

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-clock"></i> Waitlist</h2>
            <button className="btn btn-primary" onClick={loadWaitlist}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {/* Filters Section */}
          {!loading && waitlist.length > 0 && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-calendar-alt"></i> Check-In From</label>
                  <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({...filters, dateFrom: e.target.value})} className="filter-input" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-calendar-alt"></i> Check-In To</label>
                  <input type="date" value={filters.dateTo} onChange={(e) => setFilters({...filters, dateTo: e.target.value})} className="filter-input" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-check-circle"></i> Status</label>
                  <select value={filters.status} onChange={(e) => setFilters({...filters, status: e.target.value})} className="filter-input">
                    <option value="">All Status</option>
                    <option value="Waiting">Waiting</option>

    // ============================================
    // USERS VIEW
    // ============================================
    function UsersView() {
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [users, setUsers] = useState([]);
      const [filters, setFilters] = useState({ role: '' });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);

      useEffect(() => {
        loadUsers();
        // Real-time polling every 30 seconds
        intervalRef.current = setInterval(() => loadUsers(true), 30000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadUsers = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            const data = result.error ? [] : result;
            setUsers(data);
            if (!silent || !tableRef.current) initDataTable(data);
          })
          .withFailureHandler(() => setLoading(false))
          .getAllUsers();
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#usersTable').empty(); }
        setTimeout(() => {
          tableRef.current = $('#usersTable').DataTable({
            data: data,
            columns: [
              { data: 'username', title: 'Username' },
              { data: 'fullName', title: 'Full Name', render: d => d || '-' },
              { data: 'password', title: 'Password' },
              { data: 'role', title: 'Role', render: d => `<span class="role-badge role-${d}" style="background:${d === 'admin' ? '#001f3f' : d === 'FoodStaff' ? '#ff9800' : d === 'Cleaner' ? '#9c27b0' : '#34a853'};color:white;padding:4px 10px;border-radius:3px">${d}</span>` },
              { data: 'assignedRooms', title: 'Assigned Rooms', render: d => d ? `<span style="background:#e3f2fd;color:#1565c0;padding:4px 8px;border-radius:3px;font-size:12px">${d}</span>` : '-' },
              { data: null, title: 'Actions', orderable: false, render: () => `<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>` }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[0, 'asc']]
          });

          $('#usersTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const action = $(this).data('action');
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            if (action === 'edit') { setEditingUser(rowData); setShowModal(true); }
            else {
              Swal.fire({ icon: 'warning', title: 'Delete?', showCancelButton: true, confirmButtonColor: '#ea4335' }).then((result) => {
                if (result.isConfirmed) {
                  google.script.run.withSuccessHandler((res) => { if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000 }); loadUsers(); } }).deleteUser(rowData.rowIndex);
                }
              });
            }
          });
        }, 150);
      };

      const applyFilters = () => {
        if (!tableRef.current) return;
        tableRef.current.columns().search('');
        if (filters.role) tableRef.current.column(3).search(filters.role);
        tableRef.current.draw();
      };

      const clearFilters = () => {
        setFilters({ role: '' });
        if (tableRef.current) tableRef.current.columns().search('').draw();
      };

      useEffect(() => {
        if (tableRef.current && users.length > 0) applyFilters();
      }, [filters]);

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-users"></i> Users</h2>
            <button className="btn btn-success" onClick={() => { setEditingUser(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add User</button>
          </div>

          {/* Filters Section */}
          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-user-tag"></i> Role</label>
                  <select value={filters.role} onChange={(e) => setFilters({...filters, role: e.target.value})} className="filter-input">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="FoodStaff">Food Staff</option>
                    <option value="Cleaner">Cleaner</option>
                    <option value="user">User</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={5} columns={6} />}
          <div style={{ display: loading ? 'none' : 'block' }}><table id="usersTable" className="display" style={{width: '100%'}}></table></div>
          {showModal && <UserModal user={editingUser} onClose={() => { setShowModal(false); setEditingUser(null); }} onSave={() => { setShowModal(false); setEditingUser(null); loadUsers(); }} />}
        </div>
      );
    }

    function UserModal({ user, onClose, onSave }) {
      const [formData, setFormData] = useState({
        username: user?.username || '',
        password: user?.password || '',
        role: user?.role || 'user',
        assignedRooms: user?.assignedRooms || '',
        fullName: user?.fullName || ''
      });
      const [saving, setSaving] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.username || !formData.password) { Swal.fire({ icon: 'warning', text: 'All fields required' }); return; }
        if ((formData.role === 'FoodStaff' || formData.role === 'Cleaner') && !formData.assignedRooms.trim()) {
          Swal.fire({ icon: 'warning', text: `Please assign rooms for ${formData.role} (e.g., 101,102,103)` }); return;
        }
        setSaving(true);

        if (user) {
          google.script.run.withSuccessHandler((res) => { setSaving(false); if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000 }); onSave(); } else Swal.fire({ icon: 'error', text: res.message }); }).updateUser(user.rowIndex, formData.password, formData.role, formData.assignedRooms, formData.fullName);
        } else {
          google.script.run.withSuccessHandler((res) => { setSaving(false); if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000 }); onSave(); } else Swal.fire({ icon: 'error', text: res.message }); }).addUser(formData.username, formData.password, formData.role, formData.assignedRooms, formData.fullName);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 500}}>
            <div className="modal-header"><h3><i className="fas fa-user"></i> {user ? 'Edit' : 'Add'} User</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-group"><label>Username (Email) *</label><input type="email" value={formData.username} onChange={(e) => setFormData({...formData, username: e.target.value})} disabled={!!user} required /></div>
                <div className="form-group"><label>Password *</label><input type="text" value={formData.password} onChange={(e) => setFormData({...formData, password: e.target.value})} required /></div>
                <div className="form-group"><label>Full Name</label><input type="text" value={formData.fullName} onChange={(e) => setFormData({...formData, fullName: e.target.value})} placeholder="Enter full name" /></div>
                <div className="form-group"><label>Role</label><select value={formData.role} onChange={(e) => setFormData({...formData, role: e.target.value})}><option value="user">User</option><option value="FoodStaff">Food Staff</option><option value="Cleaner">Cleaner</option><option value="admin">Admin</option></select></div>
                {(formData.role === 'FoodStaff' || formData.role === 'Cleaner') && (
                  <div className="form-group">
                    <label>Assigned Rooms * <small style={{color: '#666', fontWeight: 'normal'}}>(comma-separated)</small></label>
                    <input type="text" value={formData.assignedRooms} onChange={(e) => setFormData({...formData, assignedRooms: e.target.value})} placeholder="e.g., 101,102,103,201" required />
                    <small style={{color: '#888', display: 'block', marginTop: 5}}>Staff will only receive food orders from these rooms</small>
                  </div>
                )}
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // ACTIVITY LOGS VIEW
    // ============================================
    function LogsView() {
      const [loading, setLoading] = useState(true);
      const [logs, setLogs] = useState([]);
      const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', user: '', action: '' });
      const [uniqueUsers, setUniqueUsers] = useState([]);
      const [uniqueActions, setUniqueActions] = useState([]);
      const tableRef = useRef(null);

      useEffect(() => { loadLogs(); return () => { if (tableRef.current) tableRef.current.destroy(); }; }, []);

      const loadLogs = () => {
        setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            const data = result.error ? [] : result;
            setLogs(data);
            const users = [...new Set(data.map(l => l.User).filter(Boolean))].sort();
            const actions = [...new Set(data.map(l => l.Action).filter(Boolean))].sort();
            setUniqueUsers(users);
            setUniqueActions(actions);
            initDataTable(data);
          })
          .withFailureHandler(() => { setLoading(false); setLogs([]); })
          .getActivityLogs(500);
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#logsTable').empty(); }
        setTimeout(() => {
          tableRef.current = $('#logsTable').DataTable({
            data: data,
            columns: [
              { data: 'Timestamp', title: 'Timestamp', render: d => formatDateTime(d) },
              { data: 'User', title: 'User' },
              { data: 'Action', title: 'Action', render: d => `<span class="status-badge" style="background:#e0e0e0;color:#333">${d}</span>` },
              { data: 'Details', title: 'Details' }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV' },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF' },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print' }
            ],
            order: [[0, 'desc']]
          });
        }, 150);
      };

      const applyFilters = () => {
        if (!tableRef.current) return;
        // Clear previous custom search
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn.isLogsFilter);

        // Date range filter
        const filterFn = function(settings, data, dataIndex) {
          if (settings.nTable.id !== 'logsTable') return true;
          const log = logs[dataIndex];
          if (!log) return true;

          const logDate = new Date(log.Timestamp);
          const fromDate = (filters.dateFrom && filters.dateFrom.trim()) ? new Date(filters.dateFrom) : null;
          const toDate = (filters.dateTo && filters.dateTo.trim()) ? new Date(filters.dateTo + 'T23:59:59') : null;

          if (fromDate && logDate < fromDate) return false;
          if (toDate && logDate > toDate) return false;
          return true;
        };
        filterFn.isLogsFilter = true;
        $.fn.dataTable.ext.search.push(filterFn);

        // Column filters
        tableRef.current.columns().search('');
        if (filters.user) tableRef.current.column(1).search(filters.user);
        if (filters.action) tableRef.current.column(2).search(filters.action);

        tableRef.current.draw();
      };

      const clearFilters = () => {
        setFilters({ dateFrom: '', dateTo: '', user: '', action: '' });
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn.isLogsFilter);
        if (tableRef.current) tableRef.current.columns().search('').draw();
      };

      useEffect(() => {
        if (tableRef.current && logs.length > 0) applyFilters();
      }, [filters]);

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-history"></i> Activity Logs</h2>
            <button className="btn btn-primary" onClick={loadLogs}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {/* Filters Section */}
          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-calendar-alt"></i> Date From</label>
                  <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({...filters, dateFrom: e.target.value})} className="filter-input" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-calendar-alt"></i> Date To</label>
                  <input type="date" value={filters.dateTo} onChange={(e) => setFilters({...filters, dateTo: e.target.value})} className="filter-input" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-user"></i> User</label>
                  <select value={filters.user} onChange={(e) => setFilters({...filters, user: e.target.value})} className="filter-input">
                    <option value="">All Users</option>
                    {uniqueUsers.map(u => <option key={u} value={u}>{u}</option>)}
                  </select>
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-bolt"></i> Action</label>
                  <select value={filters.action} onChange={(e) => setFilters({...filters, action: e.target.value})} className="filter-input">
                    <option value="">All Actions</option>
                    {uniqueActions.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={10} columns={4} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="logsTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>
      );
    }

    // ============================================
    // PAYMENT METHODS VIEW
    // ============================================
    function PaymentMethodsView() {
      const [loading, setLoading] = useState(true);
      const [methods, setMethods] = useState([]);
      const [stats, setStats] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [editingMethod, setEditingMethod] = useState(null);
      const [filters, setFilters] = useState({ status: '' });
      const tableRef = useRef(null);

      useEffect(() => { loadData(); return () => { if (tableRef.current) tableRef.current.destroy(); }; }, []);

      const loadData = () => {
        setLoading(true);
        Promise.all([
          new Promise((resolve) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(() => resolve([])).getPaymentMethods();
          }),
          new Promise((resolve) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(() => resolve(null)).getTransactionStats();
          })
        ]).then(([methodsResult, statsResult]) => {
          const data = methodsResult.error ? [] : methodsResult;
          setMethods(data);
          setStats(statsResult?.error ? null : statsResult);
          setLoading(false);
          initDataTable(data, statsResult?.error ? null : statsResult);
        });
      };

      const initDataTable = (data, statsData) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#paymentMethodsTable').empty(); }
        if (data.length === 0) return;

        // Add stats to data for display
        const enrichedData = data.map(m => {
          const methodStats = statsData?.byMethod?.[m.name] || { count: 0, amount: 0 };
          return { ...m, txnCount: methodStats.count, txnAmount: methodStats.amount };
        });

        setTimeout(() => {
          tableRef.current = $('#paymentMethodsTable').DataTable({
            data: enrichedData,
            columns: [
              { data: 'name', title: 'Method Name', render: d => `<i class="fas fa-credit-card" style="margin-right:8px;color:var(--navy-accent)"></i><strong>${d}</strong>` },
              { data: 'description', title: 'Description', render: d => d || '-' },
              { data: null, title: 'Bank Details', render: (d, t, row) => {
                if (!row.bankName && !row.accountNo) return '<span style="color:#999">-</span>';
                let html = '';
                if (row.bankName) html += `<div style="font-weight:600;color:var(--navy-primary)">${row.bankName}</div>`;
                if (row.accountName) html += `<div style="font-size:12px;color:#666">${row.accountName}</div>`;
                if (row.accountNo) html += `<div style="font-size:12px;color:#888"><i class="fas fa-hashtag"></i> ${row.accountNo}</div>`;
                return html;
              }},
              { data: 'qrCode', title: 'QR Code', className: 'text-center', render: d => d ? `<img src="${d}" style="width:40px;height:40px;object-fit:contain;border:1px solid #ddd;border-radius:4px;cursor:pointer" onclick="Swal.fire({imageUrl:'${d}',imageWidth:300,imageHeight:300,showConfirmButton:false})" />` : '<span style="color:#999">-</span>' },
              { data: 'status', title: 'Status', render: d => `<span class="status-badge ${d === 'Active' ? 'status-active' : 'status-booked'}">${d}</span>` },
              { data: 'txnCount', title: 'Transactions', className: 'text-center' },
              { data: 'txnAmount', title: 'Total Amount', render: d => `<strong style="color:var(--success)">$${(d || 0).toFixed(2)}</strong>`, className: 'text-right' },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => `
                <button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button>
                <button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>
              ` }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,2,4,5,6] } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,2,4,5,6] } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,4,5,6] } }

            order: [[0, 'asc']]

          $('#paymentMethodsTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const action = $(this).data('action');
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            if (action === 'edit') { setEditingMethod(rowData); setShowModal(true); }
            else handleDelete(rowData);
          });
        }, 150);
      };

      const handleDelete = (method) => {
        Swal.fire({
          icon: 'warning', title: 'Delete?', text: `Delete payment method "${method.name}"?`,
          showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => { if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); loadData(); } else Swal.fire({ icon: 'error', text: res.message }); })
              .deletePaymentMethod(method.rowIndex);
          }
        });

      const applyFilters = () => {
        if (!tableRef.current) return;
        tableRef.current.columns().search('');
        if (filters.status) tableRef.current.column(4).search(filters.status);
        tableRef.current.draw();

        if (tableRef.current) tableRef.current.columns().search('').draw();

        if (tableRef.current && methods.length > 0) applyFilters();

      return (

          <div className="section-header">
            <h2><i className="fas fa-credit-card"></i> Payment Methods</h2>

              <i className="fas fa-plus"></i> Add Method
            </button>

          {stats && (
            <div className="dashboard-grid-3" style={{marginBottom: 20}}>
              <div className="stat-card">
                <div className="stat-card-icon"><i className="fas fa-receipt"></i></div>
                <div className="stat-card-value">{stats.totalCount || 0}</div>
                <div className="stat-card-label">Total Transactions</div>

              <div className="stat-card">
                <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #34a853, #4ade80)'}}><i className="fas fa-dollar-sign"></i></div>
                <div className="stat-card-value">${(stats.totalAmount || 0).toFixed(2)}</div>
                <div className="stat-card-label">Total Amount</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #fbbc04, #fde047)'}}><i className="fas fa-list"></i></div>
                <div className="stat-card-value">{methods.length}</div>
                <div className="stat-card-label">Payment Methods</div>
              </div>
            </div>
          )}

          {/* Filters Section */}
          {!loading && methods.length > 0 && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>

              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-check-circle"></i> Status</label>

                    <option value="Active">Active</option>

                </div>
              </div>

          {loading ? <TableSkeleton rows={5} columns={6} /> : methods.length === 0 ? (
            <div style={{textAlign: 'center', padding: 40}}><i className="fas fa-credit-card" style={{fontSize: '3rem', color: '#ccc'}}></i><p style={{marginTop: 15, color: '#666'}}>No payment methods found</p></div>

            <div style={{ display: 'block' }}>
              <table id="paymentMethodsTable" className="display" style={{width: '100%'}}></table>

            <PaymentMethodModal
              method={editingMethod}
              onClose={() => { setShowModal(false); setEditingMethod(null); }}
              onSave={() => { setShowModal(false); setEditingMethod(null); loadData(); }}
            />
          )}
        </div>
      );
    }

    function PaymentMethodModal({ method, onClose, onSave }) {
      const [formData, setFormData] = useState({
        name: method?.name || '',
        description: method?.description || '',
        accountName: method?.accountName || '',
        bankName: method?.bankName || '',
        accountNo: method?.accountNo || '',
        status: method?.status || 'Active'
      });
      const [saving, setSaving] = useState(false);
      const [qrCodeFile, setQrCodeFile] = useState(null);
      const [qrCodePreview, setQrCodePreview] = useState(method?.qrCode || '');

      const handleQrCodeChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            Swal.fire({ icon: 'warning', text: 'QR code image must be less than 5MB' });
            return;
          }
          setQrCodeFile(file);
          const reader = new FileReader();
          reader.onload = (ev) => setQrCodePreview(ev.target.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) { Swal.fire({ icon: 'warning', text: 'Method name is required' }); return; }

        setSaving(true);

        const processAndSave = (qrBase64, qrFileName, qrMimeType) => {
          if (method) {
            google.script.run
              .withSuccessHandler((res) => { setSaving(false); if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); onSave(); } else Swal.fire({ icon: 'error', text: res.message }); })
              .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
              .updatePaymentMethod(method.rowIndex, formData.name, formData.description, formData.accountName, formData.bankName, formData.accountNo, qrBase64, qrFileName, qrMimeType, formData.status);
          } else {
            google.script.run
              .withSuccessHandler((res) => { setSaving(false); if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); onSave(); } else Swal.fire({ icon: 'error', text: res.message }); })
              .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
              .addPaymentMethod(formData.name, formData.description, formData.accountName, formData.bankName, formData.accountNo, qrBase64, qrFileName, qrMimeType);
          }
        };

        if (qrCodeFile) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const base64 = ev.target.result.split(',')[1];
            processAndSave(base64, qrCodeFile.name, qrCodeFile.type);
          };
          reader.readAsDataURL(qrCodeFile);
        } else {
          processAndSave(null, null, null);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{maxWidth: 600}} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-credit-card"></i> {method ? 'Edit' : 'Add'} Payment Method</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <div className="form-group">
                    <label>Method Name *</label>
                    <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} placeholder="e.g., Cash, Card, JazzCash" required />
                  </div>
                  <div className="form-group">
                    <label>Description</label>
                    <input type="text" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} placeholder="Optional description" />
                  </div>
                </div>

                <div style={{background: '#f8f9fa', padding: 15, borderRadius: 4, marginBottom: 20, border: '1px solid #e9ecef'}}>
                  <h4 style={{marginBottom: 15, color: 'var(--navy-primary)', fontSize: 14}}><i className="fas fa-university"></i> Bank/Account Details (Optional)</h4>
                  <div className="form-grid">
                    <div className="form-group" style={{marginBottom: 10}}>
                      <label>Account Holder Name</label>
                      <input type="text" value={formData.accountName} onChange={(e) => setFormData({...formData, accountName: e.target.value})} placeholder="e.g., Your Hotel" />
                    </div>
                    <div className="form-group" style={{marginBottom: 10}}>
                      <label>Bank/Service Name</label>
                      <input type="text" value={formData.bankName} onChange={(e) => setFormData({...formData, bankName: e.target.value})} placeholder="e.g., National Bank, JazzCash" />
                    </div>
                    <div className="form-group" style={{marginBottom: 10}}>
                      <label>Account/Mobile Number</label>
                      <input type="text" value={formData.accountNo} onChange={(e) => setFormData({...formData, accountNo: e.target.value})} placeholder="e.g., 1234567890" />
                    </div>
                  </div>
                </div>

                <div className="form-group">
                  <label><i className="fas fa-qrcode"></i> QR Code (Optional)</label>
                  <input type="file" accept="image/*" onChange={handleQrCodeChange} style={{marginBottom: 10}} />
                  {qrCodePreview && (
                    <div style={{textAlign: 'center', marginTop: 10}}>
                      <img src={qrCodePreview} alt="QR Code" style={{maxWidth: 150, maxHeight: 150, border: '2px solid #ddd', borderRadius: 8, padding: 5}} />
                      <button type="button" className="btn btn-secondary btn-sm" style={{display: 'block', margin: '10px auto 0'}} onClick={() => { setQrCodeFile(null); setQrCodePreview(''); }}>
                        <i className="fas fa-trash"></i> Remove
                      </button>
                    </div>
                  )}
                </div>

                {method && (
                  <div className="form-group">
                    <label>Status</label>
                    <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})}>
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive</option>
                    </select>
                  </div>
                )}
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}
                  </button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // TRANSACTIONS VIEW
    // ============================================
    function TransactionsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [transactions, setTransactions] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingTransaction, setEditingTransaction] = useState(null);
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', paymentMethod: '' });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);

      useEffect(() => {
        loadPaymentMethods();
        loadBookings();
        loadTransactions();
        // Real-time polling every 15 seconds
        intervalRef.current = setInterval(() => loadTransactions(true), 15000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadPaymentMethods = () => {
        google.script.run.withSuccessHandler((result) => { if (!result.error) setPaymentMethods(result.filter(m => m.status === 'Active')); }).getPaymentMethods();
      };

      const loadBookings = () => {
        google.script.run.withSuccessHandler((result) => { if (!result.error) setBookings(result); }).getBookingsForDropdown();
      };

      const loadTransactions = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            const data = result.error ? [] : result;
            setTransactions(data);
            if (!silent || !tableRef.current) initDataTable(data);
          })
          .withFailureHandler(() => { setLoading(false); setTransactions([]); })
          .getTransactions(filters.dateFrom || null, filters.dateTo || null);
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#transactionsTable').empty(); }
        setTimeout(() => {
          tableRef.current = $('#transactionsTable').DataTable({
            data: data,
            columns: [
              { data: 'txnId', title: 'Transaction ID' },
              { data: 'createdAt', title: 'Date & Time (ISO)', render: d => d || '-' },
              { data: 'ticketId', title: 'Booking', render: d => d || '-' },
              { data: 'guestName', title: 'Guest', render: d => d || '-' },
              { data: 'roomNo', title: 'Room', render: d => d || '-' },
              { data: 'paymentMethod', title: 'Method', render: d => `<span class="status-badge" style="background:#e3f2fd;color:#1565c0">${d}</span>` },
              { data: 'type', title: 'Type' },
              { data: 'amount', title: 'Amount', render: d => `<strong style="color:var(--success)">$${parseFloat(d).toFixed(2)}</strong>` },
              { data: 'createdBy', title: 'By', render: d => d ? d.split('@')[0] : '-' },
              { data: null, title: 'Actions', orderable: false, render: () => `
                <button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>
                <button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>
              ` }
            ],
            pageLength: 10,
            lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ],
            order: [[1, 'desc'], [0, 'desc']]
          });

          $('#transactionsTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') {
              setEditingTransaction(rowData);
              setShowModal(true);
            } else if (action === 'delete') {
              handleDelete(rowData);
            }
          });
        }, 150);
      };

      const handleDelete = (txn) => {
        Swal.fire({
          icon: 'warning', title: 'Delete Transaction?', text: `Delete transaction ${txn.txnId}?`,
          showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => { if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 1500 }); loadTransactions(); } else Swal.fire({ icon: 'error', text: res.message }); })
              .deleteTransaction(txn.date, txn.txnId);
          }
        });
      };

      const applyFilters = () => { loadTransactions(); };
      const clearFilters = () => { setFilters({ dateFrom: '', dateTo: '', paymentMethod: '' }); setTimeout(loadTransactions, 100); };

      // Calculate totals by payment method
      const methodTotals = {};
      let grandTotal = 0;
      transactions.forEach(t => {
        const method = t.paymentMethod || 'Unknown';
        if (!methodTotals[method]) methodTotals[method] = { count: 0, amount: 0 };
        methodTotals[method].count++;
        methodTotals[method].amount += parseFloat(t.amount) || 0;
        grandTotal += parseFloat(t.amount) || 0;
      });

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-money-bill-wave"></i> Transactions</h2>
            <button className="btn btn-success" onClick={() => { setEditingTransaction(null); setShowModal(true); }}>
              <i className="fas fa-plus"></i> Add Transaction
            </button>
          </div>

          {/* Summary Cards */}
          <div style={{display: 'flex', flexWrap: 'wrap', gap: 15, marginBottom: 20}}>
            <div style={{background: 'linear-gradient(135deg, var(--navy-primary), var(--navy-light))', color: 'white', padding: '15px 25px', borderRadius: 4, minWidth: 150}}>
              <div style={{fontSize: 12, opacity: 0.8}}>TOTAL</div>
              <div style={{fontSize: 24, fontWeight: 700}}>${grandTotal.toFixed(2)}</div>
              <div style={{fontSize: 12}}>{transactions.length} transactions</div>
            </div>
            {Object.entries(methodTotals).map(([method, data]) => (
              <div key={method} style={{background: '#f8f9fa', padding: '15px 25px', borderRadius: 4, borderLeft: '4px solid var(--navy-accent)', minWidth: 130}}>
                <div style={{fontSize: 12, color: '#666'}}>{method.toUpperCase()}</div>
                <div style={{fontSize: 20, fontWeight: 700, color: 'var(--success)'}}>${data.amount.toFixed(2)}</div>
                <div style={{fontSize: 12, color: '#999'}}>{data.count} txns</div>
              </div>
            ))}
          </div>

          {/* Filters Section */}
          <div className="filters-section">
            <div className="filters-header">
              <h3><i className="fas fa-filter"></i> Filters</h3>
              <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
            </div>
            <div className="filters-grid">
              <div className="filter-group">
                <label><i className="fas fa-calendar-alt"></i> Date From</label>
                <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({...filters, dateFrom: e.target.value})} className="filter-input" />
              </div>
              <div className="filter-group">
                <label><i className="fas fa-calendar-alt"></i> Date To</label>
                <input type="date" value={filters.dateTo} onChange={(e) => setFilters({...filters, dateTo: e.target.value})} className="filter-input" />
              </div>
              <div className="filter-group">
                <label><i className="fas fa-credit-card"></i> Payment Method</label>
                <select value={filters.paymentMethod} onChange={(e) => setFilters({...filters, paymentMethod: e.target.value})} className="filter-input">
                  <option value="">All Methods</option>
                  {paymentMethods.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                </select>
              </div>
              <div className="filter-group" style={{display: 'flex', alignItems: 'flex-end'}}>
                <button className="btn btn-primary" onClick={applyFilters}><i className="fas fa-search"></i> Apply</button>
              </div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={10} /> : (
            <div style={{ display: 'block' }}>
              <table id="transactionsTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && (
            <TransactionModal
              transaction={editingTransaction}
              paymentMethods={paymentMethods}
              bookings={bookings}
              user={user}
              onClose={() => { setShowModal(false); setEditingTransaction(null); }}
              onSave={() => { setShowModal(false); setEditingTransaction(null); loadTransactions(); loadBookings(); }}
            />
          )}
        </div>
      );
    }

    // Searchable Dropdown Component
    function SearchableDropdown({ options, value, onChange, placeholder, renderOption, displayKey }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false);
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredOptions = options.filter(opt => {
        const searchLower = searchTerm.toLowerCase();
        return (opt.guestName?.toLowerCase().includes(searchLower) ||
                opt.ticketId?.toLowerCase().includes(searchLower) ||
                opt.roomNo?.toLowerCase().includes(searchLower) ||
                opt.phone?.toLowerCase().includes(searchLower));
      });

      const selectedOption = options.find(opt => opt[displayKey] === value);

      return (
        <div className={`searchable-dropdown ${isOpen ? 'open' : ''}`} ref={dropdownRef}>
          <input
            type="text"
            className="searchable-dropdown-input"
            value={selectedOption ? selectedOption.displayText : ''}
            onClick={() => setIsOpen(!isOpen)}
            placeholder={placeholder}
            readOnly
          />
          <i className="fas fa-chevron-down searchable-dropdown-icon"></i>
          {value && (
            <button type="button" className="searchable-dropdown-clear" onClick={(e) => { e.stopPropagation(); onChange(null); setSearchTerm(''); }}>
              <i className="fas fa-times"></i>
            </button>
          )}
          <div className="searchable-dropdown-menu">
            <div className="searchable-dropdown-search">
              <input
                type="text"
                placeholder="Search by guest, ticket, room, or phone..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                onClick={(e) => e.stopPropagation()}
              />
            </div>
            {filteredOptions.length === 0 ? (
              <div className="searchable-dropdown-empty">
                <i className="fas fa-search"></i> No bookings found
              </div>
            ) : (
              filteredOptions.slice(0, 50).map(opt => (
                <div
                  key={opt.ticketId}
                  className={`searchable-dropdown-item ${value === opt[displayKey] ? 'selected' : ''}`}
                  onClick={() => { onChange(opt); setIsOpen(false); setSearchTerm(''); }}
                >
                  {renderOption ? renderOption(opt) : (
                    <>
                      <div className="searchable-dropdown-item-main">
                        <i className="fas fa-user" style={{marginRight: 8, color: 'var(--navy-accent)'}}></i>
                        {opt.guestName} - Room {opt.roomNo}
                      </div>
                      <div className="searchable-dropdown-item-sub">
                        <span style={{marginRight: 15}}><i className="fas fa-ticket-alt"></i> {opt.ticketId}</span>
                        <span style={{marginRight: 15}}><i className="fas fa-phone"></i> {opt.phone || 'N/A'}</span>
                        <span><i className="fas fa-calendar"></i> {formatDate(opt.checkIn)}</span>
                      </div>
                      <div className="searchable-dropdown-item-sub">
                        <span className={`status-badge status-${opt.paymentStatus?.toLowerCase().replace(' ', '-')}`} style={{fontSize: 10, padding: '2px 8px'}}>
                          {opt.paymentStatus}
                        </span>
                        <span style={{marginLeft: 10, color: opt.balance > 0 ? 'var(--danger)' : 'var(--success)'}}>
                          Balance: ${opt.balance?.toFixed(2) || '0.00'}
                        </span>
                      </div>
                    </>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function TransactionModal({ transaction, paymentMethods, bookings, user, onClose, onSave }) {
      const isEditing = !!transaction;
      const [formData, setFormData] = useState({
        ticketId: transaction?.ticketId || '',
        guestName: transaction?.guestName || '',
        roomNo: transaction?.roomNo || '',
        amount: transaction?.amount || '',
        paymentMethod: transaction?.paymentMethod || (paymentMethods[0]?.name || 'Cash'),
        type: transaction?.type || 'Payment',
        notes: transaction?.notes || ''
      });
      const [selectedBooking, setSelectedBooking] = useState(null);
      const [saving, setSaving] = useState(false);

      // Set initial selected booking if editing and has ticketId
      useEffect(() => {
        if (isEditing && transaction.ticketId) {
          const booking = bookings.find(b => b.ticketId === transaction.ticketId);
          if (booking) setSelectedBooking(booking);
        }
      }, [isEditing, transaction, bookings]);

      const handleBookingSelect = (booking) => {
        setSelectedBooking(booking);
        if (booking) {
          setFormData({
            ...formData,
            ticketId: booking.ticketId,
            guestName: booking.guestName,
            roomNo: booking.roomNo
          });
        } else {
          setFormData({
            ...formData,
            ticketId: '',
            guestName: '',
            roomNo: ''
          });
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.amount || parseFloat(formData.amount) <= 0) {
          Swal.fire({ icon: 'warning', text: 'Enter a valid amount' });
          return;
        }

        setSaving(true);

        if (isEditing) {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Transaction Updated!', timer: 2000, showConfirmButton: false });
                onSave();
              } else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .updateTransaction(transaction.date, transaction.txnId, formData, user);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Transaction Added!', text: `Transaction ID: ${res.txnId}`, timer: 2000, showConfirmButton: false });
                onSave();
              } else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .addTransaction(formData, user);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{maxWidth: 650}} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className={`fas ${isEditing ? 'fa-edit' : 'fa-plus-circle'}`}></i> {isEditing ? 'Edit' : 'Add'} Transaction</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                {/* Booking Selection - Searchable Dropdown */}
                <div className="form-group">
                  <label><i className="fas fa-link" style={{marginRight: 6}}></i> Link to Booking (Optional)</label>
                  <SearchableDropdown
                    options={bookings}
                    value={selectedBooking?.ticketId}
                    onChange={handleBookingSelect}
                    placeholder="Search guest, ticket ID, room, or phone..."
                    displayKey="ticketId"
                  />
                  {selectedBooking && (
                    <div style={{marginTop: 10, padding: 12, background: '#f8f9fa', borderRadius: 4, borderLeft: '4px solid var(--navy-accent)'}}>
                      <div style={{fontWeight: 600, color: 'var(--navy-primary)', marginBottom: 5}}>
                        <i className="fas fa-info-circle" style={{marginRight: 6}}></i> Booking Details
                      </div>
                      <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, fontSize: 13}}>
                        <div><strong>Guest:</strong> {selectedBooking.guestName}</div>
                        <div><strong>Room:</strong> {selectedBooking.roomNo}</div>
                        <div><strong>Total:</strong> ${selectedBooking.totalAmount?.toFixed(2)}</div>
                        <div><strong>Paid:</strong> ${selectedBooking.paidAmount?.toFixed(2)}</div>
                        <div style={{gridColumn: 'span 2'}}>
                          <strong>Balance Due:</strong>
                          <span style={{color: selectedBooking.balance > 0 ? 'var(--danger)' : 'var(--success)', fontWeight: 600, marginLeft: 5}}>
                            ${selectedBooking.balance?.toFixed(2)}
                          </span>
                          {selectedBooking.balance > 0 && (
                            <button type="button" className="btn btn-sm" style={{marginLeft: 10, padding: '3px 10px', fontSize: 11}}
                              onClick={() => setFormData({...formData, amount: selectedBooking.balance.toFixed(2), type: 'Full Payment'})}>
                              Pay Full Balance
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="form-grid">
                  <div className="form-group">
                    <label>Amount *</label>
                    <input type="number" step="0.01" min="0" value={formData.amount}
                      onChange={(e) => setFormData({...formData, amount: e.target.value})} placeholder="0.00" required />
                  </div>
                  <div className="form-group">
                    <label>Payment Method *</label>
                    <select value={formData.paymentMethod} onChange={(e) => setFormData({...formData, paymentMethod: e.target.value})}>
                      {paymentMethods.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}

    function UserBookRoomView({ user }) {
      const [formData, setFormData] = useState({
        guestName: '', phone: '', email: user, city: '',
        maritalStatus: 'Married', occupancyType: 'Single', familyDetails: '',
        discount: '0', tax: '0', paymentMethod: 'Cash',
        roomNo: '', checkIn: '', checkOut: '',
        specialRequests: '', earlyCheckin: 'No', lateCheckout: 'No'
      });
      const [saving, setSaving] = useState(false);
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      const [paymentMethods, setPaymentMethods] = useState([]);
      const [loadingMethods, setLoadingMethods] = useState(true);
      const [selectedPaymentMethod, setSelectedPaymentMethod] = useState(null);
      const [paymentScreenshot, setPaymentScreenshot] = useState(null);
      const [screenshotPreview, setScreenshotPreview] = useState('');

      useEffect(() => {
        google.script.run.withSuccessHandler((result) => { setLoadingRooms(false); setRooms(result || []); }).getAvailableRoomNumbers();
        google.script.run.withSuccessHandler((result) => {
          setLoadingMethods(false);
          const methods = result?.error ? [] : (result || []);
          setPaymentMethods(methods);
          if (methods.length > 0) {
            setFormData(prev => ({...prev, paymentMethod: methods[0].name}));
            setSelectedPaymentMethod(methods[0]);
          }
        }).getActivePaymentMethods();
      }, []);

      const handlePaymentMethodChange = (methodName) => {
        setFormData({...formData, paymentMethod: methodName});
        const method = paymentMethods.find(m => m.name === methodName);
        setSelectedPaymentMethod(method || null);
      };

      const handleScreenshotChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            Swal.fire({ icon: 'warning', text: 'Screenshot must be less than 5MB' });
            return;
          }
          setPaymentScreenshot(file);
          const reader = new FileReader();
          reader.onload = (ev) => setScreenshotPreview(ev.target.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.roomNo) { Swal.fire({ icon: 'warning', text: 'Select a room' }); return; }
        if (!formData.checkIn || !formData.checkOut) { Swal.fire({ icon: 'warning', text: 'Select dates' }); return; }
        if (new Date(formData.checkOut) <= new Date(formData.checkIn)) { Swal.fire({ icon: 'warning', text: 'Check-out must be after check-in' }); return; }

        setSaving(true);

        const submitBooking = (screenshotData, screenshotExt, screenshotMime) => {
          const bookingData = {
            ...formData,
            paymentScreenshotData: screenshotData,
            paymentScreenshotExt: screenshotExt,
            paymentScreenshotMime: screenshotMime
          };
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Request Submitted!', html: '<p>' + res.message + '</p><p style="color:#666;font-size:13px;margin-top:10px">Your booking is pending admin approval. You will receive an email notification once it is approved.</p>' });
                setFormData({ ...formData, guestName: '', phone: '', city: '', familyDetails: '', roomNo: '', checkIn: '', checkOut: '', specialRequests: '' });
                setPaymentScreenshot(null);
                setScreenshotPreview('');
                setLoadingRooms(true);
                google.script.run.withSuccessHandler((r) => { setLoadingRooms(false); setRooms(r || []); }).getAvailableRoomNumbers();
              } else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .bookRoom(bookingData);
        };

        if (paymentScreenshot) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const base64 = ev.target.result.split(',')[1];
            const ext = paymentScreenshot.name.split('.').pop();
            submitBooking(base64, ext, paymentScreenshot.type);
          };
          reader.readAsDataURL(paymentScreenshot);
        } else {
          submitBooking(null, null, null);
        }
      };

      const today = new Date().toISOString().split('T')[0];

      return (
