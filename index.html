    // ============================================
    // MODAL: QUOTE (Add/Edit)
    // ============================================
    function QuoteModal({ quote, user, onClose, onSave }) {
      const [formData, setFormData] = useState({
        guestName: quote?.guestName || '',
        guestEmail: quote?.guestEmail || '',
        guestPhone: quote?.guestPhone || '',
        notes: quote?.notes || '',
        validUntil: quote?.validUntil || '',
        taxRate: quote?.taxRate || 10,
        discount: quote?.discount || 0,
        status: quote?.status || 'Draft'
      });
      const [rooms, setRooms] = useState(quote?.rooms?.length > 0 ? quote.rooms.map(r => ({...r})) : [{ roomNo: '', roomType: '', rate: '', nights: 1, amount: 0 }]);
      const [services, setServices] = useState(quote?.services?.length > 0 ? quote.services.map(s => ({...s})) : [{ name: '', amount: '' }]);
      const [saving, setSaving] = useState(false);

      const roomsTotal = rooms.reduce((sum, r) => sum + ((parseFloat(r.rate) || 0) * (parseInt(r.nights) || 0)), 0);
      const servicesTotal = services.reduce((sum, s) => sum + (parseFloat(s.amount) || 0), 0);
      const subtotal = roomsTotal + servicesTotal;
      const taxAmount = subtotal * ((parseFloat(formData.taxRate) || 0) / 100);
      const totalAmount = subtotal + taxAmount - (parseFloat(formData.discount) || 0);

      const addRoom = () => setRooms([...rooms, { roomNo: '', roomType: '', rate: '', nights: 1, amount: 0 }]);
      const removeRoom = (idx) => { if (rooms.length <= 1) return; setRooms(rooms.filter((_, i) => i !== idx)); };
      const updateRoom = (idx, field, value) => { const updated = [...rooms]; updated[idx] = { ...updated[idx], [field]: value }; setRooms(updated); };

      const addService = () => setServices([...services, { name: '', amount: '' }]);
      const removeService = (idx) => { if (services.length <= 1) return; setServices(services.filter((_, i) => i !== idx)); };
      const updateService = (idx, field, value) => { const updated = [...services]; updated[idx] = { ...updated[idx], [field]: value }; setServices(updated); };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.guestName) { Swal.fire({ icon: 'warning', text: 'Guest name is required' }); return; }
        const validRooms = rooms.filter(r => r.roomNo && r.rate);
        const validServices = services.filter(s => s.name && s.amount);
        if (validRooms.length === 0 && validServices.length === 0) { Swal.fire({ icon: 'warning', text: 'Add at least one room or service' }); return; }

        setSaving(true);
        const submitRooms = validRooms.map(r => ({ roomNo: r.roomNo, roomType: r.roomType, rate: parseFloat(r.rate), nights: parseInt(r.nights) || 1, amount: (parseFloat(r.rate) || 0) * (parseInt(r.nights) || 1) }));
        const submitServices = validServices.map(s => ({ name: s.name, amount: parseFloat(s.amount) }));
        const submitData = {
          ...formData,
          rooms: submitRooms,
          services: submitServices,
          subtotal: subtotal,
          taxRate: parseFloat(formData.taxRate) || 0,
          taxAmount: taxAmount,
          discount: parseFloat(formData.discount) || 0,
          totalAmount: totalAmount
        };

        if (quote) {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .editQuote(quote.dateRowIndex, quote.quoteIndex, submitData, user);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Quote Created!', text: 'Quote ID: ' + res.quoteId, timer: 2000 }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .addQuote(submitData, user);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 700, maxHeight: '90vh', overflow: 'auto'}}>
            <div className="modal-header">
              <h3><i className="fas fa-file-invoice"></i> {quote ? 'Edit' : 'New'} Quote</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                {/* Guest Info */}
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 15}}>
                  <div className="form-group">
                    <label>Guest Name *</label>
                    <input type="text" value={formData.guestName} onChange={(e) => setFormData({...formData, guestName: e.target.value})} placeholder="Guest name" required />
                  </div>
                  <div className="form-group">
                    <label>Guest Email</label>
                    <input type="email" value={formData.guestEmail} onChange={(e) => setFormData({...formData, guestEmail: e.target.value})} placeholder="guest@email.com" />
                  </div>
                  <div className="form-group">
                    <label>Guest Phone</label>
                    <input type="text" value={formData.guestPhone} onChange={(e) => setFormData({...formData, guestPhone: e.target.value})} placeholder="+92..." />
                  </div>
                </div>

                {/* Rooms Section */}
                <div style={{marginBottom: 15}}>
                  <label style={{fontWeight: 600, marginBottom: 10, display: 'block'}}><i className="fas fa-bed" style={{marginRight: 5}}></i> Rooms</label>
                  {rooms.map((room, idx) => (

                      <input type="text" value={room.roomType} onChange={(e) => updateRoom(idx, 'roomType', e.target.value)} placeholder="Type" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="number" step="0.01" min="0" value={room.rate} onChange={(e) => updateRoom(idx, 'rate', e.target.value)} placeholder="Rate" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="number" min="1" value={room.nights} onChange={(e) => updateRoom(idx, 'nights', e.target.value)} placeholder="Nights" style={{width: 70, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <span style={{minWidth: 70, textAlign: 'right', fontWeight: 600, color: '#001f3f'}}>${((parseFloat(room.rate) || 0) * (parseInt(room.nights) || 0)).toFixed(2)}</span>

                {/* Services Section */}

                      <input type="number" step="0.01" min="0" value={svc.amount} onChange={(e) => updateService(idx, 'amount', e.target.value)} placeholder="Amount" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />

    // ============================================
    // ADMIN: INVOICES VIEW
    // ============================================
    function AdminInvoicesView({ user }) {
      const [loading, setLoading] = useState(true);
      const [invoices, setInvoices] = useState([]);
      const [stats, setStats] = useState({ unpaid: 0, paid: 0, partial: 0, totalRevenue: 0 });
      const tableRef = useRef(null);
      const intervalRef = useRef(null);
      const [showModal, setShowModal] = useState(false);
      const [editingInvoice, setEditingInvoice] = useState(null);
      const [previewInvoice, setPreviewInvoice] = useState(null);

      useEffect(() => {
        loadInvoices();
        intervalRef.current = setInterval(() => loadInvoices(true), 10000);
        return () => {
          clearInterval(intervalRef.current);
          if (tableRef.current) tableRef.current.destroy();
        };
      }, []);

      const loadInvoices = (silent = false) => {
        if (!silent) setLoading(true);
        google.script.run.withSuccessHandler((result) => {
          setLoading(false);
          const data = result.error ? [] : result;
          setInvoices(data);
          const unpaid = data.filter(i => i.status === 'Unpaid').length;
          const paid = data.filter(i => i.status === 'Paid').length;
          const partial = data.filter(i => i.status === 'Partial').length;
          const totalRevenue = data.filter(i => i.status === 'Paid').reduce((sum, i) => sum + (i.totalAmount || 0), 0);
          setStats({ unpaid, paid, partial, totalRevenue });
          if (!silent || !tableRef.current) initDataTable(data);
        }).getAllInvoices();
      };

      const handleDelete = (invoice) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Invoice?',
          text: `Delete invoice ${invoice.invoiceId} for ${invoice.guestName}?`,
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: 'Delete'
        }).then((result) => {
          if (result.isConfirmed) {
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); loadInvoices(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .deleteInvoice(invoice.dateRowIndex, invoice.invoiceIndex, user);
          }
        });
      };

      const handleEmail = (invoice) => {
        if (!invoice.guestEmail) {
          Swal.fire({ icon: 'warning', text: 'No guest email address on this invoice.' });
          return;
        }
        Swal.fire({
          icon: 'question',
          title: 'Send Invoice Email?',
          html: `<p>Send invoice <strong>${invoice.invoiceId}</strong> to <strong>${invoice.guestEmail}</strong>?</p>`,
          showCancelButton: true,
          confirmButtonColor: '#0074D9',
          confirmButtonText: 'Send Email'
        }).then((result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Sending...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            google.script.run
              .withSuccessHandler((res) => {
                if (res.success) { Swal.fire({ icon: 'success', text: 'Invoice email sent!', timer: 2000, showConfirmButton: false }); loadInvoices(); }
                else Swal.fire({ icon: 'error', text: res.message });
              })
              .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
              .sendInvoiceEmail(invoice.dateRowIndex, invoice.invoiceIndex, user);
          }
        });
      };

      const handlePrint = (invoice) => {
        setPreviewInvoice(invoice);
      };

      const initDataTable = (data) => {
        if (tableRef.current) { tableRef.current.destroy(); $('#adminInvoicesTable').empty(); }
        if (data.length === 0) return;

        setTimeout(() => {
          tableRef.current = $('#adminInvoicesTable').DataTable({
            data: data,
            columns: [
              { data: 'invoiceId', title: 'Invoice ID' },
              { data: 'quoteId', title: 'Quote Ref', render: d => d || '-' },
              { data: 'guestName', title: 'Guest', render: d => d || '-' },
              { data: 'totalAmount', title: 'Total', render: d => `<strong style="color:var(--navy-primary)">$${(d || 0).toFixed(2)}</strong>` },
              { data: 'paidAmount', title: 'Paid', render: d => `<span style="color:var(--success)">$${(d || 0).toFixed(2)}</span>` },
              { data: 'status', title: 'Status', render: d => {
                const colors = { Unpaid: '#ea4335', Paid: '#34a853', Partial: '#ff9800', Cancelled: '#6c757d' };
                return `<span style="background:${colors[d] || '#6c757d'};color:white;padding:4px 10px;border-radius:15px;font-size:12px">${d}</span>`;
              }},
              { data: 'dueDate', title: 'Due Date', render: d => d || '-' },
              { data: 'createdAt', title: 'Created', render: d => new Date(d).toLocaleString() },
              { data: null, title: 'Actions', orderable: false, render: (d, t, row) => {
                let btns = `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>`;
                btns += `<button class="action-icon" data-action="email" title="Send Email" style="color:#0074D9"><i class="fas fa-envelope"></i></button>`;
                btns += `<button class="action-icon" data-action="print" title="Print" style="color:#001f3f"><i class="fas fa-print"></i></button>`;
                btns += `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>`;
                return btns;
              }}
            ],
            pageLength: 10,
            order: [[7, 'desc']],
            responsive: true,
            dom: 'Blfrtip',
            buttons: [
              { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
              { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
            ]
          });

          $('#adminInvoicesTable').off('click', '.action-icon').on('click', '.action-icon', function() {
            const rowData = tableRef.current.row($(this).parents('tr')).data();
            const action = $(this).data('action');
            if (action === 'edit') { setEditingInvoice(rowData); setShowModal(true); }
            else if (action === 'email') handleEmail(rowData);
            else if (action === 'print') handlePrint(rowData);
            else if (action === 'delete') handleDelete(rowData);
          });
        }, 150);
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-file-invoice-dollar"></i> Invoices</h2>
            <div style={{display: 'flex', gap: 10}}>
              <button className="btn btn-success" onClick={() => { setEditingInvoice(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add Invoice</button>
              <button className="btn btn-primary" onClick={loadInvoices}><i className="fas fa-sync-alt"></i> Refresh</button>
            </div>
          </div>

          <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 15, marginBottom: 20}}>
            <div style={{background: 'linear-gradient(135deg, #ea4335, #f87171)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.unpaid}</div>
              <div style={{opacity: 0.9}}>Unpaid</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #34a853, #2d9249)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.paid}</div>
              <div style={{opacity: 0.9}}>Paid</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #ff9800, #ffc107)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>{stats.partial}</div>
              <div style={{opacity: 0.9}}>Partial</div>
            </div>
            <div style={{background: 'linear-gradient(135deg, #001f3f, #003366)', padding: 20, borderRadius: 8, color: 'white'}}>
              <div style={{fontSize: 32, fontWeight: 700}}>${stats.totalRevenue.toFixed(2)}</div>
              <div style={{opacity: 0.9}}>Total Revenue</div>
            </div>
          </div>

          {loading ? <TableSkeleton rows={8} columns={9} /> : invoices.length === 0 ? (
            <div style={{textAlign: 'center', padding: 40}}>
              <i className="fas fa-file-invoice-dollar" style={{fontSize: '3rem', color: '#ccc'}}></i>
              <p style={{marginTop: 15, color: '#666'}}>No invoices found</p>
            </div>
          ) : (
            <div style={{display: 'block'}}>
              <table id="adminInvoicesTable" className="display" style={{width: '100%'}}></table>
            </div>
          )}

          {showModal && (
            <InvoiceModal
              invoice={editingInvoice}
              user={user}
              onClose={() => { setShowModal(false); setEditingInvoice(null); }}
              onSave={() => { setShowModal(false); setEditingInvoice(null); loadInvoices(); }}
            />
          )}

          {previewInvoice && (
            <InvoicePrintPreview invoice={previewInvoice} onClose={() => setPreviewInvoice(null)} />
          )}
        </div>
      );
    }

    // ============================================
    // MODAL: INVOICE (Add/Edit)
    // ============================================
    function InvoiceModal({ invoice, user, onClose, onSave }) {
      const [formData, setFormData] = useState({
        guestName: invoice?.guestName || '',
        guestEmail: invoice?.guestEmail || '',
        guestPhone: invoice?.guestPhone || '',
        notes: invoice?.notes || '',
        dueDate: invoice?.dueDate || '',
        taxRate: invoice?.taxRate || 10,
        discount: invoice?.discount || 0,
        status: invoice?.status || 'Unpaid',
        paidAmount: invoice?.paidAmount || 0,
        paymentMethod: invoice?.paymentMethod || ''
      });
      const [rooms, setRooms] = useState(invoice?.rooms?.length > 0 ? invoice.rooms.map(r => ({...r})) : [{ roomNo: '', roomType: '', rate: '', nights: 1, amount: 0 }]);
      const [services, setServices] = useState(invoice?.services?.length > 0 ? invoice.services.map(s => ({...s})) : [{ name: '', amount: '' }]);
      const [saving, setSaving] = useState(false);

      const roomsTotal = rooms.reduce((sum, r) => sum + ((parseFloat(r.rate) || 0) * (parseInt(r.nights) || 0)), 0);
      const servicesTotal = services.reduce((sum, s) => sum + (parseFloat(s.amount) || 0), 0);
      const subtotal = roomsTotal + servicesTotal;
      const taxAmount = subtotal * ((parseFloat(formData.taxRate) || 0) / 100);
      const totalAmount = subtotal + taxAmount - (parseFloat(formData.discount) || 0);

      const addRoom = () => setRooms([...rooms, { roomNo: '', roomType: '', rate: '', nights: 1, amount: 0 }]);
      const removeRoom = (idx) => { if (rooms.length <= 1) return; setRooms(rooms.filter((_, i) => i !== idx)); };
      const updateRoom = (idx, field, value) => { const updated = [...rooms]; updated[idx] = { ...updated[idx], [field]: value }; setRooms(updated); };

      const addService = () => setServices([...services, { name: '', amount: '' }]);
      const removeService = (idx) => { if (services.length <= 1) return; setServices(services.filter((_, i) => i !== idx)); };
      const updateService = (idx, field, value) => { const updated = [...services]; updated[idx] = { ...updated[idx], [field]: value }; setServices(updated); };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.guestName) { Swal.fire({ icon: 'warning', text: 'Guest name is required' }); return; }
        const validRooms = rooms.filter(r => r.roomNo && r.rate);
        const validServices = services.filter(s => s.name && s.amount);
        if (validRooms.length === 0 && validServices.length === 0) { Swal.fire({ icon: 'warning', text: 'Add at least one room or service' }); return; }

        setSaving(true);
        const submitRooms = validRooms.map(r => ({ roomNo: r.roomNo, roomType: r.roomType, rate: parseFloat(r.rate), nights: parseInt(r.nights) || 1, amount: (parseFloat(r.rate) || 0) * (parseInt(r.nights) || 1) }));
        const submitServices = validServices.map(s => ({ name: s.name, amount: parseFloat(s.amount) }));
        const submitData = {
          ...formData,
          rooms: submitRooms,
          services: submitServices,
          subtotal: subtotal,
          taxRate: parseFloat(formData.taxRate) || 0,
          taxAmount: taxAmount,
          discount: parseFloat(formData.discount) || 0,
          totalAmount: totalAmount,
          paidAmount: parseFloat(formData.paidAmount) || 0
        };

        if (invoice) {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', text: res.message, timer: 2000, showConfirmButton: false }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .editInvoice(invoice.dateRowIndex, invoice.invoiceIndex, submitData, user);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              setSaving(false);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Invoice Created!', text: 'Invoice ID: ' + res.invoiceId, timer: 2000 }); onSave(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
            .addInvoice(submitData, user);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: 700, maxHeight: '90vh', overflow: 'auto'}}>
            <div className="modal-header">
              <h3><i className="fas fa-file-invoice-dollar"></i> {invoice ? 'Edit' : 'New'} Invoice</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                {/* Guest Info */}
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 15}}>
                  <div className="form-group">
                    <label>Guest Name *</label>
                    <input type="text" value={formData.guestName} onChange={(e) => setFormData({...formData, guestName: e.target.value})} placeholder="Guest name" required />
                  </div>
                  <div className="form-group">
                    <label>Guest Email</label>
                    <input type="email" value={formData.guestEmail} onChange={(e) => setFormData({...formData, guestEmail: e.target.value})} placeholder="guest@email.com" />
                  </div>
                  <div className="form-group">
                    <label>Guest Phone</label>
                    <input type="text" value={formData.guestPhone} onChange={(e) => setFormData({...formData, guestPhone: e.target.value})} placeholder="+92..." />
                  </div>
                </div>

                {/* Rooms Section */}
                <div style={{marginBottom: 15}}>
                  <label style={{fontWeight: 600, marginBottom: 10, display: 'block'}}><i className="fas fa-bed" style={{marginRight: 5}}></i> Rooms</label>
                  {rooms.map((room, idx) => (
                    <div key={idx} style={{display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center'}}>
                      <input type="text" value={room.roomNo} onChange={(e) => updateRoom(idx, 'roomNo', e.target.value)} placeholder="Room No" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="text" value={room.roomType} onChange={(e) => updateRoom(idx, 'roomType', e.target.value)} placeholder="Type" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="number" step="0.01" min="0" value={room.rate} onChange={(e) => updateRoom(idx, 'rate', e.target.value)} placeholder="Rate" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="number" min="1" value={room.nights} onChange={(e) => updateRoom(idx, 'nights', e.target.value)} placeholder="Nights" style={{width: 70, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <span style={{minWidth: 70, textAlign: 'right', fontWeight: 600, color: '#001f3f'}}>${((parseFloat(room.rate) || 0) * (parseInt(room.nights) || 0)).toFixed(2)}</span>
                      {rooms.length > 1 && (
                        <button type="button" onClick={() => removeRoom(idx)} style={{background: '#ea4335', color: 'white', border: 'none', borderRadius: 3, padding: '8px 10px', cursor: 'pointer'}}><i className="fas fa-times"></i></button>
                      )}
                    </div>
                  ))}
                  <button type="button" onClick={addRoom} style={{background: 'none', color: 'var(--accent)', border: '1px dashed var(--accent)', borderRadius: 3, padding: '6px 12px', cursor: 'pointer', fontSize: 13}}>
                    <i className="fas fa-plus"></i> Add Room
                  </button>
                </div>

                {/* Services Section */}
                <div style={{marginBottom: 15}}>
                  <label style={{fontWeight: 600, marginBottom: 10, display: 'block'}}><i className="fas fa-concierge-bell" style={{marginRight: 5}}></i> Services</label>
                  {services.map((svc, idx) => (
                    <div key={idx} style={{display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center'}}>
                      <input type="text" value={svc.name} onChange={(e) => updateService(idx, 'name', e.target.value)} placeholder="Service name" style={{flex: 2, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      <input type="number" step="0.01" min="0" value={svc.amount} onChange={(e) => updateService(idx, 'amount', e.target.value)} placeholder="Amount" style={{flex: 1, padding: 8, border: '1px solid #d0d0d0', borderRadius: 3}} />
                      {services.length > 1 && (
                        <button type="button" onClick={() => removeService(idx)} style={{background: '#ea4335', color: 'white', border: 'none', borderRadius: 3, padding: '8px 10px', cursor: 'pointer'}}><i className="fas fa-times"></i></button>
                      )}
                    </div>
                  ))}
                  <button type="button" onClick={addService} style={{background: 'none', color: 'var(--accent)', border: '1px dashed var(--accent)', borderRadius: 3, padding: '6px 12px', cursor: 'pointer', fontSize: 13}}>
                    <i className="fas fa-plus"></i> Add Service
                  </button>
                </div>

                {/* Totals */}
                <div style={{background: '#f8f9fa', padding: 15, borderRadius: 6, marginBottom: 15}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 8}}>
                    <span>Subtotal:</span><strong>${subtotal.toFixed(2)}</strong>
                  </div>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
                    <span>Tax Rate (%):</span>
                    <input type="number" step="0.1" min="0" value={formData.taxRate} onChange={(e) => setFormData({...formData, taxRate: e.target.value})} style={{width: 80, padding: 6, border: '1px solid #d0d0d0', borderRadius: 3, textAlign: 'right'}} />
                  </div>
                  <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 8}}>
                    <span>Tax Amount:</span><span>${taxAmount.toFixed(2)}</span>
                  </div>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
                    <span>Discount:</span>
                    <input type="number" step="0.01" min="0" value={formData.discount} onChange={(e) => setFormData({...formData, discount: e.target.value})} style={{width: 100, padding: 6, border: '1px solid #d0d0d0', borderRadius: 3, textAlign: 'right'}} />
                  </div>
                  <hr style={{border: 'none', borderTop: '2px solid #001f3f', margin: '10px 0'}} />
                  <div style={{display: 'flex', justifyContent: 'space-between'}}>
                    <strong style={{fontSize: 18, color: '#001f3f'}}>Total:</strong>
                    <strong style={{fontSize: 18, color: '#001f3f'}}>${totalAmount.toFixed(2)}</strong>
                  </div>
                </div>

                {/* Payment & Status */}
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 15}}>
                  <div className="form-group">
                    <label>Due Date</label>
                    <input type="date" value={formData.dueDate} onChange={(e) => setFormData({...formData, dueDate: e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label>Status</label>
                    <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})}>
                      <option value="Unpaid">Unpaid</option>
                      <option value="Paid">Paid</option>
                      <option value="Partial">Partial</option>
                      <option value="Cancelled">Cancelled</option>
                    </select>
                  </div>
                </div>
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 15}}>
                  <div className="form-group">
                    <label>Paid Amount</label>
                    <input type="number" step="0.01" min="0" value={formData.paidAmount} onChange={(e) => setFormData({...formData, paidAmount: e.target.value})} placeholder="0.00" />
                  </div>
                  <div className="form-group">
                    <label>Payment Method</label>
                    <select value={formData.paymentMethod} onChange={(e) => setFormData({...formData, paymentMethod: e.target.value})}>
                      <option value="">-- Select --</option>
                      <option value="Cash">Cash</option>
                      <option value="Card">Card</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                      <option value="Online">Online</option>
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label>Notes</label>
                  <textarea rows={2} value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Additional notes..." style={{width: '100%', padding: 12, border: '1px solid #d0d0d0', borderRadius: 3, fontFamily: 'inherit'}}></textarea>
                </div>

                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>
                    {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> {invoice ? 'Update' : 'Create'} Invoice</>}
                  </button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // AI CHAT ASSISTANT VIEW
    // ============================================
    function AIChatView({ user, role }) {
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(false);
      const [conversationHistory, setConversationHistory] = useState([]);
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);

      const scrollToBottom = () => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      useEffect(() => { scrollToBottom(); }, [messages, loading]);

      const getTime = () => {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      const formatAIText = (text) => {
        if (!text) return '';
        let html = text
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`(.+?)`/g, '<code>$1</code>')
          .replace(/^\s*[-•]\s+(.+)/gm, '<li>$1</li>')
          .replace(/^\s*\d+\.\s+(.+)/gm, '<li>$1</li>');
        html = html.replace(/((<li>.*?<\/li>\s*)+)/gs, '<ul>$1</ul>');
        html = html.replace(/\n/g, '<br>');
        return html;
      };

      const sendMessage = () => {
        const text = inputText.trim();
        if (!text || loading) return;

        const userMsg = { type: 'user', text: text, time: getTime() };
        setMessages(prev => [...prev, userMsg]);
        setInputText('');
        setLoading(true);

        const newHistory = [...conversationHistory, { role: 'user', text: text }];

        google.script.run
          .withSuccessHandler((result) => {
            setLoading(false);
            if (result && result.success) {
              const aiMsg = { type: 'ai', text: result.reply, time: getTime() };
              setMessages(prev => [...prev, aiMsg]);
              setConversationHistory([...newHistory, { role: 'model', text: result.reply }]);
            } else {
              const errMsg = { type: 'ai', text: (result && result.message) || 'Sorry, I could not process your request. Please try again.', time: getTime() };
              setMessages(prev => [...prev, errMsg]);
            }
            if (inputRef.current) inputRef.current.focus();
          })
          .withFailureHandler((err) => {
            setLoading(false);
            const errMsg = { type: 'ai', text: 'Connection error. Please check your internet and try again.', time: getTime() };
            setMessages(prev => [...prev, errMsg]);
            if (inputRef.current) inputRef.current.focus();
          })
          .chatWithAI(text, user, role, newHistory.slice(-20));
      };

      const clearChat = () => {
        Swal.fire({
          title: 'Clear Chat?',
          text: 'This will remove all messages.',
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#001f3f',
          confirmButtonText: 'Yes, clear',
          cancelButtonText: 'Cancel'
        }).then((result) => {
          if (result.isConfirmed) {
            setMessages([]);
            setConversationHistory([]);
          }
        });
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      return (
        <div className="ai-chat-container">
          <div className="ai-chat-header">
            <div className="ai-chat-header-left">
              <div className="ai-avatar"><i className="fas fa-robot"></i></div>
              <div>
                <h3>AI Assistant</h3>
                <span>{role === 'admin' ? 'Full System Access' : 'Your Bookings'}</span>
              </div>
            </div>
            {messages.length > 0 && (
              <button onClick={clearChat}><i className="fas fa-trash-alt"></i> Clear</button>
            )}
          </div>

          <div className="ai-chat-messages">
            {messages.length === 0 && !loading && (
              <div className="ai-chat-welcome">
                <i className="fas fa-robot"></i>
                <h3>Hotel AI Assistant</h3>
                <p>
                  {role === 'admin'
                    ? 'Ask me anything about your hotel — rooms, bookings, revenue, food orders, and more.'
                    : 'Ask me about your bookings, check-in details, or anything related to your stay.'}
                </p>
              </div>
            )}

            {messages.map((msg, idx) => (
              <div key={idx} className={`ai-chat-bubble ${msg.type}`}>
                {msg.type === 'ai' ? (
                  <div className="ai-formatted-text" dangerouslySetInnerHTML={{ __html: formatAIText(msg.text) }}></div>
                ) : (
                  <div>{msg.text}</div>
                )}
                <span className="bubble-time">{msg.time}</span>
              </div>
            ))}

            {loading && (
              <div className="ai-typing-indicator">
                <span></span><span></span><span></span>
              </div>
            )}

            <div ref={messagesEndRef}></div>
          </div>

          <div className="ai-chat-input-area">
            <input
              ref={inputRef}
              type="text"
              value={inputText}
              onChange={(e) => setInputText(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder={loading ? 'AI is thinking...' : 'Type your message...'}
              disabled={loading}
              autoComplete="off"
            />
            <button className="ai-chat-send-btn" onClick={sendMessage} disabled={loading || !inputText.trim()}>
              <i className="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      );
    }

    function AdminSettingsView() {
      const { settings, refreshSettings } = useSettings();
      const [activeTab, setActiveTab] = useState('general');
      const [form, setForm] = useState(settings);
      const [saving, setSaving] = useState(false);
      const [uploadingLogo, setUploadingLogo] = useState(false);
      const [uploadingHero, setUploadingHero] = useState(false);
      const [testPhone, setTestPhone] = useState('');
      const [testingSms, setTestingSms] = useState(false);

      // Keep the local editable form in sync whenever fresh settings load
      useEffect(() => { setForm(settings); }, [settings]);

      const update = (patch) => setForm(prev => ({ ...prev, ...patch }));

      const fileToBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ data: reader.result.split(',')[1], mime: file.type, name: file.name });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const handleSave = () => {
        setSaving(true);
        google.script.run
          .withSuccessHandler((res) => {
            setSaving(false);
            if (res.success) {
              Swal.fire({ icon: 'success', text: 'Settings saved', timer: 1500, showConfirmButton: false });
              refreshSettings();
            } else {
              Swal.fire({ icon: 'error', text: res.message });
            }
          })
          .withFailureHandler((err) => { setSaving(false); Swal.fire({ icon: 'error', text: err.message }); })
          .saveSettings(form);
      };

      const handleLogoChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { Swal.fire({ icon: 'warning', text: 'Logo image must be less than 5MB' }); return; }
        setUploadingLogo(true);
        try {
          const b64 = await fileToBase64(file);
          google.script.run
            .withSuccessHandler((res) => {
              setUploadingLogo(false);
              if (res.success) { Swal.fire({ icon: 'success', text: 'Logo updated', timer: 1500, showConfirmButton: false }); refreshSettings(); }
              else Swal.fire({ icon: 'error', text: res.message });
            })
            .withFailureHandler((err) => { setUploadingLogo(false); Swal.fire({ icon: 'error', text: err.message }); })
            .saveLogo(b64.data, b64.name, b64.mime);
        } catch (err) {
          setUploadingLogo(false);
          Swal.fire({ icon: 'error', text: 'Error reading logo file: ' + err.message });
        }
      };

      const handleHeroUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        setUploadingHero(true);
        try {
          for (const file of files) {
            if (file.size > 5 * 1024 * 1024) continue; // skip oversized silently, keep uploading the rest
            const b64 = await fileToBase64(file);
            await new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(resolve)
                .addHeroImage(b64.data, b64.name, b64.mime);
            });
          }
          refreshSettings();

          setUploadingHero(false);
          e.target.value = '';
        }
      };

      const handleDeleteHero = (fileId) => {
        Swal.fire({ icon: 'warning', title: 'Remove this image?', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Remove' }).then((result) => {
          if (!result.isConfirmed) return;
          google.script.run
            .withSuccessHandler((res) => { if (res.success) refreshSettings(); else Swal.fire({ icon: 'error', text: res.message }); })
            .withFailureHandler((err) => Swal.fire({ icon: 'error', text: err.message }))
            .deleteHeroImage(fileId);
        });
      };

      const handleTestSms = () => {
        if (!testPhone) { Swal.fire({ icon: 'warning', text: 'Enter a phone number to send the test to' }); return; }
        setTestingSms(true);
        google.script.run
          .withSuccessHandler((res) => {
            setTestingSms(false);
            Swal.fire({ icon: res.success ? 'success' : 'error', title: res.success ? 'Test SMS Sent' : 'Test SMS Failed', text: res.message });

          </div>

    function Dashboard({ user, role, onLogout }) {
      const { settings } = useSettings();
      const getDefaultMenu = () => {
        if (role === 'admin') return 'dashboard';
        if (role === 'FoodStaff') return 'food-staff-dashboard';
        if (role === 'Cleaner') return 'cleaner-dashboard';
        return 'book-room';
      };
      const [activeMenu, setActiveMenu] = useState(getDefaultMenu());
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [sidebarCounts, setSidebarCounts] = useState({});

      useEffect(() => {
        if (role === 'admin') {
          const loadCounts = () => {
            google.script.run
              .withSuccessHandler((res) => {
                if (!res || res.error) return;
                setSidebarCounts({
                  bookings: (res.bookingStats?.pending || 0) + (res.bookingStats?.booked || 0) + (res.bookingStats?.checkedIn || 0),
                  'food-orders': res.foodOrdersCount || 0,
                  'cleaning-requests': res.cleaningRequestsCount || 0,
                  transactions: res.transactionsCount || 0
                });
              })
              .withFailureHandler(() => {})
              .getDashboardData();
          };
          loadCounts();
          const interval = setInterval(loadCounts, 30000);
          return () => clearInterval(interval);
        } else if (role === 'FoodStaff') {
          const loadFoodCounts = () => {
            google.script.run
              .withSuccessHandler((res) => {
                const pending = (res && !res.error) ? res.length : 0;
                setSidebarCounts({ 'food-staff-pending': pending });
              })
              .withFailureHandler(() => {})
              .getPendingFoodOrders(user);
          };
          loadFoodCounts();
          const interval = setInterval(loadFoodCounts, 10000);
          return () => clearInterval(interval);
        } else if (role === 'Cleaner') {
          const loadCleanCounts = () => {
            google.script.run
              .withSuccessHandler((res) => {
                const pending = (res && !res.error) ? res.length : 0;
                setSidebarCounts({ 'cleaner-dashboard': pending });
              })
              .withFailureHandler(() => {})
              .getPendingCleaningRequests(user);
          };
          loadCleanCounts();
          const interval = setInterval(loadCleanCounts, 10000);
          return () => clearInterval(interval);
        }
      }, [role]);

      return (
        <div className="app-container">
          <button className="mobile-menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}><i className="fas fa-bars"></i></button>
          <Sidebar activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} user={user} onLogout={onLogout} isOpen={sidebarOpen} setIsOpen={setSidebarOpen} counts={sidebarCounts} />
          <div className="main-content">
            <div className="header">
              <h1><i className="fas fa-hotel"></i> {settings.hotelName}</h1>
              <div style={{display: 'flex', alignItems: 'center', gap: 15}}>
                <span className="live-indicator"><span className="live-dot"></span> Live</span>
                <div style={{color: '#666'}}>Welcome, <strong>{user}</strong></div>
              </div>
            </div>
            <MainContent activeMenu={activeMenu} user={user} role={role} />
          </div>
        </div>
      );
    }

    const DEFAULT_HERO_IMAGE_URL = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80';

    function HotelWebsite({ onLoginClick }) {
      const { settings } = useSettings();
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      const [publicRoomTypes, setPublicRoomTypes] = useState([]);

      // Hero carousel: uses admin-uploaded images (Settings > Public Page), falls back to a default photo
      const heroSlides = (settings.heroImages && settings.heroImages.length > 0)
        ? settings.heroImages.map(img => img.url)
        : [DEFAULT_HERO_IMAGE_URL];
      const [currentHeroSlide, setCurrentHeroSlide] = useState(0);

      useEffect(() => {
        if (!settings.heroAutoplay || heroSlides.length < 2) return;
        const ms = Math.max(2, settings.heroIntervalSeconds || 6) * 1000;
        const timer = setInterval(() => {
          setCurrentHeroSlide(prev => (prev + 1) % heroSlides.length);
        }, ms);
        return () => clearInterval(timer);
      }, [settings.heroAutoplay, settings.heroIntervalSeconds, heroSlides.length]);

      // Keep the active slide in range if the admin removes images while viewing
      useEffect(() => {
        if (currentHeroSlide >= heroSlides.length) setCurrentHeroSlide(0);
      }, [heroSlides.length]);

      // Calculator state
      const [calcRoomType, setCalcRoomType] = useState('Standard');
      const [calcDuration, setCalcDuration] = useState('night');
      const [calcQuantity, setCalcQuantity] = useState(1);

      // Default room type info (amenities, descriptions, fallback images)
      const defaultRoomInfo = {
        'Standard': {
          name: 'Standard Room',
          description: 'Comfortable and cozy room with essential amenities for a pleasant stay.',
          amenities: ['Free WiFi', 'AC', 'TV', 'Room Service'],
          fallbackImage: 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
        },
        'Deluxe': {
          name: 'Deluxe Room',
          description: 'Spacious room with premium furnishings and city view balcony.',
          amenities: ['Free WiFi', 'AC', 'Smart TV', 'Mini Bar', 'Balcony'],
          fallbackImage: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
        },
        'Suite': {
          name: 'Suite',
          description: 'Luxurious suite with separate living area and premium amenities.',
          amenities: ['Free WiFi', 'AC', 'Smart TV', 'Mini Bar', 'Living Room', 'Jacuzzi'],
          fallbackImage: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
        },
        'Executive': {
          name: 'Executive Suite',
          description: 'Our finest accommodation with panoramic views and exclusive services.',
          amenities: ['Free WiFi', 'AC', 'Smart TV', 'Full Bar', 'Office', 'Butler Service'],
          fallbackImage: 'https://images.unsplash.com/photo-1618773928121-c32242e63f39?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
        }
      };

      // Merge backend data with default info
      const roomTypes = publicRoomTypes.length > 0
        ? publicRoomTypes.map(room => {
            const info = defaultRoomInfo[room.type] || defaultRoomInfo['Standard'];
            return {
              ...room,
              name: info.name,
              description: info.description,
              amenities: info.amenities,
              image: room.image || info.fallbackImage
            };
          })
        : Object.keys(defaultRoomInfo).map(type => ({
            type,
            name: defaultRoomInfo[type].name,
            description: defaultRoomInfo[type].description,
            amenities: defaultRoomInfo[type].amenities,
            image: defaultRoomInfo[type].fallbackImage,
            pricePerNight: type === 'Standard' ? 100 : type === 'Deluxe' ? 150 : type === 'Suite' ? 250 : 350,
            availableRooms: 0,
            totalRooms: 0
          }));

      useEffect(() => {
        // Load public room types with images and availability
        google.script.run
          .withSuccessHandler((result) => {
            setLoadingRooms(false);
            if (result.success && result.data) {
              setPublicRoomTypes(result.data);
              // Set calcRoomType to first available room type
              if (result.data.length > 0) {
                setCalcRoomType(result.data[0].type);
              }
            }
          })
          .withFailureHandler(() => setLoadingRooms(false))
          .getPublicRoomTypes();

        // Also load all rooms for additional data
        google.script.run
          .withSuccessHandler((result) => {
            if (!result.error) setRooms(result);
          })
          .withFailureHandler(() => {})
          .getAllRoomsWithStatus();
      }, []);

      // Calculate prices
      const getSelectedRoomPrice = () => {
        const room = roomTypes.find(r => r.type === calcRoomType);
        return room ? room.pricePerNight : 100;
      };

      const calculatePrices = () => {
        const basePrice = getSelectedRoomPrice();
        const quantity = parseInt(calcQuantity) || 1;

        let multiplier = 1;
        let label = 'Night';

        switch (calcDuration) {
          case 'night': multiplier = 1; label = 'Night'; break;
          case 'week': multiplier = 7; label = 'Week'; break;
          case 'month': multiplier = 30; label = 'Month'; break;
        }

        const subtotal = basePrice * multiplier * quantity;
        const discount = calcDuration === 'week' ? 0.10 : (calcDuration === 'month' ? 0.20 : 0);
        const discountAmount = subtotal * discount;
        const total = subtotal - discountAmount;

        return {
          pricePerNight: basePrice,
          nights: multiplier * quantity,
          subtotal,
          discount: discount * 100,
          discountAmount,
          total
        };
      };

      const prices = calculatePrices();

      // Get room availability count
      const getAvailableCount = (type) => {
        // First check if we have data from publicRoomTypes
        const roomType = publicRoomTypes.find(r => r.type === type);
        if (roomType && roomType.availableRooms !== undefined) {
          return roomType.availableRooms;
        }
        // Fallback to filtering rooms
        return rooms.filter(r => r.type === type && r.isAvailable).length;

                <a href="#" onClick={(e) => { e.preventDefault(); scrollToSection('calculator'); }}>Pricing</a>

              <button className="mobile-nav-toggle" onClick={() => {

                  html: `

                      <a href="#" onclick="document.getElementById('hero')?.scrollIntoView({behavior:'smooth'});Swal.close();" style="display:block;padding:15px;color:#001f3f;text-decoration:none;border-bottom:1px solid #eee"><i class="fas fa-home"></i> Home</a>
                      <a href="#" onclick="document.getElementById('about')?.scrollIntoView({behavior:'smooth'});Swal.close();" style="display:block;padding:15px;color:#001f3f;text-decoration:none;border-bottom:1px solid #eee"><i class="fas fa-info-circle"></i> About</a>
                      <a href="#" onclick="document.getElementById('rooms')?.scrollIntoView({behavior:'smooth'});Swal.close();" style="display:block;padding:15px;color:#001f3f;text-decoration:none;border-bottom:1px solid #eee"><i class="fas fa-bed"></i> Rooms</a>
                      <a href="#" onclick="document.getElementById('calculator')?.scrollIntoView({behavior:'smooth'});Swal.close();" style="display:block;padding:15px;color:#001f3f;text-decoration:none;border-bottom:1px solid #eee"><i class="fas fa-calculator"></i> Pricing</a>
                      <a href="#" onclick="document.getElementById('contact')?.scrollIntoView({behavior:'smooth'});Swal.close();" style="display:block;padding:15px;color:#001f3f;text-decoration:none;border-bottom:1px solid #eee"><i class="fas fa-envelope"></i> Contact</a>
                    </div>
                  `,
                  showConfirmButton: true,
                  confirmButtonText: 'Login / Sign Up',
                  confirmButtonColor: '#001f3f',
                  showCloseButton: true
                }).then((result) => {

                <i className="fas fa-bars"></i>
              </button>

          {/* Hero Section */}

            <div className="hero-content">

                      <div className="room-image" style={{background: 'linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%)', backgroundSize: '200% 100%', animation: 'skeleton-loading 1.5s ease-in-out infinite'}}>

    // ============================================
    // MAIN APP
    // ============================================
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState(null);
      const [checkingSession, setCheckingSession] = useState(true);
      const [showLoginPage, setShowLoginPage] = useState(false);
      const [settings, setSettings] = useState(DEFAULT_CLIENT_SETTINGS);

      const refreshSettings = () => {
        google.script.run
          .withSuccessHandler((res) => { if (res) { setSettings(res); applyThemeToDocument(res); } })
          .withFailureHandler(() => {})
          .getSettings();
      };

      // Load hotel branding/theme/SMS/hero settings once on app start
      useEffect(() => { refreshSettings(); }, []);

      // Check for existing session on app load
      useEffect(() => {
        const session = getSession();
        if (session) {
          setIsLoggedIn(true);
          setCurrentUser(session.username);
          setUserRole(session.role);
        }
        setCheckingSession(false);
      }, []);

      // Set up session expiry check (every minute)
      useEffect(() => {
        if (!isLoggedIn) return;

        const checkExpiry = setInterval(() => {
          const session = getSession();
          if (!session) {
            // Session expired
            setIsLoggedIn(false);
            setCurrentUser(null);
            setUserRole(null);
            setShowLoginPage(false);
            Swal.fire({
              icon: 'info',
              title: 'Session Expired',
              text: 'Your session has expired. Please login again.',
              confirmButtonColor: '#001f3f'
            });
          }
        }, 60000); // Check every minute

        return () => clearInterval(checkExpiry);
      }, [isLoggedIn]);

      const handleLogin = (username, role) => {
        // Save session to localStorage (2-hour expiry)
        saveSession(username, role);
        setIsLoggedIn(true);
        setCurrentUser(username);
        setUserRole(role);
        setShowLoginPage(false);
      };

      const handleLogout = () => {
        Swal.fire({ icon: 'question', title: 'Logout?', showCancelButton: true, confirmButtonColor: '#001f3f', confirmButtonText: 'Yes, Logout' }).then((result) => {
          if (result.isConfirmed) {
            // Clear session from localStorage
            clearSession();
            setIsLoggedIn(false);
            setCurrentUser(null);
            setUserRole(null);
            setShowLoginPage(false);
          }
        });
      };

      // Re-apply the theme any time settings change (e.g. after saving in Admin Settings)
      useEffect(() => { applyThemeToDocument(settings); }, [settings]);

      let content;
      if (checkingSession) {
        // Show loading while checking session
        content = (
          <div className="login-container">
            <div className="login-box" style={{textAlign: 'center'}}>
              <i className="fas fa-spinner fa-spin" style={{fontSize: 40, color: 'var(--navy-primary)', marginBottom: 20}}></i>
              <p style={{color: '#666'}}>Checking session...</p>
            </div>
          </div>
        );
      } else if (isLoggedIn) {
        // If logged in, show dashboard
        content = <Dashboard user={currentUser} role={userRole} onLogout={handleLogout} />;
      } else if (showLoginPage) {
        // If showing login page
        content = <LoginPage onLogin={handleLogin} onBackToWebsite={() => setShowLoginPage(false)} />;
      } else {
        // Show hotel website
        content = <HotelWebsite onLoginClick={() => setShowLoginPage(true)} />;
      }

      return (
        <SettingsContext.Provider value={{ settings, refreshSettings }}>
          {content}
        </SettingsContext.Provider>
      );
    }

    // ============================================
    // RENDER
    // ============================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
