      '<div class="panel"><h3>Loyalty &amp; Booking</h3><div class="form-row">' +
      '<div class="field"><label>Loyalty Points per ' + (s.Currency || 'GH₵') + '1 spent</label><input type="number" id="s_LoyaltyPointsPerCedi" value="' + esc(s.LoyaltyPointsPerCedi) + '"></div>' +
      '<div class="field"><label>Slot Interval (minutes)</label><input type="number" id="s_SlotIntervalMinutes" value="' + esc(s.SlotIntervalMinutes) + '"></div>' +
      '<div class="field"><label>Measurement Unit</label><select id="s_MeasurementUnit"><option' + (s.MeasurementUnit === 'inches' ? ' selected' : '') + '>inches</option><option' + (s.MeasurementUnit === 'cm' ? ' selected' : '') + '>cm</option></select></div></div>' +
      '<div class="field"><label>Service Categories (comma-separated)</label><input type="text" id="s_ServiceCategories" value="' + esc(s.ServiceCategories) + '"></div>' +
      '<div class="check-row"><input type="checkbox" id="s_ShowGreetingBanner"' + (s.ShowGreetingBanner === 'Y' ? ' checked' : '') + '><label style="margin:0;">Show greeting banner</label></div>' +
      '<div class="check-row"><input type="checkbox" id="s_ShowTeamSection"' + (s.ShowTeamSection === 'Y' ? ' checked' : '') + '><label style="margin:0;">Show team section</label></div>' +
      '<div class="check-row"><input type="checkbox" id="s_NotifyBookingSms"' + (s.NotifyBookingSms === 'Y' ? ' checked' : '') + '><label style="margin:0;">SMS notify on new booking</label></div>' +
      '<div class="check-row"><input type="checkbox" id="s_NotifyOrderStatusSms"' + (s.NotifyOrderStatusSms === 'Y' ? ' checked' : '') + '><label style="margin:0;">SMS notify on order status change</label></div></div>' +
      '<div class="panel"><h3>SMS Provider</h3><div class="form-row">' +
      '<div class="field"><label>Provider</label><select id="s_SmsProvider"><option value="simulate"' + (s.SmsProvider === 'simulate' ? ' selected' : '') + '>Simulate (log only)</option><option value="arkesel"' + (s.SmsProvider === 'arkesel' ? ' selected' : '') + '>Arkesel</option><option value="hubtel"' + (s.SmsProvider === 'hubtel' ? ' selected' : '') + '>Hubtel</option></select></div>' +
      '<div class="field"><label>Sender ID</label><input type="text" id="s_SmsSenderId" value="' + esc(s.SmsSenderId) + '"></div></div>' +
      '<div class="field"><label>API Key</label><input type="text" id="s_SmsApiKey" value="' + esc(s.SmsApiKey) + '"></div></div>' +
      '<button class="btn btn-accent btn-block" onclick="saveAllSettings()">Save Settings</button>' +
      '<div class="panel" style="margin-top:20px;"><h3>Public Booking QR Code</h3><div class="qrBox" id="qrBox"></div></div>';
    renderShopInfoEditor();
    renderQrCard();
  }).catch(function (e) { host.innerHTML = '<div class="emptyState">' + esc(e.message) + '</div>'; });
}
function renderShopInfoEditor() {
  api('getShopInfo', state.token).then(function (info) {
    var wh = info.weeklyHours;
    document.getElementById('shopInfoBox').innerHTML =
      '<div class="form-row"><div class="field"><label>Shop Name</label><input type="text" id="sh_Name" value="' + esc(info.branch.Name) + '"></div>' +
      '<div class="field"><label>Phone</label><input type="text" id="sh_Phone" value="' + esc(info.branch.Phone) + '"></div></div>' +
      '<div class="field"><label>Location</label><input type="text" id="sh_Location" value="' + esc(info.branch.Location) + '"></div>' +
      '<table class="hoursTable"><tbody id="sh_hours">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) {
        var w = wh[d] || { open: true, is24: false, start: '09:00', end: '18:00' };
        return '<tr data-day="' + d + '"><td style="width:50px;">' + d + '</td>' +
          '<td><input type="checkbox" class="sh-open" ' + (w.open ? 'checked' : '') + '></td>' +
          '<td><input type="time" class="sh-start" value="' + w.start + '" style="width:110px;" ' + (!w.open ? 'disabled' : '') + '></td>' +
          '<td>to</td><td><input type="time" class="sh-end" value="' + w.end + '" style="width:110px;" ' + (!w.open ? 'disabled' : '') + '></td></tr>';
      }).join('') + '</tbody></table>' +
      '<button class="btn btn-sm" style="margin-top:10px;" onclick="saveShopInfoUi()">Save Shop Info &amp; Hours</button>';
    document.querySelectorAll('.sh-open').forEach(function (ck) { ck.addEventListener('change', function () { var row = ck.closest('tr'); row.querySelectorAll('input[type=time]').forEach(function (t) { t.disabled = !ck.checked; }); }); });
  }).catch(toastError);
}
function saveShopInfoUi() {
  var weeklyHours = {};
  document.querySelectorAll('#sh_hours tr').forEach(function (row) {
    var day = row.dataset.day;
    weeklyHours[day] = { open: row.querySelector('.sh-open').checked, is24: false, start: row.querySelector('.sh-start').value, end: row.querySelector('.sh-end').value };
  });
  api('saveShopInfo', state.token, { Name: document.getElementById('sh_Name').value, Phone: document.getElementById('sh_Phone').value, Location: document.getElementById('sh_Location').value, weeklyHours: weeklyHours })
    .then(function () { toast('Shop info saved.', 'success'); }).catch(toastError);
}
function saveAllSettings() {
  var payload = {
    BusinessName: val('s_BusinessName'), Tagline: val('s_Tagline'), PrimaryColor: val('s_PrimaryColor'), SecondaryColor: val('s_SecondaryColor'), AccentColor: val('s_SecondaryColor'),
    ContactPhone: val('s_ContactPhone'), ContactEmail: val('s_ContactEmail'), WhatsAppNumber: val('s_WhatsAppNumber'), MapEmbedURL: val('s_MapEmbedURL'),
    MomoName: val('s_MomoName'), MomoNumber: val('s_MomoNumber'), VodafoneCashName: val('s_VodafoneCashName'), VodafoneCashNumber: val('s_VodafoneCashNumber'),
    TelecelCashName: val('s_TelecelCashName'), TelecelCashNumber: val('s_TelecelCashNumber'), AirtelTigoMoneyName: val('s_AirtelTigoMoneyName'), AirtelTigoMoneyNumber: val('s_AirtelTigoMoneyNumber'),
    BankName: val('s_BankName'), BankAccountName: val('s_BankAccountName'), BankAccountNumber: val('s_BankAccountNumber'), TaxRatePercent: val('s_TaxRatePercent'),
    LoyaltyPointsPerCedi: val('s_LoyaltyPointsPerCedi'), SlotIntervalMinutes: val('s_SlotIntervalMinutes'), MeasurementUnit: val('s_MeasurementUnit'), ServiceCategories: val('s_ServiceCategories'),
    ShowGreetingBanner: chk('s_ShowGreetingBanner'), ShowTeamSection: chk('s_ShowTeamSection'), NotifyBookingSms: chk('s_NotifyBookingSms'), NotifyOrderStatusSms: chk('s_NotifyOrderStatusSms'),
    SmsProvider: val('s_SmsProvider'), SmsSenderId: val('s_SmsSenderId'), SmsApiKey: val('s_SmsApiKey'),
    ActivePaymentMethods: Array.from(document.querySelectorAll('.payMethodCk:checked')).map(function (c) { return c.value; }).join(',')
  };
  var fileInput = document.getElementById('s_LogoFile');
  var save = function (url) {
    if (url) payload.LogoURL = url;
    api('updateSettings', state.token, payload).then(function (s) {
      state.settings = s; applyTheme(s); toast('Settings saved.', 'success');
      api('getPublicData').then(function (d) { state.publicData = d; });
    }).catch(toastError);
  };
  if (fileInput.files[0]) {
    var reader = new FileReader();
    reader.onload = function () { api('uploadImage', state.token, reader.result, fileInput.files[0].name, fileInput.files[0].type).then(function (r) { save(r.url); }).catch(function (err) { toastError(err); save(''); }); };
    reader.readAsDataURL(fileInput.files[0]);
  } else { save(''); }
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function chk(id) { var el = document.getElementById(id); return el && el.checked ? 'Y' : 'N'; }
function renderQrCard() {
  var url = getWebAppUrlClient();
  var qrImgSrc = 'https://chart.googleapis.com/chart?cht=qr&chs=160x160&chl=' + encodeURIComponent(url);
  document.getElementById('qrBox').innerHTML = '<img src="' + qrImgSrc + '" style="border-radius:8px;border:1px solid #eee;">' +
    '<div><p class="muted">Print this QR code in-store — customers scan it to book instantly.</p><input type="text" readonly value="' + esc(url) + '" style="width:280px;" onclick="this.select()"></div>';
}
function getWebAppUrlClient() { return location.href.split('#')[0]; }

/* ============================================================================
 * MY ACCOUNT
 * ==========================================================================*/
function renderAccount(host) {
  var user = state.user;
  host.innerHTML = '<div class="panel" style="max-width:440px;"><h3>My Account</h3>' +
    '<p><strong>' + esc(user.fullName || user.username) + '</strong><br><span class="muted">' + esc(user.role) + ' · ' + esc(user.username) + '</span></p>' +
    '<h4 style="margin-top:20px;">Change Password</h4>' +
    '<form id="pwForm"><div class="field"><label>Current Password</label><input type="password" name="oldPassword" required></div>' +
    '<div class="field"><label>New Password</label><input type="password" name="newPassword" required></div>' +
    '<button class="btn btn-accent" type="submit">Update Password</button></form></div>';
  document.getElementById('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    api('changeOwnPassword', state.token, fd.get('oldPassword'), fd.get('newPassword')).then(function (res) { toast(res.message, 'success'); e.target.reset(); }).catch(toastError);
  });
}
</script>
