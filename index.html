<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advance Tailor — Bespoke Fashion House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  ============================================================================
  ADVANCE TAILOR MANAGEMENT SYSTEM (Ghana)
  Front-end — index.html
  Public marketing/booking site + secured admin/staff dashboard, in one file.
  Routing: '#admin' switches to the dashboard. Everything else is public.
  ============================================================================
-->
<style>
  :root {
    --clr-primary: #16213e;
    --clr-secondary: #c9a227;
    --clr-accent: #c9a227;
    --clr-bg: #f7f5f0;
    --clr-text: #1a1a1a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
    --radius: 10px;
    --shadow: 0 2px 14px rgba(0,0,0,.08);
    --shadow-lift: 0 14px 34px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--clr-bg);
    color: var(--clr-text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.15; font-weight: 700; font-family: var(--font-display); letter-spacing: -.01em; }
  h1 { font-size: 2.6rem; }
  h2 { font-size: 2rem; }
  h3 { font-size: 1.3rem; }
  p { margin: 0 0 1em; }
  button, input, select, textarea { font-family: inherit; font-size: 1rem; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .hidden { display: none !important; }
  .muted { color: #777; font-size: .9em; }
  .icon { flex-shrink: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 13px 26px; border-radius: 999px; border: none;
    background: var(--clr-primary); color: #fff; cursor: pointer; font-weight: 700; letter-spacing: .01em;
    transition: opacity .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,.16); }
  .btn:active { transform: scale(.97) translateY(0); }
  .btn-accent { background: var(--clr-accent); color: #1a1a1a; }
  .btn-outline { background: transparent; border: 2px solid var(--clr-primary); color: var(--clr-primary); }
  .btn-outline-light { background: transparent; border: 2px solid #fff; color: #fff; }
  .btn-sm { padding: 7px 14px; font-size: .85rem; border-radius: 6px; }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-icon { padding: 8px 10px; border-radius: 8px; background: #eee; color: #333; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .badge-pending, .badge-order-received { background: #fff4d6; color: #8a6d00; }
  .badge-confirmed, .badge-measuring { background: #dbeeff; color: #0b5da3; }
  .badge-completed, .badge-delivered, .badge-paid { background: #dcf5e3; color: #1c7c3c; }
  .badge-cancelled, .badge-no-show, .badge-unpaid { background: #fbe0e0; color: #b32424; }
  .badge-cutting, .badge-sewing { background: #f0e4ff; color: #6b21a8; }
  .badge-fitting, .badge-finishing { background: #ffe8d6; color: #a34a06; }
  .badge-ready-for-pickup { background: #d6f5f0; color: #0d7d6f; }
  .badge-partially-paid { background: #fff4d6; color: #8a6d00; }
  .warn-line { display: flex; align-items: center; gap: 8px; color: #8a6d00; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 6px; }

  /* ---------- FORMS ---------- */
  label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 5px; color: #444; }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="password"], input[type="number"],
  input[type="date"], input[type="time"], select, textarea {
    width: 100%; padding: 11px 13px; border: 1.5px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a;
    transition: border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--clr-secondary); }
  textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .form-row .field { flex: 1; min-width: 180px; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .check-row input { width: auto; }
  .field-error { color: #c0392b; font-size: .8rem; margin-top: 4px; }

  /* ---------- PUBLIC NAV ---------- */
  #publicNav { position: sticky; top: 0; z-index: 50; background: var(--clr-primary); color: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
  #publicNav .bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
  #publicNav .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; font-family: var(--font-display); letter-spacing: -.01em; }
  #publicNav .brand img { height: 38px; width: 38px; border-radius: 9px; object-fit: cover; }
  #publicNav nav { display: flex; align-items: center; gap: 26px; }
  #publicNav nav a { font-weight: 600; font-size: .92rem; opacity: .88; }
  #publicNav nav a:hover { opacity: 1; }
  #publicNav .navBtns { display: flex; align-items: center; gap: 10px; }
  #navToggle { display: none; background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }
  .shopStatusBadge { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .shopStatusBadge.open { background: #1c7c3c33; color: #a8f0c0; }
  .shopStatusBadge.closed { background: #c0392b33; color: #ffb3ac; }
  .shopStatusBadge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  @media (max-width: 860px) {
    #navToggle { display: block; }
    #publicNav nav { position: fixed; top: 68px; left: 0; right: 0; bottom: 0; background: var(--clr-primary); flex-direction: column; align-items: flex-start; padding: 24px; gap: 18px; transform: translateX(-100%); transition: transform .2s ease; overflow-y: auto; }
    #publicNav nav.open { transform: translateX(0); }
  }

  /* ---------- HERO ---------- */
  #hero { position: relative; overflow: hidden; min-height: 560px; display: flex; align-items: center; color: #fff; }
  #hero .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity .8s ease; }
  #hero .slide.active { opacity: 1; }
  #hero .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22,33,62,.55), rgba(22,33,62,.82)); }
  #hero .heroContent { position: relative; z-index: 2; max-width: 700px; padding: 90px 24px 100px; }
  #hero .heroContent h1 { font-size: 3rem; margin-bottom: .3em; }
  #hero .heroContent p { font-size: 1.15rem; opacity: .92; margin-bottom: 1.6em; }
  #hero .heroBtns { display: flex; gap: 14px; flex-wrap: wrap; }
  #hero .dots { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 8px; }
  #hero .dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.4); cursor: pointer; }
  #hero .dots span.active { background: #fff; }
  @media (max-width: 640px) { #hero .heroContent h1 { font-size: 2.1rem; } }

  /* ---------- GREETING BANNER ---------- */
  #greetingBanner { background: var(--clr-secondary); color: #1a1a1a; text-align: center; padding: 10px 16px; font-weight: 700; font-size: .88rem; }

  /* ---------- SECTIONS ---------- */
  section.pubSection { padding: 72px 0; }
  section.pubSection.alt { background: #fff; }
  .sectionHead { text-align: center; max-width: 640px; margin: 0 auto 44px; }
  .sectionHead .eyebrow { color: var(--clr-secondary); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; margin-bottom: 10px; display: block; }
  .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }

  /* Services */
  .grid { display: grid; gap: 24px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 980px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .grid-3, .grid-4 { grid-template-columns: 1fr; } }
  .svcCard .thumb { height: 180px; background-size: cover; background-position: center; background-color: #eee; }
  .svcCard .body { padding: 18px 20px; }
  .svcCard .catTag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--clr-secondary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .svcCard .priceRow { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .svcCard .price { font-weight: 800; font-size: 1.15rem; color: var(--clr-primary); }
  .svcFilterRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
  .chip { padding: 7px 16px; border-radius: 999px; border: 1.5px solid #ddd; background: #fff; cursor: pointer; font-weight: 600; font-size: .85rem; }
  .chip.active { background: var(--clr-primary); border-color: var(--clr-primary); color: #fff; }

  /* Team */
  .staffCard { text-align: center; padding: 20px; }
  .staffCard .photo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 14px; background: #eee; border: 4px solid var(--clr-secondary); }
  .staffCard .role { color: var(--clr-secondary); font-weight: 700; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  .staffCard .spec { color: #777; font-size: .85rem; margin-top: 6px; }

  /* Gallery */
  .galleryGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .galleryGrid { grid-template-columns: repeat(2, 1fr); } }
  .galleryItem { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 1; cursor: pointer; }
  .galleryItem img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
  .galleryItem:hover img { transform: scale(1.08); }
  .galleryItem .cap { position: absolute; inset: auto 0 0 0; padding: 10px 12px; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent); color: #fff; font-size: .8rem; font-weight: 600; }

  /* Reviews */
  .reviewCard { padding: 22px; }
  .reviewCard .stars { color: var(--clr-secondary); font-size: 1.05rem; margin-bottom: 8px; letter-spacing: 2px; }
  .reviewCard .who { display: flex; justify-content: space-between; margin-top: 12px; font-weight: 700; font-size: .85rem; color: #555; }
  .reviewScroller { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
  .reviewScroller .reviewCard { min-width: 320px; scroll-snap-align: start; }

  /* Booking wizard */
  #booking { background: var(--clr-primary); color: #fff; }
  #booking .sectionHead h2, #booking .sectionHead .eyebrow { color: #fff; }
  .wizardBox { background: #fff; color: var(--clr-text); border-radius: 16px; box-shadow: var(--shadow-lift); max-width: 760px; margin: 0 auto; overflow: hidden; }
  .wizardSteps { display: flex; background: #f2f0ea; padding: 18px 24px; gap: 6px; }
  .wizardSteps .step { flex: 1; text-align: center; font-size: .74rem; font-weight: 700; color: #999; position: relative; padding-bottom: 8px; border-bottom: 3px solid #ddd; }
  .wizardSteps .step.active { color: var(--clr-primary); border-color: var(--clr-secondary); }
  .wizardSteps .step.done { color: var(--clr-secondary); border-color: var(--clr-secondary); }
  .wizardBody { padding: 30px 28px; }
  .optionGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 560px) { .optionGrid { grid-template-columns: 1fr; } }
  .optionCard { border: 2px solid #e5e3dc; border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .optionCard:hover { border-color: var(--clr-secondary); }
  .optionCard.selected { border-color: var(--clr-secondary); background: #fdf7e6; }
  .optionCard .oc-title { font-weight: 700; }
  .optionCard .oc-sub { color: #777; font-size: .82rem; }
  .slotGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 260px; overflow-y: auto; }
  @media (max-width: 560px) { .slotGrid { grid-template-columns: repeat(3, 1fr); } }
  .slotBtn { padding: 9px 4px; border-radius: 7px; border: 1.5px solid #ddd; background: #fff; cursor: pointer; font-weight: 600; font-size: .82rem; text-align: center; }
  .slotBtn:hover { border-color: var(--clr-secondary); }
  .slotBtn.selected { background: var(--clr-primary); border-color: var(--clr-primary); color: #fff; }
  .wizardNav { display: flex; justify-content: space-between; margin-top: 26px; }
  .paymentMethodGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .payDetailBox { background: #f7f5f0; border-radius: 8px; padding: 14px; margin-top: 12px; font-size: .88rem; }
  .successBox { text-align: center; padding: 20px 0; }
  .successBox .refCode { display: inline-block; background: #f2f0ea; padding: 10px 22px; border-radius: 8px; font-weight: 800; font-size: 1.2rem; letter-spacing: .04em; margin: 14px 0; }

  /* Track order */
  #track .trackResultCard { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-top: 20px; }
  .stageTrack { display: flex; align-items: center; margin: 22px 0; }
  .stageTrack .stageDot { width: 22px; height: 22px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stageTrack .stageDot.done { background: var(--clr-secondary); }
  .stageTrack .stageLine { flex: 1; height: 3px; background: #ddd; }
  .stageTrack .stageLine.done { background: var(--clr-secondary); }
  .stageLabels { display: flex; justify-content: space-between; font-size: .68rem; color: #777; margin-top: 6px; }
  .stageLabels span { flex: 1; text-align: center; }

  /* Contact */
  .contactGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 860px) { .contactGrid { grid-template-columns: 1fr; } }
  .contactInfoRow { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .contactInfoRow .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--clr-primary); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mapEmbed { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-top: 20px; }
  .mapEmbed iframe { width: 100%; height: 260px; border: 0; display: block; }
  .socialRow { display: flex; gap: 10px; margin-top: 18px; }
  .socialRow a { width: 38px; height: 38px; border-radius: 50%; background: var(--clr-primary); color: #fff; display: flex; align-items: center; justify-content: center; }
  .hoursTable { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .hoursTable td { padding: 5px 0; font-size: .88rem; }
  .hoursTable td:last-child { text-align: right; font-weight: 600; }

  /* Footer */
  footer#pubFooter { background: #0e1526; color: #ccc; padding: 50px 0 24px; }
  footer#pubFooter .fgrid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
  @media (max-width: 760px) { footer#pubFooter .fgrid { grid-template-columns: 1fr; } }
  footer#pubFooter h4 { color: #fff; font-size: .95rem; }
  footer#pubFooter a { color: #aab; font-size: .88rem; display: block; margin-bottom: 8px; }
  footer#pubFooter .fbottom { text-align: center; font-size: .78rem; color: #778; margin-top: 40px; border-top: 1px solid #223; padding-top: 20px; }
  .whatsappFab { position: fixed; bottom: 22px; right: 22px; width: 58px; height: 58px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 60; }
  .whatsappFab svg { width: 30px; height: 30px; }

  /* ---------- TOAST / MODAL ---------- */
  #toastHost { position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: #1a1a1a; color: #fff; padding: 13px 18px; border-radius: 8px; box-shadow: var(--shadow-lift); font-size: .88rem; font-weight: 600; max-width: 320px; animation: toastIn .2s ease; }
  .toast.error { background: #c0392b; }
  .toast.success { background: #1c7c3c; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .modalOverlay { position: fixed; inset: 0; background: rgba(10,12,20,.55); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modalBox { background: #fff; border-radius: 14px; max-width: 600px; width: 100%; padding: 28px; box-shadow: var(--shadow-lift); }
  .modalBox.wide { max-width: 860px; }
  .modalHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modalClose { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #999; }
  #loadBar { position: fixed; top: 0; left: 0; height: 3px; background: var(--clr-secondary); z-index: 999; width: 0; transition: width .3s ease; }

  /* ---------- ADMIN SHELL ---------- */
  #adminShell { display: flex; min-height: 100vh; background: #f1f1ef; }
  #adminSidebar { width: 232px; background: var(--clr-primary); color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  #adminSidebar .sbBrand { padding: 20px 20px 14px; font-weight: 800; font-family: var(--font-display); font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
  #adminSidebar .sbBrand img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
  #adminSidebar .sbNav { flex: 1; padding: 6px 10px; }
  #adminSidebar .sbLink { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 8px; color: #cdd3e0; font-weight: 600; font-size: .88rem; cursor: pointer; margin-bottom: 2px; }
  #adminSidebar .sbLink:hover { background: rgba(255,255,255,.06); color: #fff; }
  #adminSidebar .sbLink.active { background: var(--clr-secondary); color: #1a1a1a; }
  #adminSidebar .sbGroupLabel { padding: 16px 12px 6px; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: #7c85a0; font-weight: 800; }
  #adminSidebar .sbFooter { padding: 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: .8rem; }
  #adminMain { flex: 1; min-width: 0; }
  #adminTopbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 30; }
  #adminTopbar .pageTitle { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  #adminContent { padding: 24px 26px 60px; }
  #sidebarToggle { display: none; }
  @media (max-width: 900px) {
    #adminSidebar { position: fixed; left: 0; top: 0; z-index: 100; transform: translateX(-100%); transition: transform .2s ease; }
    #adminSidebar.open { transform: translateX(0); }
    #sidebarToggle { display: inline-flex; }
  }

  .statGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  @media (max-width: 980px) { .statGrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .statGrid { grid-template-columns: 1fr; } }
  .statCard { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .statCard .lbl { color: #888; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .statCard .val { font-size: 1.7rem; font-weight: 800; margin-top: 6px; font-family: var(--font-display); }
  .statCard .sub { font-size: .78rem; color: #999; margin-top: 4px; }
  .panel { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px; }
  .panel .panelHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .panel .panelHead h3 { margin: 0; }
  .twoCol { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 980px) { .twoCol { grid-template-columns: 1fr; } }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; justify-content: space-between; }
  .toolbar .left { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .searchBox { position: relative; }
  .searchBox input { padding-left: 34px; min-width: 220px; }

  table.dataTable { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.dataTable th { text-align: left; padding: 10px 12px; background: #f6f6f4; font-weight: 700; color: #555; border-bottom: 2px solid #eee; white-space: nowrap; }
  table.dataTable td { padding: 10px 12px; border-bottom: 1px solid #f0f0ee; vertical-align: middle; }
  table.dataTable tr:hover td { background: #fafaf8; }
  .tableWrap { overflow-x: auto; }
  .rowActions { display: flex; gap: 6px; }
  .pager { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .pager button { padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: .82rem; }
  .pager button.active { background: var(--clr-primary); color: #fff; border-color: var(--clr-primary); }

  .loginBox { background: #fff; border-radius: 16px; padding: 36px; max-width: 400px; width: 100%; box-shadow: var(--shadow-lift); }
  .loginBox h2 { text-align: center; }

<body>
<div id="loadBar"></div>
<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="app"></div>

<script>window.__initialPage = '<?= initialPage ?>';</script>
<script>
/* ============================================================================
 * STATE
 * ==========================================================================*/
var state = {
  token: localStorage.getItem('at_token') || null,
  user: null,
  publicData: null,
  settings: null,
  adminPage: 'overview',
  cart: [],
  wizard: { step: 'service', serviceId: null, staffId: null, date: null, timeSlot: null, name: '', phone: '', email: '', notes: '', paymentMethod: 'Cash', paymentProofUrl: '' }
};

/* ============================================================================
 * API WRAPPER — google.script.run with loading + error handling
 * ==========================================================================*/
var pendingCalls = 0;
function setLoading(on) {
  pendingCalls = Math.max(0, pendingCalls + (on ? 1 : -1));
  var bar = document.getElementById('loadBar');
  if (pendingCalls > 0) { bar.style.width = '70%'; } else { bar.style.width = '100%'; setTimeout(function () { bar.style.width = '0'; }, 250); }
}

function api(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  var showLoading = true;
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('This app must be opened as a deployed Google Apps Script web app.'));
      return;
    }
    if (showLoading) setLoading(true);
    google.script.run
      .withSuccessHandler(function (result) { if (showLoading) setLoading(false); resolve(result); })
      .withFailureHandler(function (err) { if (showLoading) setLoading(false); reject(err); })
      [fnName].apply(null, args);
  });
}

function toast(message, type) {
  var host = document.getElementById('toastHost');
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  host.appendChild(el);
  setTimeout(function () { el.remove(); }, 4200);
}
function toastError(err) { toast(err && err.message ? err.message : String(err), 'error'); }

function openModal(innerHtml, opts) {
  opts = opts || {};
  var host = document.getElementById('modalHost');
  host.innerHTML = '<div class="modalOverlay" id="__modalOverlay"><div class="modalBox' + (opts.wide ? ' wide' : '') + '">' + innerHtml + '</div></div>';
  document.getElementById('__modalOverlay').addEventListener('click', function (e) { if (e.target.id === '__modalOverlay' && !opts.persistent) closeModal(); });
}
function closeModal() { document.getElementById('modalHost').innerHTML = ''; }

function esc(s) { var d = document.createElement('div'); d.textContent = (s === undefined || s === null) ? '' : String(s); return d.innerHTML; }
function fmtMoney(n) { var sym = (state.settings && state.settings.Currency) || 'GH₵'; return sym + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDateNice(dateStr) { if (!dateStr) return ''; try { var d = new Date(dateStr + 'T12:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return dateStr; } }
function fmtDateShort(dateStr) { if (!dateStr) return ''; try { var d = new Date(dateStr.slice(0, 10) + 'T12:00:00'); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); } catch (e) { return dateStr; } }
function slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
function badgeClass(status) { return 'badge badge-' + slugify(status); }
function debounce(fn, ms) { var t; return function () { var args = arguments, ctx = this; clearTimeout(t); t = setTimeout(function () { fn.apply(ctx, args); }, ms); }; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ============================================================================
 * INIT / ROUTER
 * ==========================================================================*/
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', init);

function init() {
  var visitorKey = localStorage.getItem('at_visitor') || (Date.now() + '-' + Math.random().toString(36).slice(2));
  localStorage.setItem('at_visitor', visitorKey);
  api('trackVisit', visitorKey).catch(function () {});

  api('getPublicData').then(function (data) {
    state.publicData = data;
    state.settings = data.settings;
    applyTheme(data.settings);
    if (state.token) {
      api('getCurrentUser', state.token).then(function (user) {
        state.user = user;
        route();
      }).catch(function () { state.token = null; localStorage.removeItem('at_token'); route(); });
    } else {
      route();
    }
  }).catch(function (err) {
    document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;">Unable to load. ' + esc(err.message) + '</div>';
  });
}

function applyTheme(s) {
  var root = document.documentElement.style;
  root.setProperty('--clr-primary', s.PrimaryColor || '#16213e');
  root.setProperty('--clr-secondary', s.SecondaryColor || '#c9a227');
  root.setProperty('--clr-accent', s.AccentColor || '#c9a227');
  root.setProperty('--clr-bg', s.BackgroundColor || '#f7f5f0');
  root.setProperty('--clr-text', s.TextColor || '#1a1a1a');
  document.title = (s.BusinessName || 'Advance Tailor') + ' — Bespoke Fashion House';
}

function route() {
  var hash = location.hash || '#home';
  if (hash.indexOf('#admin') === 0) {
    if (!state.user) { renderLogin(); return; }
    renderAdminShell();
  } else {
    renderPublicSite();
    setTimeout(function () {
      if (hash && hash !== '#home' && hash !== '#') {
        var target = document.querySelector(hash);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      } else { window.scrollTo(0, 0); }
    }, 30);
  }
}

function goAdmin(page) {
  state.adminPage = page;
  location.hash = '#admin';
  renderAdminShell();
}

/* ============================================================================
 * PUBLIC SITE
 * ==========================================================================*/
var svcFilter = 'All';

function renderPublicSite() {
  var d = state.publicData;
  if (!d) return;
  var s = d.settings;
  document.getElementById('app').innerHTML =
    renderPublicNav(d) +
    (String(s.ShowGreetingBanner).toUpperCase() === 'Y' ? '<div id="greetingBanner">' + esc(s.Tagline || '') + ' &nbsp;•&nbsp; ' + waLink(s, 'Chat with us on WhatsApp') + '</div>' : '') +
    renderHero(d.heroSlides, s) +
    renderAbout(d, s) +
    renderServicesSection(d) +
    (String(s.ShowTeamSection).toUpperCase() === 'Y' ? renderStaffSection(d.staff) : '') +
    renderGallerySection(d.gallery) +
    (d.videos && d.videos.length ? renderVideosSection(d.videos) : '') +
    renderReviewsSection(d.reviews) +
    renderBookingSection(d) +
    renderTrackSection() +
    renderContactSection(d, s) +
    renderPublicFooter(d, s) +
    waFab(s);

  bindPublicNavEvents();
  startHeroRotation(d.heroSlides.length);
  bindReviewForm();
}

function waNumber(s) { return (s.WhatsAppNumber || '').replace(/[^\d]/g, ''); }
function waLink(s, label) { return '<a href="https://wa.me/' + waNumber(s) + '" target="_blank" style="text-decoration:underline;">' + esc(label) + '</a>'; }
function waFab(s) {
  if (!s.WhatsAppNumber) return '';
  return '<a class="whatsappFab" href="https://wa.me/' + waNumber(s) + '" target="_blank" title="Chat on WhatsApp">' +
    '<svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.5 7.8 9.3 7.3c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.2L2 22l4.9-1.3C8.5 21.6 10.2 22 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.5-1.2l-.3-.2-3 .8.8-2.9-.2-.3C4 15 3.4 13.5 3.4 12c0-4.7 3.9-8.6 8.6-8.6s8.6 3.9 8.6 8.6-3.9 8.6-8.6 8.6z"/></svg></a>';
}

function renderPublicNav(d) {
  var s = d.settings;
  return '<header id="publicNav"><div class="bar container">' +
    '<div class="brand">' + (s.LogoURL ? '<img src="' + s.LogoURL + '">' : '') + esc(s.BusinessName || 'Advance Tailor') + '</div>' +
    '<button id="navToggle">&#9776;</button>' +
    '<nav id="pubNavLinks">' +
      '<a href="#services">Services</a><a href="#staff">Our Team</a><a href="#gallery">Portfolio</a><a href="#reviews">Reviews</a>' +
      '<a href="#track">Track Order</a><a href="#contact">Contact</a>' +
      '<span class="shopStatusBadge ' + (d.shopStatus.open ? 'open' : 'closed') + '"><span class="dot"></span>' + (d.shopStatus.open ? 'Open now' : 'Closed now') + '</span>' +
      '<a href="#booking" class="btn btn-accent btn-sm">Book a Fitting</a>' +
      '<a onclick="location.hash=\'#admin\'" class="btn btn-outline-light btn-sm">Staff Login</a>' +
    '</nav></div></header>';
}
function bindPublicNavEvents() {
  var toggle = document.getElementById('navToggle');
  if (toggle) toggle.addEventListener('click', function () { document.getElementById('pubNavLinks').classList.toggle('open'); });
  document.querySelectorAll('#pubNavLinks a').forEach(function (a) { a.addEventListener('click', function () { document.getElementById('pubNavLinks').classList.remove('open'); }); });
}

var heroTimer = null, heroIdx = 0;
function renderHero(slides, s) {
  if (!slides || !slides.length) {
    return '<section id="hero" style="background:linear-gradient(135deg,var(--clr-primary),#0e1526);"><div class="heroContent"><h1>' + esc(s.BusinessName) + '</h1><p>' + esc(s.Tagline) + '</p><div class="heroBtns"><a href="#booking" class="btn btn-accent">Book a Fitting</a></div></div></section>';
  }
  return '<section id="hero">' +
    slides.map(function (sl, i) { return '<div class="slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" style="background-image:url(\'' + sl.ImageURL + '\')"></div>'; }).join('') +
    '<div class="heroContent"><h1 id="heroTitle">' + esc(slides[0].Title) + '</h1><p id="heroSub">' + esc(slides[0].Subtitle) + '</p>' +
    '<div class="heroBtns"><a href="' + esc(slides[0].ButtonLink || '#booking') + '" id="heroBtn" class="btn btn-accent">' + esc(slides[0].ButtonText || 'Book Now') + '</a><a href="#services" class="btn btn-outline-light">View Services</a></div></div>' +
    '<div class="dots">' + slides.map(function (sl, i) { return '<span data-i="' + i + '" class="' + (i === 0 ? 'active' : '') + '" onclick="setHeroSlide(' + i + ')"></span>'; }).join('') + '</div>' +
    '</section>';
}
function startHeroRotation(count) {
  clearInterval(heroTimer); heroIdx = 0;
  if (count <= 1) return;
  heroTimer = setInterval(function () { setHeroSlide((heroIdx + 1) % count); }, 6000);
}
function setHeroSlide(i) {
  heroIdx = i;
  var slides = state.publicData.heroSlides;
  document.querySelectorAll('#hero .slide').forEach(function (el) { el.classList.toggle('active', Number(el.dataset.i) === i); });
  document.querySelectorAll('#hero .dots span').forEach(function (el) { el.classList.toggle('active', Number(el.dataset.i) === i); });
  var sl = slides[i];
  var titleEl = document.getElementById('heroTitle'), subEl = document.getElementById('heroSub'), btnEl = document.getElementById('heroBtn');
  if (titleEl) titleEl.textContent = sl.Title;
  if (subEl) subEl.textContent = sl.Subtitle;
  if (btnEl) { btnEl.textContent = sl.ButtonText || 'Book Now'; btnEl.setAttribute('href', sl.ButtonLink || '#booking'); }
}

function renderAbout(d, s) {
  return '<section class="pubSection" id="about"><div class="container" style="display:flex;gap:40px;flex-wrap:wrap;align-items:center;">' +
    '<div style="flex:1;min-width:280px;"><span class="eyebrow" style="color:var(--clr-secondary);font-weight:800;text-transform:uppercase;font-size:.78rem;">About Us</span>' +
    '<h2>Ghana\'s Trusted Made-to-Measure Tailoring House</h2>' +
    '<p>' + esc(s.BusinessName) + ' brings together master tailors and seamstresses to craft suits, traditional wear, bridal gowns and everyday garments — cut and sewn to your exact measurements, from consultation to delivery.</p>' +
    '<div style="display:flex;gap:28px;margin-top:20px;flex-wrap:wrap;">' +
    '<div><div style="font-size:1.8rem;font-weight:800;color:var(--clr-primary);font-family:var(--font-display);">' + (d.services.length) + '+</div><div class="muted">Garment services</div></div>' +
    '<div><div style="font-size:1.8rem;font-weight:800;color:var(--clr-primary);font-family:var(--font-display);">' + (d.staff.length) + '</div><div class="muted">Skilled tailors</div></div>' +
    '<div><div style="font-size:1.8rem;font-weight:800;color:var(--clr-primary);font-family:var(--font-display);">' + (d.reviews.length ? (d.reviews.reduce(function (sum, r) { return sum + Number(r.Rating); }, 0) / d.reviews.length).toFixed(1) : '5.0') + '★</div><div class="muted">Customer rating</div></div>' +
    '</div></div></div></section>';
}

function renderServicesSection(d) {
  var cats = ['All'].concat(d.serviceCategories);
  var filtered = svcFilter === 'All' ? d.services : d.services.filter(function (s) { return s.Category === svcFilter; });
  return '<section class="pubSection alt" id="services"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">What We Offer</span><h2>Our Tailoring Services</h2><p class="muted">Every piece is cut, fitted and finished by hand.</p></div>' +
    '<div class="svcFilterRow">' + cats.map(function (c) { return '<button class="chip' + (c === svcFilter ? ' active' : '') + '" onclick="setSvcFilter(\'' + esc(c).replace(/'/g, "\\'") + '\')">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<div class="grid grid-4">' + filtered.map(renderServiceCard).join('') + '</div>' +
    (!filtered.length ? '<div class="emptyState">No services in this category yet.</div>' : '') +
    '</div></section>';
}
function setSvcFilter(c) { svcFilter = c; renderPublicSite(); location.hash = '#services'; }
function renderServiceCard(s) {
  return '<div class="card svcCard"><div class="thumb" style="background-image:url(\'' + (s.ImageURL || '') + '\')"></div>' +
    '<div class="body"><span class="catTag">' + esc(s.Category) + '</span><h3 style="font-size:1.05rem;">' + esc(s.Name) + '</h3>' +
    '<p class="muted" style="font-size:.85rem;">' + esc(s.Description || '') + '</p>' +
    '<div class="priceRow"><span class="price">' + fmtMoney(s.Price) + '</span><span class="muted">~' + esc(s.TurnaroundDays) + ' days</span></div>' +
    '<a href="#booking" class="btn btn-block btn-sm" style="margin-top:12px;" onclick="preselectService(\'' + s.ServiceID + '\')">Book This</a></div></div>';
}
function preselectService(id) { state.wizard.serviceId = id; }

function renderStaffSection(staff) {
  return '<section class="pubSection" id="staff"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">Meet The Makers</span><h2>Our Tailors &amp; Seamstresses</h2></div>' +
    '<div class="grid grid-4">' + staff.map(function (s) {
      return '<div class="card staffCard"><img class="photo" src="' + (s.PhotoURL || '') + '" onerror="this.style.background=\'#eee\'">' +
        '<h3 style="font-size:1rem;">' + esc(s.Name) + '</h3><div class="role">' + esc(s.Role) + '</div><div class="spec">' + esc(s.Specialties || '') + '</div></div>';
    }).join('') + '</div></div></section>';
}

function renderGallerySection(gallery) {
  return '<section class="pubSection alt" id="gallery"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">Our Work</span><h2>Portfolio</h2></div>' +
    '<div class="galleryGrid">' + gallery.slice(0, 12).map(function (g) {
      return '<div class="galleryItem"><img src="' + g.ImageURL + '"><div class="cap">' + esc(g.Caption) + '</div></div>';
    }).join('') + '</div></div></section>';
}

function renderVideosSection(videos) {
  return '<section class="pubSection" id="videos"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">In Motion</span><h2>Behind The Scenes</h2></div>' +
    '<div class="grid grid-3">' + videos.map(function (v) {
      return '<div class="card"><video src="' + v.VideoURL + '" controls style="width:100%;display:block;"></video><div style="padding:12px;"><strong>' + esc(v.Title) + '</strong><p class="muted" style="margin:4px 0 0;">' + esc(v.Caption || '') + '</p></div></div>';
    }).join('') + '</div></div></section>';
}

function renderReviewsSection(reviews) {
  return '<section class="pubSection alt" id="reviews"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">Testimonials</span><h2>What Our Customers Say</h2></div>' +
    '<div class="reviewScroller">' + reviews.map(function (r) {
      return '<div class="card reviewCard"><div class="stars">' + '★'.repeat(Number(r.Rating)) + '☆'.repeat(5 - Number(r.Rating)) + '</div><p>&ldquo;' + esc(r.Comment) + '&rdquo;</p>' +
        '<div class="who"><span>' + esc(r.CustomerName) + '</span><span class="muted">' + esc(r.StaffName || '') + '</span></div></div>';
    }).join('') + '</div>' +
    '<div style="text-align:center;margin-top:26px;"><button class="btn btn-outline" onclick="openReviewModal()">Leave a Review</button></div>' +
    '</div></section>';
}
function openReviewModal() {
  var staffOptions = state.publicData.staff.map(function (s) { return '<option value="' + s.StaffID + '">' + esc(s.Name) + '</option>'; }).join('');
  openModal('<div class="modalHead"><h3>Leave a Review</h3><button class="modalClose" onclick="closeModal()">&times;</button></div>' +
    '<form id="reviewForm">' +
    '<div class="field"><label>Your Name</label><input type="text" name="name" required></div>' +
    '<div class="field"><label>Phone</label><input type="tel" name="phone" required placeholder="024XXXXXXX"></div>' +
    '<div class="field"><label>Which tailor served you? (optional)</label><select name="staffId"><option value="">—</option>' + staffOptions + '</select></div>' +
    '<div class="field"><label>Rating</label><select name="rating" required><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Okay</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select></div>' +
    '<div class="field"><label>Comment</label><textarea name="comment" required></textarea></div>' +

/* ============================================================================
 * BOOKING WIZARD (public fitting/consultation booking)
 * ==========================================================================*/
var WIZ_STEPS = ['service', 'staff', 'slot', 'details', 'payment', 'done'];
var WIZ_LABELS = { service: 'Service', staff: 'Tailor', slot: 'Date & Time', details: 'Your Details', payment: 'Payment', done: 'Done' };

function renderBookingSection(d) {
  return '<section class="pubSection" id="booking"><div class="container">' +
    '<div class="sectionHead"><span class="eyebrow">Book Online</span><h2>Book a Fitting or Consultation</h2><p class="muted" style="opacity:.8;">Pick a service, choose your tailor, and lock in a time — in under a minute.</p></div>' +
    '<div class="wizardBox" id="wizardBox"></div>' +
    '</div></section>';
}
function renderWizard() {
  var box = document.getElementById('wizardBox');
  if (!box) return;
  var w = state.wizard;
  var stepsHtml = WIZ_STEPS.map(function (s, i) {
    var curIdx = WIZ_STEPS.indexOf(w.step);
    var cls = s === w.step ? 'active' : (i < curIdx ? 'done' : '');
    return '<div class="step ' + cls + '">' + (i + 1) + '. ' + WIZ_LABELS[s] + '</div>';
  }).join('');
  box.innerHTML = '<div class="wizardSteps">' + stepsHtml + '</div><div class="wizardBody" id="wizardStepBody"></div>';
  renderWizardStep(w.step);
}
function wizGoto(step) { state.wizard.step = step; renderWizard(); }

function renderWizardStep(stepKey) {
  var host = document.getElementById('wizardStepBody');
  var d = state.publicData, w = state.wizard;
  if (stepKey === 'service') {
    host.innerHTML = '<h3>Choose a service</h3><div class="optionGrid">' + d.services.map(function (s) {
      return '<div class="optionCard' + (w.serviceId === s.ServiceID ? ' selected' : '') + '" onclick="wizPickService(\'' + s.ServiceID + '\')"><div class="oc-title">' + esc(s.Name) + '</div><div class="oc-sub">' + fmtMoney(s.Price) + ' · ~' + s.TurnaroundDays + ' days</div></div>';
    }).join('') + '</div>';
  } else if (stepKey === 'staff') {
    var eligible = d.staff;
    host.innerHTML = '<h3>Choose your tailor</h3><div class="optionGrid">' + eligible.map(function (s) {
      return '<div class="optionCard' + (w.staffId === s.StaffID ? ' selected' : '') + '" onclick="wizPickStaff(\'' + s.StaffID + '\')"><div class="oc-title">' + esc(s.Name) + '</div><div class="oc-sub">' + esc(s.Role) + ' · ' + esc(s.Specialties || '') + '</div></div>';
    }).join('') + '</div>' + wizardNav(true, false);
  } else if (stepKey === 'slot') {
    var minDate = todayStr();
    host.innerHTML = '<h3>Choose date &amp; time</h3>' +
      '<div class="field"><label>Date</label><input type="date" id="wizDate" min="' + minDate + '" value="' + (w.date || '') + '"></div>' +
      '<div id="wizSlots" class="slotGrid" style="margin-top:10px;"></div>' + wizardNav(true, false);
    document.getElementById('wizDate').addEventListener('change', wizLoadSlots);
    if (w.date) wizLoadSlots();
  } else if (stepKey === 'details') {
    host.innerHTML = '<h3>Your details</h3>' +
      '<div class="form-row"><div class="field"><label>Full Name</label><input type="text" id="wizName" value="' + esc(w.name) + '"></div>' +
      '<div class="field"><label>Phone</label><input type="tel" id="wizPhone" value="' + esc(w.phone) + '" placeholder="024XXXXXXX"></div></div>' +
      '<div class="form-row"><div class="field"><label>Email (optional)</label><input type="email" id="wizEmail" value="' + esc(w.email) + '"></div>' +
      '<div class="field"><label>Appointment type</label><select id="wizType">' + ['Consultation', 'Measurement Session', 'Fitting'].map(function (t) { return '<option' + (w.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="field"><label>Notes (optional)</label><textarea id="wizNotes">' + esc(w.notes) + '</textarea></div>' +
      wizardNav(true, true);
  } else if (stepKey === 'payment') {
    var svc = d.services.find(function (s) { return s.ServiceID === w.serviceId; });
    var methods = String(d.settings.ActivePaymentMethods || '').split(',').map(function (m) { return m.trim(); }).filter(Boolean);
    host.innerHTML = '<h3>Confirm &amp; pay deposit (optional)</h3>' +
      '<p class="muted">You may pay a deposit now via mobile money, or simply pay Cash at the shop.</p>' +
      '<div class="paymentMethodGrid">' + methods.map(function (m) {
        return '<div class="optionCard' + (w.paymentMethod === m ? ' selected' : '') + '" onclick="wizPickPayment(\'' + m + '\')"><div class="oc-title">' + esc(m) + '</div></div>';
      }).join('') + '</div>' +
      '<div id="wizPayDetail">' + paymentDetailHtml(w.paymentMethod, d.settings) + '</div>' +
      (w.paymentMethod !== 'Cash' ? '<div class="field" style="margin-top:14px;"><label>Upload payment screenshot (optional)</label><input type="file" id="wizProof" accept="image/*"></div>' : '') +
      '<div class="panel" style="margin-top:16px;background:#f7f5f0;box-shadow:none;"><strong>' + esc(svc ? svc.Name : '') + '</strong><div class="muted">' + fmtDateNice(w.date) + ' at ' + esc(w.timeSlot || '') + '</div></div>' +
      wizardNav(true, true, 'Confirm Booking');
  } else if (stepKey === 'done') {
    host.innerHTML = renderBookingSuccess(w.result || {});
  }
}
function wizardNav(showBack, showNext, nextLabel) {
  return '<div class="wizardNav">' +
    (showBack ? '<button class="btn btn-outline" onclick="wizBack()">Back</button>' : '<span></span>') +
    (showNext ? '<button class="btn btn-accent" onclick="wizNext()">' + (nextLabel || 'Continue') + '</button>' : '<span></span>') +
    '</div>';
}
function wizPickService(id) { state.wizard.serviceId = id; wizGoto('staff'); }
function wizPickStaff(id) { state.wizard.staffId = id; wizGoto('slot'); }
function wizPickPayment(m) { state.wizard.paymentMethod = m; document.getElementById('wizPayDetail').innerHTML = paymentDetailHtml(m, state.publicData.settings); renderWizardStep('payment'); }
function paymentDetailHtml(method, s) {
  if (method === 'Cash' || !method) return '';
  var map = {
    'MTN MoMo': [s.MomoName, s.MomoNumber], 'Vodafone Cash': [s.VodafoneCashName, s.VodafoneCashNumber],
    'Telecel Cash': [s.TelecelCashName, s.TelecelCashNumber], 'AirtelTigo Money': [s.AirtelTigoMoneyName, s.AirtelTigoMoneyNumber],
    'Bank Transfer': [s.BankAccountName, s.BankAccountNumber, s.BankName]
  };
  var info = map[method];
  if (!info || !info[1]) return '<div class="payDetailBox">Payment details for ' + esc(method) + ' have not been set up yet — you can pay Cash at the shop instead.</div>';
  return '<div class="payDetailBox">Send to <strong>' + esc(info[0] || '') + '</strong><br>' + (method === 'Bank Transfer' ? esc(info[2] || '') + ' — ' : '') + 'Account/Number: <strong>' + esc(info[1]) + '</strong></div>';
}
function wizLoadSlots() {
  var date = document.getElementById('wizDate').value;
  state.wizard.date = date;
  if (!date) return;
  var branchId = state.publicData.branch.BranchID;
  api('getAvailableSlots', branchId, state.wizard.staffId, date).then(function (slots) {
    var host = document.getElementById('wizSlots');
    if (!slots.length) { host.innerHTML = '<div class="emptyState" style="grid-column:1/-1;">No slots available this day. Try another date.</div>'; return; }
    host.innerHTML = slots.map(function (sl) { return '<div class="slotBtn' + (state.wizard.timeSlot === sl ? ' selected' : '') + '" onclick="wizPickSlot(\'' + sl + '\')">' + sl + '</div>'; }).join('');
  }).catch(toastError);
}
function wizPickSlot(sl) {
  state.wizard.timeSlot = sl;
  document.querySelectorAll('#wizSlots .slotBtn').forEach(function (el) { el.classList.toggle('selected', el.textContent === sl); });
}
function wizBack() {
  var idx = WIZ_STEPS.indexOf(state.wizard.step);
  if (idx > 0) wizGoto(WIZ_STEPS[idx - 1]);
}
function wizNext() {
  var w = state.wizard;
  if (w.step === 'staff') { if (!w.staffId) { toast('Please choose a tailor.', 'error'); return; } wizGoto('slot'); }
  else if (w.step === 'slot') { if (!w.date || !w.timeSlot) { toast('Please choose a date and time.', 'error'); return; } wizGoto('details'); }
  else if (w.step === 'details') {
    w.name = document.getElementById('wizName').value.trim();
    w.phone = document.getElementById('wizPhone').value.trim();
    w.email = document.getElementById('wizEmail').value.trim();
    w.type = document.getElementById('wizType').value;
    w.notes = document.getElementById('wizNotes').value.trim();
    if (!w.name || !w.phone) { toast('Please enter your name and phone number.', 'error'); return; }
    wizGoto('payment');
  } else if (w.step === 'payment') {
    submitBooking();
  }
}
function submitBooking() {
  var w = state.wizard;
  var fileInput = document.getElementById('wizProof');
  var proceed = function (proofUrl) {
    w.paymentProofUrl = proofUrl || '';
    api('createAppointment', { name: w.name, phone: w.phone, email: w.email, serviceId: w.serviceId, staffId: w.staffId, date: w.date, timeSlot: w.timeSlot, type: w.type, notes: w.notes, paymentMethod: w.paymentMethod, paymentProofUrl: w.paymentProofUrl })
      .then(function (res) { w.result = res; wizGoto('done'); })
      .catch(toastError);
  };
  if (fileInput && fileInput.files[0]) {
    var reader = new FileReader();
    reader.onload = function () {
      api('uploadPaymentProof', reader.result, fileInput.files[0].name, fileInput.files[0].type).then(function (r) { proceed(r.url); }).catch(function (e) { toastError(e); proceed(''); });
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else { proceed(''); }
}
function renderBookingSuccess(res) {
  return '<div class="successBox"><div style="font-size:3rem;">✅</div><h3>Booking Received!</h3>' +
    '<p class="muted">We\'ll confirm your appointment shortly by SMS/Email.</p>' +
    '<div class="refCode">' + esc(res.reference || '') + '</div>' +
    '<p class="muted">Save this reference to track or manage your booking.</p>' +
    '<button class="btn btn-accent" onclick="resetWizard()">Book Another</button></div>';
}
function resetWizard() {
  state.wizard = { step: 'service', serviceId: null, staffId: null, date: null, timeSlot: null, name: '', phone: '', email: '', notes: '', paymentMethod: 'Cash', paymentProofUrl: '' };
  renderWizard();
}

function renderTrackSection() {
  return '<section class="pubSection alt" id="track"><div class="container" style="max-width:640px;">' +
    '<div class="sectionHead"><span class="eyebrow">Order Status</span><h2>Track My Order</h2><p class="muted">Enter your order reference or phone number to see progress.</p></div>' +
    '<div class="form-row"><div class="field" style="flex:2;"><input type="text" id="trackInput" placeholder="Order reference (e.g. ORD250101-1234) or phone number"></div>' +
    '<div class="field" style="flex:0 0 auto;"><button class="btn btn-accent" onclick="doTrackLookup()">Track</button></div></div>' +
    '<div id="trackResults"></div></div></section>';
}
function doTrackLookup() {
  var val = document.getElementById('trackInput').value.trim();
  var host = document.getElementById('trackResults');
  if (!val) { toast('Please enter a reference or phone number.', 'error'); return; }
  host.innerHTML = '<p class="muted">Searching…</p>';
  if (/^\d[\d\s+-]{6,}$/.test(val)) {
    api('lookupMyOrders', val).then(function (orders) {
      if (!orders.length) { host.innerHTML = '<div class="emptyState">No orders found for that phone number.</div>'; return; }
      host.innerHTML = orders.map(renderOrderTrackCard).join('');
    }).catch(function (e) { host.innerHTML = '<div class="emptyState">' + esc(e.message) + '</div>'; });
  } else {
    api('lookupOrderByReference', val).then(function (o) { host.innerHTML = renderOrderTrackCard(o); })
      .catch(function () {
        api('lookupBookingByReference', val).then(function (b) { host.innerHTML = renderBookingTrackCard(b); })
          .catch(function (e) { host.innerHTML = '<div class="emptyState">' + esc(e.message) + '</div>'; });
      });
  }
}
function renderOrderTrackCard(o) {
  var stages = ['Order Received', 'Measuring', 'Cutting', 'Sewing', 'Fitting', 'Finishing', 'Ready for Pickup', 'Delivered'];
  var idx = o.StageIndex >= 0 ? o.StageIndex : 0;
  var isCancelled = o.Status === 'Cancelled';
  return '<div class="trackResultCard"><div style="display:flex;justify-content:space-between;align-items:center;">' +
    '<div><strong>' + esc(o.Reference) + '</strong><div class="muted">' + esc(o.ServiceName) + '</div></div>' +
    '<span class="' + badgeClass(o.Status) + '">' + esc(o.Status) + '</span></div>' +
    (isCancelled ? '' : '<div class="stageTrack">' + stages.map(function (st, i) {
      return (i > 0 ? '<div class="stageLine' + (i <= idx ? ' done' : '') + '"></div>' : '') + '<div class="stageDot' + (i <= idx ? ' done' : '') + '"></div>';
    }).join('') + '</div><div class="stageLabels">' + stages.map(function (st) { return '<span>' + st + '</span>'; }).join('') + '</div>') +
    '<div class="form-row" style="margin-top:16px;"><div><div class="muted">Order Date</div><strong>' + fmtDateShort(o.OrderDate) + '</strong></div>' +
    '<div><div class="muted">Due Date</div><strong>' + fmtDateShort(o.DueDate) + '</strong></div>' +
    '<div><div class="muted">Balance Due</div><strong>' + fmtMoney(Number(o.Price || 0) - Number(o.AmountPaid || 0)) + '</strong></div></div></div>';
}
function renderBookingTrackCard(b) {
  return '<div class="trackResultCard"><div style="display:flex;justify-content:space-between;align-items:center;">' +
    '<div><strong>' + esc(b.Reference) + '</strong><div class="muted">' + esc(b.ServiceName) + ' with ' + esc(b.StaffName) + '</div></div>' +
    '<span class="' + badgeClass(b.Status) + '">' + esc(b.Status) + '</span></div>' +
    '<div class="form-row" style="margin-top:16px;"><div><div class="muted">Date</div><strong>' + fmtDateShort(b.Date) + '</strong></div><div><div class="muted">Time</div><strong>' + esc(b.TimeSlot) + '</strong></div></div>' +
    (b.Status !== 'Completed' && b.Status !== 'Cancelled' ? '<button class="btn btn-outline btn-sm" style="margin-top:14px;" onclick="cancelTrackedBooking(\'' + b.Reference + '\')">Cancel Booking</button>' : '') +
    '</div>';
}
function cancelTrackedBooking(ref) {
  if (!confirm('Cancel this booking?')) return;
  api('cancelBookingByReference', ref).then(function () { toast('Booking cancelled.', 'success'); doTrackLookup(); }).catch(toastError);
}

    });
  }
}
function logoutUser() {

/* ---- Shared table/pagination helper ---- */
var tableState = {};
function renderTable(headers, rows, pageKey, pageSize) {
  pageSize = pageSize || 10;
  if (!tableState[pageKey]) tableState[pageKey] = 1;
  var page = tableState[pageKey];
  var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page > totalPages) page = totalPages;
  var pageRows = rows.slice((page - 1) * pageSize, page * pageSize);
  var thead = '<tr>' + headers.map(function (h) { return '<th>' + h.label + '</th>'; }).join('') + '</tr>';
  var tbody = pageRows.map(function (row) {
    return '<tr>' + headers.map(function (h) { return '<td>' + (h.render ? h.render(row) : esc(row[h.key])) + '</td>'; }).join('') + '</tr>';
  }).join('');
  var pager = '';
  if (totalPages > 1) {
    pager = '<div class="pager">';
    for (var i = 1; i <= totalPages; i++) pager += '<button class="' + (i === page ? 'active' : '') + '" onclick="tableState[\'' + pageKey + '\']=' + i + ';renderAdminPage()">' + i + '</button>';
    pager += '</div>';
  }
  return '<div class="tableWrap"><table class="dataTable"><thead>' + thead + '</thead><tbody>' + (tbody || '') + '</tbody></table></div>' +
    (!rows.length ? '<div class="emptyState">No records found.</div>' : '') + pager;
}

    .then(function (r) { apptsCache = { rows: r[0], services: r[1], staff: r[2], customers: r[3] }; drawAppointments(host); })
    .catch(function (e) { host.innerHTML = '<div class="emptyState">' + esc(e.message) + '</div>'; });
}
function drawAppointments(host) {
  host.innerHTML = '<div class="toolbar"><div class="left">' +
    '<div class="searchBox"><input type="text" id="apptSearch" placeholder="Search appointments…"></div>' +
    '<select id="apptStatusFilter"><option value="">All statuses</option>' + APPT_STATUSES.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
    '<button class="chip' + (apptsView === 'table' ? ' active' : '') + '" onclick="apptsView=\'table\';drawAppointments(document.getElementById(\'adminContent\'))">Table</button>' +
    '<button class="chip' + (apptsView === 'kanban' ? ' active' : '') + '" onclick="apptsView=\'kanban\';drawAppointments(document.getElementById(\'adminContent\'))">Kanban</button>' +
    '</div><button class="btn btn-accent" onclick="openApptForm()">+ New Appointment</button></div>' +
    '<div id="apptsBody"></div>';
  document.getElementById('apptSearch').addEventListener('input', debounce(function (e) { window.__apptSearch = e.target.value; filterAndDrawAppts(); }, 250));
  document.getElementById('apptStatusFilter').addEventListener('change', function (e) { window.__apptStatusFilter = e.target.value; filterAndDrawAppts(); });
  filterAndDrawAppts();
}
var APPT_STATUSES = ['Pending', 'Confirmed', 'Completed', 'Cancelled', 'No-Show'];
var APPT_TYPES_JS = ['Consultation', 'Measurement Session', 'Fitting', 'Delivery/Pickup'];
function filterAndDrawAppts() {
  var q = (window.__apptSearch || '').toLowerCase();
  var statusF = window.__apptStatusFilter || '';
  var rows = apptsCache.rows.filter(function (a) {
    if (statusF && a.Status !== statusF) return false;
    if (!q) return true;
    return (a.CustomerName || '').toLowerCase().indexOf(q) > -1 || (a.Reference || '').toLowerCase().indexOf(q) > -1;
  });
  var body = document.getElementById('apptsBody');
  body.innerHTML = apptsView === 'table' ? renderApptsTable(rows) : renderApptsKanban(rows);
}
function renderApptsTable(rows) {
  return renderTable([
    { label: 'Ref', key: 'Reference' }, { label: 'Customer', key: 'CustomerName' }, { label: 'Service', key: 'ServiceName' }, { label: 'Tailor', key: 'StaffName' },
    { label: 'Date', render: function (a) { return fmtDateShort(a.Date) + ' ' + a.TimeSlot; } }, { label: 'Type', key: 'Type' },
    { label: 'Status', render: function (a) { return '<span class="' + badgeClass(a.Status) + '">' + a.Status + '</span>'; } },
    { label: '', render: function (a) { return '<div class="rowActions">' + apptStatusButtons(a) + '</div>'; } }
  ], rows, 'appts-table');
}
function apptStatusButtons(a) {
  var opts = APPT_STATUSES.map(function (s) { return '<option' + (s === a.Status ? ' selected' : '') + '>' + s + '</option>'; }).join('');
  return '<select onchange="setApptStatus(\'' + a.AppointmentID + '\', this.value)">' + opts + '</select>';
}
function setApptStatus(id, status) {
  api('updateAppointmentStatus', state.token, id, status).then(function () { toast('Status updated.', 'success'); renderAppointmentsPage(document.getElementById('adminContent')); loadNotifBell(); }).catch(toastError);
}
function renderApptsKanban(rows) {
  return '<div class="kanban">' + APPT_STATUSES.map(function (status) {
    var items = rows.filter(function (a) { return a.Status === status; });
    return '<div class="kanbanCol"><h4>' + status + '<span>' + items.length + '</span></h4>' +
      items.map(function (a) { return '<div class="kanbanCard"><div class="kc-ref">' + esc(a.Reference) + '</div><div class="kc-sub">' + esc(a.CustomerName) + '<br>' + esc(a.ServiceName) + '</div><div class="kc-due">' + fmtDateShort(a.Date) + ' ' + a.TimeSlot + '</div>' + apptStatusButtons(a) + '</div>'; }).join('') +
      '</div>';
  }).join('') + '</div>';
}
function openApptForm() {
  var svcOptions = apptsCache.services.map(function (s) { return '<option value="' + s.ServiceID + '">' + esc(s.Name) + '</option>'; }).join('');
  var staffOptions = apptsCache.staff.map(function (s) { return '<option value="' + s.StaffID + '">' + esc(s.Name) + '</option>'; }).join('');
  var custOptions = apptsCache.customers.map(function (c) { return '<option value="' + c.CustomerID + '">' + esc(c.Name) + ' (' + esc(c.Phone) + ')</option>'; }).join('');
  openModal('<div class="modalHead"><h3>New Appointment</h3><button class="modalClose" onclick="closeModal()">&times;</button></div>' +
    '<form id="apptForm">' +
    '<div class="field"><label>Customer</label><select name="customerId" required><option value="">Choose…</option>' + custOptions + '</select></div>' +
    '<div class="form-row"><div class="field"><label>Service</label><select name="serviceId" required>' + svcOptions + '</select></div>' +
    '<div class="field"><label>Tailor</label><select name="staffId" required>' + staffOptions + '</select></div></div>' +
    '<div class="form-row"><div class="field"><label>Date</label><input type="date" name="date" required></div>' +
    '<div class="field"><label>Time</label><input type="time" name="timeSlot" required></div></div>' +
    '<div class="field"><label>Type</label><select name="type">' + APPT_TYPES_JS.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label>Notes</label><textarea name="notes"></textarea></div>' +
    '<button class="btn btn-block btn-accent" type="submit">Create Appointment</button></form>');
  document.getElementById('apptForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var payload = Object.fromEntries(new FormData(e.target).entries());
    api('createAppointmentAdmin', state.token, payload).then(function () { toast('Appointment created.', 'success'); closeModal(); renderAppointmentsPage(document.getElementById('adminContent')); }).catch(toastError);

function renderSlotsAdmin(host) {
  var date = window.__slotsDate || todayStr();
  host.innerHTML = '<div class="panel"><div class="field" style="max-width:220px;"><label>Date</label><input type="date" id="slotsDateInput" value="' + date + '"></div>' +
    '<p class="muted">Click a slot to block/unblock it for online booking. Slots already booked can\'t be blocked.</p>' +
    '<div id="slotsGrid" class="slotGrid" style="max-height:none;"></div></div>';
  document.getElementById('slotsDateInput').addEventListener('change', function (e) { window.__slotsDate = e.target.value; loadSlotsGrid(); });
  loadSlotsGrid();
}
function loadSlotsGrid() {
  var date = window.__slotsDate || todayStr();
  var branchId = state.publicData.branch.BranchID;
  api('getSlotsForAdmin', state.token, branchId, date).then(function (res) {
    var takenSlots = {};
    res.appointments.forEach(function (a) { takenSlots[a.TimeSlot] = a; });
    document.getElementById('slotsGrid').innerHTML = res.slots.map(function (sl) {
      var isBlocked = res.blocked.indexOf(sl) > -1;
      var isTaken = !!takenSlots[sl];
      var cls = isTaken ? 'slotBtn' : (isBlocked ? 'slotBtn selected' : 'slotBtn');
      var style = isTaken ? 'background:#eee;color:#999;cursor:not-allowed;' : '';
      return '<div class="' + cls + '" style="' + style + '" ' + (isTaken ? '' : 'onclick="toggleSlot(\'' + branchId + '\',\'' + date + '\',\'' + sl + '\')"') + ' title="' + (isTaken ? 'Booked' : (isBlocked ? 'Blocked' : 'Available')) + '">' + sl + '</div>';
    }).join('') || '<div class="emptyState">Shop closed this day.</div>';
  }).catch(toastError);
}
function toggleSlot(branchId, date, slot) {
  api('toggleBlockedSlot', state.token, branchId, date, slot).then(function () { loadSlotsGrid(); }).catch(toastError);
}

function openMeasurementForm(customerId, existing) {
  api('getMeasurementTemplates').then(function (templates) {
    var fields = existing ? existing.FieldsParsed : {};
    openModal('<div class="modalHead"><h3>' + (existing ? 'Edit' : 'Add') + ' Measurement Profile</h3><button class="modalClose" onclick="closeModal()">&times;</button></div>' +
      '<form id="measureForm">' +
      '<div class="form-row"><div class="field"><label>Profile Name</label><input type="text" name="ProfileName" required placeholder="e.g. Wedding Suit" value="' + (existing ? esc(existing.ProfileName) : '') + '"></div>' +
      '<div class="field"><label>Garment Template</label><select id="garmentTemplate"><option value="">Custom / blank</option>' + Object.keys(templates).map(function (g) { return '<option value="' + esc(g) + '"' + (existing && existing.Garment === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="field"><label>Gender</label><select name="Gender"><option value="">—</option><option' + (existing && existing.Gender === 'Male' ? ' selected' : '') + '>Male</option><option' + (existing && existing.Gender === 'Female' ? ' selected' : '') + '>Female</option><option' + (existing && existing.Gender === 'Kids' ? ' selected' : '') + '>Kids</option></select></div>' +
      '<label>Measurements (' + (state.settings.MeasurementUnit || 'inches') + ')</label><div id="measureFields">' + Object.keys(fields).map(function (k) { return measureFieldRow(k, fields[k]); }).join('') + '</div>' +
      '<button type="button" class="btn-sm btn-outline" onclick="addMeasureFieldRow()">+ Add measurement field</button>' +
      '<div class="field" style="margin-top:14px;"><label>Notes</label><textarea name="Notes">' + (existing ? esc(existing.Notes) : '') + '</textarea></div>' +
      '<input type="hidden" name="MeasurementID" value="' + (existing ? existing.MeasurementID : '') + '">' +
      '<input type="hidden" name="CustomerID" value="' + customerId + '">' +
      '<button class="btn btn-block btn-accent" type="submit" style="margin-top:10px;">Save Measurements</button></form>', { wide: true });
    function fillFromTemplate() {
      var g = document.getElementById('garmentTemplate').value;
      if (!g || !templates[g] || !templates[g].length) return;
      document.getElementById('measureFields').innerHTML = templates[g].map(function (k) { return measureFieldRow(k, ''); }).join('');
    }
    document.getElementById('garmentTemplate').addEventListener('change', fillFromTemplate);
    document.getElementById('measureForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      var payload = Object.fromEntries(fd.entries());
      var fieldsObj = {};
      document.querySelectorAll('#measureFields .measureFieldRow').forEach(function (row) {
        var k = row.querySelector('.mf-key').value.trim();
        var v = row.querySelector('.mf-val').value.trim();
        if (k) fieldsObj[k] = v;
      });
      payload.Fields = JSON.stringify(fieldsObj);
      payload.Garment = document.getElementById('garmentTemplate').value;
      api('saveMeasurement', state.token, payload).then(function () { toast('Measurements saved.', 'success'); closeModal(); openCustomerProfile(customerId); }).catch(toastError);
    });
  }).catch(toastError);
}
function measureFieldRow(key, val) {
  return '<div class="measureFieldRow"><input class="mf-key" placeholder="Field (e.g. Chest)" value="' + esc(key || '') + '">' +
    '<input class="mf-val" placeholder="Value" value="' + esc(val || '') + '">' +
    '<button type="button" class="btn-icon" onclick="this.parentElement.remove()">✕</button></div>';
}
function addMeasureFieldRow() {
  document.getElementById('measureFields').insertAdjacentHTML('beforeend', measureFieldRow('', ''));
}
function deleteMeasurementUi(id, customerId) {
  if (!confirm('Delete this measurement profile?')) return;
  api('deleteMeasurement', state.token, id).then(function () { toast('Deleted.', 'success'); openCustomerProfile(customerId); }).catch(toastError);

var posProducts = [];
function renderPOS(host) {
  api('getProducts', state.token).then(function (products) {
    posProducts = products;
    host.innerHTML = '<div class="posLayout"><div>' +
      '<div class="searchBox" style="margin-bottom:14px;"><input type="text" id="posSearch" placeholder="Search fabric, accessories…" style="width:100%;"></div>' +
      '<div class="posItemGrid" id="posItemGrid"></div></div>' +
      '<div class="cartBox"><h3>Cart</h3><div id="cartLines"></div><div id="cartCustomer"></div><div class="cartTotals" id="cartTotals"></div>' +
      '<div class="field" style="margin-top:12px;"><label>Payment Method</label><select id="posPaymentMethod">' + PAYMENT_METHODS_JS.map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Discount (' + (state.settings.Currency || 'GH₵') + ')</label><input type="number" id="posDiscount" value="0" step="0.01"></div>' +
      '<div class="field"><label>Customer phone (optional, for receipt &amp; points)</label><input type="tel" id="posCustPhone" placeholder="024XXXXXXX"></div>' +
      '<div class="field"><label>Customer name (if new)</label><input type="text" id="posCustName" placeholder="Walk-in customer"></div>' +
      '<button class="btn btn-block btn-accent" onclick="checkoutSale()">Complete Sale</button></div></div>';
    renderPosItems();
    renderCart();
    document.getElementById('posSearch').addEventListener('input', debounce(renderPosItems, 200));
  }).catch(function (e) { host.innerHTML = '<div class="emptyState">' + esc(e.message) + '</div>'; });
}
function renderPosItems() {
  var q = (document.getElementById('posSearch').value || '').toLowerCase();
  var filtered = posProducts.filter(function (p) { return !q || p.Name.toLowerCase().indexOf(q) > -1 || p.Category.toLowerCase().indexOf(q) > -1; });
  document.getElementById('posItemGrid').innerHTML = filtered.map(function (p) {
    var out = Number(p.QuantityInStock) <= 0;
    return '<div class="posItem' + (out ? ' outOfStock' : '') + '" onclick="' + (out ? '' : 'addToCart(\'' + p.ProductID + '\')') + '"><div class="thumb" style="background-image:url(\'' + (p.ImageURL || '') + '\')"></div>' +
      '<div class="nm">' + esc(p.Name) + '</div><div class="pr">' + fmtMoney(p.SellingPrice) + ' / ' + esc(p.Unit) + '</div>' +
      '<div class="muted" style="font-size:.72rem;">' + (out ? 'Out of stock' : p.QuantityInStock + ' in stock') + '</div></div>';
  }).join('') || '<div class="emptyState">No items found.</div>';
}
function addToCart(productId) {
  var existing = state.cart.find(function (c) { return c.productId === productId; });
  if (existing) existing.qty += 1; else state.cart.push({ productId: productId, qty: 1 });
  renderCart();
}
function renderCart() {
  var products = keyByJs(posProducts, 'ProductID');
  document.getElementById('cartLines').innerHTML = state.cart.length ? state.cart.map(function (line) {
    var p = products[line.productId];
    if (!p) return '';
    return '<div class="cartLine"><span>' + esc(p.Name) + '</span><div class="qtyCtrl"><button onclick="changeQty(\'' + line.productId + '\',-1)">−</button><span>' + line.qty + '</span><button onclick="changeQty(\'' + line.productId + '\',1)">+</button></div><span>' + fmtMoney(p.SellingPrice * line.qty) + '</span></div>';
  }).join('') : '<div class="emptyState" style="padding:20px 0;">Cart is empty</div>';
  updateCartTotals();
}
function changeQty(productId, delta) {
  var line = state.cart.find(function (c) { return c.productId === productId; });
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) state.cart = state.cart.filter(function (c) { return c.productId !== productId; });
  renderCart();
}
function keyByJs(rows, field) { var m = {}; rows.forEach(function (r) { m[r[field]] = r; }); return m; }
function updateCartTotals() {
  var products = keyByJs(posProducts, 'ProductID');
  var subtotal = state.cart.reduce(function (sum, l) { var p = products[l.productId]; return sum + (p ? p.SellingPrice * l.qty : 0); }, 0);
  var discount = Number((document.getElementById('posDiscount') || {}).value || 0);
  var taxRate = Number(state.settings.TaxRatePercent) || 0;
  var taxable = Math.max(0, subtotal - discount);
  var tax = taxable * taxRate / 100;
  var total = taxable + tax;
  var el = document.getElementById('cartTotals');
  if (el) el.innerHTML = '<div class="row"><span>Subtotal</span><span>' + fmtMoney(subtotal) + '</span></div>' +
    '<div class="row"><span>Discount</span><span>-' + fmtMoney(discount) + '</span></div>' +
    (taxRate ? '<div class="row"><span>Tax (' + taxRate + '%)</span><span>' + fmtMoney(tax) + '</span></div>' : '') +
    '<div class="row grand"><span>Total</span><span>' + fmtMoney(total) + '</span></div>';
}
document.addEventListener('input', function (e) { if (e.target && e.target.id === 'posDiscount') updateCartTotals(); });
function checkoutSale() {
  if (!state.cart.length) { toast('Cart is empty.', 'error'); return; }
  var payload = {
    items: state.cart, discount: document.getElementById('posDiscount').value, paymentMethod: document.getElementById('posPaymentMethod').value,
    customerPhone: document.getElementById('posCustPhone').value, customerName: document.getElementById('posCustName').value
  };
  api('createSale', state.token, payload).then(function (res) {
    toast('Sale completed — ' + fmtMoney(res.sale.Total) + (res.pointsEarned ? ' · +' + res.pointsEarned + ' pts' : ''), 'success');
    state.cart = [];
    renderPOS(document.getElementById('adminContent'));
  }).catch(toastError);
}

/* ============================================================================
 * CHARTS (lightweight canvas — no external libraries)
 * ==========================================================================*/
var CHART_COLORS = ['#16213e', '#c9a227', '#0b5da3', '#1c7c3c', '#a34a06', '#6b21a8', '#c0392b', '#0d7d6f'];
function renderLineChart(canvasId, data) {
  var canvas = document.getElementById(canvasId);
  if (!canvas || !data.length) return;
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight || 220;
  canvas.width = w * dpr; canvas.height = h * dpr;
  var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  var pad = 34;
  var max = Math.max.apply(null, data.map(function (d) { return d.amount; }).concat([1]));
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  for (var g = 0; g <= 4; g++) { var y = pad + (h - pad * 2) * g / 4; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - 10, y); ctx.stroke(); }
  ctx.beginPath(); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2.4;
  data.forEach(function (d, i) {
    var x = pad + (w - pad - 20) * (data.length === 1 ? 0 : i / (data.length - 1));
    var y = h - pad - (h - pad * 2) * (d.amount / max);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#c9a227';
  data.forEach(function (d, i) {
    var x = pad + (w - pad - 20) * (data.length === 1 ? 0 : i / (data.length - 1));
    var y = h - pad - (h - pad * 2) * (d.amount / max);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });
}
function renderDonutChart(canvasId, slices) {
  var canvas = document.getElementById(canvasId);
  if (!canvas || !slices.length) return;
  var dpr = window.devicePixelRatio || 1;
  var size = Math.min(canvas.clientWidth, 220);
  canvas.width = size * dpr; canvas.height = size * dpr;
  var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  var total = slices.reduce(function (s, x) { return s + x.amount; }, 0) || 1;
  var cx = size / 2, cy = size / 2, r = size / 2 - 8, start = -Math.PI / 2;
  slices.forEach(function (s, i) {
    var angle = (s.amount / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + angle); ctx.closePath();
    ctx.fillStyle = CHART_COLORS[i % CHART_COLORS.length]; ctx.fill();
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
}
function renderBarChart(canvasId, data) {
  var canvas = document.getElementById(canvasId);
  if (!canvas || !data.length) return;
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight || 220;
  canvas.width = w * dpr; canvas.height = h * dpr;
  var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  var pad = 30;
  var max = Math.max.apply(null, data.map(function (d) { return d.amount; }).concat([1]));
  var barW = (w - pad * 2) / data.length * 0.6;
  ctx.clearRect(0, 0, w, h);
  data.forEach(function (d, i) {
    var slot = (w - pad * 2) / data.length;
    var x = pad + slot * i + (slot - barW) / 2;
    var barH = (h - pad * 2) * (d.amount / max);
    ctx.fillStyle = CHART_COLORS[i % CHART_COLORS.length];
    ctx.fillRect(x, h - pad - barH, barW, barH);
  });
}
function legendRow(items) {
  return '<div class="legendRow">' + items.map(function (it, i) { return '<div class="lg"><span class="sw" style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></span>' + esc(it.name || it.method) + ' — ' + fmtMoney(it.amount) + '</div>'; }).join('') + '</div>';
}

    var byteNumbers = new Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
