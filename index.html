<!DOCTYPE html>
<html>
<head>
  <title>Tenancy Agreement Portal</title>
</head>
<body>
  <!--
    This page just embeds the deployed Google Apps Script web app — see
    README.md for how to build and deploy it. Replace the src below with
    YOUR deployment's /exec URL once you've followed the setup steps.
  -->
  <iframe
    src="REPLACE_WITH_YOUR_APPS_SCRIPT_EXEC_URL"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
