<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This was missing before, which is why mobile browsers rendered this
       wrapper page at a fake ~980px desktop width and scaled everything
       down - making the (already mobile-responsive) app inside the iframe
       look like a tiny "desktop version". -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MySchool</title>
  <meta name="description" content="Apply for open positions at MySchool and manage applications.">

  <!-- PWA: makes this installable ("Add to Home Screen") so it opens like
       a standalone app, without browser address bar/tabs. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS ignores manifest.json's "display": "standalone", so it needs
       these tags separately for the home-screen icon to open chrome-free. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MySchool">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2e7d32;
    }

    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #2e7d32;
      /* Keep content clear of notches/home-indicator when installed */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .fullscreen-btn {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      right: 16px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fullscreen-btn:active {
      background: rgba(0, 0, 0, 0.75);
    }

    /* No browser chrome to escape once installed/launched standalone */
    @media (display-mode: standalone), (display-mode: fullscreen) {
      .fullscreen-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbweB2UbaMxFiRbdJ9s71xnKL1C_Ak15HqS9bdLskkxrZzf4YWR5fcX-uOt4mUD8Va8/exec"
    title="MySchool Job Application"
    allowfullscreen="true">
  </iframe>

  <button class="fullscreen-btn" id="fullscreenBtn" title="Enter fullscreen" aria-label="Enter fullscreen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>

  <script>
    // Fullscreen requires a real user gesture - browsers reject it when
    // fired from window.onload, so it's wired to an actual tap instead.
    document.getElementById('fullscreenBtn').addEventListener('click', function () {
      var el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(function (err) {
          console.error('Fullscreen request failed:', err.message);
        });
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
