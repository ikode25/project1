<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zeyada&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --ink:#0f3d3e; --ink-light:#155c5d; --ink-dark:#0a2b2c;
      --gold:#c9962c;
      --bg:#f4f6f6; --card:#ffffff; --border:#e3e8e8;
      --text:#20302f; --muted:#6b7c7b;
      --ok:#1a8754; --warn:#c9962c; --bad:#c0392b; --info:#2f6fa3;
      --radius:12px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--ink-light);}
    button{font-family:inherit;cursor:pointer;}
    input,select,textarea{font-family:inherit;}
    #app{min-height:100vh;}
    .hidden{display:none !important;}

    /* ---------- Buttons ---------- */
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid transparent;
      font-weight:600;font-size:14px;transition:.15s;white-space:nowrap;}
    .btn-primary{background:var(--ink);color:#fff;}
    .btn-primary:hover{background:var(--ink-light);}
    .btn-primary:disabled{background:#a9bcbc;cursor:not-allowed;}
    .btn-secondary{background:#fff;color:var(--ink);border-color:var(--border);}
    .btn-secondary:hover{background:#eef2f2;}
    .btn-danger{background:#fff;color:var(--bad);border-color:#f1c7c0;}
    .btn-danger:hover{background:#fdecea;}
    .btn-ghost{background:transparent;color:var(--muted);border-color:transparent;}
    .btn-ghost:hover{color:var(--text);}
    .btn-sm{padding:6px 12px;font-size:12.5px;}
    .btn-block{width:100%;justify-content:center;}

    /* ---------- Auth screen ---------- */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:radial-gradient(circle at top left,var(--ink-light),var(--ink-dark));}
    .auth-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:380px;padding:36px 32px;}
    .auth-logo{width:52px;height:52px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;}
    .auth-card h1{font-size:20px;margin:0 0 4px;}
    .auth-card p.sub{color:var(--muted);margin:0 0 24px;font-size:13.5px;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fbfcfc;}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink-light);background:#fff;}
    .field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
    .err-msg{background:#fdecea;color:var(--bad);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}

    /* ---------- Admin shell ---------- */
    .shell{display:flex;min-height:100vh;}
    .sidebar{width:224px;background:var(--ink-dark);color:#dce8e7;flex-shrink:0;display:flex;flex-direction:column;}
    .sidebar .brand{padding:20px 18px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
    .sidebar nav{flex:1;padding:14px 10px;}
    .sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#bcd0cf;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;}
    .sidebar nav a i{width:16px;text-align:center;}
    .sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
    .sidebar nav a.active{background:var(--ink);color:#fff;}
    .sidebar .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#9fb6b5;}
    .main{flex:1;min-width:0;}
    .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
    .topbar h2{margin:0;font-size:18px;}
    .content{padding:24px 26px 60px;max-width:1180px;}
    @media (max-width:820px){
      .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;z-index:20;}
      .sidebar.open{transform:translateX(0);}
      .content{padding:16px;}
    }

    /* ---------- Cards / KPIs ---------- */
    .grid{display:grid;gap:16px;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:22px;}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
    .kpi .num{font-size:26px;font-weight:800;}
    .kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
    .kpi i{float:right;font-size:20px;opacity:.35;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
    .card h3{margin:0 0 14px;font-size:15px;}
    .card h3 small{color:var(--muted);font-weight:500;}

    /* ---------- Table ---------- */
    .table-wrap{overflow-x:auto;}
    table.data{width:100%;border-collapse:collapse;font-size:13.5px;}
    table.data th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
      padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
    table.data td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
    table.data tr:hover td{background:#f7fafa;}
    .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
    .badge-draft{background:#eceff1;color:#546e7a;}
    .badge-inquiry{background:#f3e8ff;color:#7c3aed;}
    .badge-sent{background:#e3f0fb;color:var(--info);}
    .badge-viewed{background:#fff3d6;color:#966c11;}
    .badge-accepted{background:#e2f6ea;color:var(--ok);}
    .badge-declined{background:#fdecea;color:var(--bad);}
    .badge-expired{background:#f1eaea;color:#8a5a5a;}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;justify-content:space-between;}
    .toolbar .filters{display:flex;gap:10px;flex-wrap:wrap;}
    .toolbar input[type=text],.toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#fff;}
    .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
    .empty-state i{font-size:32px;margin-bottom:10px;opacity:.4;}

    /* ---------- Form layout ---------- */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
    .form-grid .full{grid-column:1/-1;}
    @media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
    .section-title{font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;}
    .section-title:first-child{margin-top:0;}

    /* ---------- Tenant public flow ---------- */
    .tenant-wrap{min-height:100vh;background:var(--bg);}
    .admin-icon-btn{position:fixed;top:16px;right:16px;z-index:50;width:42px;height:42px;border-radius:50%;
      background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:16px;
      display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
    .admin-icon-btn:hover{background:rgba(255,255,255,.28);}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);text-decoration:none;margin-bottom:14px;}
    .back-link:hover{color:var(--text);}
    .tenant-head{background:linear-gradient(120deg,var(--ink-dark),var(--ink));color:#fff;padding:26px 20px 60px;text-align:center;position:relative;}
    .tenant-head h1{margin:0 0 4px;font-size:19px;}
    .tenant-head p{margin:0;opacity:.85;font-size:13px;}
    .stepper{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap;padding:0 10px;}
    .step-dot{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.55);}
    .step-dot .n{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;}
    .step-dot.active{color:#fff;}
    .step-dot.active .n{background:var(--gold);color:#2b1e00;}
    .step-dot.done .n{background:#fff;color:var(--ink);}
    .tenant-card{max-width:660px;margin:-40px auto 40px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.12);padding:26px 24px;}
    @media (max-width:700px){.tenant-card{margin:-30px 14px 30px;padding:20px 16px;}}
    .doc{font-family:Georgia,'Times New Roman',serif;line-height:1.65;font-size:14.5px;color:#222;}
    .doc h2{text-align:center;font-size:18px;margin:0 0 4px;}
    .doc .parties{text-align:center;margin:14px 0 20px;font-size:13.5px;color:#444;}
    .doc p{margin:0 0 12px;}
    .doc .clause-num{font-weight:700;}
    .terms-box{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:#fafcfc;font-size:13.5px;line-height:1.7;}
    .terms-box::-webkit-scrollbar{width:8px;}
    .terms-box::-webkit-scrollbar-thumb{background:#c9d4d3;border-radius:8px;}
    .scroll-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;}
    .scroll-hint.done{color:var(--ok);font-weight:600;}
    .agree-row{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:14px;background:#f5f8f8;border-radius:10px;}
    .agree-row input{margin-top:3px;width:17px;height:17px;}
    .agree-row label{font-size:13.5px;}
    .sig-input{width:100%;padding:14px;border:1px solid var(--border);border-radius:10px;font-size:16px;}
    .sig-preview{margin-top:18px;padding:20px;border:2px dashed var(--border);border-radius:10px;text-align:center;font-family:'Zeyada',cursive;font-size:36px;color:var(--ink-dark);min-height:60px;}
    .summary-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13.5px;}
    .summary-list .k{color:var(--muted);}
    .summary-list .v{font-weight:600;}
    @media (max-width:520px){.summary-list{grid-template-columns:1fr;}}
    .step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
    .center-state{text-align:center;padding:50px 10px;}
    .center-state i{font-size:44px;margin-bottom:14px;}
    .center-state h2{margin:0 0 8px;font-size:19px;}
    .center-state p{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto;}
    .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    .toast-host{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:slidein .15s ease;}
    .toast.ok{background:#1a8754;} .toast.bad{background:#c0392b;}
    @keyframes slidein{from{transform:translateY(-8px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast-host" id="toastHost"></div>

<script>
/* ===================================================================
 * TENANCY AGREEMENT PORTAL — client
 * Same pattern as the school blueprint: one HtmlService page, routed by
 * URL params, talking to Code.gs purely through google.script.run.
 * =================================================================== */

// ---------- server call helper ----------
// google.script.run's runner object exposes every server function by name, so a dynamic-name
// call needs to go through that object rather than being applied directly.
function gs(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e && e.message ? e.message : e); });
    runner[fn].apply(runner, args);
  });
}

function toast(msg, kind) {
  var host = document.getElementById('toastHost');
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function () { el.remove(); }, 3600);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtDate(iso) { if (!iso) return '—'; var d = new Date(iso); return isNaN(d) ? String(iso).slice(0, 10) : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtMoney(n, cur) { n = Number(n) || 0; return (cur || '') + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function statusBadge(s) {
  var label = { inquiry: 'New Application', draft: 'Draft', sent: 'Sent', viewed: 'Viewed', accepted: 'Signed', declined: 'Declined', expired: 'Expired' }[s] || s;
  return '<span class="badge badge-' + s + '">' + label + '</span>';
}
function downloadBase64Pdf(base64, filename) {
  var byteChars = atob(base64);
  var bytes = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(bytes)], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename || 'Tenancy Agreement.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

// ===================================================================
// ROUTER
// ===================================================================
var App = { root: document.getElementById('app') };

function boot() {
  var params = new URLSearchParams(window.location.search);
  var pub = params.get('public');
  if (pub === 'agreement') return TenantFlow.start(params.get('token'));
  if (pub === 'renewal') return RenewalFlow.start(params.get('token'), params.get('resp'));

  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('tap_session') || 'null'); } catch (e) {}
  if (saved && saved.user) { Admin.session = saved; return Admin.go('dashboard'); }
  // the deployed URL's front door: a public tenancy application form, same shape as a job
  // application page. The landlord gets in via the lock icon on that page, not a bare login wall.
  return ApplicationForm.render();
}
window.addEventListener('DOMContentLoaded', boot);

// ===================================================================
// AUTH (landlord login)
// ===================================================================
var Auth = {
  render: function (errorMsg) {
    App.root.innerHTML =
      '<div class="auth-wrap"><div class="auth-card">' +
      '<a href="#" class="back-link" onclick="ApplicationForm.render();return false;"><i class="fa-solid fa-arrow-left"></i> Back to application form</a>' +
      '<div class="auth-logo"><i class="fa-solid fa-house-chimney-window"></i></div>' +
      '<h1>Tenancy Agreement Portal</h1><p class="sub">Landlord / admin sign-in</p>' +
      (errorMsg ? '<div class="err-msg">' + esc(errorMsg) + '</div>' : '') +
      '<div class="field"><label>Username</label><input id="loginUser" placeholder="admin"></div>' +
      '<div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>' +
      '<button class="btn btn-primary btn-block" onclick="Auth.submit()"><i class="fa-solid fa-right-to-bracket"></i> Log in</button>' +
      '</div></div>';
    document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') Auth.submit(); });
  },
  submit: function () {
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    if (!u || !p) return Auth.render('Enter your username and password');
    gs('authenticateUser', u, p).then(function (res) {
      if (!res.success) return Auth.render(res.message);
      Admin.session = { user: res.user.username, role: res.user.role, fullName: res.user.fullName };
      sessionStorage.setItem('tap_session', JSON.stringify(Admin.session));
      Admin.go('dashboard');
    }).catch(function (e) { Auth.render(String(e)); });
  }
};

// ===================================================================
// ADMIN (landlord dashboard)
// ===================================================================
var Admin = {
  session: null,
  view: 'dashboard',
  cache: { agreements: null, settings: null },

  go: function (view, opts) {
    Admin.view = view;
    Admin.render(opts || {});
  },

  logout: function () {
    sessionStorage.removeItem('tap_session');
    Admin.session = null;
    ApplicationForm.render();
  },

  navItems: [
    { id: 'dashboard', label: 'Dashboard', icon: 'fa-gauge-high' },
    { id: 'agreements', label: 'Agreements', icon: 'fa-file-signature' },
    { id: 'settings', label: 'Settings', icon: 'fa-gear' },
    { id: 'logs', label: 'Activity Log', icon: 'fa-clock-rotate-left' }
  ],

  shell: function (title, bodyHtml) {
    var nav = Admin.navItems.map(function (n) {
      return '<a href="#" class="' + (Admin.view === n.id ? 'active' : '') + '" onclick="Admin.go(\'' + n.id + '\');return false;"><i class="fa-solid ' + n.icon + '"></i>' + n.label + '</a>';
    }).join('');
    App.root.innerHTML =
      '<div class="shell">' +
      '<aside class="sidebar" id="sidebar"><div class="brand"><i class="fa-solid fa-house-chimney-window"></i> Tenancy Portal</div>' +
      '<nav>' + nav + '</nav>' +
      '<div class="foot">Logged in as<br><b>' + esc(Admin.session.fullName || Admin.session.user) + '</b><br>' +
      '<a href="#" onclick="Admin.logout();return false;" style="color:#ffb3a7;"><i class="fa-solid fa-right-from-bracket"></i> Log out</a></div>' +
      '</aside>' +
      '<div class="main"><div class="topbar"><h2><i class="fa-solid fa-bars" style="cursor:pointer;display:none" id="hamb" onclick="document.getElementById(\'sidebar\').classList.toggle(\'open\')"></i> ' + title + '</h2></div>' +
      '<div class="content">' + bodyHtml + '</div></div>' +
      '</div>';
  },

  render: function (opts) {
    if (Admin.view === 'dashboard') return Admin.renderDashboard();
    if (Admin.view === 'agreements') return Admin.renderAgreements();
    if (Admin.view === 'agreementForm') return Admin.renderAgreementForm(opts.id != null ? opts.id : null, opts.renewFromId != null ? opts.renewFromId : null);
    if (Admin.view === 'settings') return Admin.renderSettings();
    if (Admin.view === 'logs') return Admin.renderLogs();
  },

  // ---------------- Dashboard ----------------
  renderDashboard: function () {
    Admin.shell('Dashboard', '<div class="grid kpis" id="kpiGrid"><div class="kpi"><div class="spinner" style="margin:0"></div></div></div><div id="dashExtra"></div>');
    Promise.all([gs('getDashboardStats', Admin.session.user, Admin.session.role), gs('getAllAgreements', Admin.session.user, Admin.session.role)])
      .then(function (r) {
        var statsRes = r[0], allRes = r[1];
        if (!statsRes || !statsRes.success || !allRes || !allRes.success) {
          var msg = (statsRes && statsRes.message) || (allRes && allRes.message) || 'No response from the server — try refreshing.';
          document.getElementById('kpiGrid').innerHTML = '';
          document.getElementById('dashExtra').innerHTML = '<div class="err-msg">Couldn\'t load the dashboard — ' + esc(msg) + '</div>';
          return;
        }
        var stats = statsRes.data || {}, all = allRes.data || [];
        document.getElementById('kpiGrid').innerHTML =
          Admin.kpi('fa-inbox', stats.newApplications, 'New Applications', 'gold') +
          Admin.kpi('fa-folder-open', stats.total, 'Total Agreements') +
          Admin.kpi('fa-hourglass-half', stats.awaitingSignature, 'Awaiting Signature', 'warn') +
          Admin.kpi('fa-file-circle-check', stats.accepted, 'Signed / Active', 'ok') +
          Admin.kpi('fa-triangle-exclamation', stats.expiringSoon, 'Expiring ≤ 30 days', 'bad') +
          Admin.kpi('fa-rotate', stats.renewalRequests, 'Renewal Requests', 'info');

        var applications = all.filter(function (a) { return a.EffectiveStatus === 'inquiry'; });
        var appRows = applications.slice(0, 8).map(function (a) {
          return '<tr><td>' + esc(a.TenantName) + '</td><td>' + esc(a.TenantEmail) + '</td><td>' + esc(a.PremisesDescription) + '</td><td>' + fmtDate(a.CreatedAt) + '</td>' +
            '<td class="row-actions"><button class="btn btn-primary btn-sm" onclick="Admin.go(\'agreementForm\',{id:' + a.ID + '})"><i class="fa-solid fa-clipboard-check"></i> Review</button></td></tr>';
        }).join('');

        var needsAttention = all.filter(function (a) { return (a.RenewalResponse === 'yes' && !a.RenewedToId) || (a.EffectiveStatus === 'accepted' && a.DaysToEnd !== null && a.DaysToEnd <= 30 && a.DaysToEnd >= 0 && !a.RenewedToId); });
        var rows = needsAttention.slice(0, 8).map(function (a) {
          var flag = a.RenewalResponse === 'yes' && !a.RenewedToId
            ? '<span class="badge badge-accepted">Wants to renew</span>'
            : '<span class="badge badge-declined">Ends in ' + a.DaysToEnd + ' day(s)</span>';
          return '<tr><td>' + esc(a.TenantName) + '</td><td>' + esc(a.PremisesDescription) + '</td><td>' + fmtDate(a.EndDate) + '</td><td>' + flag + '</td>' +
            '<td class="row-actions">' +
            (a.RenewalResponse === 'yes' ? '<button class="btn btn-primary btn-sm" onclick="Admin.startRenewal(' + a.ID + ')"><i class="fa-solid fa-rotate"></i> Renew</button>' : '<button class="btn btn-secondary btn-sm" onclick="Admin.remind(' + a.ID + ')"><i class="fa-solid fa-bell"></i> Remind</button>') +
            '</td></tr>';
        }).join('');
        document.getElementById('dashExtra').innerHTML =
          '<div class="card"><h3>New applications <small>submitted from the public application form</small></h3>' +
          (appRows ? '<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Email</th><th>Interested in</th><th>Applied</th><th></th></tr></thead><tbody>' + appRows + '</tbody></table></div>'
            : '<div class="empty-state"><i class="fa-regular fa-folder-open"></i><div>No new applications right now.</div></div>') +
          '</div>' +
          '<div class="card"><h3>Needs your attention</h3>' +
          (rows ? '<div class="table-wrap"><table class="data"><thead><tr><th>Tenant</th><th>Premises</th><th>End Date</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
            : '<div class="empty-state"><i class="fa-regular fa-circle-check"></i><div>Nothing needs attention right now.</div></div>') +
          '</div>';
      }).catch(function (e) {
        document.getElementById('kpiGrid').innerHTML = '';
        document.getElementById('dashExtra').innerHTML = '<div class="err-msg">Couldn\'t load the dashboard — ' + esc(String((e && e.message) || e)) + '</div>';
      });
  },
  kpi: function (icon, num, label, tone) {
    return '<div class="kpi"><i class="fa-solid ' + icon + '" style="color:var(--' + (tone || 'ink') + ')"></i>' +
      '<div class="num">' + (num == null ? '…' : num) + '</div><div class="lbl">' + label + '</div></div>';
  },

  // ---------------- Agreements list ----------------
  filters: { q: '', status: '' },
  renderAgreements: function () {
    Admin.shell('Agreements',
      '<div class="toolbar">' +
      '<div class="filters">' +
      '<input type="text" id="fltQ" placeholder="Search tenant or premises…" value="' + esc(Admin.filters.q) + '" oninput="Admin.filters.q=this.value;Admin.applyFilters();">' +
      '<select id="fltStatus" onchange="Admin.filters.status=this.value;Admin.applyFilters();">' +
      '<option value="">All statuses</option>' +
      ['inquiry', 'draft', 'sent', 'viewed', 'accepted', 'declined', 'expired'].map(function (s) { return '<option value="' + s + '"' + (Admin.filters.status === s ? ' selected' : '') + '>' + (s === 'inquiry' ? 'New Application' : s.charAt(0).toUpperCase() + s.slice(1)) + '</option>'; }).join('') +
      '</select></div>' +
      '<button class="btn btn-primary" onclick="Admin.go(\'agreementForm\',{})"><i class="fa-solid fa-plus"></i> New Agreement</button>' +
      '</div>' +
      '<div class="card"><div class="table-wrap" id="agreementsTableWrap"><div class="spinner"></div></div></div>');
    gs('getAllAgreements', Admin.session.user, Admin.session.role).then(function (res) {
      Admin.cache.agreements = res.data || [];
      Admin.applyFilters();
    }).catch(function (e) { toast(String(e), 'bad'); });
  },
  applyFilters: function () {
    var wrap = document.getElementById('agreementsTableWrap');
    if (!wrap || !Admin.cache.agreements) return;
    var q = Admin.filters.q.toLowerCase();
    var rows = Admin.cache.agreements.filter(function (a) {
      if (Admin.filters.status && a.EffectiveStatus !== Admin.filters.status) return false;
      if (q && (a.TenantName + ' ' + a.PremisesDescription).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if (!rows.length) { wrap.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i><div>No agreements match.</div></div>'; return; }
    wrap.innerHTML = '<table class="data"><thead><tr><th>Tenant</th><th>Premises</th><th>Rent</th><th>Start – End</th><th>Status</th><th>Renewal</th><th></th></tr></thead><tbody>' +
      rows.map(Admin.agreementRow).join('') + '</tbody></table>';
  },
  agreementRow: function (a) {
    var actions = [];
    if (a.EffectiveStatus === 'inquiry') {
      actions.push(btn('fa-clipboard-check', 'Review & Complete', "Admin.go('agreementForm',{id:" + a.ID + "})", 'primary'));
    }
    if (a.EffectiveStatus === 'draft') {
      actions.push(btn('fa-pen', 'Edit', "Admin.go('agreementForm',{id:" + a.ID + "})"));
      actions.push(btn('fa-paper-plane', 'Send', 'Admin.sendLink(' + a.ID + ')', 'primary'));
    }
    if (a.EffectiveStatus === 'sent' || a.EffectiveStatus === 'viewed' || a.EffectiveStatus === 'expired') {
      actions.push(btn('fa-paper-plane', a.EffectiveStatus === 'expired' ? 'Resend' : 'Resend', 'Admin.sendLink(' + a.ID + ')'));
      actions.push(btn('fa-link', 'Copy Link', 'Admin.copyLink(' + a.ID + ')'));
    }
    if (a.EffectiveStatus === 'accepted') {
      actions.push(btn('fa-download', 'PDF', 'Admin.downloadPdf(' + a.ID + ')'));
      if (!a.RenewedToId) {
        actions.push(btn('fa-bell', 'Remind', 'Admin.remind(' + a.ID + ')'));
        actions.push(btn('fa-rotate', 'Renew', 'Admin.startRenewal(' + a.ID + ')', 'primary'));
      } else {
        actions.push('<span class="badge badge-accepted">Renewed</span>');
      }
    }
    actions.push(btn('fa-trash', '', 'Admin.remove(' + a.ID + ')', 'danger'));
    function btn(icon, label, onclick, tone) {
      return '<button class="btn btn-sm btn-' + (tone || 'secondary') + '" onclick="' + onclick + '"><i class="fa-solid ' + icon + '"></i>' + (label ? ' ' + label : '') + '</button>';
    }
    var renewalFlag = a.RenewalResponse === 'yes' ? '<span class="badge badge-accepted">Wants renewal</span>' : (a.RenewalResponse === 'no' ? '<span class="badge badge-declined">Vacating</span>' : '—');
    return '<tr><td><b>' + esc(a.TenantName) + '</b><br><span style="color:var(--muted);font-size:12px">' + esc(a.TenantEmail) + '</span></td>' +
      '<td>' + esc(a.PremisesDescription) + '</td>' +
      '<td>' + fmtMoney(a.MonthlyRent, a.Currency) + '/mo</td>' +
      '<td>' + fmtDate(a.StartDate) + ' – ' + fmtDate(a.EndDate) + (a.DaysToEnd !== null && a.EffectiveStatus === 'accepted' ? '<br><span style="color:var(--muted);font-size:12px">' + (a.DaysToEnd >= 0 ? a.DaysToEnd + ' day(s) left' : 'ended') + '</span>' : '') + '</td>' +
      '<td>' + statusBadge(a.EffectiveStatus) + '</td>' +
      '<td>' + renewalFlag + '</td>' +
      '<td class="row-actions">' + actions.join('') + '</td></tr>';
  },

  sendLink: function (id) {
    gs('sendAgreementLink', id, Admin.session.user, Admin.session.role).then(function (res) {
      toast(res.message, res.success ? 'ok' : 'bad');
      if (res.success) Admin.renderAgreements();
    });
  },
  copyLink: function (id) {
    gs('getShareLink', id, Admin.session.user, Admin.session.role).then(function (res) {
      if (!res.success) return toast(res.message, 'bad');
      navigator.clipboard && navigator.clipboard.writeText(res.link).then(function () { toast('Link copied to clipboard', 'ok'); },
        function () { window.prompt('Copy this link:', res.link); });
      if (!navigator.clipboard) window.prompt('Copy this link:', res.link);
    });
  },
  remind: function (id) {
    gs('sendRenewalReminder', id, Admin.session.user, Admin.session.role).then(function (res) { toast(res.message, res.success ? 'ok' : 'bad'); });
  },
  downloadPdf: function (id) {
    gs('getAgreementPdfBase64ForAdmin', id, Admin.session.user, Admin.session.role).then(function (res) {
      if (!res.success) return toast(res.message, 'bad');
      downloadBase64Pdf(res.base64, res.filename);
    });
  },
  remove: function (id) {
    Swal.fire({ icon: 'warning', title: 'Remove this agreement?', text: 'This hides it from your list — nothing already emailed is recalled.', showCancelButton: true, confirmButtonText: 'Remove', confirmButtonColor: '#c0392b' })
      .then(function (r) {
        if (!r.isConfirmed) return;
        gs('deleteAgreement', id, Admin.session.user, Admin.session.role).then(function (res) { toast(res.message, res.success ? 'ok' : 'bad'); if (res.success) Admin.renderAgreements(); });
      });
  },
  startRenewal: function (id) {
    Admin.go('agreementForm', { renewFromId: id });
  },

  // ---------------- New / Edit / Renew form ----------------
  renderAgreementForm: function (id, renewFromId) {
    var isEdit = !!id, isRenew = !!renewFromId;
    Admin.shell(isRenew ? 'Renew Agreement' : (isEdit ? 'Edit Agreement' : 'New Agreement'),
      '<div class="card" id="formCard"><div class="spinner"></div></div>');

    var settingsP = Admin.cache.settings ? Promise.resolve({ success: true, data: Admin.cache.settings }) : gs('getSettings', Admin.session.user, Admin.session.role);
    var sourceP = isEdit ? gs('getAgreementById', id, Admin.session.user, Admin.session.role)
      : (isRenew ? gs('getAgreementById', renewFromId, Admin.session.user, Admin.session.role) : Promise.resolve({ success: true, data: null }));

    Promise.all([settingsP, sourceP]).then(function (r) {
      Admin.cache.settings = r[0].data;
      var src = r[1].data;
      var d = Admin.formDefaults(r[0].data, src, isRenew);
      document.getElementById('formCard').innerHTML = Admin.formHtml(d, isEdit, isRenew, id, renewFromId);
    }).catch(function (e) { toast(String(e), 'bad'); });
  },

  formDefaults: function (settings, src, isRenew) {
    if (src && !isRenew) return src; // editing — use as-is
    var d = {
      LandlordName: settings.LandlordName || '', LandlordAddress: settings.LandlordAddress || '',
      LandlordPhone: settings.LandlordPhone || '', LandlordEmail: settings.LandlordEmail || '',
      BankName: settings.BankName || '', BankAccountName: settings.BankAccountName || '',
      BankAccountNumber: settings.BankAccountNumber || '', BankBranch: settings.BankBranch || '',
      TenantName: '', TenantEmail: '', TenantPhone: '', TenantAddress: '',
      PremisesDescription: '', PremisesAddress: '', Region: '',
      StartDate: new Date().toISOString().slice(0, 10),
      TermValue: settings.DefaultTermValue || 1, TermUnit: settings.DefaultTermUnit || 'years',
      Currency: settings.Currency || 'GH₵', MonthlyRent: '', RentAdvanceMonths: settings.DefaultTermValue || 1,
      RentAdvanceAmount: '', RetentionDeposit: '', NoticePeriodMonths: settings.DefaultNoticePeriodMonths || 3,
      LandlordWitnessName: '', TenantWitnessName: ''
    };
    if (src && isRenew) {
      ['LandlordName', 'LandlordAddress', 'LandlordPhone', 'LandlordEmail', 'BankName', 'BankAccountName', 'BankAccountNumber', 'BankBranch',
        'TenantName', 'TenantEmail', 'TenantPhone', 'TenantAddress', 'PremisesDescription', 'PremisesAddress', 'Region',
        'TermValue', 'TermUnit', 'Currency', 'MonthlyRent', 'RetentionDeposit', 'NoticePeriodMonths', 'LandlordWitnessName', 'TenantWitnessName'
      ].forEach(function (k) { d[k] = src[k]; });
      var end = new Date(src.EndDate); end.setDate(end.getDate() + 1);
      d.StartDate = end.toISOString().slice(0, 10);
      d.RentAdvanceMonths = src.TermUnit === 'years' ? src.TermValue * 12 : src.TermValue;
    }
    return d;
  },

  formHtml: function (d, isEdit, isRenew, id, renewFromId) {
    function f(label, key, type, extra) {
      type = type || 'text';
      var val = d[key] == null ? '' : d[key];
      return '<div class="field"><label>' + label + '</label><input id="f_' + key + '" type="' + type + '" value="' + esc(val) + '" ' + (extra || '') + '></div>';
    }
    return (d.Status === 'inquiry' ? '<div class="err-msg" style="background:#f3e8ff;color:#7c3aed;">This started as a tenant application' + (d.Notes ? ' — their message: "' + esc(d.Notes) + '"' : '') + '. Fill in the remaining details (premises address, rent, term, dates) and Save — it will automatically move to Draft, ready to send.</div>' : '') +
      (isRenew ? '<div class="err-msg" style="background:#e3f0fb;color:var(--info);">Renewing agreement #' + renewFromId + '. Adjust the dates/rent below, then save and send the tenant a fresh link to sign.</div>' : '') +
      '<div class="section-title">Landlord Details</div><div class="form-grid">' +
      f('Landlord / Landlady Name', 'LandlordName') + f('Landlord Email', 'LandlordEmail', 'email') +
      f('Landlord Phone', 'LandlordPhone') + f('Landlord Address', 'LandlordAddress') +
      '</div>' +
      '<div class="section-title">Tenant Details</div><div class="form-grid">' +
      f('Tenant Full Name', 'TenantName') + f('Tenant Email (link is sent here)', 'TenantEmail', 'email') +
      f('Tenant Phone', 'TenantPhone') + f('Tenant Current Address', 'TenantAddress') +
      '</div>' +
      '<div class="section-title">Premises</div><div class="form-grid">' +
      '<div class="field full"><label>Premises Description (e.g. "Chamber and Hall Self-Contain")</label><input id="f_PremisesDescription" value="' + esc(d.PremisesDescription) + '"></div>' +
      f('Premises Address', 'PremisesAddress') + f('Region', 'Region') +
      '</div>' +
      '<div class="section-title">Term & Rent</div><div class="form-grid">' +
      f('Start Date', 'StartDate', 'date') +
      '<div class="field"><label>Term</label><div style="display:flex;gap:8px;"><input id="f_TermValue" type="number" min="1" value="' + esc(d.TermValue) + '" style="width:80px;">' +
      '<select id="f_TermUnit" style="flex:1;"><option value="years"' + (d.TermUnit === 'years' ? ' selected' : '') + '>Year(s)</option><option value="months"' + (d.TermUnit === 'months' ? ' selected' : '') + '>Month(s)</option></select></div></div>' +
      f('Currency Symbol', 'Currency') + f('Monthly Rent', 'MonthlyRent', 'number') +
      f('Rent Advance (months)', 'RentAdvanceMonths', 'number') + f('Rent Advance Amount (auto if blank)', 'RentAdvanceAmount', 'number') +
      f('Retention / Damage Deposit', 'RetentionDeposit', 'number') + f('Tenant Notice Period (months)', 'NoticePeriodMonths', 'number') +
      '</div>' +
      '<div class="section-title">Bank Details for Rent Payment</div><div class="form-grid">' +
      f('Bank Name', 'BankName') + f('Account Name', 'BankAccountName') +
      f('Account Number', 'BankAccountNumber') + f('Branch', 'BankBranch') +
      '</div>' +
      '<div class="section-title">Witnesses (optional)</div><div class="form-grid">' +
      f('Landlord\'s Witness', 'LandlordWitnessName') + f('Tenant\'s Witness', 'TenantWitnessName') +
      '</div>' +
      '<div style="display:flex;gap:10px;margin-top:20px;">' +
      '<button class="btn btn-primary" onclick="Admin.saveAgreement(' + (isEdit ? id : 'null') + ',' + (isRenew ? renewFromId : 'null') + ')"><i class="fa-solid fa-floppy-disk"></i> Save Agreement</button>' +
      '<button class="btn btn-secondary" onclick="Admin.go(\'agreements\')">Cancel</button>' +
      '</div>';
  },

  saveAgreement: function (id, renewFromId) {
    var keys = ['LandlordName', 'LandlordAddress', 'LandlordPhone', 'LandlordEmail', 'BankName', 'BankAccountName', 'BankAccountNumber', 'BankBranch',
      'TenantName', 'TenantEmail', 'TenantPhone', 'TenantAddress', 'PremisesDescription', 'PremisesAddress', 'Region',
      'StartDate', 'TermValue', 'TermUnit', 'Currency', 'MonthlyRent', 'RentAdvanceMonths', 'RentAdvanceAmount', 'RetentionDeposit',
      'NoticePeriodMonths', 'LandlordWitnessName', 'TenantWitnessName'];
    var payload = {};
    keys.forEach(function (k) { var el = document.getElementById('f_' + k); if (el) payload[k] = el.value; });
    if (!payload.TenantName || !payload.TenantEmail || !payload.PremisesDescription || !payload.PremisesAddress || !payload.MonthlyRent) {
      return toast('Please fill in tenant name/email, premises, and rent.', 'bad');
    }
    if (renewFromId) payload.RenewalOfId = renewFromId; // links the new agreement back to the one it renews
    var call = id ? gs('updateAgreement', id, payload, Admin.session.user, Admin.session.role)
      : gs('createAgreement', payload, Admin.session.user, Admin.session.role);
    call.then(function (res) {
      if (!res.success) return toast(res.message, 'bad');
      toast(id ? 'Agreement updated' : 'Agreement created', 'ok');
      Admin.go('agreements');
    }).catch(function (e) { toast(String(e), 'bad'); });
  },

  // ---------------- Settings ----------------
  renderSettings: function () {
    Admin.shell('Settings', '<div class="card"><div class="spinner"></div></div>');
    gs('getSettings', Admin.session.user, Admin.session.role).then(function (res) {
      Admin.cache.settings = res.data;
      var d = res.data;
      var body =
        '<div class="card"><h3>Your Details (used as defaults for new agreements)</h3><div class="form-grid">' +
        s('Landlord / Company Name', 'LandlordName') + s('Landlord Email', 'LandlordEmail') +
        s('Landlord Phone', 'LandlordPhone') + s('Landlord Address', 'LandlordAddress') +
        s('Currency Symbol', 'Currency') +
        '</div></div>' +
        '<div class="card"><h3>Default Bank Details</h3><div class="form-grid">' +
        s('Bank Name', 'BankName') + s('Account Name', 'BankAccountName') +
        s('Account Number', 'BankAccountNumber') + s('Branch', 'BankBranch') +
        '</div></div>' +
        '<div class="card"><h3>Defaults</h3><div class="form-grid">' +
        s('Default Term Value', 'DefaultTermValue') +
        '<div class="field"><label>Default Term Unit</label><select id="s_DefaultTermUnit"><option value="years"' + (d.DefaultTermUnit === 'years' ? ' selected' : '') + '>Years</option><option value="months"' + (d.DefaultTermUnit === 'months' ? ' selected' : '') + '>Months</option></select></div>' +
        s('Default Tenant Notice Period (months)', 'DefaultNoticePeriodMonths') +
        s('Renewal Reminder Lead Days (comma-separated)', 'ReminderLeadDays') +
        '</div></div>' +
        '<div class="card"><h3>Terms &amp; Conditions <small>shown to every tenant before they sign</small></h3>' +
        '<div class="field"><textarea id="s_TermsTemplate" rows="12" style="width:100%;">' + esc(d.TermsTemplate) + '</textarea>' +
        '<div class="hint">Use <code>{{NoticePeriodMonths}}</code> anywhere you want that agreement\'s notice period inserted automatically.</div></div></div>' +
        '<div class="card"><h3>Public link override <small>only if using a custom domain</small></h3>' +
        s('Public App Base URL (leave blank to auto-detect)', 'PublicAppBaseURL') + '</div>' +
        '<button class="btn btn-primary" onclick="Admin.saveSettings()"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>' +
        '<div class="card" style="margin-top:22px;"><h3>Change Password</h3><div class="form-grid">' +

        '<div class="field"><label>New Password</label><input id="pwNew" type="password"></div></div>' +
        '<button class="btn btn-secondary" onclick="Admin.changePassword()"><i class="fa-solid fa-key"></i> Update Password</button></div>';
      document.querySelector('#app .content').innerHTML = body;
      function s(label, key) { return '<div class="field"><label>' + label + '</label><input id="s_' + key + '" value="' + esc(d[key]) + '"></div>'; }
    });
  },
  saveSettings: function () {
    var keys = ['LandlordName', 'LandlordEmail', 'LandlordPhone', 'LandlordAddress', 'Currency', 'BankName', 'BankAccountName',
      'BankAccountNumber', 'BankBranch', 'DefaultTermValue', 'DefaultTermUnit', 'DefaultNoticePeriodMonths', 'ReminderLeadDays',
      'TermsTemplate', 'PublicAppBaseURL'];
    var payload = {};
    keys.forEach(function (k) { var el = document.getElementById('s_' + k); if (el) payload[k] = el.value; });
    gs('updateSettings', payload, Admin.session.user, Admin.session.role).then(function (res) {
      toast(res.message, res.success ? 'ok' : 'bad');
      if (res.success) Admin.cache.settings = null;
    });
  },
  changePassword: function () {
    var oldP = document.getElementById('pwOld').value, newP = document.getElementById('pwNew').value;
    if (!oldP || !newP) return toast('Fill in both password fields', 'bad');
    gs('changePassword', Admin.session.user, Admin.session.role, oldP, newP).then(function (res) {
      toast(res.message, res.success ? 'ok' : 'bad');
      if (res.success) { document.getElementById('pwOld').value = ''; document.getElementById('pwNew').value = ''; }
    });
  },

  // ---------------- Logs ----------------
  renderLogs: function () {
    Admin.shell('Activity Log', '<div class="card"><div class="table-wrap" id="logsWrap"><div class="spinner"></div></div></div>');
    gs('getRecentLogs', Admin.session.user, Admin.session.role, 100).then(function (res) {
      var rows = (res.data || []).map(function (l) {
        return '<tr><td style="white-space:nowrap;color:var(--muted);font-size:12.5px;">' + fmtDate(l.Timestamp) + ' ' + new Date(l.Timestamp).toLocaleTimeString() + '</td>' +
          '<td>' + esc(l.User) + '</td><td>' + esc(l.Action) + '</td><td>' + esc(l.Details) + '</td></tr>';
      }).join('');
      document.getElementById('logsWrap').innerHTML = rows
        ? '<table class="data"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty-state"><i class="fa-regular fa-clock"></i><div>No activity yet.</div></div>';
    });
  }
};

// ===================================================================
// TENANT FLOW (public — no login)
// ===================================================================
var TenantFlow = {
  token: null, data: null, step: 1, scrolledToEnd: false,

  start: function (token) {
    TenantFlow.token = token;
    App.root.innerHTML = TenantFlow.wrap('<div class="center-state"><div class="spinner"></div><h2>Loading your agreement…</h2></div>');
    gs('getPublicAgreementByToken', token).then(function (res) {
      if (!res.success) return TenantFlow.renderError(res);
      TenantFlow.data = res.data;
      var st = res.data.EffectiveStatus;
      if (st === 'accepted') return TenantFlow.renderAlreadySigned();
      if (st === 'declined') return TenantFlow.renderDeclined();
      TenantFlow.step = 1;
      TenantFlow.render();
    }).catch(function (e) { TenantFlow.renderError({ message: String(e) }); });
  },

  wrap: function (inner, showHead) {
    var d = TenantFlow.data;
    var head = '<div class="tenant-head"><h1><i class="fa-solid fa-house-chimney-window"></i> ' + (d ? esc(d.LandlordName) + ' — Tenancy Agreement' : 'Tenancy Agreement') + '</h1>' +
      (d ? '<p>' + esc(d.PremisesDescription) + '</p>' : '') +
      (showHead ? TenantFlow.stepper() : '') + '</div>';
    return '<div class="tenant-wrap">' + head + '<div class="tenant-card">' + inner + '</div></div>';
  },
  stepper: function () {
    var labels = ['Review', 'Terms', 'Sign', 'Confirm'];
    return '<div class="stepper">' + labels.map(function (l, i) {
      var n = i + 1, cls = n < TenantFlow.step ? 'done' : (n === TenantFlow.step ? 'active' : '');
      return '<div class="step-dot ' + cls + '"><span class="n">' + (n < TenantFlow.step ? '✓' : n) + '</span>' + l + '</div>';
    }).join('<div style="width:14px"></div>') + '</div>';
  },

  render: function () {
    if (TenantFlow.step === 1) return TenantFlow.renderReview();
    if (TenantFlow.step === 2) return TenantFlow.renderTerms();
    if (TenantFlow.step === 3) return TenantFlow.renderSign();
    if (TenantFlow.step === 4) return TenantFlow.renderConfirm();
  },

  renderError: function (res) {
    App.root.innerHTML = TenantFlow.wrap(
      '<div class="center-state"><i class="fa-solid ' + (res.expired ? 'fa-hourglass-end' : 'fa-triangle-exclamation') + '" style="color:var(--warn)"></i>' +
      '<h2>' + (res.expired ? 'This link has expired' : 'We couldn\'t open this agreement') + '</h2>' +
      '<p>' + esc(res.message || '') + '</p></div>');
  },
  renderDeclined: function () {
    var d = TenantFlow.data;
    App.root.innerHTML = TenantFlow.wrap('<div class="center-state"><i class="fa-solid fa-circle-xmark" style="color:var(--bad)"></i>' +
      '<h2>You declined this agreement</h2><p>You declined on ' + fmtDate(d.DeclinedAt) + '. If that was a mistake, please contact ' + esc(d.LandlordName) + (d.LandlordEmail ? ' at ' + esc(d.LandlordEmail) : '') + (d.LandlordPhone ? ' / ' + esc(d.LandlordPhone) : '') + '.</p></div>');
  },
  renderAlreadySigned: function () {
    var d = TenantFlow.data;
    App.root.innerHTML = TenantFlow.wrap(
      '<div class="center-state"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i><h2>Already signed</h2>' +
      '<p>You signed this tenancy agreement on ' + fmtDate(d.AcceptedAt) + ' as <b>' + esc(d.TenantSignatureName) + '</b>. A copy was emailed to you — you can also download it again below.</p>' +
      '<button class="btn btn-primary" style="margin-top:16px;" onclick="TenantFlow.download()"><i class="fa-solid fa-download"></i> Download my copy</button></div>');
  },
  download: function () {
    gs('getAgreementPdfBase64', TenantFlow.token).then(function (res) {
      if (!res.success) return toast(res.message, 'bad');
      downloadBase64Pdf(res.base64, res.filename);
    });
  },

  renderReview: function () {
    var d = TenantFlow.data;
    var startFmt = fmtDate(d.StartDate), endFmt = fmtDate(d.EndDate);
    var html =
      '<div class="doc">' +
      '<h2>TENANCY AGREEMENT</h2>' +
      '<div class="parties">Between <b>' + esc(d.LandlordName) + '</b> (Landlord/Landlady) and <b>' + esc(d.TenantName) + '</b> (Tenant)</div>' +
      '<p><span class="clause-num">1.</span> The Landlord/Landlady lets, and the Tenant takes, the premises described as <b>' + esc(d.PremisesDescription) + '</b>, located at <b>' + esc(d.PremisesAddress) + (d.Region ? ', ' + esc(d.Region) : '') + '</b>, together with its fixtures and fittings, for the term and rent set out below.</p>' +
      '<p><span class="clause-num">2.</span> The premises shall be held by the Tenant from <b>' + startFmt + '</b> for a period of <b>' + d.TermValue + ' ' + d.TermUnit + '</b>, ending <b>' + endFmt + '</b>.</p>' +
      '<p><span class="clause-num">3.</span> The Tenant shall pay a monthly rent of <b>' + fmtMoney(d.MonthlyRent, d.Currency) + '</b>, clear of all deductions.</p>' +
      '<p><span class="clause-num">4.</span> Rent shall be paid to: Bank <b>' + esc(d.BankName || '—') + '</b>, Account Name <b>' + esc(d.BankAccountName || '—') + '</b>, Account Number <b>' + esc(d.BankAccountNumber || '—') + '</b>, Branch <b>' + esc(d.BankBranch || '—') + '</b>.</p>' +
      '<p><span class="clause-num">5.</span> Retention deposit for repairs: <b>' + fmtMoney(d.RetentionDeposit, d.Currency) + '</b>, refundable in full at the end of the tenancy if no damage is found (less the cost of any repairs otherwise).</p>' +
      '<p><span class="clause-num">6.</span> The Landlord/Landlady acknowledges receipt of <b>' + fmtMoney(d.RentAdvanceAmount, d.Currency) + '</b> being ' + d.RentAdvanceMonths + ' month(s) rent advance.</p>' +
      '</div>' +
      '<div class="step-nav"><span></span><button class="btn btn-primary" onclick="TenantFlow.step=2;TenantFlow.render()">Continue to Terms &amp; Conditions <i class="fa-solid fa-arrow-right"></i></button></div>';
    App.root.innerHTML = TenantFlow.wrap(html, true);
  },

  renderTerms: function () {
    var d = TenantFlow.data;
    var terms = String(d.TermsSnapshot || '').replace(/\{\{NoticePeriodMonths\}\}/g, d.NoticePeriodMonths);
    var html =
      '<h3 style="margin-top:0;">Terms &amp; Conditions</h3>' +
      '<div class="terms-box" id="termsBox" onscroll="TenantFlow.onTermsScroll()">' +
      terms.split('\n').map(function (l) { return l.trim() ? '<p>' + esc(l) + '</p>' : ''; }).join('') +
      '</div>' +
      '<div class="scroll-hint" id="scrollHint"><i class="fa-solid fa-arrow-down"></i> Please scroll to the end to continue</div>' +
      '<div class="agree-row"><input type="checkbox" id="agreeBox" disabled onchange="TenantFlow.toggleContinue()">' +
      '<label for="agreeBox">I confirm I have read and understood the Terms &amp; Conditions above, and I agree to be bound by them.</label></div>' +
      '<div class="step-nav"><button class="btn btn-ghost" onclick="TenantFlow.step=1;TenantFlow.render()"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
      '<div style="display:flex;gap:10px;"><button class="btn btn-secondary" onclick="TenantFlow.promptDecline()">Decline</button>' +
      '<button class="btn btn-primary" id="continueBtn" disabled onclick="TenantFlow.step=3;TenantFlow.render()">Continue <i class="fa-solid fa-arrow-right"></i></button></div></div>';
    App.root.innerHTML = TenantFlow.wrap(html, true);
    // if the terms box doesn't need scrolling at all (short content / big screen), unlock immediately
    setTimeout(function () {
      var box = document.getElementById('termsBox');
      if (box && box.scrollHeight <= box.clientHeight + 4) TenantFlow.onTermsScroll(true);
    }, 50);
  },
  onTermsScroll: function (force) {
    var box = document.getElementById('termsBox');
    if (!box) return;
    var atEnd = force || (box.scrollTop + box.clientHeight >= box.scrollHeight - 6);
    if (atEnd && !TenantFlow.scrolledToEnd) {
      TenantFlow.scrolledToEnd = true;
      document.getElementById('agreeBox').disabled = false;
      var hint = document.getElementById('scrollHint');
      hint.className = 'scroll-hint done';
      hint.innerHTML = '<i class="fa-solid fa-circle-check"></i> You\'ve read to the end — you may now tick the box below.';
    }
  },
  toggleContinue: function () {
    document.getElementById('continueBtn').disabled = !document.getElementById('agreeBox').checked;
  },
  promptDecline: function () {
    Swal.fire({ icon: 'question', title: 'Decline this agreement?', input: 'text', inputPlaceholder: 'Reason (optional)', showCancelButton: true, confirmButtonText: 'Decline', confirmButtonColor: '#c0392b' })
      .then(function (r) {
        if (!r.isConfirmed) return;
        gs('declineAgreement', TenantFlow.token, r.value || '').then(function (res) {
          if (res.success) { TenantFlow.data.EffectiveStatus = 'declined'; TenantFlow.data.DeclinedAt = new Date().toISOString(); TenantFlow.renderDeclined(); }
          else toast(res.message, 'bad');
        });
      });
  },

  renderSign: function () {
    var d = TenantFlow.data;
    var html =
      '<h3 style="margin-top:0;">Sign the Agreement</h3>' +
      '<p style="color:var(--muted);font-size:13.5px;">You are signing as <b>' + esc(d.TenantName) + '</b>. Type your full name below — this will be recorded as your electronic signature.</p>' +
      '<input class="sig-input" id="sigName" placeholder="Type your full name" oninput="TenantFlow.updateSigPreview()" autocomplete="off">' +
      '<div class="sig-preview" id="sigPreview">&nbsp;</div>' +
      '<div class="step-nav"><button class="btn btn-ghost" onclick="TenantFlow.step=2;TenantFlow.render()"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
      '<button class="btn btn-primary" id="signContinueBtn" disabled onclick="TenantFlow.step=4;TenantFlow.render()">Review &amp; Continue <i class="fa-solid fa-arrow-right"></i></button></div>';
    App.root.innerHTML = TenantFlow.wrap(html, true);
    if (TenantFlow.signatureName) { document.getElementById('sigName').value = TenantFlow.signatureName; TenantFlow.updateSigPreview(); }
  },
  updateSigPreview: function () {
    var v = document.getElementById('sigName').value.trim();
    TenantFlow.signatureName = v;
    document.getElementById('sigPreview').textContent = v || ' ';
    document.getElementById('signContinueBtn').disabled = v.length < 2;
  },

  renderConfirm: function () {
    var d = TenantFlow.data;
    var html =
      '<h3 style="margin-top:0;">Review &amp; Submit</h3>' +
      '<div class="summary-list">' +
      row('Tenant', d.TenantName) + row('Premises', d.PremisesDescription) +
      row('Term', d.TermValue + ' ' + d.TermUnit) + row('Start – End', fmtDate(d.StartDate) + ' to ' + fmtDate(d.EndDate)) +
      row('Monthly Rent', fmtMoney(d.MonthlyRent, d.Currency)) + row('Retention Deposit', fmtMoney(d.RetentionDeposit, d.Currency)) +
      '</div>' +
      '<div class="section-title">Your Signature</div>' +
      '<div class="sig-preview">' + esc(TenantFlow.signatureName) + '</div>' +
      '<div class="agree-row"><i class="fa-solid fa-shield-halved" style="color:var(--ink);margin-top:2px;"></i>' +
      '<label>By clicking "Confirm &amp; Submit" you are electronically signing this Tenancy Agreement and agreeing to all of its terms.</label></div>' +
      '<div class="step-nav"><button class="btn btn-ghost" onclick="TenantFlow.step=3;TenantFlow.render()"><i class="fa-solid fa-arrow-left"></i> Edit signature</button>' +
      '<button class="btn btn-primary" id="submitBtn" onclick="TenantFlow.submit()"><i class="fa-solid fa-check"></i> Confirm &amp; Submit</button></div>';
    App.root.innerHTML = TenantFlow.wrap(html, true);
    function row(k, v) { return '<div><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>'; }
  },
  submit: function () {
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting…';
    gs('acceptAgreement', TenantFlow.token, TenantFlow.signatureName, true).then(function (res) {
      if (!res.success) { toast(res.message, 'bad'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Confirm &amp; Submit'; return; }
      TenantFlow.data = res.data;
      TenantFlow.lastPdf = { base64: res.pdfBase64, filename: res.pdfFilename };
      TenantFlow.renderSuccess();
    }).catch(function (e) { toast(String(e), 'bad'); btn.disabled = false; });
  },
  renderSuccess: function () {
    var d = TenantFlow.data;
    App.root.innerHTML = TenantFlow.wrap(
      '<div class="center-state"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i>' +
      '<h2>Agreement signed!</h2><p>Thank you, ' + esc(d.TenantName) + '. Your tenancy agreement for <b>' + esc(d.PremisesDescription) + '</b> has been submitted. A copy has been emailed to you.</p>' +
      '<button class="btn btn-primary" style="margin-top:18px;" onclick="TenantFlow.downloadJustSigned()"><i class="fa-solid fa-download"></i> Download my copy</button></div>');
  },
  downloadJustSigned: function () {
    if (TenantFlow.lastPdf && TenantFlow.lastPdf.base64) return downloadBase64Pdf(TenantFlow.lastPdf.base64, TenantFlow.lastPdf.filename);
    TenantFlow.download();
  }
};

// ===================================================================
// TENANCY APPLICATION FORM (public — the deployed URL's default landing page)
// Same shape as a job application page: a prospective tenant lands here directly (no link, no
// token, no login) and submits their interest. It shows up on the landlord's dashboard as a New
// Application; the landlord's lock icon is the only way into the admin side from here.
// ===================================================================
var ApplicationForm = {
  landlordName: 'Property Management',

  render: function () {
    App.root.innerHTML = ApplicationForm.wrap('<div class="center-state"><div class="spinner"></div></div>');
    gs('getPublicLandlordProfile').then(function (res) {
      if (res.success && res.data && res.data.LandlordName) ApplicationForm.landlordName = res.data.LandlordName;
      ApplicationForm.renderForm();
    }).catch(function () { ApplicationForm.renderForm(); });
  },

  wrap: function (inner) {
    return '<div class="tenant-wrap">' +
      '<button class="admin-icon-btn" title="Landlord / Admin login" onclick="Auth.render()"><i class="fa-solid fa-user-lock"></i></button>' +
      '<div class="tenant-head"><h1><i class="fa-solid fa-house-chimney-window"></i> ' + esc(ApplicationForm.landlordName) + '</h1><p>Tenancy Application Form</p></div>' +
      '<div class="tenant-card">' + inner + '</div></div>';
  },

  renderForm: function () {
    var html =
      '<h3 style="margin-top:0;">Apply for a tenancy</h3>' +
      '<p style="color:var(--muted);font-size:13.5px;margin-top:-6px;">Tell us a little about yourself and what you\'re looking for — ' + esc(ApplicationForm.landlordName) + ' will follow up with you directly.</p>' +
      '<div class="form-grid">' +
      '<div class="field"><label>Full Name *</label><input id="app_TenantName"></div>' +
      '<div class="field"><label>Email *</label><input id="app_TenantEmail" type="email"></div>' +
      '<div class="field"><label>Phone</label><input id="app_TenantPhone"></div>' +
      '<div class="field"><label>Preferred Move-in Date</label><input id="app_PreferredStartDate" type="date"></div>' +
      '<div class="field full"><label>Property / Unit you\'re interested in</label><input id="app_PremisesDescription" placeholder="e.g. 2-bedroom apartment, Spintex — or leave blank for a general enquiry"></div>' +
      '<div class="field full"><label>Message</label><textarea id="app_Message" rows="4" placeholder="Anything else you\'d like us to know"></textarea></div>' +
      '</div>' +
      '<button class="btn btn-primary btn-block" id="appSubmitBtn" onclick="ApplicationForm.submit()"><i class="fa-solid fa-paper-plane"></i> Submit Application</button>';
    App.root.innerHTML = ApplicationForm.wrap(html);
  },

  submit: function () {
    var payload = {
      TenantName: document.getElementById('app_TenantName').value.trim(),
      TenantEmail: document.getElementById('app_TenantEmail').value.trim(),
      TenantPhone: document.getElementById('app_TenantPhone').value.trim(),
      PreferredStartDate: document.getElementById('app_PreferredStartDate').value,
      PremisesDescription: document.getElementById('app_PremisesDescription').value.trim(),
      Message: document.getElementById('app_Message').value.trim()
    };
    if (!payload.TenantName || !payload.TenantEmail) return toast('Please enter your name and email.', 'bad');
    var btn = document.getElementById('appSubmitBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting…';
    gs('submitTenancyApplication', payload).then(function (res) {
      if (!res.success) { toast(res.message, 'bad'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Application'; return; }
      App.root.innerHTML = ApplicationForm.wrap(
        '<div class="center-state"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i><h2>Application received</h2><p>' + esc(res.message) + '</p></div>');
    }).catch(function (e) { toast(String(e), 'bad'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Application'; });
  }
};

// ===================================================================
// RENEWAL RESPONSE FLOW (public — tenant clicks Yes/No from the reminder email)
// ===================================================================
var RenewalFlow = {
  start: function (token, resp) {
    App.root.innerHTML = '<div class="tenant-wrap"><div class="tenant-head"><h1><i class="fa-solid fa-rotate"></i> Renewal Response</h1></div>' +
      '<div class="tenant-card"><div class="center-state"><div class="spinner"></div><h2>Recording your response…</h2></div></div></div>';
    gs('respondToRenewal', token, resp).then(function (res) {
      var inner;
      if (!res.success) {
        inner = '<div class="center-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--warn)"></i><h2>Something went wrong</h2><p>' + esc(res.message) + '</p></div>';
      } else if (res.response === 'yes') {
        inner = '<div class="center-state"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i><h2>Thanks, ' + esc(res.tenantName) + '!</h2>' +
          '<p>We\'ve told your landlord you\'d like to renew your tenancy for <b>' + esc(res.premises) + '</b>. They\'ll be in touch with your new agreement shortly.</p></div>';
      } else {
        inner = '<div class="center-state"><i class="fa-solid fa-circle-info" style="color:var(--info)"></i><h2>Thanks for letting us know</h2>' +
          '<p>We\'ve told your landlord that you won\'t be renewing <b>' + esc(res.premises) + '</b>. We wish you all the best!</p></div>';
      }
      document.querySelector('.tenant-card').innerHTML = inner;
    }).catch(function (e) {
      document.querySelector('.tenant-card').innerHTML = '<div class="center-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--warn)"></i><h2>Something went wrong</h2><p>' + esc(String(e)) + '</p></div>';
    });
  }
};
</script>
</body>
</html>
